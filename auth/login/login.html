<!doctype html>
<html class="light" dir="ltr" lang="en" style="height: 100%;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bloxtip log in or like sign in</title>
  <link rel="icon" type="image/vnd.microsoft.icon" href="/favicon.ico">
  <style>
    :root {
      --theme-navbar-bg: #0074BD;
      --theme-primary: #02b757;
      --theme-primary-hover: #00cc61;
      --theme-discord: #5865F2;
      --theme-discord-hover: #4752C4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background: #e3e3e3;
      color: #191919;
      font-family: 'Source Sans Pro', Arial, sans-serif;
      font-size: 16px;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      z-index: 1050;
      min-height: 40px;
      background-color: var(--theme-navbar-bg);
      box-shadow: 0 1px 4px rgba(25, 25, 25, 0.3);
      width: 100%;
    }

    .nav-container {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0 20px;
      min-height: 64px;
    }

    .logo-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      width: 40px;
    }

    .logo-img {
      height: 35px;
      width: auto;
      object-fit: contain;
    }

    .nav-spacer {
      flex: 1;
    }

    .nav-link {
      color: white;
      text-decoration: none;
      padding: 4px 8px;
      margin-left: 10px;
    }

    .nav-link:hover {
      background: rgba(25, 25, 25, 0.1);
      border-radius: 4px;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }

    .auth-container h1 {
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
    }

    .discord-btn {
      width: 100%;
      padding: 12px;
      background: var(--theme-discord);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s;
      margin-bottom: 12px;
      text-decoration: none;
    }

    .discord-btn:hover {
      background: var(--theme-discord-hover);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #888;
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e3e3e3;
    }

    .divider span {
      padding: 0 10px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #191919;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      font-size: 15px;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--theme-primary);
      box-shadow: 0 0 0 2px rgba(2, 183, 87, 0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--theme-primary);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--theme-primary-hover);
    }

    .error {
      background: #fee;
      color: #c00;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .error.show {
      display: block;
    }

    .footer {
      background: white;
      border-top: 1px solid #e3e3e3;
      padding: 15px 0 25px;
      text-align: center;
    }

    .footer-text {
      color: #B8B8B8;
      font-size: 12px;
      font-weight: 400;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <button class="logo-btn" title="Home" onclick="window.location.href='/'">
        <img src="https://raw.githubusercontent.com/amr010920/bloxtip/images/more/Untitled-removebg-preview.png" alt="Bloxtip" class="logo-img">
      </button>
      <div class="nav-spacer"></div>
      <a class="nav-link" href="/">Back to Home</a>
    </div>
  </nav>

  <main class="main">
    <div class="auth-container">
      <h1>Account Authentication</h1>
      <div class="error" id="error"></div>

      <!-- Discord Direct OAuth Buttons -->
      <a href="http://localhost:3000/api/auth/discord?mode=login" class="discord-btn">
        <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="white"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74C48.86,40.21,54,45.92,53.88,53,53.88,60,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74C91.14,40.21,96.25,45.92,96.13,53,96.13,60,91.08,65.69,84.69,65.69Z"/></svg>
        Sign In with Discord
      </a>

      <a href="http://localhost:3000/api/auth/discord?mode=signup" class="discord-btn" style="background: #404EED;">
        <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="white"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74C48.86,40.21,54,45.92,53.88,53,53.88,60,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74C91.14,40.21,96.25,45.92,96.13,53,96.13,60,91.08,65.69,84.69,65.69Z"/></svg>
        Sign Up with Discord
      </a>

      <div class="divider"><span>OR MANUAL LOGIN</span></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>
        <div class="form-group">
          <label for="discordTag">Discord Tag / Username <span style="color:#888;">(Optional)</span></label>
          <input type="text" id="discordTag" name="discordTag" placeholder="e.g. bloxtip_user">
        </div>
        <button type="submit" class="submit-btn">Login / Sign Up</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p class="footer-text">Bloxtip is an independent platform and is not affiliated with Roblox Corporation or any other company and if u still think it is then idk</p>
  </footer>

  <script>
    const API_URL = 'http://localhost:3000/api/auth';

    async function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const discord = document.getElementById('discordTag').value.trim();
      const error = document.getElementById('error');

      error.classList.remove('show');

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, discord })
        });

        const data = await response.json();

        if (!data.success) {
          error.textContent = data.message || 'Authentication failed';
          error.classList.add('show');
          return;
        }

        // Store active session info locally
        localStorage.setItem('bloxtip_account', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (err) {
        error.textContent = 'Unable to connect to authentication server';
        error.classList.add('show');
      }
    }
  </script>
</body>
</html>
