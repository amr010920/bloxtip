<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games – Bloxtip</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)),
                linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 40px;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 280px;
            margin-bottom: 30px;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            opacity: 0.95;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .primary {
            background: linear-gradient(135deg, #00d084 0%, #00a86b 100%);
            color: white;
        }

        .secondary {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
            color: white;
        }

        .tertiary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .quaternary {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        /* footer credit */
        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            opacity: 0.85;
        }

        footer a {
            color: #ffffff;
            text-decoration: underline;
            transition: opacity 0.2s ease;
        }

        footer a:hover {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }

            .btn {
                padding: 14px 22px;
                font-size: 14px;
            }

            .logo {
                width: 220px;
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">🎮 Bloxtip</div>

        <h1>Create & Play Games</h1>
        <p>
            Discover amazing games and worlds created by our community.<br>
            Build, play, and share your creations with players worldwide.
        </p>

        <div class="buttons">
            <a href="#play" class="btn primary">
                🚀 Play Now
            </a>

            <a href="#create" class="btn secondary">
                🎨 Create
            </a>

            <a href="#explore" class="btn tertiary">
                🔍 Explore
            </a>

            <a href="#community" class="btn quaternary">
                👥 Community
            </a>
        </div>
    </div>

    <footer>
        Made with ❤️ by the Bloxtip Team
    </footer>

</body>

</html>
