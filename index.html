<!doctype html>
<html class="light" dir="ltr" lang="en" style="height: 100%;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - Bloxtip</title>
  <link rel="icon" type="image/vnd.microsoft.icon" href="/favicon.ico">
  <style>
    :root {
      --theme-navbar-bg: #0074BD;
      --theme-primary: #02b757;
      --theme-primary-hover: #00cc61;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background: #e3e3e3;
      color: #191919;
      font-family: 'Source Sans Pro', Arial, sans-serif;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Navbar */
    .navbar {
      z-index: 1050;
      min-height: 40px;
      padding-top: 0;
      padding-bottom: 0;
      background-color: var(--theme-navbar-bg);
      background-repeat: no-repeat;
      box-shadow: 0 1px 4px rgba(25, 25, 25, 0.3);
      width: 100vw;
      margin-left: calc(-50vw + 50%);
    }

    .nav-container {
      z-index: 2;
      position: relative;
      max-width: 100%;
      padding: 0 20px;
      display: flex;
      align-items: center;
    }

    .top-row {
      width: 100%;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      min-height: 64px;
    }

    .left-section {
      flex: 1;
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 20px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .logo-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      width: 40px;
    }

    .logo-img {
      height: 35px;
      width: auto;
      object-fit: contain;
    }

    nav {
      display: flex;
      gap: 50px;
      margin-left: 30px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      padding: 6px 9px;
      transition: background 0.2s;
    }

    nav a:hover {
      background: rgba(25, 25, 25, 0.1);
      border-radius: 4px;
    }

    .search-container {
      flex: 0 1 450px;
      min-width: 120px;
      padding-left: 10px;
      padding-right: 10px;
      display: flex;
      gap: 0;
    }

    .search-wrapper {
      width: 100%;
      display: flex;
      position: relative;
      background: white;
      border-radius: 3px;
    }

    .search-input {
      flex: 1;
      border: 1px solid #b8b8b8;
      height: 28px;
      padding: 0 12px;
      font-size: 16px;
      font-weight: 200;
      border-right: none;
      border-radius: 3px 0 0 3px;
    }

    .search-input::placeholder {
      color: #B8B8B8;
      opacity: 1;
    }

    .search-input:focus {
      outline: none;
      box-shadow: inset 0 0 2px rgba(0, 116, 189, 0.3);
    }

    .search-button {
      border: 1px solid #b8b8b8;
      cursor: pointer;
      height: 28px;
      display: flex;
      padding: 0 8px;
      background: white;
      align-items: center;
      border-left: none;
      border-radius: 0 3px 3px 0;
      justify-content: center;
      color: #333;
    }

    .search-button:hover {
      background: #f5f5f5;
    }

    .right-section {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      white-space: nowrap;
      position: relative;
    }

    .user-menu {
      color: white;
      cursor: pointer;
      padding: 4px 8px;
      transition: background 0.2s;
      border-radius: 4px;
    }

    .user-menu:hover {
      background: rgba(25, 25, 25, 0.1);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      min-width: 180px;
      z-index: 1001;
      margin-top: 5px;
    }

    .dropdown-menu.active {
      display: block;
    }

    .dropdown-menu a,
    .dropdown-menu button {
      display: block;
      width: 100%;
      padding: 10px 15px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
      color: #191919;
      text-decoration: none;
      transition: background 0.2s;
      font-family: inherit;
      font-size: 14px;
    }

    .dropdown-menu a:hover,
    .dropdown-menu button:hover {
      background: #f0f0f0;
    }

    .dropdown-menu a.disabled,
    .dropdown-menu button.disabled {
      color: #ccc;
      cursor: not-allowed;
    }

    /* Alert Banner */
    .alert-wrapper {
      background: #F68802;
      padding: 10px 15px;
      text-align: center;
      color: white;
      font-size: 18px;
      font-weight: bold;
      z-index: 1030;
      width: 100vw;
      margin-left: calc(-50vw + 50%);
    }

    .alert-link {
      color: white;
    }

    .alert-link:hover {
      text-decoration: underline;
    }

    /* Main Content */
    .main {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      padding-top: 124px;
      padding-left: 0;
      padding-bottom: 50px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 0 20px;
      flex: 1;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 100%;
      background: white;
      box-shadow: 0 -5px 20px rgba(25, 25, 25, 0.15);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 100%;
    }

    .page-header-text h1 {
      font-size: 40px;
      font-weight: 300;
      margin: 0 0 8px;
    }

    .page-header-text p {
      color: #4a4a4a;
      font-size: 24px;
      font-weight: 300;
      margin: 0;
    }

    .games-section {
      margin-bottom: 40px;
    }

    .games-section h2 {
      font-size: 24px;
      font-weight: 300;
      margin: 0 0 16px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .game-card {
      background: white;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(25, 25, 25, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .game-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(25, 25, 25, 0.3);
    }

    .game-card-image {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #0074BD, #0099FF);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      padding: 10px;
    }

    .game-card-body {
      padding: 12px;
    }

    .game-card-title {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 4px;
      color: #191919;
    }

    .game-card-meta {
      font-size: 12px;
      color: #777;
    }

    .play-btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px 0;
      border: none;
      border-radius: 3px;
      background: #02b757;
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }

    .play-btn:hover {
      background: #00cc61;
    }

    /* Footer */
    .footer {
      width: 100%;
      background: #ffffff;
      border-top: 1px solid #e3e3e3;
      margin-top: auto;
      padding: 15px 0 25px;
    }

    .footer-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }

    .footer-link {
      color: #B8B8B8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 400;
    }

    .footer-link:hover {
      color: #777;
    }

    .footer-text {
      color: #B8B8B8;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.6;
    }

    @media (max-width: 984px) {
      nav {
        display: none;
      }

      .page-header {
        flex-direction: column;
        text-align: center;
      }

      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }

    @media (max-width: 535px) {
      .search-container {
        display: none;
      }

      .logo-img {
        height: 30px;
      }

      .page-header-text h1 {
        font-size: 30px;
      }

      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="top-row">
        <div class="left-section">
          <div class="logo-container">
            <button class="logo-btn" title="Refresh Page" onclick="location.reload()">
              <img src="https://raw.githubusercontent.com/amr010920/bloxtip/images/more/Untitled-removebg-preview.png" alt="Bloxtip" class="logo-img">
            </button>
          </div>
          <nav>
            <a href="/home/">Games</a>
            <a href="/catalog">Catalog</a>
            <a href="/creation/">Create</a>
            <a href="#download">Download</a>
          </nav>
        </div>
        <div class="search-container">
          <div class="search-wrapper">
            <input type="text" class="search-input" placeholder="Search">
            <button class="search-button" type="button">🔍</button>
          </div>
        </div>
        <div class="right-section">
          <div style="position: relative;">
            <span class="user-menu" id="user-menu-btn" onclick="toggleUserMenu()">
              <span id="user-display">Guest</span> ▼
            </span>
            <div class="dropdown-menu" id="user-dropdown">
              <a href="/auth/login" id="login-link">Login</a>
              <a href="/auth/signup" id="signup-link">Sign Up</a>
              <a href="/auth/profile" id="profile-btn" style="display:none;">My Profile</a>
              <a href="/catalog" id="avatar-btn" style="display:none;">Avatar & Items</a>
