<html class="light" dir="ltr" lang="en" style="height: 100%;"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog - Bloxtip</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/Untitled-removebg-preview.png">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --theme-navbar-bg: #0074BD;
      --theme-primary: #02b757;
      --theme-primary-hover: #00cc61;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body { background: #e3e3e3; color: #191919; font-family: Arial, sans-serif; display: flex; flex-direction: column; }

    .navbar {
      height: 40px;
      background-color: var(--theme-navbar-bg);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      color: white;
      font-size: 13px;
      font-weight: bold;
    }
    .nav-link { color: white; text-decoration: none; }
    .robux-display { display: inline-flex; align-items: center; gap: 5px; }
    .robux-icon { width: 16px; height: 16px; object-fit: contain; }

    .main { flex: 1; padding: 25px; max-width: 1100px; margin: 0 auto; width: 100%; }
    .catalog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .catalog-header h1 { font-size: 24px; color: #191919; }

    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    .item-card { background: white; border: 1px solid #ccc; border-radius: 4px; padding: 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .item-img-wrap { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; background: #f9f9f9; }
    .item-img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .item-title { font-size: 13px; font-weight: bold; color: #191919; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-creator { font-size: 11px; color: #666; margin-bottom: 8px; }
    .item-price-row { display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: bold; font-size: 13px; margin-bottom: 10px; }
    
    .buy-btn { width: 100%; padding: 6px 0; background: var(--theme-primary); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 2px; font-size: 12px; }
    .buy-btn:hover { background: var(--theme-primary-hover); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="./" class="nav-link">← Back to Home</a>
    <div class="robux-display">
      <img src="https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/ROBUX_icon_3F19%2529.webp" class="robux-icon" alt="Robux">
      <span id="user-robux">0</span> Robux
    </div>
  </nav>

  <main class="main">
    <div class="catalog-header">
      <h1>Avatar Shop / Catalog</h1>
      <a href="./avatar" class="nav-link" style="color: #0074BD; font-weight: bold;">Go to Avatar Editor →</a>
    </div>

    <div id="catalog-grid" class="catalog-grid">
      <p style="color: #777; grid-column: 1 / -1; text-align: center;">Loading catalog items...</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://hdpxjesfeawnntjzttwj.supabase.co/'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_rP30CJxvlgsSxAX73v2DNg_Cn0klwkX'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = localStorage.getItem('bloxtip_username') || 'yepme2';
    let userRobux = 0;

    async function initCatalog() {
      await fetchUserData();
      await fetchCatalogItems();
    }

    async function fetchUserData() {
      const { data } = await supabaseClient.from('accounts').select('robux').eq('username', currentUser).single();
      if (data) {
        userRobux = data.robux || 0;
        document.getElementById('user-robux').textContent = userRobux;
      }
    }

    async function fetchCatalogItems() {
      const grid = document.getElementById('catalog-grid');
      const { data: items, error } = await supabaseClient.from('catalog_items').select('*').order('id', { ascending: false });

      if (error || !items || items.length === 0) {
        grid.innerHTML = `<p style="color: #777; grid-column: 1 / -1; text-align: center;">No catalog items available.</p>`;
        return;
      }

      // fetch owned items of the player cuz why not lowk
      const { data: userInventory } = await supabaseClient.from('inventory').select('item_name').eq('user_id', currentUser);
      const ownedItemNames = new Set((userInventory || []).map(i => i.item_name));

      grid.innerHTML = items.map(item => {
        const isOwned = ownedItemNames.has(item.name);
        return `
          <div class="item-card">
            <div>
              <div class="item-img-wrap">
                <img src="${item.image_url}" class="item-img" alt="${item.name}">
              </div>
              <div class="item-title">${item.name}</div>
              <div class="item-creator">By ${item.creator}</div>
            </div>
            <div>
              <div class="item-price-row">
                <img src="https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/ROBUX_icon_3F19%2529.webp" style="width:14px; height:14px;">
                <span>${item.price}</span>
              </div>
              ${isOwned 
                ? `<button class="buy-btn" style="background:#888; cursor:default;" disabled>Owned</button>` 
                : `<button class="buy-btn" onclick="buyItem('${item.name}', ${item.price}, '${item.category}', '${item.image_url}')">Buy</button>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    async function buyItem(itemName, price, category, imageUrl) {
      if (userRobux < price) {
        alert("You do not have enough Robux to purchase this item!");
        return;
      }

      if (!confirm(`Are you sure you want to buy '${itemName}' for ${price} Robux?`)) return;

      // 1. Deduct Robux from user's account or shit on their head if their on debt
      const newBalance = userRobux - price;
      const { error: updateError } = await supabaseClient
        .from('accounts')
        .update({ robux: newBalance })
        .eq('username', currentUser);

      if (updateError) {
        alert("Purchase failed during checkout.");
        return;
      }

      // 2. add it or else supabase ur gonna DIE SUPABASE DIEEEE
      const { error: invError } = await supabaseClient
        .from('inventory')
        .insert([{
          user_id: currentUser,
          item_name: itemName,
          category: category,
          image_url: imageUrl,
          is_equipped: false
        }]);

      if (invError) {
        alert("Failed to add item to your inventory.");
        return;
      }

      alert(`Successfully purchased '${itemName}'!`);
      initCatalog();
    }

    window.addEventListener('DOMContentLoaded', initCatalog);
  </script>

</body>
</html>
