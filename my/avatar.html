<html class="light" dir="ltr" lang="en" style="height: 100%;"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Editor - Bloxtip</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/Untitled-removebg-preview.png">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Three.js & OBJLoader for External 3D Models -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

  <style>
    :root {
      --theme-navbar-bg: #0074BD;
      --theme-primary: #02b757;
      --theme-primary-hover: #00cc61;
      --theme-chat-blue: #00a2ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      background: #e3e3e3;
      color: #191919;
      font-family: 'Source Sans Pro', Arial, sans-serif;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* TOP NAVBAR */
    .navbar {
      z-index: 1050;
      height: 40px;
      background-color: var(--theme-navbar-bg);
      box-shadow: 0 1px 4px rgba(25, 25, 25, 0.3);
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      display: flex;
      align-items: center;
      padding: 0 15px;
    }

    .nav-container { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .left-section { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .logo-btn { background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; }
    .logo-img { height: 26px; width: auto; object-fit: contain; }
    .header-nav { display: flex; gap: 16px; margin-left: 5px; }
    .header-nav a { color: white; text-decoration: none; font-size: 14px; font-weight: bold; padding: 4px 2px; }

    .right-section { display: flex; align-items: center; gap: 12px; flex-shrink: 0; color: white; font-size: 13px; font-weight: bold; position: relative; }
    .robux-display { display: inline-flex; align-items: center; gap: 5px; font-weight: bold; font-size: 13px; color: white; }
    .robux-icon { width: 18px; height: 18px; object-fit: contain; }

    .main { flex: 1; width: 100%; display: flex; flex-direction: column; padding-top: 20px; padding-bottom: 40px; }
    .container { max-width: 1100px; margin: 0 auto; width: 100%; padding: 0 15px; flex: 1; }

    .page-box { background: white; border: 1px solid #cccccc; border-radius: 2px; padding: 20px; }
    .avatar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .avatar-header h1 { font-size: 24px; font-weight: normal; color: #191919; }
    .get-more-btn { background: #0074BD; border: 1px solid #00568c; color: white; padding: 6px 14px; font-size: 13px; font-weight: bold; border-radius: 2px; cursor: pointer; text-decoration: none; }
    
    .editor-body { display: flex; gap: 20px; flex-wrap: wrap; }
    .preview-column { width: 260px; background: #f5f5f5; border: 1px solid #cccccc; border-radius: 2px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    
    .avatar-thumb-container { position: relative; width: 220px; height: 260px; background: white; border: 1px solid #dddddd; border-radius: 2px; display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 12px; }
    
    /* 2D RIG STYLING */
    #avatar-2d-rig { width: 100%; height: 100%; position: relative; background: #e0e0e0; display: flex; justify-content: center; align-items: center; }
    .rig-head { position: absolute; top: 20px; width: 50px; height: 50px; background: #f5cd27; border: 1px solid #c4a118; border-radius: 3px; z-index: 2; }
    .rig-face { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; z-index: 3; }
    .rig-torso { position: absolute; top: 72px; width: 60px; height: 65px; background: #00a2ff; border: 1px solid #0077bc; z-index: 2; }
    .rig-left-arm { position: absolute; top: 72px; left: 45px; width: 28px; height: 65px; background: #f5cd27; border: 1px solid #c4a118; z-index: 1; }
    .rig-right-arm { position: absolute; top: 72px; right: 45px; width: 28px; height: 65px; background: #f5cd27; border: 1px solid #c4a118; z-index: 1; }
    .rig-left-leg { position: absolute; top: 139px; left: 79px; width: 29px; height: 65px; background: #a25b15; border: 1px solid #75400d; z-index: 2; }
    .rig-right-leg { position: absolute; top: 139px; right: 79px; width: 29px; height: 65px; background: #a25b15; border: 1px solid #75400d; z-index: 2; }
    .rig-overlay-item { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

    .view-toggle-btn { width: 100%; padding: 6px 0; background: #ffffff; border: 1px solid #0074BD; color: #0074BD; font-weight: bold; font-size: 13px; border-radius: 2px; cursor: pointer; margin-bottom: 10px; }
    .view-toggle-btn:hover { background: #eef5fc; }

    .inventory-column { flex: 1; background: #f5f5f5; border: 1px solid #cccccc; border-radius: 2px; padding: 15px; min-width: 300px; }
    .tabs-container { display: flex; gap: 6px; border-bottom: 1px solid #cccccc; padding-bottom: 8px; margin-bottom: 15px; }
    .v-tab-label { cursor: pointer; color: #0074BD; font-size: 13px; font-weight: bold; padding: 4px 10px; border: 1px solid transparent; border-radius: 2px; }
    .v-tab-label:hover { background: #eef5fc; }
    .v-tab-label.active { background: white; border-color: #cccccc; border-bottom-color: white; color: #191919; }

    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
    
    .avatar-card { background: white; border: 1px solid #cccccc; border-radius: 2px; padding: 8px; text-align: center; cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; transition: border-color 0.15s ease, background 0.15s ease; }
    .avatar-card:hover { border-color: #0074BD; }
    .avatar-card.equipped { border-color: #02b757; background: #eafbf1; }
    
    .avatar-card-img-wrap { width: 100%; height: 80px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
    .avatar-card-img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .avatar-card-title { font-size: 11px; font-weight: bold; color: #191919; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; width: 100%; }

    /* OUTFIT SAVE BAR */
    .outfit-save-box { display: flex; gap: 8px; margin-bottom: 15px; }
    .outfit-input { flex: 1; padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 2px; }
    .save-outfit-btn { background: #02b757; color: white; border: none; font-weight: bold; padding: 6px 12px; border-radius: 2px; cursor: pointer; font-size: 12px; }

    .footer { width: 100%; background: #ffffff; border-top: 1px solid #cccccc; margin-top: auto; padding: 15px 0; }
    .footer-container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }
    .footer-links { display: flex; gap: 15px; margin-bottom: 8px; }
    .footer-link { color: #0074BD; text-decoration: none; font-size: 12px; }
    .footer-text { color: #888888; font-size: 11px; line-height: 1.4; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <div class="left-section">
        <button class="logo-btn" onclick="window.location.href='./index.html'">
          <img src="https://raw.githubusercontent.com/amr010920/bloxtip/images/more/Untitled-removebg-preview.png" alt="Bloxtip" class="logo-img">
        </button>
        <div class="header-nav">
          <a href="./index">Games</a>
          <a href="./catalog">Catalog</a>
          <a href="./creation">Create</a>
        </div>
      </div>
      <div class="right-section">
        <span id="user-display">yepme2</span>
      </div>
    </div>
  </nav>

  <main class="main">
    <div class="container">
      <div class="page-box">
        <div class="avatar-header">
          <h1>Avatar Editor</h1>
          <a href="./catalog" class="get-more-btn">Get More Items</a>
        </div>

        <div class="editor-body">
          <div class="preview-column">
            <button class="view-toggle-btn" id="mode-toggle-btn" onclick="toggleViewMode()">Switch to 3D View</button>

            <div class="avatar-thumb-container">
              <!-- 2D Rig -->
              <div id="avatar-2d-rig">
                <div class="rig-head" id="rig-head">
                  <div class="rig-face" id="rig-face"></div>
                </div>
                <div class="rig-torso" id="rig-torso"></div>
                <div class="rig-left-arm"></div>
                <div class="rig-right-arm"></div>
                <div class="rig-left-leg"></div>
                <div class="rig-right-leg"></div>
                <div id="rig-overlay-container"></div>
              </div>

              <!-- 3D Model Viewport (External Roblox Character OBJ) -->
              <div id="avatar-3d-container" style="width:100%; height:100%; display:none;"></div>
            </div>
          </div>

          <div class="inventory-column">
            <div class="tabs-container" id="category-tabs">
              <div class="v-tab-label active" data-category="Recent">Recent</div>
              <div class="v-tab-label" data-category="Clothing">Clothing</div>
              <div class="v-tab-label" data-category="Body">Body</div>
              <div class="v-tab-label" data-category="Animations">Animations</div>
              <div class="v-tab-label" data-category="Outfits">Outfits</div>
            </div>

            <!-- Save Outfit Controls (Shown when Outfits tab is selected or dynamically) -->
            <div class="outfit-save-box" id="outfit-save-box">
              <input type="text" id="outfit-name-input" class="outfit-input" placeholder="Outfit Name (e.g., Cool Outfit)">
              <button class="save-outfit-btn" onclick="saveCurrentOutfit()">Save Outfit</button>
            </div>

            <div>
              <div id="category-title" style="padding-bottom: 8px; color: #666; font-size: 13px; font-weight: bold;">Recent &gt; All Items</div>
              <div id="inventory-grid" class="inventory-grid"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://hdpxjesfeawnntjzttwj.supabase.co/'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_rP30CJxvlgsSxAX73v2DNg_Cn0klwkX'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allInventoryItems = [];
    let userOutfits = [];
    let activeCategory = 'Recent';
    let is3DMode = false;

    // Three.js 3D External Model Loader (Loads Roblox Character Mesh)
    let scene, camera, renderer, loadedCharacterMesh;

    function init3DExternalModel() {
      const container = document.getElementById('avatar-3d-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe0e0e0);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1, 8);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(5, 10, 7);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      // Load External Roblox Noob Character OBJ Model File
      const objLoader = new THREE.OBJLoader();
      const characterObjUrl = 'https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/roblox_noob.obj'; // External Roblox Model

      objLoader.load(characterObjUrl, (object) => {
        loadedCharacterMesh = object;
        loadedCharacterMesh.scale.set(0.1, 0.1, 0.1);
        loadedCharacterMesh.position.set(0, -2, 0);
        scene.add(loadedCharacterMesh);
      }, undefined, (error) => {
        console.log('Error loading external 3D model, fallback scene enabled.');
      });

      function animate() {
        requestAnimationFrame(animate);
        if (loadedCharacterMesh) loadedCharacterMesh.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();
    }

    function toggleViewMode() {
      is3DMode = !is3DMode;
      document.getElementById('mode-toggle-btn').textContent = is3DMode ? "Switch to 2D View" : "Switch to 3D View";
      document.getElementById('avatar-2d-rig').style.display = is3DMode ? "none" : "flex";
      document.getElementById('avatar-3d-container').style.display = is3DMode ? "block" : "none";

      if (is3DMode && !renderer) {
        init3DExternalModel();
      }
    }

    async function loadUserData() {
      const currentUser = localStorage.getItem('bloxtip_username') || 'yepme2';

      // Load user inventory items
      const { data: inv } = await supabaseClient.from('inventory').select('*').eq('user_id', currentUser);
      allInventoryItems = inv || [];

      // Load user saved outfits
      const { data: outfits } = await supabaseClient.from('outfits').select('*').eq('user_id', currentUser);
      userOutfits = outfits || [];

      renderInventory();
      render2DRig();
    }

    function render2DRig() {
      const faceElement = document.getElementById('rig-face');
      const torsoElement = document.getElementById('rig-torso');
      const overlayContainer = document.getElementById('rig-overlay-container');

      faceElement.style.backgroundImage = '';
      torsoElement.style.backgroundImage = '';
      overlayContainer.innerHTML = '';

      allInventoryItems.forEach(item => {
        if (item.is_equipped) {
          const cat = (item.category || '').toLowerCase();
          if (cat === 'face') faceElement.style.backgroundImage = `url('${item.image_url}')`;
          else if (cat === 'shirt') torsoElement.style.backgroundImage = `url('${item.image_url}')`;
          else {
            const overlay = document.createElement('img');
            overlay.src = item.image_url;
            overlay.className = 'rig-overlay-item';
            overlayContainer.appendChild(overlay);
          }
        }
      });
    }

    function renderInventory() {
      const grid = document.getElementById('inventory-grid');
      grid.innerHTML = '';

      if (activeCategory === 'Outfits') {
        if (userOutfits.length === 0) {
          grid.innerHTML = `<p style="color: #777; font-size: 13px; grid-column: 1 / -1; text-align: center; padding: 20px;">No saved outfits yet.</p>`;
          return;
        }

        userOutfits.forEach(outfit => {
          const card = document.createElement('div');
          card.className = 'avatar-card';
          card.innerHTML = `
            <div class="avatar-card-img-wrap">
              <img src="https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/guestpfp.png" class="avatar-card-img">
            </div>
            <span class="avatar-card-title">${outfit.outfit_name}</span>
          `;
          card.addEventListener('click', () => equipOutfit(outfit));
          grid.appendChild(card);
        });
        return;
      }

      const filteredItems = allInventoryItems.filter(item => {
        if (activeCategory === 'Recent') return true;
        const cat = (item.category || '').toLowerCase();
        if (activeCategory === 'Clothing') return ['clothing', 'shirt', 'pants', 'face', 'hat', 'hair'].includes(cat);
        if (activeCategory === 'Body') return ['body', 'left arm', 'right arm', 'torso'].includes(cat);
        if (activeCategory === 'Animations') return cat.includes('anim');
        return cat === activeCategory.toLowerCase();
      });

      filteredItems.forEach(item => {
        const card = document.createElement('div');
        card.className = `avatar-card ${item.is_equipped ? 'equipped' : ''}`;
        card.innerHTML = `
          <div class="avatar-card-img-wrap"><img src="${item.image_url}" class="avatar-card-img"></div>
          <span class="avatar-card-title">${item.item_name}</span>
        `;

        card.addEventListener('click', async () => {
          item.is_equipped = !item.is_equipped;
          renderInventory();
          render2DRig();
          await supabaseClient.from('inventory').update({ is_equipped: item.is_equipped }).eq('id', item.id);
        });

        grid.appendChild(card);
      });
    }

    // SAVE OUTFIT FUNCTIONALITY
    async function saveCurrentOutfit() {
      const nameInput = document.getElementById('outfit-name-input');
      const outfitName = nameInput.value.trim();
      const currentUser = localStorage.getItem('bloxtip_username') || 'yepme2';

      if (!outfitName) return alert('Please enter an outfit name.');

      const equippedIds = allInventoryItems.filter(i => i.is_equipped).map(i => i.id);

      const { error } = await supabaseClient.from('outfits').insert([{
        user_id: currentUser,
        outfit_name: outfitName,
        equipped_item_ids: JSON.stringify(equippedIds)
      }]);

      if (error) {
        alert('Failed to save outfit: ' + error.message);
      } else {
        alert(`Outfit '${outfitName}' saved successfully!`);
        nameInput.value = '';
        loadUserData();
      }
    }

    // EQUIP ENTIRE OUTFIT AT ONCE
    async function equipOutfit(outfit) {
      const currentUser = localStorage.getItem('bloxtip_username') || 'yepme2';
      const equippedIds = new Set(JSON.parse(outfit.equipped_item_ids || '[]'));

      allInventoryItems.forEach(item => {
        item.is_equipped = equippedIds.has(item.id);
      });

      renderInventory();
      render2DRig();

      // Batch update inventory equipped statuses in Supabase
      for (const item of allInventoryItems) {
        await supabaseClient.from('inventory').update({ is_equipped: item.is_equipped }).eq('id', item.id);
      }
    }

    // Tab Listeners
    document.querySelectorAll('#category-tabs .v-tab-label').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#category-tabs .v-tab-label').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeCategory = tab.getAttribute('data-category');
        renderInventory();
      });
    });

    window.addEventListener('DOMContentLoaded', loadUserData);
  </script>

</body>
</html>
