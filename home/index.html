<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bloxtip | Home</title>
  <style>
    :root{--gold:#dfaa32;--gold-dark:#bd8918;--orange:#ff9008;--page:#e7e7e7;--text:#3d3d3d;--muted:#777}
    *{box-sizing:border-box;user-select:none}
    body{margin:0;min-width:320px;background:var(--page);color:var(--text);font:16px/1.5 Arial,sans-serif}
    header{background:var(--gold);border-bottom:3px solid var(--gold-dark);box-shadow:0 2px 6px #0002}
    .bar{display:flex;align-items:center;gap:24px;max-width:1100px;min-height:64px;margin:auto;padding:0 20px}
    .logo{display:grid;place-items:center;width:50px;height:50px;border-radius:6px;background:#fff;overflow:hidden;text-decoration:none}
    .logo img{width:100%;height:100%;object-fit:cover}
    nav{display:flex;gap:18px}
    nav a{color:#fff;font-weight:700;text-decoration:none;transition:opacity .2s}
    nav a:hover{opacity:.8}
    .user{margin-left:auto;color:#fff;font-weight:700}
    main{max-width:1100px;margin:auto;padding:28px 20px 48px}
    h1{margin:0 0 8px;font-size:32px}
    .intro{margin-top:0;color:var(--muted)}
    h2{margin:32px 0 14px;font-size:22px}
    .games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
    .card{overflow:hidden;border:1px solid #d0d0d0;border-radius:8px;background:#fff;box-shadow:0 2px 5px #0001;transition:transform .2s,box-shadow .2s}
    .card:hover{transform:translateY(-2px);box-shadow:0 4px 12px #0002}
    .game-icon{display:grid;place-items:center;width:100%;min-height:130px;padding:16px;border:0;background:linear-gradient(135deg,var(--gold),var(--orange));color:#fff;cursor:pointer;font:700 20px Arial,sans-serif;transition:filter .2s}
    .game-icon:hover,.game-icon:focus-visible{filter:brightness(.92);outline:3px solid var(--gold-dark);outline-offset:-3px}
    .card-body{padding:14px}
    .card h3{margin:0 0 6px;font-size:17px}
    .meta{color:var(--muted);font-size:14px}
    .play-button{display:none;width:100%;margin-top:12px;padding:10px 14px;border:0;border-radius:5px;background:var(--gold-dark);color:#fff;cursor:pointer;font:700 16px Arial,sans-serif;transition:background .2s}
    .card.open .play-button{display:block}
    .play-button:hover,.play-button:focus-visible{background:#9d7014;outline:3px solid #e7c466}
    .status{min-height:1.5em;margin-top:18px;color:var(--muted)}
    .feed{margin-top:34px;padding:20px;border-radius:8px;background:#fff}
    .downloads-section{margin-top:34px}
    .release-list{display:flex;flex-direction:column;gap:12px}
    .release-item{padding:16px;border:1px solid #d0d0d0;border-radius:6px;background:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
    .release-info{flex:1;min-width:250px}
    .release-tag{font-weight:700;color:var(--gold-dark);font-size:16px}
    .release-desc{color:var(--muted);font-size:14px;margin-top:4px}
    .release-date{color:var(--muted);font-size:13px}
    .download-btn{padding:10px 18px;border:0;border-radius:5px;background:var(--gold-dark);color:#fff;cursor:pointer;font:700 14px Arial,sans-serif;text-decoration:none;display:inline-block;transition:background .2s}
    .download-btn:hover{background:#9d7014}
    .no-releases{color:var(--muted);font-style:italic}
    footer{padding:24px 20px;color:var(--muted);text-align:center}
  </style>
</head>

  <main>
    <h1>Discover bloxtip</h1>
    <p class="intro">Click a game icon to show its Play button. Guests can play.</p>

    <section id="catalog">
      <h2>Featured Games</h2>
      <div class="games" id="games-container">
        <!-- Games will be dynamically loaded here -->
      </div>
      <p id="launch-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="downloads" class="downloads-section">
      <h2>Downloads</h2>
      <div class="release-list" id="releases-container">
        <p class="no-releases">Loading releases...</p>
      </div>
    </section>

    <section id="about" class="feed">
      <h2>Welcome to bloxtip!</h2>
      <p>Choose a game icon first, then click Play. Download the latest version to experience bloxtip!</p>
    </section>
  </main>

  <footer>© 2026 bloxtip</footer>

  <script>
    // Games data with placeids assigned sequentially
    const games = [
      { name: 'Piggy', title: 'Piggy [ALPHA] JULY 2020', year: 2020, placeid: 1 },
      { name: 'Ride a Box', title: 'Ride a Box Down Stairs', year: 2020, placeid: 2 },
      { name: 'Tower of Hell', title: 'Tower of Hell 2020', year: 2020, placeid: 3 },
      { name: 'Natural Disaster', title: 'Natural Disaster Survival', year: 2020, placeid: 4 }
    ];

    const status = document.getElementById('launch-status');
    const gamesContainer = document.getElementById('games-container');
    const releasesContainer = document.getElementById('releases-container');

    // Render games dynamically with assigned placeids
    function renderGames() {
      gamesContainer.innerHTML = games.map((game, index) => `
        <article class="card">
          <button class="game-icon" type="button" aria-expanded="false">${game.name}</button>
          <div class="card-body">
            <h3>${game.title}</h3>
            <div class="meta">${game.year} · 0 playing</div>
            <button class="play-button" data-game="${game.name}" data-place="${game.placeid}" type="button">Play</button>
          </div>
        </article>
      `).join('');

      // Attach event listeners
      document.querySelectorAll('.card').forEach(card => {
        const icon = card.querySelector('.game-icon');
        const play = card.querySelector('.play-button');

        if (!icon || !play) return;

        icon.addEventListener('click', () => {
          const isOpen = card.classList.toggle('open');
          icon.setAttribute('aria-expanded', String(isOpen));
          if (isOpen) play.focus();
        });

        play.addEventListener('click', (event) => {
          event.preventDefault();
          const game = play.dataset.game;
          const place = play.dataset.place;

          if (!game || !place) {
            status.textContent = 'This game is missing a launch target.';
            return;
          }

          history.pushState({}, '', `./${game}`);
          status.textContent = `Loading ${game}…`;
          window.location.href = `bloxtip://play?place=${encodeURIComponent(place)}&game=${encodeURIComponent(game)}`;
        });
      });
    }

    // Fetch and render releases from GitHub API
    async function loadReleases() {
      try {
        const response = await fetch('https://api.github.com/repos/amr010920/bloxtip/releases');
        const releases = await response.json();

        if (!Array.isArray(releases) || releases.length === 0) {
          releasesContainer.innerHTML = '<p class="no-releases">No releases available yet.</p>';
          return;
        }

        releasesContainer.innerHTML = releases.map(release => {
          const date = new Date(release.published_at).toLocaleDateString('en-US', { 
            year: 'numeric', 
            month: 'short', 
            day: 'numeric' 
          });
          
          const downloadLinks = release.assets.map(asset => `
            <a href="${asset.browser_download_url}" class="download-btn" download>${asset.name}</a>
          `).join('');

          return `
            <div class="release-item">
              <div class="release-info">
                <div class="release-tag">${release.tag_name}</div>
                <div class="release-desc">${release.name || 'Release'}</div>
                <div class="release-date">${date}</div>
              </div>
              <div>
                ${downloadLinks || '<span class="no-releases">No downloads</span>'}
              </div>
            </div>
          `;
        }).join('');
      } catch (error) {
        console.error('Error loading releases:', error);
        releasesContainer.innerHTML = '<p class="no-releases">Unable to load releases. Please try again later.</p>';
      }
    }

    // Initialize
    renderGames();
    loadReleases();
  </script>
