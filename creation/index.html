<!doctype html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* 2013 Roblox-style blue menu header and dropdown layout */
    .site-header {
      background: #0070dd;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 15px;
      height: 50px;
      position: relative;
    }
    .hamburger-menu-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 0 10px;
    }
    .hamburger-menu-btn:hover {
      background: rgba(0, 0, 0, 0.15);
    }
    .site-header nav {
      display: none;
      position: absolute;
      top: 50px;
      left: 0;
      background: #005bb5;
      width: 220px;
      flex-direction: column;
      box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    .site-header nav.open {
      display: flex;
    }
    .site-header nav a {
      color: white;
      text-decoration: none;
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 14px;
    }
    .site-header nav a:hover {
      background: #00458a;
    }
    .site-header nav a.coming-soon {
      color: #b0d3f8;
      cursor: default;
    }
    .site-header .search {
      margin-left: auto;
    }
  </style>
</head>
<body data-page="creation">
  <header class="site-header">
    <button class="hamburger-menu-btn" id="hamburger-toggle">☰</button>
    <nav id="header-nav">
      <a href="/home/">Games</a>
      <a href="#catalog" class="coming-soon">Catalog (Coming Soon)</a>
      <a class="active" href="/creation/">Create</a>
      <a href="#download">Download</a>
    </nav>
    <label class="search"><input placeholder="Search"><span>⌕</span></label>
  </header>

  <input type="file" id="hidden-rbxl-input" accept=".rbxl" style="display: none;">

  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="adWrapper-0-2-127" style="width: 100%; text-align: center;">
          <iframe src="/user-sponsorship/1" frameborder="0" scrolling="no" style="border-width: medium; border-style: none; border-color: currentcolor; border-image: none; margin: 0px auto; display: block; width: 100%; max-width: 728px; height: auto; aspect-ratio: 728 / 90;"></iframe>
        </div>
      </div>
    </div>

    <div class="developerContainer-0-2-132">
      <div class="row">
        <div class="buttonCol-0-2-137 col-12">
          <div class="vTab-0-2-134">
            <p class="vTabLabel-0-2-135">My Creations </p>
            <div class="btnBottomSeperator-0-2-138"></div>
          </div>
        </div>

        <div class="col-12">
          <div class="row">
            <div class="col-2">
              <div class="row mt-4 pe-0 row-0-2-141">
                <div class="col-12 pe-0 me-0">
                  <a class="wrapper-0-2-142 wrapperSelected-0-2-143" href="/develop?View=0"><span class="text-0-2-145 textSelected-0-2-146">Games</span></a>
                  <a class="wrapper-0-2-142 wrapperDisabled-0-2-144" href="/develop?View=10"><span class="text-0-2-145">Models</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=13"><span class="text-0-2-145">Decals</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=21"><span class="text-0-2-145">Badges</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=34"><span class="text-0-2-145">Passes</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=3"><span class="text-0-2-145">Audio</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=24"><span class="text-0-2-145">Animations</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=4"><span class="text-0-2-145">Meshes</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=101"><span class="text-0-2-145">User Ads</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=11"><span class="text-0-2-145">Shirts</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=2"><span class="text-0-2-145">T-Shirts</span></a>
                  <a class="wrapper-0-2-142" href="/develop?View=12"><span class="text-0-2-145">Pants</span></a>
                </div>
              </div>
            </div>

            <div class="col-8 mt-4">
              <div class="row">
                <div class="col-12">
                  <div>
                    <button id="create-game-btn" class="buyButton-0-2-147 w-auto ms-0" title="">Create New Game</button>
                  </div>
                  <h2 class="mt-2">Games</h2>
                  
                  <div class="row">
                    <div class="col-12" id="dynamic-games-container">
                      <!-- Player's custom games inject here dynamically -->
                    </div>
                  </div>

                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>© 2026 bloxtip · <a href="/home/">Back to home</a></footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Toggle Hamburger menu
      const hamburgerToggle = document.getElementById("hamburger-toggle");
      const headerNav = document.getElementById("header-nav");
      if (hamburgerToggle && headerNav) {
        hamburgerToggle.addEventListener("click", (e) => {
          e.stopPropagation();
          headerNav.classList.toggle("open");
        });
        document.addEventListener("click", (e) => {
          if (!headerNav.contains(e.target) && e.target !== hamburgerToggle) {
            headerNav.classList.remove("open");
          }
        });
      }

      const createBtn = document.getElementById("create-game-btn");
      const fileInput = document.getElementById("hidden-rbxl-input");
      const container = document.getElementById("dynamic-games-container");

      function getNextPlaceId() {
        const existingGames = JSON.parse(localStorage.getItem("bloxtip_custom_games") || "[]");
        if (existingGames.length === 0) return 1;
        const maxId = Math.max(...existingGames.map(g => parseInt(g.placeId) || 0));
        return maxId + 1;
      }

      createBtn.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length === 0) return;
        const file = e.target.files[0];
        
        let defaultName = file.name.replace(/\.[^/.]+$/, "");
        let gameName = prompt("Enter your game name:", defaultName);
        if (!gameName) return;

        const assignedId = getNextPlaceId();

        const reader = new FileReader();
        reader.onload = function(event) {
          const newGame = {
            placeId: assignedId,
            name: gameName,
            fileName: file.name,
            data: event.target.result
          };

          let existingGames = JSON.parse(localStorage.getItem("bloxtip_custom_games") || "[]");
          existingGames.push(newGame);
          localStorage.setItem("bloxtip_custom_games", JSON.stringify(existingGames));

          renderGames();
          fileInput.value = "";
        };
        reader.readAsDataURL(file);
      });

      function renderGames() {
        const existingGames = JSON.parse(localStorage.getItem("bloxtip_custom_games") || "[]");
        
        if (existingGames.length === 0) {
          container.innerHTML = `<p style="color: #666; margin-top: 15px;">No games found. Click "Create New Game" to upload your first place file.</p>`;
          return;
        }

        let htmlContent = "";
        existingGames.forEach(game => {
          htmlContent += `
            <div class="row row-0-2-160" style="margin-top: 15px;">
              <div class="col-2"><img class="image-0-2-159" src="https://www.bloxxia.de//images/thumbnails/765fd79a4c6610ebce4c8a67a3b2b0f95e6649c399673690b0d610661741f9c0.png"></div>
              <div class="col-9 ps-0"><p class="mb-0"><a href="/universes/configure?id=${game.placeId}">${game.name}</a></p><div><p class="mb-0"><span class="startPlaceLabel-0-2-162">Start Place: </span> <a href="/games/${game.placeId}/${game.name}">${game.name}</a></p><p class="visibilityButton-0-2-163 mb-0 mt-1"><a href="/games/${game.placeId}/${game.name}#/#basicSettings">Public</a></p></div></div>
              <div class="col-1"><div class="container-0-2-172"><div class="box-0-2-164 "><div class="gearWrapper-0-2-167"><div class="gear-0-2-166"></div></div><div class="caretWrapper-0-2-168"><div class="caret-0-2-169">▼</div></div></div></div></div>
            </div>
          `;
        });

        container.innerHTML = htmlContent;
      }

      renderGames();
    });
  </script>
  <script src="/app.js"></script>
</body>
</html>
