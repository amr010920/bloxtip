<!doctype html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Develop - Bloxtip</title>
  <link rel="icon" type="image/png" href="https://githubusercontent.com">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-navbar-bg: #0074BD;
      --theme-primary: #02b757;
      --theme-primary-hover: #00cc61;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #e3e3e3;
      color: #191919;
      font-family: 'Source Sans Pro', Arial, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    /* Top Blue Navbar */
    .navbar {
      z-index: 1050;
      height: 40px;
      background-color: var(--theme-navbar-bg);
      box-shadow: 0 1px 4px rgba(25, 25, 25, 0.3);
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      display: flex;
      align-items: center;
      padding: 0 15px;
    }

    .nav-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 3px;
    }

    .menu-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .hamburger-icon {
      width: 18px;
      height: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hamburger-line {
      width: 100%;
      height: 2px;
      background-color: #ffffff;
      border-radius: 1px;
    }

    .logo-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .logo-img {
      height: 28px;
      width: auto;
      object-fit: contain;
    }

    .header-nav {
      display: flex;
      gap: 20px;
      margin-left: 20px;
    }

    .header-nav a {
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      padding: 4px 6px;
      border-radius: 2px;
    }

    .header-nav a:hover, .header-nav a.active {
      background: rgba(255, 255, 255, 0.15);
    }

    .search-container {
      flex: 0 1 300px;
      display: flex;
      align-items: center;
      margin: 0 15px;
    }

    .search-wrapper {
      width: 100%;
      display: flex;
      background: white;
      border-radius: 2px;
    }

    .search-input {
      flex: 1;
      border: 1px solid #b8b8b8;
      height: 26px;
      padding: 0 10px;
      font-size: 13px;
      border-right: none;
      border-radius: 2px 0 0 2px;
    }

    .search-input:focus {
      outline: none;
    }

    .search-button {
      border: 1px solid #b8b8b8;
      cursor: pointer;
      height: 26px;
      width: 30px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: none;
      border-radius: 0 2px 2px 0;
    }

    .search-icon-svg {
      width: 13px;
      height: 13px;
      fill: #555555;
    }

    .right-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-container {
      max-width: 1100px;
      width: 100%;
      margin: 20px auto;
      padding: 0 15px;
      flex: 1;
    }

    .page-title-banner {
      background: white;
      border: 1px solid #cccccc;
      padding: 12px 20px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
      border-radius: 2px;
    }

    .dev-layout {
      display: flex;
      gap: 20px;
    }

    .dev-sidebar {
      width: 180px;
      background: white;
      border: 1px solid #cccccc;
      border-radius: 2px;
      padding: 8px 0;
      height: fit-content;
    }

    .dev-sidebar a {
      display: block;
      padding: 8px 15px;
      color: #0074BD;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
    }

    .dev-sidebar a:hover {
      background: #eef5fc;
    }

    .dev-sidebar a.selected {
      background: #0074BD;
      color: white;
    }

    .dev-content {
      flex: 1;
      background: white;
      border: 1px solid #cccccc;
      border-radius: 2px;
      padding: 20px;
    }

    .games-list-title {
      font-size: 16px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 15px;
      color: #333;
    }

    /* Form Design */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    .form-control {
      width: 100%;
      padding: 8px;
      border: 1px solid #b8b8b8;
      border-radius: 2px;
      font-size: 13px;
    }

    .form-control:focus {
      outline: 1px solid var(--theme-navbar-bg);
    }

    .btn-submit {
      background: linear-gradient(to bottom, #02b757 0%, #018a41 100%);
      border: 1px solid #018a41;
      color: white;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-submit:hover {
      background: linear-gradient(to bottom, #00cc61 0%, #02b757 100%);
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 12px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header Links Layout -->
  <div class="navbar">
    <div class="nav-container">
      <div class="left-section">
        <button class="menu-toggle-btn">
          <div class="hamburger-icon">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
          </div>
        </button>
        <a href="../index.html" class="logo-btn">
          <img class="logo-img" src="https://githubusercontent.com" alt="Bloxtip">
        </a>
        <div class="header-nav">
          <a href="../index.html">Games</a>
          <a href="#">Catalog</a>
          <a href="develop.html" class="active">Develop</a>
        </div>
      </div>

      <div class="search-container">
        <div class="search-wrapper">
          <input type="text" class="search-input" placeholder="Search">
          <button class="search-button">
            <svg class="search-icon-svg" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Creator Dashboard Workspace Frame -->
  <div class="main-container">
    <div class="page-title-banner">My Creations (Game Publisher)</div>
    
    <div class="dev-layout">
      <!-- Left Tab Navigation Selection List Menu -->
      <div class="dev-sidebar">
        <a href="#" class="selected">Games</a>
        <a href="#">Models</a>
        <a href="#">Decals</a>
        <a href="#">Badges</a>
        <a href="#">Passes</a>
      </div>

      <!-- Right Main Publisher Execution Workspace Panel Content -->
      <div class="dev-content">
        <h3 class="games-list-title">Create & Submit Game</h3>
        
        <form id="publishForm" onsubmit="handleGamePublish(event)">
          <div class="form-group">
            <label for="gameName">Game Name / Title:</label>
            <input type="text" id="gameName" class="form-control" placeholder="e.g. Classic Crossroads" required>
          </div>

          <div class="form-group">
            <label for="creatorName">Creator Name:</label>
            <input type="text" id="creatorName" class="form-control" placeholder="e.g. Builderman" required>
          </div>

          <div class="form-group">
            <label for="rbxlFile">Place File (.rbxl):</label>
            <input type="file" id="rbxlFile" class="form-control" accept=".rbxl" required>
          </div>

          <div class="form-group">
            <label for="githubToken">GitHub Access Token:</label>
            <input type="password" id="githubToken" class="form-control" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxx" required>
            <small style="color: #666; display: block; margin-top: 4px;">Requires repository code writing access scopes to append elements into games.json</small>
          </div>

          <button type="submit" class="btn-submit">Submit Game Proposal (Community)</button>
        </form>
      </div>
    </div>
  </div>

  <div class="footer">
    © 2026 Bloxtip Corporation · Return to Home
  </div>

  <script>
    async function handleGamePublish(event) {
      event.preventDefault();

      // Gather input data from standard field selectors
      const gameName = document.getElementById('gameName').value.trim();
      const creatorName = document.getElementById('creatorName').value.trim();
      const githubToken = document.getElementById('githubToken').value.trim();

      // Configure mock metadata structures
      const randomId = String(Math.floor(Math.random() * 900000) + 100000);
