<html class="light" dir="ltr" lang="en" style="height: 100%;"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create & Publish - Bloxtip</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/Untitled-removebg-preview.png">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --theme-navbar-bg: #0074BD;
      --theme-primary: #02b757;
      --theme-primary-hover: #00cc61;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body { background: #e3e3e3; color: #191919; font-family: Arial, sans-serif; display: flex; flex-direction: column; }

    .navbar {
      height: 40px;
      background-color: var(--theme-navbar-bg);
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 15px;
    }

    .nav-link { color: white; text-decoration: none; font-size: 13px; font-weight: bold; }

    .main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .create-box { background: white; padding: 30px; border: 1px solid #ccc; border-radius: 4px; width: 100%; max-width: 480px; }
    .create-box h1 { font-size: 22px; margin-bottom: 15px; color: #0074BD; }

    .tab-selector { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
    .tab-btn { background: none; border: none; font-size: 14px; font-weight: bold; color: #666; cursor: pointer; padding: 4px 8px; }
    .tab-btn.active { color: #0074BD; border-bottom: 2px solid #0074BD; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; font-size: 14px; }

    .publish-btn { width: 100%; padding: 10px; background: var(--theme-primary); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 2px; }
    .publish-btn:hover { background: var(--theme-primary-hover); }
    .publish-btn:disabled { background: #888; cursor: not-allowed; }

    .error { background: #fee; color: #c00; padding: 8px; margin-bottom: 15px; display: none; font-size: 13px; }
    .error.show { display: block; }
    .section-form { display: none; }
    .section-form.active { display: block; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="../" class="nav-link">← Back to Home</a>
  </nav>

  <main class="main">
    <div class="create-box">
      <h1>Creator</h1>
      <div class="error" id="error-box"></div>

      <div class="tab-selector">
        <button class="tab-btn active" onclick="switchTab('game', event)">Games</button>
        <button class="tab-btn" onclick="switchTab('item', event)">Catalog Item</button>
      </div>

      <!-- PUBLISH GAME FORM -->
      <form id="form-game" class="section-form active" onsubmit="publishGame(event)">
        <div class="form-group">
          <label for="game-title">Title</label>
          <input type="text" id="game-title" required placeholder="My Awesome 2013 Place">
        </div>
        <div class="form-group">
          <label for="game-file">Upload .rbxl File <span style="font-weight:normal; color:#777;">(Max 5 MB)</span></label>
          <input type="file" id="game-file" accept=".rbxl,.rbxlx" required>
        </div>
        <div class="form-group">
          <label for="game-thumb">Thumbnail Image URL <span style="font-weight:normal; color:#777;">(Optional)</span></label>
          <input type="text" id="game-thumb" placeholder="https://raw.githubusercontent.com/...">
        </div>
        <button type="submit" class="publish-btn" id="pub-game-btn">Publish Game</button>
      </form>

      <!-- PUBLISH ITEM FORM -->
      <form id="form-item" class="section-form" onsubmit="publishCatalogItem(event)">
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" required placeholder="Cool Red Hoodie">
        </div>
        <div class="form-group">
          <label for="item-category">Category</label>
          <select id="item-category">
            <option value="Shirt">Shirt</option>
            <option value="Pants">Pants</option>
            <option value="Face">Face</option>
            <option value="Hair">Hair</option>
            <option value="Hat">Hat</option>
          </select>
        </div>
        <div class="form-group">
          <label for="item-img">Item Image / Decal URL</label>
          <input type="text" id="item-img" required placeholder="https://raw.githubusercontent.com/...">
        </div>
        <div class="form-group">
          <label for="item-price">Price (Robux)</label>
          <input type="number" id="item-price" value="0" min="0">
        </div>
        <button type="submit" class="publish-btn" id="pub-item-btn">Publish Item & Add to Inventory</button>
      </form>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://hdpxjesfeawnntjzttwj.supabase.co/'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_rP30CJxvlgsSxAX73v2DNg_Cn0klwkX'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MAX_FILE_SIZE_MB = 5;
    const MAX_FILE_SIZE_BYTES = MAX_FILE_SIZE_MB * 1024 * 1024;

    function switchTab(tab, event) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section-form').forEach(f => f.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`form-${tab}`).classList.add('active');
      document.getElementById('error-box').classList.remove('show');
    }

    async function uploadFileWithBucketFallback(file, filePath) {
      if (file.size > MAX_FILE_SIZE_BYTES) {
        throw new Error(`File is too large (${(file.size / (1024 * 1024)).toFixed(2)} MB). Maximum allowed size is ${MAX_FILE_SIZE_MB} MB.`);
      }

      let bucketIndex = 1;
      let bucketName = 'games';
      
      while (true) {
        console.log(`Attempting upload to bucket: ${bucketName}`);
        
        const { data, error } = await supabaseClient.storage
          .from(bucketName)
          .upload(filePath, file, { upsert: true });

        if (!error) {
          const { data: publicUrlData } = supabaseClient.storage
            .from(bucketName)
            .getPublicUrl(filePath);
          return publicUrlData.publicUrl;
        }

        console.warn(`Upload to '${bucketName}' failed:`, error.message);

        bucketIndex++;
        bucketName = `games-${bucketIndex}`;

        if (bucketIndex > 20) {
          throw new Error("Storage upload failed: " + error.message);
        }
      }
    }

    async function publishGame(event) {
      event.preventDefault();
      const title = document.getElementById('game-title').value.trim();
      const fileInput = document.getElementById('game-file');
      let thumbnail = document.getElementById('game-thumb').value.trim();
      const errorBox = document.getElementById('error-box');
      const btn = document.getElementById('pub-game-btn');

      const savedUser = localStorage.getItem('bloxtip_username');
      if (!savedUser) {
        alert("You must be logged in to publish a game!");
        window.location.href = '../login';
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please select an .rbxl file to upload.");
        return;
      }

      const file = fileInput.files[0];

      if (file.size > MAX_FILE_SIZE_BYTES) {
        errorBox.textContent = `File size exceeds the ${MAX_FILE_SIZE_MB} MB limit. Your file is ${(file.size / (1024 * 1024)).toFixed(2)} MB.`;
        errorBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = "Uploading .rbxl File...";
      errorBox.classList.remove('show');

      if (!thumbnail) {
        thumbnail = "https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/defaultgamethumbnail.png";
      }

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;
        
        console.log("Starting file upload...");
        const filePublicUrl = await uploadFileWithBucketFallback(file, fileName);
        console.log("File uploaded successfully. Public URL:", filePublicUrl);

        btn.textContent = "Publishing Game...";

        const { error } = await supabaseClient.from('games').insert([{
          title: title,
          creator: savedUser,
          thumbnail_url: thumbnail,
          file_url: filePublicUrl, 
          visits: 0
        }]);

        if (error) {
          throw error;
        }

        alert(`Game '${title}' successfully published!`);
        window.location.href = '../';
      } catch (err) {
        console.error("Publish error:", err);
        errorBox.textContent = "Failed to publish game: " + (err.message || JSON.stringify(err));
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = "Publish Game to Catalog";
      }
    }

    async function publishCatalogItem(event) {
      event.preventDefault();
      const name = document.getElementById('item-name').value.trim();
      const category = document.getElementById('item-category').value;
      const imageUrl = document.getElementById('item-img').value.trim();
      const price = parseInt(document.getElementById('item-price').value) || 0;
      const errorBox = document.getElementById('error-box');
      const btn = document.getElementById('pub-item-btn');

      const savedUser = localStorage.getItem('bloxtip_username');
      if (!savedUser) {
        alert("You must be logged in to create items!");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Publishing Item...";

      const { error: catalogError } = await supabaseClient.from('catalog_items').insert([{
        name: name,
        creator: savedUser,
        category: category,
        image_url: imageUrl,
        price: price
      }]);

      if (catalogError) {
        errorBox.textContent = "Failed to publish to catalog_items: " + catalogError.message;
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = "Publish Item & Add to Inventory";
        return;
      }

      await supabaseClient.from('inventory').insert([{
        user_id: savedUser,
        item_name: name,
        category: category,
        image_url: imageUrl,
        is_equipped: false
      }Saving...]);

      alert(`Item '${name}' successfully published to the catalog and added to your inventory!`);
      window.location.href = '../avatar';
    }
  </script>

</body>
</html>
