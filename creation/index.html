<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bloxtip | Creation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="creation">
  <header class="site-header">
    <button class="hamburger">☰</button>
    <a class="logo" href="/home/"><b>B</b></a>
    <nav>
      <a href="/home/">Games</a>
      <a href="#catalog">Catalog</a>
      <a class="active" href="/creation/">Create</a>
      <a href="#download">Download</a>
    </nav>
    <label class="search"><input placeholder="Search"><span>⌕</span></label>
    <a class="user-name" href="/creation/">Guest</a>
    <a class="nav-icon" href="/creation/">▤</a>
    <a class="nav-icon" href="#settings">⚙</a>
  </header>

  <div class="announcement">We are reverting 2017 back to 0.300 as it has a lot of issues we can fix later.</div>

  <main id="creation-content" class="creation-page">
    <div style="max-width: 600px; margin: 40px auto; padding: 25px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
      <h2>Create a New Place</h2>
      <p>Publish your custom .rbxl place file to bloxtip.</p>
      
      <form id="create-game-form">
        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Game Name</label>
          <input type="text" id="game-name" placeholder="Enter game title" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Assigned Place ID</label>
          <input type="text" id="place-id-display" readonly style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; background: #f9f9f9; border-radius: 4px; color: #666;">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Select .rbxl File</label>
          <input type="file" id="rbxl-file" accept=".rbxl" required style="width: 100%;">
        </div>

        <button type="submit" style="background: #0066ff; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer;">Create Game</button>
      </form>
      <div id="create-status" style="margin-top: 15px; font-weight: bold;"></div>
    </div>
  </main>

  <footer>© 2026 bloxtip · <a href="/home/">Back to home</a></footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("create-game-form");
      const placeIdInput = document.getElementById("place-id-display");
      const statusDiv = document.getElementById("create-status");

      // Calculate the next sequential placeId dynamically
      function getNextPlaceId() {
        const existingGames = JSON.parse(localStorage.getItem("bloxtip_custom_games") || "[]");
        if (existingGames.length === 0) {
          return 1;
        }
        const maxId = Math.max(...existingGames.map(g => parseInt(g.placeId) || 0));
        return maxId + 1;
      }

      // Automatically display the next available placeId on page load
      placeIdInput.value = getNextPlaceId();

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const gameName = document.getElementById("game-name").value;
        const fileInput = document.getElementById("rbxl-file");

        if (fileInput.files.length === 0) {
          statusDiv.style.color = "red";
          statusDiv.textContent = "Please select an .rbxl file.";
          return;
        }

        const file = fileInput.files[0];
        const assignedId = parseInt(placeIdInput.value);

        const reader = new FileReader();
        reader.onload = function(event) {
          const fileData = event.target.result;

          const newGame = {
            placeId: assignedId,
            name: gameName,
            fileName: file.name,
            data: fileData,
            createdAt: new Date().toISOString()
          };

          let existingGames = JSON.parse(localStorage.getItem("bloxtip_custom_games") || "[]");
          existingGames.push(newGame);
          localStorage.setItem("bloxtip_custom_games", JSON.stringify(existingGames));

          statusDiv.style.color = "green";
          statusDiv.textContent = `Game successfully created! Assigned Place ID: ${assignedId}. Redirecting...`;

          setTimeout(() => {
            window.location.href = "/home/";
          }, 1500);
        };

        reader.readAsDataURL(file);
      });
    });
  </script>
  <script src="/app.js"></script>
</body>
</html>
