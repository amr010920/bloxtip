<!doctype html>
<html class="light" dir="ltr" lang="en" style="height: 100%;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Game - Bloxtip</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/Untitled-removebg-preview.png">
  <style>
    :root {
      --theme-navbar-bg: #0074BD;
      --theme-primary: #02b757;
      --theme-primary-hover: #00cc61;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body { background: #e3e3e3; color: #191919; font-family: Arial, sans-serif; display: flex; flex-direction: column; }

    .navbar {
      height: 40px;
      background-color: var(--theme-navbar-bg);
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 15px;
    }

    .nav-link { color: white; text-decoration: none; font-size: 13px; font-weight: bold; }

    .main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .create-box { background: white; padding: 30px; border: 1px solid #ccc; border-radius: 4px; width: 100%; max-width: 450px; }
    .create-box h1 { font-size: 24px; margin-bottom: 20px; color: #0074BD; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; font-size: 14px; }

    .publish-btn { width: 100%; padding: 10px; background: var(--theme-primary); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 2px; }
    .publish-btn:hover { background: var(--theme-primary-hover); }
    .publish-btn:disabled { background: #888; cursor: not-allowed; }

    .error { background: #fee; color: #c00; padding: 8px; margin-bottom: 15px; display: none; font-size: 13px; }
    .error.show { display: block; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="../" class="nav-link">&larr; Back to Home</a>
  </nav>

  <main class="main">
    <div class="create-box">
      <h1>Publish a Game (.rbxl)</h1>
      <div class="error" id="error-box"></div>

      <form onsubmit="publishGame(event)">
        <div class="form-group">
          <label for="game-title">Game Title</label>
          <input type="text" id="game-title" required placeholder="My Awesome 2013 Place">
        </div>
        <div class="form-group">
          <label for="game-file">Upload .rbxl File</label>
          <input type="file" id="game-file" accept=".rbxl" required>
        </div>
        <div class="form-group">
          <label for="game-thumb">Thumbnail Image URL <span style="font-weight:normal; color:#777;">(Optional)</span></label>
          <input type="text" id="game-thumb" placeholder="https://raw.githubusercontent.com/...">
        </div>
        <button type="submit" class="publish-btn" id="pub-btn">Publish to Global Catalog</button>
      </form>
    </div>
  </main>

  <script>
    const GAMES_BIN_ID = "6ad78c3aac6210605a42bdca";
    const JSONBIN_API_KEY = "$2a$10$bNwAOC5k1cJUHBKMRNfTOOMf88mvTl0feXXMT4xHxl4Gt/ORSwEmi";
    const GAMES_URL = `https://api.jsonbin.io/v3/b/${GAMES_BIN_ID}`;

    async function publishGame(event) {
      event.preventDefault();
      const title = document.getElementById('game-title').value.trim();
      const fileInput = document.getElementById('game-file');
      let thumbnail = document.getElementById('game-thumb').value.trim();
      const errorBox = document.getElementById('error-box');
      const btn = document.getElementById('pub-btn');

      errorBox.classList.remove('show');

      const savedUser = localStorage.getItem('bloxtip_username');
      if (!savedUser) {
        alert("You must be logged in to publish a game!");
        window.location.href = '../login';
        return;
      }

      if (fileInput.files.length === 0) {
        errorBox.textContent = "Please select an .rbxl file to publish.";
        errorBox.classList.add('show');
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;
      btn.textContent = "Publishing Game...";

      try {
        const rbxlUrl = URL.createObjectURL(file);

        if (!thumbnail) {
          thumbnail = "https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/defaultgamethumbnail.png";
        }

        const getRes = await fetch(GAMES_URL + "/latest", {
          headers: { "X-Master-Key": JSONBIN_API_KEY }
        });

        let games = [];
        if (getRes.ok) {
          const data = await getRes.json();
          games = data.record.games || [];
        }

        const newGame = {
          id: Date.now(),
          title: title,
          author: savedUser,
          thumbnail: thumbnail,
          rbxlUrl: rbxlUrl,
          createdAt: new Date().toLocaleDateString()
        };

        games.unshift(newGame);

        const putRes = await fetch(GAMES_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify({ games: games })
        });

        if (putRes.ok) {
          alert(`Game '${title}' successfully published globally! Redirecting to home...`);
          window.location.href = '../';
        } else {
          errorBox.textContent = "Failed to save game to global database.";
          errorBox.classList.add('show');
          btn.disabled = false;
          btn.textContent = "Publish to Global Catalog";
        }
      } catch (err) {
        errorBox.textContent = "An error occurred while publishing.";
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = "Publish to Global Catalog";
      }
    }
  </script>
</body>
</html>
