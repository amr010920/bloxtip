  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const refreshBtn = document.getElementById("refresh-btn");
      if (refreshBtn) {
        refreshBtn.addEventListener("click", () => {
          location.reload();
        });
      }

      const createBtn = document.getElementById("create-game-btn");
      const fileInput = document.getElementById("hidden-rbxl-input");
      const container = document.getElementById("dynamic-games-container");

      function getNextPlaceId() {
        const existingGames = JSON.parse(localStorage.getItem("bloxtip_custom_games") || "[]");
        if (existingGames.length === 0) return 1;
        const maxId = Math.max(...existingGames.map(g => parseInt(g.placeId) || 0));
        return maxId + 1;
      }

      createBtn.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length === 0) return;
        const file = e.target.files[0];
        
        let defaultName = file.name.replace(/\.[^/.]+$/, "");
        let gameName = prompt("Enter your game name:", defaultName);
        if (!gameName) return;

        const assignedId = getNextPlaceId();

        const reader = new FileReader();
        reader.onload = function(event) {
          const newGame = {
            placeId: assignedId,
            name: gameName,
            fileName: file.name,
            data: event.target.result
          };

          let existingGames = JSON.parse(localStorage.getItem("bloxtip_custom_games") || "[]");
          existingGames.push(newGame);
          localStorage.setItem("bloxtip_custom_games", JSON.stringify(existingGames));

          renderGames();
          fileInput.value = "";
        };
        reader.readAsDataURL(file);
      });

      function renderGames() {
        const existingGames = JSON.parse(localStorage.getItem("bloxtip_custom_games") || "[]");
        
        if (existingGames.length === 0) {
          container.innerHTML = `<p style="color: #666; margin-top: 15px;">No games found. Click "Create New Game" to upload your first place file.</p>`;
          return;
        }

        let htmlContent = "";
        existingGames.forEach(game => {
          htmlContent += `
            <div class="row" style="margin-top: 15px;">
              <div class="col-2"><img src="https://www.bloxxia.de//images/thumbnails/765fd79a4c6610ebce4c8a67a3b2b0f95e6649c399673690b0d610661741f9c0.png" style="width:100%;"></div>
              <div class="col-9 ps-0"><p class="mb-0"><a href="#">${game.name}</a></p><div><p class="mb-0"><span>Start Place: </span> <a href="#">${game.name}</a></p><p class="mb-0 mt-1"><a href="#">Public</a></p></div></div>
            </div>
          `;
        });

        container.innerHTML = htmlContent;
      }

      renderGames();
    });
  </script>
