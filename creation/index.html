<!DOCTYPE html>
<html class="light" dir="ltr" lang="en" style="height: 100%;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create & Publish - Bloxtip</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/Untitled-removebg-preview.png">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --theme-navbar-bg: #0074BD;
      --theme-primary: #02b757;
      --theme-primary-hover: #00cc61;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body { background: #e3e3e3; color: #191919; font-family: Arial, sans-serif; display: flex; flex-direction: column; }

    .navbar {
      height: 40px;
      background-color: var(--theme-navbar-bg);
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 15px;
    }

    .nav-link { color: white; text-decoration: none; font-size: 13px; font-weight: bold; }

    .main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 25px 20px; overflow-y: auto; }
    .create-box { background: white; padding: 30px; border: 1px solid #ccc; border-radius: 4px; width: 100%; max-width: 540px; }
    .create-box h1 { font-size: 22px; margin-bottom: 15px; color: #0074BD; }

    .tab-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
    .tab-btn { background: none; border: none; font-size: 14px; font-weight: bold; color: #666; cursor: pointer; padding: 4px 8px; }
    .tab-btn.active { color: #0074BD; border-bottom: 2px solid #0074BD; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="file"],
    .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; font-size: 14px; background: #fff; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .checkbox-row input { width: auto; }

    .preview-box {
      border: 1px dashed #bbb;
      background: #fafafa;
      padding: 10px;
      border-radius: 3px;
      margin-bottom: 15px;
      display: none;
    }
    .preview-box.show { display: block; }
    .preview-row { display: flex; align-items: center; gap: 12px; }
    .preview-box img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      background: #fff;
      border: 1px solid #ddd;
    }
    .preview-meta { font-size: 12px; color: #444; line-height: 1.45; }

    .publish-btn { width: 100%; padding: 10px; background: var(--theme-primary); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 2px; font-size: 14px; }
    .publish-btn:hover { background: var(--theme-primary-hover); }
    .publish-btn:disabled { background: #888; cursor: not-allowed; }

    .result-card {
      margin-top: 15px;
      padding: 12px;
      background: #f0f8ff;
      border: 1px solid #b6d8f2;
      border-radius: 3px;
      font-size: 12px;
      display: none;
    }
    .result-card.show { display: block; }
    .result-card code {
      display: block;
      background: #fff;
      border: 1px solid #d0e3f2;
      padding: 5px 7px;
      margin: 5px 0 8px 0;
      word-break: break-all;
      font-family: Consolas, monospace;
      font-size: 11px;
    }

    .error { background: #fee; color: #c00; padding: 8px; margin-bottom: 15px; display: none; font-size: 13px; border: 1px solid #f5c2c2; border-radius: 2px; }
    .error.show { display: block; }
    .section-form { display: none; }
    .section-form.active { display: block; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="../" class="nav-link">← Back to Home</a>
  </nav>

  <main class="main">
    <div class="create-box">
      <h1>Creator</h1>
      <div class="error" id="error-box"></div>

      <div class="tab-selector">
        <button type="button" class="tab-btn active" onclick="switchTab('game', event)">Games</button>
        <button type="button" class="tab-btn" onclick="switchTab('item', event)">Catalog Item</button>
        <button type="button" class="tab-btn" onclick="switchTab('toolbox', event)">Toolbox</button>
        <button type="button" class="tab-btn" onclick="switchTab('plugin', event)">Plugin</button>
        <button type="button" class="tab-btn" onclick="switchTab('image', event)">Image</button>
      </div>

      <!-- PUBLISH GAME FORM -->
      <form id="form-game" class="section-form active" onsubmit="publishGame(event)">
        <div class="form-group">
          <label for="game-title">Title</label>
          <input type="text" id="game-title" required placeholder="My Awesome 2013 Place">
        </div>
        <div class="form-group">
          <label for="game-year">Game Client Year</label>
          <select id="game-year">
            <option value="2010">2010</option>
            <option value="2011">2011</option>
            <option value="2012">2012</option>
            <option value="2013" selected>2013</option>
            <option value="2014">2014</option>
          </select>
        </div>
        <div class="form-group">
          <label for="game-file">Upload .rbxl File <span style="font-weight:normal; color:#777;">(Max 15 MB)</span></label>
          <input type="file" id="game-file" accept=".rbxl,.rbxlx" required>
        </div>
        <div class="form-group">
          <label for="game-thumb">Thumbnail Image URL <span style="font-weight:normal; color:#777;">(Optional)</span></label>
          <input type="text" id="game-thumb" placeholder="https://raw.githubusercontent.com/...">
        </div>
        <button type="submit" class="publish-btn" id="pub-game-btn">Publish Game</button>
      </form>

      <!-- PUBLISH ITEM FORM -->
      <form id="form-item" class="section-form" onsubmit="publishCatalogItem(event)">
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" required placeholder="Cool Red Hoodie">
        </div>
        <div class="form-group">
          <label for="item-category">Category</label>
          <select id="item-category">
            <option value="Shirt">Shirt</option>
            <option value="Pants">Pants</option>
            <option value="Face">Face</option>
            <option value="Hair">Hair</option>
            <option value="Hat">Hat</option>
          </select>
        </div>
        <div class="form-group">
          <label for="item-img">Item Image / Decal URL</label>
          <input type="text" id="item-img" required placeholder="https://raw.githubusercontent.com/...">
        </div>
        <div class="form-group">
          <label for="item-price">Price (Robux)</label>
          <input type="number" id="item-price" value="0" min="0">
        </div>
        <button type="submit" class="publish-btn" id="pub-item-btn">Publish Item & Add to Inventory</button>
      </form>

      <!-- PUBLISH TOOLBOX ITEM FORM -->
      <form id="form-toolbox" class="section-form" onsubmit="publishToolboxItem(event)">
        <div class="form-group">
          <label for="toolbox-name">Item Name</label>
          <input type="text" id="toolbox-name" required placeholder="Cool Part">
        </div>
        <div class="form-group">
          <label for="toolbox-file">Model File (.rbxmx / .xml) <span style="font-weight:normal; color:#777;">(Max 15 MB)</span></label>
          <input type="file" id="toolbox-file" accept=".rbxmx,.xml" required>
        </div>
        <button type="submit" class="publish-btn" id="pub-toolbox-btn">Publish to Toolbox</button>
      </form>

      <!-- PUBLISH PLUGIN FORM -->
      <form id="form-plugin" class="section-form" onsubmit="publishPlugin(event)">
        <div class="form-group">
          <label for="plugin-name">Plugin Name</label>
          <input type="text" id="plugin-name" required placeholder="Part Resize Tool">
        </div>
        <div class="form-group">
          <label for="plugin-asset-id">Plugin Asset ID <span style="font-weight:normal; color:#777;">(Optional — auto-generated if empty)</span></label>
          <input type="text" id="plugin-asset-id" placeholder="e.g. 142314093">
        </div>
        <div class="form-group">
          <label for="plugin-file">Plugin File (.rbxmx / .lua / .luau / .xml) <span style="font-weight:normal; color:#777;">(Optional, Max 15 MB)</span></label>
          <input type="file" id="plugin-file" accept=".rbxmx,.lua,.luau,.xml">
        </div>
        <div class="form-group checkbox-row">
          <input type="checkbox" id="plugin-enabled" checked>
          <label for="plugin-enabled" style="margin:0; font-weight:normal;">Enable plugin in Studio Manage Plugins immediately</label>
        </div>
        <button type="submit" class="publish-btn" id="pub-plugin-btn">Publish Plugin</button>
      </form>

      <!-- PUBLISH LOW-QUALITY IMAGE / DECAL FORM -->
      <div id="form-image" class="section-form">
        <form onsubmit="publishImageAsset(event)">
          <div class="form-group">
            <label for="image-name">Image / Decal Name</label>
            <input type="text" id="image-name" required placeholder="Brick Texture or ImageLabel">
          </div>
          <div class="form-group">
            <label for="image-file">Image File <span style="font-weight:normal; color:#777;">(PNG, JPG, WebP, GIF)</span></label>
            <input type="file" id="image-file" accept="image/*" required onchange="previewCompressedImage()">
          </div>

          <div class="preview-box" id="image-preview-box">
            <div class="preview-row">
              <img id="image-preview-img" alt="Compressed preview">
              <div class="preview-meta" id="image-preview-meta">Compressing...</div>
            </div>
          </div>

          <button type="submit" class="publish-btn" id="pub-image-btn">Compress & Upload to Bucket</button>
        </form>

        <div class="result-card" id="image-upload-result">
          <strong>Uploaded Successfully!</strong>
          <div style="margin-top:6px;">Image ID & Content ID:</div>
          <code id="res-content-id"></code>
          <div>Direct Bucket URL:</div>
          <code id="res-public-url"></code>
        </div>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_PROJECT_ID = 'hdpxjesfeawnntjzttwj';
    const SUPABASE_URL = `https://${SUPABASE_PROJECT_ID}.supabase.co`;
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const SUPABASE_IMAGE_BUCKET = 'images';
    const DEFAULT_TARGET_KB = 5;
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MAX_FILE_SIZE_MB = 15;
    const MAX_FILE_SIZE_BYTES = MAX_FILE_SIZE_MB * 1024 * 1024;

    let latestCompressedBlob = null;
    let latestCompressedDimensions = { width: 0, height: 0 };

    function switchTab(tab, event) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section-form').forEach(f => f.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`form-${tab}`).classList.add('active');
      document.getElementById('error-box').classList.remove('show');
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = () => reject(new Error("Failed to read file contents."));
        reader.readAsText(file);
      });
    }

    function loadImageElement(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Could not decode image file."));
        };
        img.src = url;
      });
    }

    function canvasToJpegBlob(canvas, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (!blob) {
            reject(new Error("Canvas compression failed."));
            return;
          }
          resolve(blob);
        }, 'image/jpeg', quality);
      });
    }

    async function compressImageToTargetKB(file, targetKB = DEFAULT_TARGET_KB) {
      const img = await loadImageElement(file);
      const targetBytes = Math.max(512, targetKB * 1024);

      const maxDimSteps = [256, 192, 160, 128, 96, 64, 48];
      const qualities = [0.45, 0.3, 0.2, 0.12, 0.06, 0.02];

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      let bestBlob = null;
      let bestDims = { width: img.naturalWidth, height: img.naturalHeight };

      for (const maxDim of maxDimSteps) {
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const width = Math.max(16, Math.round(img.naturalWidth * scale));
        const height = Math.max(16, Math.round(img.naturalHeight * scale));

        canvas.width = width;
        canvas.height = height;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'low';
        ctx.drawImage(img, 0, 0, width, height);

        for (const q of qualities) {
          const blob = await canvasToJpegBlob(canvas, q);
          bestBlob = blob;
          bestDims = { width, height };
          if (blob.size <= targetBytes) {
            return { blob, width, height };
          }
        }
      }

      return { blob: bestBlob, width: bestDims.width, height: bestDims.height };
    }

    async function previewCompressedImage() {
      const fileInput = document.getElementById('image-file');
      const box = document.getElementById('image-preview-box');
      const imgEl = document.getElementById('image-preview-img');
      const metaEl = document.getElementById('image-preview-meta');
      const errorBox = document.getElementById('error-box');

      latestCompressedBlob = null;

      if (!fileInput.files || fileInput.files.length === 0) {
        box.classList.remove('show');
        return;
      }

      const file = fileInput.files[0];
      if (file.size > MAX_FILE_SIZE_BYTES) {
        errorBox.textContent = `File size exceeds the ${MAX_FILE_SIZE_MB} MB limit.`;
        errorBox.classList.add('show');
        box.classList.remove('show');
        return;
      }

      errorBox.classList.remove('show');
      box.classList.add('show');
      metaEl.textContent = "Compressing image...";

      try {
        const { blob, width, height } = await compressImageToTargetKB(file, DEFAULT_TARGET_KB);
        latestCompressedBlob = blob;
        latestCompressedDimensions = { width, height };

        if (imgEl.dataset.objectUrl) {
          URL.revokeObjectURL(imgEl.dataset.objectUrl);
        }
        const objectUrl = URL.createObjectURL(blob);
        imgEl.dataset.objectUrl = objectUrl;
        imgEl.src = objectUrl;

        const origKB = (file.size / 1024).toFixed(1);
        const compKB = (blob.size / 1024).toFixed(2);
        metaEl.innerHTML = `
          <strong>Compressed:</strong> ${compKB} KB (from ${origKB} KB)<br>
          <strong>Dimensions:</strong> ${width}×${height} px (JPEG)
        `;
      } catch (err) {
        metaEl.textContent = "Preview failed: " + err.message;
      }
    }

    async function getNextSequentialImageId() {
      const { data, error } = await supabaseClient
        .from('images')
        .select('asset_id');

      if (error || !data || data.length === 0) {
        return '1';
      }

      let maxNum = 0;
      for (const row of data) {
        const parsed = parseInt(row.asset_id, 10);
        if (!Number.isNaN(parsed) && parsed > maxNum) {
          maxNum = parsed;
        }
      }

      return String(Math.max(maxNum, data.length) + 1);
    }

    async function getAssetById(assetIdOrContent) {
      if (!assetIdOrContent) return null;
      const match = String(assetIdOrContent).match(/(\d+)/);
      if (!match) return null;

      const cleanId = match[1];
      const { data, error } = await supabaseClient
        .from('images')
        .select('asset_id, name, creator, image_url, file_size_bytes, width, height')
        .eq('asset_id', cleanId)
        .maybeSingle();

      if (error) {
        throw error;
      }
      return data;
    }

    async function resolveXmlAssetUrls(xmlString) {
      const ids = [...new Set([...xmlString.matchAll(/rbxassetid:\/\/(\d+)/g)].map(m => m[1]))];
      let output = xmlString;

      for (const id of ids) {
        const asset = await getAssetById(id);
        if (asset && asset.image_url) {
          output = output.replaceAll(`rbxassetid://${id}`, asset.image_url);
        }
      }
      return output;
    }

    async function publishImageAsset(event) {
      event.preventDefault();
      const name = document.getElementById('image-name').value.trim();
      const fileInput = document.getElementById('image-file');
      const errorBox = document.getElementById('error-box');
      const resultCard = document.getElementById('image-upload-result');
      const btn = document.getElementById('pub-image-btn');

      const savedUser = localStorage.getItem('bloxtip_username');
      if (!savedUser) {
        alert("You must be logged in to upload an image!");
        window.location.href = '../login';
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please choose an image file.");
        return;
      }

      const file = fileInput.files[0];
      if (file.size > MAX_FILE_SIZE_BYTES) {
        errorBox.textContent = `File size exceeds the ${MAX_FILE_SIZE_MB} MB limit.`;
        errorBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = "Compressing to ~5 KB...";
      errorBox.classList.remove('show');
      resultCard.classList.remove('show');

      try {
        const compressed = latestCompressedBlob
          ? { blob: latestCompressedBlob, ...latestCompressedDimensions }
          : await compressImageToTargetKB(file, DEFAULT_TARGET_KB);

        btn.textContent = "Assigning Next ID...";
        const assetId = await getNextSequentialImageId();
        const safeUser = savedUser.replace(/[^a-zA-Z0-9_-]/g, '_');
        const storagePath = `studio_assets/${safeUser}/${assetId}.jpg`;

        btn.textContent = "Uploading to Bucket...";

        const { error: uploadError } = await supabaseClient
          .storage
          .from(SUPABASE_IMAGE_BUCKET)
          .upload(storagePath, compressed.blob, {
            contentType: 'image/jpeg',
            upsert: true
          });

        if (uploadError) {
          throw uploadError;
        }

        const { data: publicUrlData } = supabaseClient
          .storage
          .from(SUPABASE_IMAGE_BUCKET)
          .getPublicUrl(storagePath);

        const publicUrl = publicUrlData && publicUrlData.publicUrl ? publicUrlData.publicUrl : '';

        btn.textContent = "Saving Asset Record...";

        const { error: dbError } = await supabaseClient
          .from('images')
          .upsert([{
            asset_id: assetId,
            name: name,
            creator: savedUser,
            image_url: publicUrl,
            storage_path: storagePath,
            bucket: SUPABASE_IMAGE_BUCKET,
            file_size_bytes: compressed.blob.size,
            width: compressed.width,
            height: compressed.height
          }], { onConflict: 'asset_id' });

        if (dbError) {
          console.warn("Bucket upload succeeded, but 'images' table insert warning:", dbError.message);
        }

        document.getElementById('res-content-id').textContent = `ID: ${assetId}  |  rbxassetid://${assetId}`;
        document.getElementById('res-public-url').textContent = publicUrl;
        resultCard.classList.add('show');

        btn.disabled = false;
        btn.textContent = "Compress & Upload to Bucket";
      } catch (err) {
        console.error("Image publish error:", err);
        errorBox.textContent = "Failed to upload image: " + (err.message || JSON.stringify(err));
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = "Compress & Upload to Bucket";
      }
    }

    async function publishGame(event) {
      event.preventDefault();
      const title = document.getElementById('game-title').value.trim();
      const year = parseInt(document.getElementById('game-year').value);
      const fileInput = document.getElementById('game-file');
      let thumbnail = document.getElementById('game-thumb').value.trim();
      const errorBox = document.getElementById('error-box');
      const btn = document.getElementById('pub-game-btn');

      const savedUser = localStorage.getItem('bloxtip_username');
      if (!savedUser) {
        alert("You must be logged in to publish a game!");
        window.location.href = '../login';
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please select an .rbxl file to upload.");
        return;
      }

      const file = fileInput.files[0];

      if (file.size > MAX_FILE_SIZE_BYTES) {
        errorBox.textContent = `File size exceeds the ${MAX_FILE_SIZE_MB} MB limit. Your file is ${(file.size / (1024 * 1024)).toFixed(2)} MB.`;
        errorBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = "Converting file to XML...";
      errorBox.classList.remove('show');

      if (!thumbnail) {
        thumbnail = "https://raw.githubusercontent.com/amr010920/bloxtip/refs/heads/images/more/defaultgamethumbnail.png";
      }

      try {
        const xmlContent = await readFileAsText(file);

        btn.textContent = "Saving to Database...";

        const { data, error } = await supabaseClient.from('games').insert([{
          title: title,
          year: year,
          creator: savedUser,
          thumbnail_url: thumbnail,
          xml: xmlContent,
          visits: 0
        }]).select();

        if (error) {
          throw error;
        }

        const newGameId = data && data[0] ? data[0].id : 'unknown';
        alert(`Game '${title}' (${year}) successfully published! Game ID: ${newGameId}`);
        window.location.href = '../';
      } catch (err) {
        console.error("Publish error:", err);
        errorBox.textContent = "Failed to publish game: " + (err.message || JSON.stringify(err));
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = "Publish Game";
      }
    }

    async function publishCatalogItem(event) {
      event.preventDefault();
      const name = document.getElementById('item-name').value.trim();
      const category = document.getElementById('item-category').value;
      const imageUrl = document.getElementById('item-img').value.trim();
      const price = parseInt(document.getElementById('item-price').value) || 0;
      const errorBox = document.getElementById('error-box');
      const btn = document.getElementById('pub-item-btn');

      const savedUser = localStorage.getItem('bloxtip_username');
      if (!savedUser) {
        alert("You must be logged in to create items!");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Publishing Item...";

      const { error: catalogError } = await supabaseClient.from('catalog_items').insert([{
        name: name,
        creator: savedUser,
        category: category,
        image_url: imageUrl,
        price: price
      }]);

      if (catalogError) {
        errorBox.textContent = "Failed to publish to catalog_items: " + catalogError.message;
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = "Publish Item & Add to Inventory";
        return;
      }

      const { error: inventoryError } = await supabaseClient.from('inventory').insert([{
        user_id: savedUser,
        item_name: name,
        category: category,
        image_url: imageUrl,
        is_equipped: false
      }]);

      if (inventoryError) {
        console.warn("Failed to add to inventory directly:", inventoryError.message);
      }

      alert(`Item '${name}' successfully published to the catalog and added to your inventory!`);
      window.location.href = '../avatar';
    }

    async function publishToolboxItem(event) {
      event.preventDefault();
      const name = document.getElementById('toolbox-name').value.trim();
      const fileInput = document.getElementById('toolbox-file');
      const errorBox = document.getElementById('error-box');
      const btn = document.getElementById('pub-toolbox-btn');

      const savedUser = localStorage.getItem('bloxtip_username');
      if (!savedUser) {
        alert("You must be logged in to publish to the toolbox!");
        window.location.href = '../login';
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please select a .rbxmx or .xml file to upload.");
        return;
      }

      const file = fileInput.files[0];
      if (file.size > MAX_FILE_SIZE_BYTES) {
        errorBox.textContent = `File size exceeds the ${MAX_FILE_SIZE_MB} MB limit. Your file is ${(file.size / (1024 * 1024)).toFixed(2)} MB.`;
        errorBox.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = "Uploading...";
      errorBox.classList.remove('show');

      try {
        const xmlContent = await readFileAsText(file);

        const { data, error } = await supabaseClient.from('toolbox').insert([{
          name: name,
          creator: savedUser,
          xml: xmlContent
        }]).select();

        if (error) {
          throw error;
        }

        const newId = data && data[0] ? data[0].id : 'unknown';
        alert(`Toolbox item '${name}' published! ID: ${newId}`);
        window.location.href = '../';
      } catch (err) {
        console.error("Toolbox publish error:", err);
        errorBox.textContent = "Toolbox publish failed: " + (err.message || JSON.stringify(err));
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = "Publish to Toolbox";
      }
    }

    async function publishPlugin(event) {
      event.preventDefault();
      const name = document.getElementById('plugin-name').value.trim();
      const rawAssetId = document.getElementById('plugin-asset-id').value.trim();
      const fileInput = document.getElementById('plugin-file');
      const enabled = document.getElementById('plugin-enabled').checked;
      const errorBox = document.getElementById('error-box');
      const btn = document.getElementById('pub-plugin-btn');

      const savedUser = localStorage.getItem('bloxtip_username');
      if (!savedUser) {
        alert("You must be logged in to publish a plugin!");
        window.location.href = '../login';
        return;
      }

      const pluginId = rawAssetId || String(Math.floor(100000000 + Math.random() * 900000000));
      let pluginSource = '';

      if (fileInput.files && fileInput.files.length > 0) {
        const file = fileInput.files[0];
        if (file.size > MAX_FILE_SIZE_BYTES) {
          errorBox.textContent = `File size exceeds the ${MAX_FILE_SIZE_MB} MB limit. Your file is ${(file.size / (1024 * 1024)).toFixed(2)} MB.`;
          errorBox.classList.add('show');
          return;
        }
        pluginSource = await readFileAsText(file);
      }

      btn.disabled = true;
      btn.textContent = "Publishing Plugin...";
      errorBox.classList.remove('show');

      try {
        const { error: pluginError } = await supabaseClient.from('studio_plugins').insert([{
          plugin_id: pluginId,
          name: name,
          creator: savedUser,
          enabled: enabled
        }]);

        if (pluginError) {
          throw pluginError;
        }

        if (pluginSource) {
          const { error: toolboxError } = await supabaseClient.from('toolbox').insert([{
            name: `${name} [Plugin]`,
            creator: savedUser,
            xml: pluginSource
          }]);
          if (toolboxError) {
            console.warn("Plugin saved to studio_plugins, but toolbox asset insert warning:", toolboxError.message);
          }
        }

        alert(`Plugin '${name}' (ID: ${pluginId}) published!`);
        window.location.href = '/studio/plugins/manage';
      } catch (err) {
        console.error("Plugin publish error:", err);
        errorBox.textContent = "Failed to publish plugin: " + (err.message || JSON.stringify(err));
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = "Publish Plugin";
      }
    }
  </script>
