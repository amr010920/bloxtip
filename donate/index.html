<!DOCTYPE html>
<html class="no-js" lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bloxtip | Donation</title>

  <style>
    *, ::after, ::before {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #313131;
      font-size: 16px;
      line-height: 1.5;
    }

    #cf-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 0;
    }

    #cf-error-details {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 3.75rem;
      font-weight: 300;
      color: #1d1d1d;
      line-height: 1.1;
      display: inline-block;
    }

    .code-label {
      font-size: 1.1rem;
      color: #666666;
      display: block;
      margin-top: 0.5rem;
    }

    header a {
      color: #0051c3;
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    .timestamp {
      margin-top: 0.75rem;
      color: #666666;
      font-size: 0.95rem;
    }

    .bg-gradient-gray {
      background: linear-gradient(to bottom, #f7f7f7, #eaeaea);
      padding: 2.5rem 0;
      margin: 2rem 0;
    }

    .status-container {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 30px;
    }

    .status-box {
      flex: 1;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .icon-container {
      position: relative;
      margin-bottom: 20px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Cloudflare SVG Icons Recreated */
    .cf-icon-browser, .cf-icon-cloud, .cf-icon-server {
      width: 48px;
      height: 48px;
      display: inline-block;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .cf-icon-browser {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 5h2v2H7zm4 0h2v2h-2z"/></svg>');
    }

    .cf-icon-cloud {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>');
    }

    .cf-icon-server {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M20 18H4v-2h16v2zM20 10H4V8h16v2zm-2-7H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H6V5h12v12z"/></svg>');
    }

    /* Green Checkmark Badge Overlay */
    .cf-icon-ok {
      position: absolute;
      bottom: -4px;
      right: calc(50% - 28px);
      width: 20px;
      height: 20px;
      background-color: #2e7d32;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .cf-icon-ok::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .status-title {
      font-size: 1.5rem;
      color: #313131;
      font-weight: 300;
      margin-bottom: 10px;
    }

    .action-link {
      display: inline-block;
      color: #0051c3;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .action-link:hover {
      text-decoration: underline;
    }

    .status-badge {
      font-size: 1.3rem;
      color: #2e7d32;
      font-weight: 400;
      display: block;
    }

    .info-columns {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      margin-top: 2rem;
    }

    .info-column {
      flex: 1;
      min-width: 280px;
    }

    .info-column h2 {
      font-size: 1.8rem;
      font-weight: 300;
      margin-bottom: 1rem;
      color: #1d1d1d;
    }

    .info-column p {
      color: #444444;
      line-height: 1.6;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

<div id="cf-wrapper">
    <div id="cf-error-details">
        <header>
            <h1>
                <span>donation</span>
                <span class="code-label">error code: none it's just for style</span>
            </h1>
            <div style="margin-top: 5px;">
                Visit <a href="https://www.cloudflare.com" target="_blank" rel="noopener noreferrer">cloudflare.com</a> for more information.
            </div>
            <div class="timestamp">2026-10-18 14:50:48 UTC</div>
        </header>

        <div class="bg-gradient-gray">
            <div class="status-container" style="max-width: 1000px; margin: 0 auto; padding: 0 20px;">
                
                <!-- Box 1: Ko-fi -->
                <div class="status-box">
                    <div class="icon-container">
                        <span class="cf-icon-browser"></span>
                        <span class="cf-icon-ok"></span>
                    </div>
                    <div class="status-title">Ko-fi Support</div>
                    <div>
                        <a href="https://ko-fi.com/bloxtip" target="_blank" rel="noopener noreferrer" class="action-link">ko-fi</a>
                    </div>
                    <span class="status-badge">Working</span>
                </div>

                <!-- Box 2: PayPal -->
                <div class="status-box">
                    <div class="icon-container">
                        <span class="cf-icon-cloud"></span>
                        <span class="cf-icon-ok"></span>
                    </div>
                    <div class="status-title">paypal itself</div>
                    <div>
                        <a href="https://paypal.me/Heckme646" target="_blank" rel="noopener noreferrer" class="action-link">paypal</a>
                    </div>
                    <span class="status-badge">Working</span>
                </div>

                <!-- Box 3: Host Status -->
                <div class="status-box">
                    <div class="icon-container">
                        <span class="cf-icon-server"></span>
                        <span class="cf-icon-ok"></span>
                    </div>
                    <div class="status-title">Host Server</div>
                    <div style="font-size: 1.25rem; font-weight: 600; color: #313131; margin-bottom: 8px;">Online</div>
                    <span class="status-badge">Working</span>
                </div>

            </div>
        </div>

        <div class="info-columns" style="max-width: 1000px; margin: 0 auto;">
            <div class="info-column">
                <p>the ko-fi or PAYPAL doesn't work help!!!</p>
            </div>
            <div class="info-column">
                <h2>What can I do?</h2>
                <p>try again in a few minutes or more</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
