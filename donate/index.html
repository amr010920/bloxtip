<!DOCTYPE html>
<html class="no-js" lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bloxtip | Donation</title>

  <style>
    *, ::after, ::before {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      color: #313131;
      font-size: 16px;
      line-height: 1.5;
    }

    #cf-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 0;
    }

    #cf-error-details {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      color: #1d1d1d;
      line-height: 1.2;
    }

    .code-label {
      font-size: 1rem;
      color: #666666;
      display: block;
      margin-top: 0.5rem;
    }

    header a {
      color: #0051c3;
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    .timestamp {
      margin-top: 0.75rem;
      color: #666666;
      font-size: 0.9rem;
    }

    .bg-gradient-gray {
      background: linear-gradient(to bottom, #f7f7f7, #eaeaea);
      border-top: 1px solid #d0d0d0;
      border-bottom: 1px solid #d0d0d0;
      padding: 2.5rem 0;
      margin: 2rem 0;
    }

    .status-container {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .status-box {
      flex: 1;
      min-width: 250px;
      background: #ffffff;
      padding: 25px 20px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      border: 1px solid #e0e0e0;
      text-align: center;
    }

    .status-title {
      font-size: 1.25rem;
      color: #555555;
      font-weight: 300;
      margin-bottom: 8px;
    }

    .status-badge {
      font-size: 1.25rem;
      color: #2e7d32;
      font-weight: 600;
      display: block;
      margin-top: 8px;
    }

    .btn-link {
      display: inline-block;
      background-color: #0070f3;
      color: #ffffff !important;
      padding: 10px 22px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 12px;
      transition: background-color 0.2s ease;
    }

    .btn-link:hover {
      background-color: #0051a2;
    }

    .btn-paypal {
      background-color: #003087;
    }

    .btn-paypal:hover {
      background-color: #00205b;
    }

    .info-columns {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      margin-bottom: 2rem;
    }

    .info-column {
      flex: 1;
      min-width: 280px;
    }

    .info-column h2 {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 1rem;
    }

    .info-column p {
      color: #444444;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div id="cf-wrapper">
    <div id="cf-error-details">
        <header>
            <h1>
                <span>donation</span>
                <span class="code-label">error code: none it's just for style</span>
            </h1>
            <div style="margin-top: 10px;">
                Visit <a href="https://www.cloudflare.com" target="_blank" rel="noopener noreferrer">cloudflare.com</a> for more information.
            </div>
            <div class="timestamp">2026-10-18 14:50:48 UTC</div>
        </header>

        <div class="bg-gradient-gray">
            <div class="status-container">
                <div class="status-box">
                    <div class="status-title">Ko-fi Support</div>
                    <a href="https://ko-fi.com/bloxtip" target="_blank" rel="noopener noreferrer" class="btn-link">
                      ko-fi
                    </a>
                    <span class="status-badge">Working</span>
                </div>

                <div class="status-box">
                    <div class="status-title">paypal itself</div>
                    <a href="https://paypal.me/Heckme646" target="_blank" rel="noopener noreferrer" class="btn-link btn-paypal">
                      paypal
                    </a>
                    <span class="status-badge">Working</span>
                </div>

                <div class="status-box">
                    <div class="status-title">Host Server</div>
                    <span class="status-badge">Working</span>
                </div>
            </div>
        </div>

        <div class="info-columns">
            <div class="info-column">
                <p>the ko-fi or PAYPAL doesn't work help!!!</p>
            </div>
            <div class="info-column">
                <h2>What can I do?</h2>
                <p>try again in a few minutes or more</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
