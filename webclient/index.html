function buildFallbackRobloxRig() {
  const rig = new THREE.Group();

  const headMat = new THREE.MeshStandardMaterial({ color: 0xf5cd30, roughness: 0.5 });
  const torsoMat = new THREE.MeshStandardMaterial({ color: 0x0d69ac, roughness: 0.5 });
  const limbMat = new THREE.MeshStandardMaterial({ color: 0x287f47, roughness: 0.5 });
  const armMat = new THREE.MeshStandardMaterial({ color: 0xf5cd30, roughness: 0.5 });

  const root = new THREE.Group();
  root.name = "HumanoidRootPart";
  rig.add(root);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
  torso.name = "Torso";
  torso.position.set(0, 3, 0);
  torso.castShadow = true;
  torso.receiveShadow = true;
  root.add(torso);

  const headPivot = new THREE.Group();
  headPivot.name = "HeadPivot";
  headPivot.position.set(0, 4.6, 0);
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
  head.name = "Head";
  head.castShadow = true;
  headPivot.add(head);
  root.add(headPivot);

  const leftArmPivot = new THREE.Group();
  leftArmPivot.name = "LeftShoulder";
  leftArmPivot.position.set(-1.5, 3.5, 0);
  const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
  leftArm.name = "Left Arm";
  leftArm.position.set(0, -0.5, 0);
  leftArm.castShadow = true;
  leftArmPivot.add(leftArm);
  root.add(leftArmPivot);

  const rightArmPivot = new THREE.Group();
  rightArmPivot.name = "RightShoulder";
  rightArmPivot.position.set(1.5, 3.5, 0);
  const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
  rightArm.name = "Right Arm";
  rightArm.position.set(0, -0.5, 0);
  rightArm.castShadow = true;
  rightArmPivot.add(rightArm);
  root.add(rightArmPivot);

  const leftLegPivot = new THREE.Group();
  leftLegPivot.name = "LeftHip";
  leftLegPivot.position.set(-0.5, 2, 0);
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), limbMat);
  leftLeg.name = "Left Leg";
  leftLeg.position.set(0, -1, 0);
  leftLeg.castShadow = true;
  leftLegPivot.add(leftLeg);
  root.add(leftLegPivot);

  const rightLegPivot = new THREE.Group();
  rightLegPivot.name = "RightHip";
  rightLegPivot.position.set(0.5, 2, 0);
  const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), limbMat);
  rightLeg.name = "Right Leg";
  rightLeg.position.set(0, -1, 0);
  rightLeg.castShadow = true;
  rightLegPivot.add(rightLeg);
  root.add(rightLegPivot);

  return {
    scene: rig,
    clips: [],
    root,
    torso,
    headPivot,
    leftArmPivot,
    rightArmPivot,
    leftLegPivot,
    rightLegPivot,
    footOffset: 0.05,
    height: 5.2,
    isFallback: true
  };
}

function extractRigParts(obj) {
  let root = null;
  let torso = null;
  let headPivot = null;
  let leftArmPivot = null;
  let rightArmPivot = null;
  let leftLegPivot = null;
  let rightLegPivot = null;

  obj.traverse((node) => {
    node.visible = true;
    node.castShadow = true;
    node.receiveShadow = true;
    if (node.isMesh && node.material) {
      node.material.transparent = false;
      node.material.opacity = 1;
      node.material.side = THREE.DoubleSide;
      node.material.needsUpdate = true;
    }
    const n = (node.name || "").toLowerCase();
    if (!torso && (n.includes("torso") || n.includes("uppertorso") || n.includes("chest") || n.includes("body"))) {
      torso = node;
    }
    if (!root && (n.includes("humanoidrootpart") || n.includes("root") || n.includes("torso") || n.includes("hips"))) {
      root = node;
    }
    if (!headPivot && n.includes("head")) headPivot = node;
    if (!leftArmPivot && (n.includes("leftarm") || n.includes("left_arm") || n.includes("left arm") || n.includes("leftshoulder") || n.includes("left upper arm"))) {
      leftArmPivot = node;
    }
    if (!rightArmPivot && (n.includes("rightarm") || n.includes("right_arm") || n.includes("right arm") || n.includes("rightshoulder") || n.includes("right upper arm"))) {
      rightArmPivot = node;
    }
    if (!leftLegPivot && (n.includes("leftleg") || n.includes("left_leg") || n.includes("left leg") || n.includes("lefthip") || n.includes("left upper leg"))) {
      leftLegPivot = node;
    }
    if (!rightLegPivot && (n.includes("rightleg") || n.includes("right_leg") || n.includes("right leg") || n.includes("righthip") || n.includes("right upper leg"))) {
      rightLegPivot = node;
    }
  });

  if (!root) root = obj;
  if (!torso) torso = root;
  return { root, torso, headPivot, leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot };
}

function normalizeLoadedGlbScene(glbScene) {
  glbScene.position.set(0, 0, 0);
  glbScene.rotation.set(0, 0, 0);
  glbScene.scale.set(1, 1, 1);
  glbScene.updateMatrixWorld(true);

  const rawBox = new THREE.Box3().setFromObject(glbScene);
  const rawSize = new THREE.Vector3();
  rawBox.getSize(rawSize);
  const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z, 0.001);
  const targetHeight = 5.0;
  const scaleFactor = rawSize.y > 0.01 ? (targetHeight / rawSize.y) : (targetHeight / maxDim);
  glbScene.scale.setScalar(scaleFactor);
  glbScene.updateMatrixWorld(true);

  const scaledBox = new THREE.Box3().setFromObject(glbScene);
  const center = new THREE.Vector3();
  scaledBox.getCenter(center);

  if (Number.isFinite(center.x) && Number.isFinite(center.z)) {
    glbScene.position.x -= center.x;
    glbScene.position.z -= center.z;
    glbScene.updateMatrixWorld(true);
  }

  const finalBox = new THREE.Box3().setFromObject(glbScene);
  const minY = Number.isFinite(finalBox.min.y) ? finalBox.min.y : 0;
  const maxY = Number.isFinite(finalBox.max.y) ? finalBox.max.y : targetHeight;
  const footOffset = Math.max(0.05, -minY + 0.05);
  const height = Math.max(1.0, maxY - minY);

  return { footOffset, height };
}

function loadAvatarTemplate(glbUrl = AVATAR_GLB_URL) {
  if (glbUrl === AVATAR_GLB_URL && cachedAvatarTemplate) {
    return Promise.resolve(cachedAvatarTemplate);
  }
  if (glbUrl === AVATAR_GLB_URL && avatarTemplatePromise) {
    return avatarTemplatePromise;
  }

  const p = new Promise((resolve) => {
    let settled = false;
    const finish = (val) => {
      if (settled) return;
      settled = true;
      clearTimeout(fallbackTimer);
      if (glbUrl === AVATAR_GLB_URL) {
        cachedAvatarTemplate = val;
      }
      resolve(val);
    };

    const fallbackTimer = setTimeout(() => {
      finish(buildFallbackRobloxRig());
    }, 6000);

    fetch(glbUrl, { mode: "cors" })
      .then((res) => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.arrayBuffer();
      })
      .then((buf) => {
        gltfLoader.parse(
          buf,
          "",
          (gltf) => {
            if (!gltf || !gltf.scene) {
              finish(buildFallbackRobloxRig());
              return;
            }
            const { footOffset, height } = normalizeLoadedGlbScene(gltf.scene);
            const parts = extractRigParts(gltf.scene);
            finish({
              scene: gltf.scene,
              clips: gltf.animations || [],
              ...parts,
              footOffset,
              height,
              isFallback: false
            });
          },
          () => finish(buildFallbackRobloxRig())
        );
      })
      .catch(() => {
        gltfLoader.load(
          glbUrl,
          (gltf) => {
            if (!gltf || !gltf.scene) {
              finish(buildFallbackRobloxRig());
              return;
            }
            const { footOffset, height } = normalizeLoadedGlbScene(gltf.scene);
            const parts = extractRigParts(gltf.scene);
            finish({
              scene: gltf.scene,
              clips: gltf.animations || [],
              ...parts,
              footOffset,
              height,
              isFallback: false
            });
          },
          undefined,
          () => finish(buildFallbackRobloxRig())
        );
      });
  });

  if (glbUrl === AVATAR_GLB_URL) {
    avatarTemplatePromise = p;
  }
  return p;
}

function createNameplateSprite(name, topY = 5.6) {
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 64;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
  ctx.fillRect(16, 12, 224, 40);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px Segoe UI, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(name, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4.5, 1.15, 1);
  sprite.position.set(0, topY, 0);
  return sprite;
}

function createAnimatedAvatarInstance(template, playerName) {
  const container = new THREE.Group();
  container.name = "PlayerAvatarContainer";
  const cloned = template.scene.clone(true);
  cloned.name = "AvatarGlbMesh";
  container.add(cloned);

  const parts = extractRigParts(cloned);
  const mixer = (template.clips && template.clips.length > 0) ? new THREE.AnimationMixer(cloned) : null;
  const actions = {};

  if (mixer && template.clips.length > 0) {
    template.clips.forEach((clip, idx) => {
      const action = mixer.clipAction(clip);
      actions[clip.name.toLowerCase()] = action;
      if (idx === 0) {
        action.play();
      }
    });
  }

  const height = template.height || 5.0;
  const nameplate = createNameplateSprite(playerName, height + 0.8);
  container.add(nameplate);

  const heldMount = new THREE.Group();
  heldMount.position.set(0, -1.0, -0.4);
  if (parts.rightArmPivot) {
    parts.rightArmPivot.add(heldMount);
  } else {
    container.add(heldMount);
  }

  return {
    container,
    cloned,
    parts,
    mixer,
    actions,
    heldMount,
    footOffset: template.footOffset || 0.05,
    height,
    animTime: 0,
    equippedToolName: ""
  };
}

function stepAvatarAnimation(avatarInst, dt, speedRatio, isGrounded, isJumping, isAttacking) {
  if (!avatarInst) return;
  avatarInst.animTime += dt * (1 + speedRatio * 5.5);

  if (avatarInst.mixer) {
    avatarInst.mixer.update(dt);
  }

  const { leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot, headPivot, root } = avatarInst.parts || {};
  const t = avatarInst.animTime;

  if (!isGrounded || isJumping) {
    if (leftArmPivot) leftArmPivot.rotation.x = THREE.MathUtils.lerp(leftArmPivot.rotation.x, -2.55, dt * 14);
    if (rightArmPivot) rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, -2.55, dt * 14);
    if (leftLegPivot) leftLegPivot.rotation.x = THREE.MathUtils.lerp(leftLegPivot.rotation.x, -0.65, dt * 14);
    if (rightLegPivot) rightLegPivot.rotation.x = THREE.MathUtils.lerp(rightLegPivot.rotation.x, 0.55, dt * 14);
    if (root && root !== avatarInst.container) {
      root.position.y = THREE.MathUtils.lerp(root.position.y, 0.25, dt * 10);
    }
  } else if (speedRatio > 0.08) {
    const swing = Math.sin(t * 2.3) * 0.9 * Math.min(1, speedRatio);
    const bob = Math.abs(Math.cos(t * 2.3)) * 0.14 * Math.min(1, speedRatio);
    if (leftLegPivot) leftLegPivot.rotation.x = THREE.MathUtils.lerp(leftLegPivot.rotation.x, swing, dt * 18);
    if (rightLegPivot) rightLegPivot.rotation.x = THREE.MathUtils.lerp(rightLegPivot.rotation.x, -swing, dt * 18);
    if (leftArmPivot) leftArmPivot.rotation.x = THREE.MathUtils.lerp(leftArmPivot.rotation.x, -swing * 0.92, dt * 18);
    if (!avatarInst.equippedToolName && rightArmPivot) {
      rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, swing * 0.92, dt * 18);
    }
    if (root && root !== avatarInst.container) {
      root.position.y = THREE.MathUtils.lerp(root.position.y, bob, dt * 16);
    }
  } else {
    const breathe = Math.sin(t * 0.65) * 0.07;
    if (leftLegPivot) leftLegPivot.rotation.x = THREE.MathUtils.lerp(leftLegPivot.rotation.x, 0, dt * 14);
    if (rightLegPivot) rightLegPivot.rotation.x = THREE.MathUtils.lerp(rightLegPivot.rotation.x, 0, dt * 14);
    if (leftArmPivot) leftArmPivot.rotation.x = THREE.MathUtils.lerp(leftArmPivot.rotation.x, breathe, dt * 14);
    if (!avatarInst.equippedToolName && rightArmPivot) {
      rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, -breathe, dt * 14);
    }
    if (root && root !== avatarInst.container) {
      root.position.y = THREE.MathUtils.lerp(root.position.y, 0, dt * 14);
    }
  }

  if (avatarInst.equippedToolName && rightArmPivot) {
    const targetArmX = isAttacking ? -0.35 : -1.35;
    rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, targetArmX, dt * 18);
  }

  if (headPivot) {
    headPivot.rotation.y = Math.sin(t * 0.35) * 0.08;
  }
}

const imageAssetMap = new Map();

function isSupportedWebUrl(url) {
  if (typeof url !== "string") return false;
  const trimmed = url.trim();
  if (!trimmed) return false;
  if (/^rbxasset:\/\//i.test(trimmed)) return false;
  if (/^rbxassetid:\/\//i.test(trimmed)) return false;
  return /^https?:\/\//i.test(trimmed) || trimmed.startsWith("data:image/") || trimmed.startsWith("./") || trimmed.startsWith("/");
}

function resolveImageUrlFromAssets(rawUrl, fallbackName = "") {
  if (typeof rawUrl === "string" && isSupportedWebUrl(rawUrl)) {
    return rawUrl.trim();
  }
  const clean = String(rawUrl || "").trim();
  const baseFile = clean.split("/").pop().split("\\").pop().toLowerCase();
  if (baseFile && imageAssetMap.has(baseFile)) {
    return imageAssetMap.get(baseFile);
  }
  const cleanLower = clean.toLowerCase();
  if (cleanLower && imageAssetMap.has(cleanLower)) {
    return imageAssetMap.get(cleanLower);
  }
  const nameLower = String(fallbackName || "").trim().toLowerCase();
  if (nameLower && imageAssetMap.has(nameLower)) {
    return imageAssetMap.get(nameLower);
  }
  for (const [k, v] of imageAssetMap.entries()) {
    if (baseFile && (k.includes(baseFile) || baseFile.includes(k))) {
      return v;
    }
  }
  return "";
}

function registerImagesFromXmlOrRow(xmlText, gameRow) {
  if (gameRow && typeof gameRow === "object") {
    for (const [key, val] of Object.entries(gameRow)) {
      if (typeof val === "string" && isSupportedWebUrl(val)) {
        imageAssetMap.set(key.toLowerCase(), val.trim());
        const filePart = val.trim().split("/").pop().split("?")[0].toLowerCase();
        if (filePart) imageAssetMap.set(filePart, val.trim());
      }
    }
  }

  if (typeof xmlText !== "string" || !xmlText.trim()) return;
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, "application/xml");
    const allEls = doc.getElementsByTagName("*");
    for (let i = 0; i < allEls.length; i++) {
      const el = allEls[i];
      const txt = (el.textContent || "").trim();
      if (isSupportedWebUrl(txt)) {
        const attrName = (el.getAttribute("name") || el.tagName || "").toLowerCase();
        if (attrName) imageAssetMap.set(attrName, txt);
        const filePart = txt.split("/").pop().split("?")[0].toLowerCase();
        if (filePart) imageAssetMap.set(filePart, txt);
      }
    }
  } catch (_) {}
}

function readNum(parent, tagName, fallback) {
  if (!parent) return fallback;
  const el = parent.getElementsByTagName(tagName)[0];
  if (!el) return fallback;
  const n = Number(el.textContent);
  return Number.isFinite(n) ? n : fallback;
}

function readBool(parent, propName, fallback) {
  if (!parent) return fallback;
  for (const el of Array.from(parent.children)) {
    if ((el.getAttribute("name") || "").toLowerCase() === propName.toLowerCase()) {
      const txt = (el.textContent || "").trim().toLowerCase();
      if (txt === "true" || txt === "1") return true;
      if (txt === "false" || txt === "0") return false;
    }
  }
  return fallback;
}

function readStr(parent, propName, fallback = "") {
  if (!parent) return fallback;
  for (const el of Array.from(parent.children)) {
    if (el.getAttribute("name") === propName) return el.textContent ?? fallback;
  }
  return fallback;
}

function findPropElement(parent, propName) {
  if (!parent) return null;
  for (const el of Array.from(parent.children)) {
    if (el.getAttribute("name") === propName) return el;
  }
  return null;
}

function parseColor3Value(propEl, fallbackHex = 0x00a2ff) {
  if (!propEl) return fallbackHex;
  const rEl = propEl.getElementsByTagName("R")[0];
  const gEl = propEl.getElementsByTagName("G")[0];
  const bEl = propEl.getElementsByTagName("B")[0];
  if (rEl && gEl && bEl) {
    let r = Number(rEl.textContent);
    let g = Number(gEl.textContent);
    let b = Number(bEl.textContent);
    if (Number.isFinite(r) && Number.isFinite(g) && Number.isFinite(b)) {
      if (r <= 1.001 && g <= 1.001 && b <= 1.001) {
        r = Math.round(Math.max(0, Math.min(1, r)) * 255);
        g = Math.round(Math.max(0, Math.min(1, g)) * 255);
        b = Math.round(Math.max(0, Math.min(1, b)) * 255);
      } else {
        r = Math.round(Math.max(0, Math.min(255, r)));
        g = Math.round(Math.max(0, Math.min(255, g)));
        b = Math.round(Math.max(0, Math.min(255, b)));
      }
      return (r << 16) | (g << 8) | b;
    }
  }
  const uintEl = propEl.getElementsByTagName("uint")[0] || propEl.getElementsByTagName("int")[0];
  if (uintEl) {
    const val = Number(uintEl.textContent);
    if (Number.isFinite(val) && val >= 0) {
      if (val > 0xffffff) return val & 0xffffff;
      return val;
    }
  }
  const txt = (propEl.textContent || "").trim();
  if (/^#?[0-9a-fA-F]{6}$/.test(txt)) {
    return parseInt(txt.replace("#", ""), 16);
  }
  const num = Number(txt);
  if (Number.isFinite(num) && num >= 0) {
    return num > 0xffffff ? (num & 0xffffff) : num;
  }
  return fallbackHex;
}

function parseColorFromProps(props, fallbackHex = 0x00a2ff) {
  const color3Prop = findPropElement(props, "Color3") || findPropElement(props, "color3");
  if (color3Prop) return parseColor3Value(color3Prop, fallbackHex);

  const colorProp = findPropElement(props, "Color") || findPropElement(props, "color");
  if (colorProp) {
    const c3 = parseColor3Value(colorProp, null);
    if (c3 !== null) return c3;
  }

  const brickProp = findPropElement(props, "BrickColor") || findPropElement(props, "brickcolor");
  if (brickProp) {
    const code = Number((brickProp.textContent || "").trim());
    if (Number.isFinite(code) && BRICK_COLORS[code] !== undefined) {
      return BRICK_COLORS[code];
    }
  }

  const colorStr = readStr(props, "Color", "") || readStr(props, "BrickColor", "");
  if (colorStr) {
    const num = Number(colorStr.trim());
    if (Number.isFinite(num)) {
      if (BRICK_COLORS[num] !== undefined) return BRICK_COLORS[num];
      if (num >= 0) return num > 0xffffff ? (num & 0xffffff) : num;
    }
    if (/^#?[0-9a-fA-F]{6}$/.test(colorStr.trim())) {
      return parseInt(colorStr.trim().replace("#", ""), 16);
    }
  }
  return fallbackHex;
}

function parseCFrameMatrix(cfEl) {
  const fallback = {
    x: 0, y: 2, z: -12,
    matrix4: new THREE.Matrix4().identity()
  };
  if (!cfEl) return fallback;

  const x = readNum(cfEl, "X", 0);
  const y = readNum(cfEl, "Y", 2);
  const z = readNum(cfEl, "Z", -12);

  const r00 = readNum(cfEl, "R00", null);
  const r01 = readNum(cfEl, "R01", null);
  const r02 = readNum(cfEl, "R02", null);
  const r10 = readNum(cfEl, "R10", null);
  const r11 = readNum(cfEl, "R11", null);
  const r12 = readNum(cfEl, "R12", null);
  const r20 = readNum(cfEl, "R20", null);
  const r21 = readNum(cfEl, "R21", null);
  const r22 = readNum(cfEl, "R22", null);

  const m = new THREE.Matrix4();
  if (
    r00 !== null && r01 !== null && r02 !== null &&
    r10 !== null && r11 !== null && r12 !== null &&
    r20 !== null && r21 !== null && r22 !== null
  ) {
    m.set(
      r00, r01, r02, x,
      r10, r11, r12, y,
      r20, r21, r22, z,
      0,   0,   0,   1
    );
  } else {
    m.makeTranslation(x, y, z);
  }

  return { x, y, z, matrix4: m };
}

function getPartShape(item, props, cls) {
  if (cls === "WedgePart") return "Wedge";
  if (cls === "Cylinder" || cls === "CylinderPart") return "Cylinder";
  if (cls === "Ball" || cls === "SpherePart") return "Ball";
  if (cls === "TrussPart") return "Truss";
  if (cls === "CornerWedgePart") return "CornerWedge";

  const shapeProp = findPropElement(props, "shape") || findPropElement(props, "Shape");
  if (shapeProp) {
    const txt = (shapeProp.textContent || "").trim();
    const num = Number(txt);
    if (Number.isFinite(num)) {
      if (num === 0) return "Ball";
      if (num === 1) return "Block";
      if (num === 2) return "Cylinder";
      if (num === 3) return "Wedge";
      if (num === 4) return "CornerWedge";
    }
    const lower = txt.toLowerCase();
    if (lower.includes("cyl")) return "Cylinder";
    if (lower.includes("ball") || lower.includes("sphere")) return "Ball";
    if (lower.includes("wedge") && lower.includes("corner")) return "CornerWedge";
    if (lower.includes("wedge")) return "Wedge";
  }

  const childItems = Array.from(item.children).filter((c) => c.tagName === "Item");
  for (const ch of childItems) {
    const cCls = ch.getAttribute("class");
    if (cCls === "CylinderMesh") return "Cylinder";
    if (cCls === "SpecialMesh") {
      const cProps = findPropElement(ch, "Properties") || ch.firstElementChild;
      const mType = readStr(cProps, "MeshType", "");
      const mNum = Number(mType.trim());
      if (mNum === 0) return "Head";
      if (mNum === 1) return "Torso";
      if (mNum === 2) return "Wedge";
      if (mNum === 3) return "Sphere";
      if (mNum === 4) return "Cylinder";
      if (mNum === 5) return "FileMesh";
      if (mNum === 6) return "Brick";
      const mLower = mType.toLowerCase();
      if (mLower.includes("cyl")) return "Cylinder";
      if (mLower.includes("sphere") || mLower.includes("ball")) return "Ball";
      if (mLower.includes("wedge")) return "Wedge";
      if (mLower.includes("file")) return "FileMesh";
    }
  }

  return "Block";
}

function createWedgeGeometry(sx, sy, sz) {
  const shape = new THREE.Shape();
  shape.moveTo(-sz / 2, -sy / 2);
  shape.lineTo(sz / 2, -sy / 2);
  shape.lineTo(sz / 2, sy / 2);
  shape.closePath();

  const geom = new THREE.ExtrudeGeometry(shape, {
    depth: sx,
    bevelEnabled: false
  });
  geom.translate(0, 0, -sx / 2);
  geom.rotateY(-Math.PI / 2);
  return geom;
}

function createCornerWedgeGeometry(sx, sy, sz) {
  const geom = new THREE.BufferGeometry();
  const hx = sx / 2, hy = sy / 2, hz = sz / 2;
  const vertices = new Float32Array([
    -hx, -hy, -hz,   hx, -hy, -hz,   hx, -hy,  hz,
    -hx, -hy, -hz,   hx, -hy,  hz,  -hx, -hy,  hz,
    -hx, -hy, -hz,  -hx,  hy, -hz,   hx, -hy, -hz,
    -hx, -hy, -hz,  -hx, -hy,  hz,  -hx,  hy, -hz,
    -hx,  hy, -hz,  -hx, -hy,  hz,   hx, -hy, -hz,
     hx, -hy, -hz,  -hx, -hy,  hz,   hx, -hy,  hz
  ]);
  geom.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geom.computeVertexNormals();
  return geom;
}

function buildGeometryForPart(shape, sx, sy, sz) {
  const w = Math.max(0.05, sx);
  const h = Math.max(0.05, sy);
  const d = Math.max(0.05, sz);

  if (shape === "Cylinder") {
    const radius = Math.max(0.025, Math.min(h, d) / 2);
    const cyl = new THREE.CylinderGeometry(radius, radius, w, 28, 1, false);
    cyl.rotateZ(-Math.PI / 2);
    return cyl;
  }
  if (shape === "Ball" || shape === "Sphere") {
    const r = Math.max(0.025, Math.min(w, h, d) / 2);
    return new THREE.SphereGeometry(r, 24, 18);
  }
  if (shape === "Wedge") {
    return createWedgeGeometry(w, h, d);
  }
  if (shape === "CornerWedge") {
    return createCornerWedgeGeometry(w, h, d);
  }
  if (shape === "Truss") {
    const g = new THREE.Group();
    const railGeo = new THREE.BoxGeometry(0.25, h, 0.25);
    const mat = new THREE.MeshStandardMaterial({ color: 0x8a929a });
    const offsets = [
      [-w / 2 + 0.125, -d / 2 + 0.125],
      [w / 2 - 0.125, -d / 2 + 0.125],
      [-w / 2 + 0.125, d / 2 - 0.125],
      [w / 2 - 0.125, d / 2 - 0.125]
    ];
    offsets.forEach(([ox, oz]) => {
      const post = new THREE.Mesh(railGeo, mat);
      post.position.set(ox, 0, oz);
      g.add(post);
    });
    const rungCount = Math.max(1, Math.floor(h / 2));
    for (let i = 0; i <= rungCount; i++) {
      const ry = -h / 2 + (i / rungCount) * h;
      const rung1 = new THREE.Mesh(new THREE.BoxGeometry(w, 0.16, 0.16), mat);
      rung1.position.set(0, ry, 0);
      g.add(rung1);
    }
    return g;
  }
  return new THREE.BoxGeometry(w, h, d);
}

const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin("anonymous");

function materialPropsFromRoblox(props, colorHex, texUrl) {
  const transparency = Math.max(0, Math.min(1, readNum(props, "Transparency", 0)));
  const reflectance = Math.max(0, Math.min(1, readNum(props, "Reflectance", 0)));
  const matName = (readStr(props, "Material", "") || "").toLowerCase();
  const validTexUrl = isSupportedWebUrl(texUrl) ? texUrl.trim() : "";

  let roughness = 0.65;
  let metalness = Math.min(0.9, reflectance * 0.85);
  let emissive = 0x000000;
  let emissiveIntensity = 0;

  if (matName.includes("neon")) {
    roughness = 0.2;
    emissive = colorHex;
    emissiveIntensity = 0.85;
  } else if (matName.includes("metal") || matName.includes("diamondplate") || matName.includes("foil") || matName.includes("corrugated")) {
    roughness = 0.28;
    metalness = Math.max(metalness, 0.72);
  } else if (matName.includes("glass")) {
    roughness = 0.08;
    metalness = 0.1;
  } else if (matName.includes("smoothplastic") || matName.includes("plastic")) {
    roughness = 0.42;
  } else if (matName.includes("wood")) {
    roughness = 0.78;
  } else if (matName.includes("grass") || matName.includes("sand") || matName.includes("brick") || matName.includes("stone") || matName.includes("rock") || matName.includes("concrete")) {
    roughness = 0.88;
  }

  const opts = {
    color: validTexUrl ? 0xffffff : colorHex,
    roughness,
    metalness,
    emissive,
    emissiveIntensity
  };

  if (transparency > 0.001) {
    opts.transparent = true;
    opts.opacity = 1 - transparency;
  }

  const mat = new THREE.MeshStandardMaterial(opts);

  if (validTexUrl) {
    const tex = textureLoader.load(validTexUrl, undefined, undefined, () => {
      if (mat.map) {
        mat.map.dispose();
        mat.map = null;
      }
      mat.color.setHex(colorHex);
      mat.needsUpdate = true;
    });
    tex.colorSpace = THREE.SRGBColorSpace;
    mat.map = tex;
  }

  return mat;
}

function extractTextureOrMeshUrl(item, props) {
  const itemName = readStr(props, "Name", "");
  let rawTex = readStr(props, "TextureUrl", "") || readStr(props, "Texture", "") || readStr(props, "Image", "");
  let rawMesh = "";

  for (const child of Array.from(item.children)) {
    if (child.tagName !== "Item") continue;
    const cCls = child.getAttribute("class");
    const cProps = findPropElement(child, "Properties") || child.firstElementChild;
    if (!cProps) continue;

    if (cCls === "Decal" || cCls === "Texture") {
      const dUrl = readStr(cProps, "Texture", "") || readStr(cProps, "TextureUrl", "") || readStr(cProps, "Image", "");
      if (dUrl && !rawTex) rawTex = dUrl;
    } else if (cCls === "SpecialMesh" || cCls === "FileMesh") {
      const mTex = readStr(cProps, "TextureId", "") || readStr(cProps, "Texture", "");
      const mId = readStr(cProps, "MeshId", "");
      if (mTex && !rawTex) rawTex = mTex;
      if (mId) rawMesh = mId;
    }
  }

  const texUrl = resolveImageUrlFromAssets(rawTex, itemName);
  const meshUrl = isSupportedWebUrl(rawMesh) ? rawMesh.trim() : "";
  return { texUrl, meshUrl };
}

function attachLightsFromItem(item, targetGroup) {
  for (const child of Array.from(item.children)) {
    if (child.tagName !== "Item") continue;
    const cCls = child.getAttribute("class");
    const cProps = findPropElement(child, "Properties") || child.firstElementChild;
    if (!cProps) continue;
    const brightness = readNum(cProps, "Brightness", 1);
    const range = readNum(cProps, "Range", 16);
    const lColor = parseColorFromProps(cProps, 0xfff5cc);

    if (cCls === "PointLight") {
      const pt = new THREE.PointLight(lColor, brightness * 1.4, range);
      targetGroup.add(pt);
    } else if (cCls === "SpotLight") {
      const angleDeg = readNum(cProps, "Angle", 90);
      const sp = new THREE.SpotLight(lColor, brightness * 1.6, range, THREE.MathUtils.degToRad(angleDeg / 2), 0.35);
      targetGroup.add(sp);
    } else if (cCls === "SurfaceLight") {
      const surf = new THREE.PointLight(lColor, brightness * 1.1, range);
      targetGroup.add(surf);
    }
  }
}

    slot.className = "hb-slot" + (idx === equippedIndex ? " active" : "");

function createVisualItemMesh(item, props) {
  const name = readStr(props, "Name", "Item");
  const colorHex = parseColorFromProps(props, 0x8d99ae);
  const { texUrl, meshUrl } = extractTextureOrMeshUrl(item, props);

  const itemRoot = new THREE.Group();
  itemRoot.name = name;

  let handlePart = null;
  const childItems = Array.from(item.children).filter((c) => c.tagName === "Item");
  for (const ch of childItems) {
    const cCls = ch.getAttribute("class") || "";
    const cProps = findPropElement(ch, "Properties") || ch.firstElementChild;
    const cName = cProps ? readStr(cProps, "Name", "") : "";
    if (cName === "Handle" || cCls === "Part" || cCls === "MeshPart" || cCls === "WedgePart" || cCls === "Cylinder") {
      handlePart = { ch, cProps, cCls };
      if (cName === "Handle") break;
    }
  }

  if (handlePart && handlePart.cProps) {
    const sEl = findPropElement(handlePart.cProps, "size") || findPropElement(handlePart.cProps, "Size");
    const sx = sEl ? Math.max(0.2, readNum(sEl, "X", 0.5)) : 0.5;
    const sy = sEl ? Math.max(0.2, readNum(sEl, "Y", 2.2)) : 2.2;
    const sz = sEl ? Math.max(0.2, readNum(sEl, "Z", 0.5)) : 0.5;
    const hColor = parseColorFromProps(handlePart.cProps, colorHex);
    const hShape = getPartShape(handlePart.ch, handlePart.cProps, handlePart.cCls);
    const hGeo = buildGeometryForPart(hShape, sx, sy, sz);
    const hMat = materialPropsFromRoblox(handlePart.cProps, hColor, texUrl);
    if (hGeo.isGroup) {
      hGeo.traverse((m) => { if (m.isMesh) m.material = hMat; });
      itemRoot.add(hGeo);
    } else {
      itemRoot.add(new THREE.Mesh(hGeo, hMat));
    }
  } else if (texUrl) {
    const spriteTex = textureLoader.load(texUrl);
    spriteTex.colorSpace = THREE.SRGBColorSpace;
    const cardMat = new THREE.MeshStandardMaterial({
      map: spriteTex,
      transparent: true,
      side: THREE.DoubleSide,
      roughness: 0.5
    });
    const card = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), cardMat);
    card.position.set(0, 1.3, 0);
    itemRoot.add(card);
  } else {
    const gripMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42, roughness: 0.5 });
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1.1, 12), gripMat);
    grip.position.set(0, 0.4, 0);
    itemRoot.add(grip);

    const bladeMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.0, 0.35), bladeMat);
    blade.position.set(0, 1.7, 0);
    itemRoot.add(blade);
  }

  if (meshUrl && /^https?:\/\//i.test(meshUrl) && meshUrl.toLowerCase().endsWith(".glb")) {
    gltfLoader.load(
      meshUrl,
      (gltf) => {
        while (itemRoot.children.length > 0) itemRoot.remove(itemRoot.children[0]);
        const sc = gltf.scene.clone(true);
        sc.scale.set(1.2, 1.2, 1.2);
        itemRoot.add(sc);
      },
      undefined,
      () => {}
    );
  }

  return itemRoot;
}

let localAvatarInst = null;

function applyToolVisualToRig(avatarInst, toolName, colorHex = 0xc0c8d0, texUrl = "") {
  if (!avatarInst || !avatarInst.heldMount) return;
  while (avatarInst.heldMount.children.length > 0) {
    avatarInst.heldMount.remove(avatarInst.heldMount.children[0]);
  }
  avatarInst.equippedToolName = toolName || "";
  if (!toolName) return;

  const resolvedTex = texUrl || resolveImageUrlFromAssets("", toolName);
  if (resolvedTex) {
    const tex = textureLoader.load(resolvedTex);
    tex.colorSpace = THREE.SRGBColorSpace;
    const planeMat = new THREE.MeshStandardMaterial({
      map: tex,
      transparent: true,
      side: THREE.DoubleSide,
      roughness: 0.4
    });
    const badge = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), planeMat);
    badge.position.set(0, 0.6, 0);
    avatarInst.heldMount.add(badge);
    return;
  }

  const gripMat = new THREE.MeshStandardMaterial({ color: 0x333842, roughness: 0.5 });
  const bladeMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.25, metalness: 0.75 });
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.9, 10), gripMat);
  handle.position.set(0, 0.2, 0);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.3), bladeMat);
  blade.position.set(0, 1.4, 0);
  avatarInst.heldMount.add(handle, blade);
}

function equipBackpackSlot(index) {
  if (index === equippedIndex) {
    equippedIndex = -1;
    applyToolVisualToRig(localAvatarInst, "");
    renderHotbar();
    broadcastSelfState();
    return;
  }
  if (index < 0 || index >= backpackItems.length) return;
  equippedIndex = index;
  const tool = backpackItems[index];
  applyToolVisualToRig(localAvatarInst, tool.name, tool.colorHex || 0xc0c8d0, tool.texUrl || "");
  renderHotbar();
  broadcastSelfState();
}

function giveItemToBackpack(itemName, colorHex = 0xc0c8d0, autoEquip = false, texUrl = "") {
  const resolvedTex = texUrl || resolveImageUrlFromAssets("", itemName);
  const existingIdx = backpackItems.findIndex((t) => t.name === itemName);
  if (existingIdx !== -1) {
    if (resolvedTex && !backpackItems[existingIdx].texUrl) {
      backpackItems[existingIdx].texUrl = resolvedTex;
    }
    if (autoEquip) equipBackpackSlot(existingIdx);
    return;
  }
  backpackItems.push({ name: itemName || "Item", colorHex, texUrl: resolvedTex });
  renderHotbar();
  if (autoEquip || backpackItems.length === 1) {
    equipBackpackSlot(backpackItems.length - 1);
  }
}

function applyGuiElementProps(domEl, props, cls) {
  const name = readStr(props, "Name", cls);
  domEl.dataset.rblxName = name;

  const posProp = findPropElement(props, "Position");
  const sizeProp = findPropElement(props, "Size");

  if (posProp) {
    const xs = readNum(posProp, "XS", 0);
    const xo = readNum(posProp, "XO", 0);
    const ys = readNum(posProp, "YS", 0);
    const yo = readNum(posProp, "YO", 0);
    domEl.style.left = `calc(${xs * 100}% + ${xo}px)`;
    domEl.style.top = `calc(${ys * 100}% + ${yo}px)`;
  }

  if (sizeProp) {
    const xs = readNum(sizeProp, "XS", 0);
    const xo = readNum(sizeProp, "XO", 120);
    const ys = readNum(sizeProp, "YS", 0);
    const yo = readNum(sizeProp, "YO", 36);
    domEl.style.width = `calc(${xs * 100}% + ${xo}px)`;
    domEl.style.height = `calc(${ys * 100}% + ${yo}px)`;

  const visible = readBool(props, "Visible", true);
  domEl.style.display = visible ? (cls === "TextLabel" || cls === "TextButton" ? "flex" : "block") : "none";

  const bgHex = parseColorFromProps(props, null);
  const bgTrans = Math.max(0, Math.min(1, readNum(props, "BackgroundTransparency", cls === "TextLabel" ? 0.25 : 0)));
  if (bgHex !== null) {
    const r = (bgHex >> 16) & 255;
    const g = (bgHex >> 8) & 255;
    const b = bgHex & 255;
    domEl.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${1 - bgTrans})`;
  } else if (bgTrans >= 0.999) {
    domEl.style.backgroundColor = "transparent";
  } else {
    domEl.style.backgroundColor = `rgba(37, 42, 52, ${1 - bgTrans})`;
  }

  const textVal = readStr(props, "Text", "");
  if (cls === "TextLabel" || cls === "TextButton") {
    domEl.textContent = textVal || name;
    const txtHex = parseColor3Value(findPropElement(props, "TextColor3"), 0xffffff);
    domEl.style.color = "#" + txtHex.toString(16).padStart(6, "0");

      domEl.style.fontSize = "clamp(10px, 2.2vw, 28px)";

  const rawImg = readStr(props, "Image", "") || readStr(props, "Texture", "");
  const resolvedImg = resolveImageUrlFromAssets(rawImg, name);
  if (resolvedImg && (cls === "ImageLabel" || cls === "ImageButton" || cls === "Frame" || cls === "TextLabel" || cls === "TextButton")) {
    domEl.style.backgroundImage = `url("${resolvedImg.replace(/"/g, "&quot;")}")`;
    domEl.style.backgroundSize = "cover";
    domEl.style.backgroundPosition = "center";
  }
}

    btn.addEventListener("click", () => {
      btn.dispatchEvent(new CustomEvent("MouseButton1Click"));
    });
    currentDom.appendChild(btn);
    currentDom = btn;
  } else if (cls === "ImageLabel" || cls === "ImageButton") {
    const im = document.createElement(cls === "ImageButton" ? "button" : "div");
    if (cls === "ImageButton") im.type = "button";
    im.className = "rblx-el rblx-button";
    if (props) applyGuiElementProps(im, props, cls);
    im.addEventListener("click", () => {
      im.dispatchEvent(new CustomEvent("MouseButton1Click"));
    });
    currentDom.appendChild(im);
    currentDom = im;
  } else if (cls === "UICorner" && parentDom && parentDom !== robloxGuiLayer) {
    const rScale = props ? readNum(props, "CornerRadiusScale", 0) : 0;
    const rOffset = props ? readNum(props, "CornerRadiusOffset", 8) : 8;
    parentDom.style.borderRadius = rScale > 0 ? `${Math.round(rScale * 100)}%` : `${rOffset}px`;
  } else if (cls === "UIStroke" && parentDom && parentDom !== robloxGuiLayer) {
    const thick = props ? readNum(props, "Thickness", 1) : 1;

    parentDom.style.border = `${Math.max(1, thick)}px solid #${strokeHex.toString(16).padStart(6, "0")}`;
  }

  for (const child of Array.from(item.children)) {
    if (child.tagName === "Item") {
      buildGuiHierarchy(child, currentDom);
    }
  }
}

function makeVector3(x = 0, y = 0, z = 0) {
  const vx = Number(x) || 0;
  const vy = Number(y) || 0;
  const vz = Number(z) || 0;
  return {
    X: vx, Y: vy, Z: vz,
    x: vx, y: vy, z: vz,
    Magnitude: Math.hypot(vx, vy, vz),
    Unit: () => {
      const len = Math.hypot(vx, vy, vz) || 1;
      return makeVector3(vx / len, vy / len, vz / len);
    },
    Lerp(goal, alpha) {
      const a = Math.max(0, Math.min(1, Number(alpha) || 0));
      return makeVector3(vx + ((goal.X ?? goal.x ?? 0) - vx) * a, vy + ((goal.Y ?? goal.y ?? 0) - vy) * a, vz + ((goal.Z ?? goal.z ?? 0) - vz) * a);
    },
    __add(o) { return makeVector3(vx + (o.X ?? o.x ?? 0), vy + (o.Y ?? o.y ?? 0), vz + (o.Z ?? o.z ?? 0)); },
    __sub(o) { return makeVector3(vx - (o.X ?? o.x ?? 0), vy - (o.Y ?? o.y ?? 0), vz - (o.Z ?? o.z ?? 0)); },
    __mul(s) {
      if (typeof s === "number") return makeVector3(vx * s, vy * s, vz * s);
      return makeVector3(vx * (s.X ?? s.x ?? 1), vy * (s.Y ?? s.y ?? 1), vz * (s.Z ?? s.z ?? 1));
    }
  };
}

function makeCFrame(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const cx = Number(x) || 0;
  const cy = Number(y) || 0;
  const cz = Number(z) || 0;
  const euler = new THREE.Euler(Number(rx) || 0, Number(ry) || 0, Number(rz) || 0, "YXZ");
  const quat = new THREE.Quaternion().setFromEuler(euler);
  return {
    X: cx, Y: cy, Z: cz,
    Position: makeVector3(cx, cy, cz),
    p: makeVector3(cx, cy, cz),
    Rotation: { X: rx, Y: ry, Z: rz },
    LookVector: makeVector3(-Math.sin(ry || 0), 0, -Math.cos(ry || 0)),
    RightVector: makeVector3(Math.cos(ry || 0), 0, -Math.sin(ry || 0)),
    UpVector: makeVector3(0, 1, 0),
    Lerp(goal, alpha) {
      const a = Math.max(0, Math.min(1, Number(alpha) || 0));
      const gx = goal.X ?? goal.Position?.X ?? cx;
      const gy = goal.Y ?? goal.Position?.Y ?? cy;
      const gz = goal.Z ?? goal.Position?.Z ?? cz;
      return makeCFrame(cx + (gx - cx) * a, cy + (gy - cy) * a, cz + (gz - cz) * a, rx, ry, rz);
    },
    ToWorldSpace(offsetCf) {
      const v = new THREE.Vector3(offsetCf.X ?? 0, offsetCf.Y ?? 0, offsetCf.Z ?? 0).applyQuaternion(quat);
      return makeCFrame(cx + v.x, cy + v.y, cz + v.z, rx, ry, rz);
    },
    __add(v) {
      return makeCFrame(cx + (v.X ?? v.x ?? 0), cy + (v.Y ?? v.y ?? 0), cz + (v.Z ?? v.z ?? 0), rx, ry, rz);
    },
    __mul(other) {
      if (other && typeof other.X === "number" && other.LookVector === undefined) {
        return makeCFrame(cx + (other.X ?? 0), cy + (other.Y ?? 0), cz + (other.Z ?? 0), rx, ry, rz);
      }
      return makeCFrame(cx + (other?.X ?? 0), cy + (other?.Y ?? 0), cz + (other?.Z ?? 0), rx + (other?.Rotation?.X ?? 0), ry + (other?.Rotation?.Y ?? 0), rz + (other?.Rotation?.Z ?? 0));
    }
  };
}

function makeSignal(cbList) {
  return {
    Connect(fn) {
      if (typeof fn === "function") cbList.push(fn);
      return {
        Connected: true,
        Disconnect() {
          this.Connected = false;
          const idx = cbList.indexOf(fn);
          if (idx !== -1) cbList.splice(idx, 1);
        }
      };
    },
    Once(fn) {
      const wrapper = (...args) => {
        const idx = cbList.indexOf(wrapper);
        if (idx !== -1) cbList.splice(idx, 1);
        if (typeof fn === "function") return fn(...args);
      };
      cbList.push(wrapper);
      return { Disconnect() { const i = cbList.indexOf(wrapper); if (i !== -1) cbList.splice(i, 1); } };
    },
    Wait() {
      return new Promise((resolve) => {
        const wrapper = (...args) => {
          const i = cbList.indexOf(wrapper);
          if (i !== -1) cbList.splice(i, 1);
          resolve(args[0]);
        };
        cbList.push(wrapper);
      });
    },
    Fire(...args) {
      [...cbList].forEach((fn) => {
        try { fn(...args); } catch (_) {}
      });
    }
  };
}

function runLuauScriptSource(code, scriptName = "Script") {
  if (!code || !code.trim()) return;

  let lua = String(code);
  lua = lua.replace(/\bcontinue\b/g, "goto __luau_continue__");

  const makePartProxy = (partRecord) => {
    const holder = partRecord.holder;
    const proxy = {
      isPartProxy: true,
      Name: partRecord.name,
      ClassName: "Part",
      get Anchored() { return Boolean(partRecord.anchored); },
      set Anchored(v) { partRecord.anchored = Boolean(v); },
      get CanCollide() { return Boolean(partRecord.canCollide); },
      set CanCollide(v) { partRecord.canCollide = Boolean(v); invalidateFloorCache(); },
      get Transparency() {
        let tr = 0;
        holder.traverse((m) => { if (m.isMesh && m.material) tr = 1 - (m.material.opacity ?? 1); });
        return tr;
      },
      set Transparency(v) {
        const op = Math.max(0, Math.min(1, 1 - Number(v || 0)));
        holder.traverse((m) => {
          if (m.isMesh && m.material) {
            m.material.transparent = op < 0.999;
            m.material.opacity = op;
            m.material.needsUpdate = true;
          }
        });
      },
      get Color() {
        let hex = 0x00a2ff;
        holder.traverse((m) => { if (m.isMesh && m.material && m.material.color) hex = m.material.color.getHex(); });
        return { R: ((hex >> 16) & 255) / 255, G: ((hex >> 8) & 255) / 255, B: (hex & 255) / 255 };
      },
      set Color(c) {
        if (!c) return;
        const r = Math.max(0, Math.min(1, Number(c.R ?? c.r ?? 0)));
        const g = Math.max(0, Math.min(1, Number(c.G ?? c.g ?? 0)));
        const b = Math.max(0, Math.min(1, Number(c.B ?? c.b ?? 0)));
        const col = new THREE.Color(r, g, b);
        holder.traverse((m) => { if (m.isMesh && m.material && m.material.color) m.material.color.copy(col); });
      },
      get Size() { return makeVector3(partRecord.halfExtents.x * 2, partRecord.halfExtents.y * 2, partRecord.halfExtents.z * 2); },
      set Size(v) {
        if (!v) return;
        const sx = Math.max(0.05, Number(v.X ?? v.x ?? 4));
        const sy = Math.max(0.05, Number(v.Y ?? v.y ?? 2));
        const sz = Math.max(0.05, Number(v.Z ?? v.z ?? 4));
        partRecord.halfExtents.set(sx / 2, sy / 2, sz / 2);
        holder.scale.set(sx / 4, sy / 2, sz / 4);
        invalidateFloorCache();
      },
      get Position() { return makeVector3(holder.position.x, holder.position.y, holder.position.z); },
      set Position(vec) {
        if (!vec) return;
        holder.position.set(Number(vec.X ?? vec.x ?? holder.position.x), Number(vec.Y ?? vec.y ?? holder.position.y), Number(vec.Z ?? vec.z ?? holder.position.z));
