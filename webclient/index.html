let isRightDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;
let camPitch = 0.16;
let camDist = 4.2;

canvas.addEventListener("mousedown", (e) => {
  if (escMenu.classList.contains("open")) return;
  if (e.button === 2) {
    isRightDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    canvas.style.cursor = "grabbing";
  }
});
window.addEventListener("mouseup", (e) => {
  if (!e || e.button === 2 || e.button === undefined) {
    isRightDragging = false;
    canvas.style.cursor = "default";
  }
});
window.addEventListener("mousemove", (e) => {
  if (escMenu.classList.contains("open")) return;
  if (isRightDragging) {
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    playerYaw -= dx * 0.0045;
    camPitch = Math.max(-0.55, Math.min(1.15, camPitch + dy * 0.004));
  } else if (shiftLockEnabled) {
    const dx = e.movementX || 0;
    const dy = e.movementY || 0;
    if (dx !== 0 || dy !== 0) {
      playerYaw -= dx * 0.0032;
      camPitch = Math.max(-0.55, Math.min(1.15, camPitch + dy * 0.003));
    }
  }
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("wheel", (e) => {
  if (escMenu.classList.contains("open")) return;
  camDist = Math.max(1.8, Math.min(14, camDist + e.deltaY * 0.006));
});

window.addEventListener("resize", () => {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (w > 0 && h > 0) {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
});

function refreshFloorBoxes(now) {
  if (now - floorCacheTime < 120 && cachedFloorBoxes.length > 0) return;
  floorCacheTime = now;
  const list = [];
  if (baseplate.userData.canCollide !== false) {
    list.push(new THREE.Box3().setFromObject(baseplate));
  }
  for (const child of worldGroup.children) {
    if (child.userData && child.userData.canCollide === false) continue;
    list.push(new THREE.Box3().setFromObject(child));
  }
  cachedFloorBoxes = list;
}

function getFloorHeightAt(x, z, currentY) {
  let highestFloor = -Infinity;
  for (let i = 0; i < cachedFloorBoxes.length; i++) {
    const box = cachedFloorBoxes[i];
    if (x >= box.min.x - 0.5 && x <= box.max.x + 0.5 && z >= box.min.z - 0.5 && z <= box.max.z + 0.5) {
      if (box.max.y <= currentY + 1.5 && box.max.y > highestFloor) {
        highestFloor = box.max.y;
      }
    }
  }
  return highestFloor;
}

function updatePhysicsAndPlayer(dt, now) {
  refreshFloorBoxes(now);

  for (const partRec of dynamicParts) {
    if (partRec.destroyed) continue;
    if (!partRec.anchored) {
      partRec.velY -= studioConfig.gravity * 0.12 * dt;
      partRec.holder.position.y += partRec.velY * dt;
      if (partRec.canCollide && partRec.holder.position.y - partRec.halfExtents.y <= 0) {
        partRec.holder.position.y = partRec.halfExtents.y;
        partRec.velY = 0;
      }
      if (partRec.holder.position.y < studioConfig.fallenPartsDestroyHeight) {
        partRec.destroyed = true;
        if (partRec.holder.parent) partRec.holder.parent.remove(partRec.holder);
      }
    }
    if (partRec.touchedCallbacks && partRec.touchedCallbacks.length > 0) {
      const p = partRec.holder.position;
      const dist = Math.hypot(playerPos.x - p.x, (playerPos.y + 2.0) - p.y, playerPos.z - p.z);
      if (dist < Math.max(partRec.halfExtents.x, partRec.halfExtents.y, partRec.halfExtents.z) + 2.5) {
        for (const cb of partRec.touchedCallbacks) {
          try { cb({ Name: username, Humanoid: { TakeDamage() {} } }); } catch (_) {}
        }
      }
    }
  }

  if (speedBoostTimer > 0) speedBoostTimer -= dt;
  if (attackTimer > 0) {
    attackTimer -= dt;
    if (attackTimer <= 0) isAttacking = false;
  }

  let moveForward = 0;
  let moveRight = 0;
  if (keysDown.has("KeyW") || keysDown.has("ArrowUp")) moveForward += 1;
  if (keysDown.has("KeyS") || keysDown.has("ArrowDown")) moveForward -= 1;
  if (keysDown.has("KeyD") || keysDown.has("ArrowRight")) moveRight += 1;
  if (keysDown.has("KeyA") || keysDown.has("ArrowLeft")) moveRight -= 1;

  const activeSpeed = speedBoostTimer > 0 ? 34 : studioConfig.walkSpeed;
  const forwardVec = new THREE.Vector3(-Math.sin(playerYaw), 0, -Math.cos(playerYaw));
  const rightVec = new THREE.Vector3(Math.cos(playerYaw), 0, -Math.sin(playerYaw));

  const wishDir = new THREE.Vector3()
    .addScaledVector(forwardVec, moveForward)
    .addScaledVector(rightVec, moveRight);
  if (wishDir.lengthSq() > 0) wishDir.normalize();

  playerVel.x = wishDir.x * activeSpeed;
  playerVel.z = wishDir.z * activeSpeed;

  playerVel.y -= studioConfig.gravity * 0.12 * dt;

  playerPos.x += playerVel.x * dt;
  playerPos.y += playerVel.y * dt;
  playerPos.z += playerVel.z * dt;

  const floorY = getFloorHeightAt(playerPos.x, playerPos.z, playerPos.y);
  if (floorY > -Infinity && playerPos.y <= floorY && playerVel.y <= 0) {
    playerPos.y = floorY;
    playerVel.y = 0;
    isGrounded = true;
    isJumping = false;
  } else {
    isGrounded = false;
  }

  if (playerPos.y < studioConfig.fallenPartsDestroyHeight) {
    respawnLocalPlayer();
  }

  for (const pItem of pickupItems) {
    if (pItem.collected) continue;
    pItem.mesh.rotation.y += dt * 2.0;
    if (playerPos.distanceTo(pItem.pickupPos) < 4.0) {
      pItem.collected = true;
      pItem.mesh.visible = false;
      giveItemToBackpack(pItem.name, pItem.colorHex || 0xc0c8d0, true, pItem.texUrl || "");
      addChat("System", "Picked up " + pItem.name + "!");
    }
  }

  for (const inter of interactiveParts) {
    if (inter.canCollide === false) continue;
    const pos = inter.mesh.position;
    const dx = Math.abs(playerPos.x - pos.x);
    const dy = Math.abs(playerPos.y + 2.5 - pos.y);
    const dz = Math.abs(playerPos.z - pos.z);
    if (dx <= inter.halfExtents.x + 1.2 && dy <= inter.halfExtents.y + 2.6 && dz <= inter.halfExtents.z + 1.2) {
      if (inter.type === "kill") {
        respawnLocalPlayer();
        break;
      } else if (inter.type === "jump") {
        playerVel.y = inter.boost || 85;
        isGrounded = false;
        isJumping = true;
      } else if (inter.type === "speed") {
        speedBoostTimer = 4.0;
      }
    }
  }

  if (localAvatarInst) {
    syncLocalAvatarTransform();
    const horizSpeed = Math.hypot(playerVel.x, playerVel.z);
    const speedRatio = Math.min(1, horizSpeed / Math.max(1, studioConfig.walkSpeed));
    stepAvatarAnimation(localAvatarInst, dt, speedRatio, isGrounded, isJumping, isAttacking);
  }

  glbTorsoCameraGroup.getWorldPosition(glbTorsoCameraGroup.userData.worldPos || (glbTorsoCameraGroup.userData.worldPos = new THREE.Vector3()));
  const torsoWorld = glbTorsoCameraGroup.userData.worldPos;
  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;
  const shoulderOffsetX = shiftLockEnabled ? Math.cos(playerYaw) * 0.75 : 0;
  const shoulderOffsetZ = shiftLockEnabled ? -Math.sin(playerYaw) * 0.75 : 0;

  camera.position.set(
    torsoWorld.x + shoulderOffsetX + Math.sin(playerYaw) * horizDist,
    torsoWorld.y + vertDist + 0.35,
    torsoWorld.z + shoulderOffsetZ + Math.cos(playerYaw) * horizDist
  );
  camera.lookAt(torsoWorld.x + shoulderOffsetX, torsoWorld.y + 0.35, torsoWorld.z + shoulderOffsetZ);
  camera.getWorldPosition(skyDome.position);
}

let lastFrameTime = performance.now();
let lastBroadcastTime = 0;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  updatePhysicsAndPlayer(dt, now);

  remotePlayers.forEach((rp) => {
    rp.avatarInst.container.position.lerp(rp.targetPos, Math.min(1, dt * 14));
    rp.avatarInst.container.rotation.y = rp.targetYaw;
    stepAvatarAnimation(rp.avatarInst, dt, rp.speedRatio, rp.isGrounded, rp.isJumping, rp.isAttacking);
  });

  if (now - lastBroadcastTime > 65) {
    lastBroadcastTime = now;
    broadcastSelfState();
  }

  renderer.render(scene, camera);
}

(async function init() {
  syncShiftLockUI();
  showLoading("Starting Bloxtip...", "Loading avatar GLB...");
  const tpl = await loadAvatarTemplate(AVATAR_GLB_URL);
  localAvatarInst = createAnimatedAvatarInstance(tpl, username);
  scene.add(localAvatarInst.container);
  attachCameraDirectlyToGlbTorso(localAvatarInst);
  syncLocalAvatarTransform();
  renderHotbar();
  updateLeaderboard();

  const rows = await loadGamesList();
  const initialGame = placeId
    ? (rows.find((g) => String(g.id) === String(placeId)) || { id: placeId, title: "Game" })
    : (rows[0] || { id: "default", title: "Baseplate" });
  await selectAndLaunchGame(initialGame);
  requestAnimationFrame(animate);
})();
</script>
