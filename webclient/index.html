#shiftlock-reticle {

function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

const params = new URLSearchParams(window.location.search);
let placeId = params.get("placeId") || params.get("id") || "";
let activeServerId = params.get("server") || "";
const peerId = "peer_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36);
const username = params.get("user") || localStorage.getItem("bloxtip_username") || ("Guest_" + peerId.slice(-4));

let masterVolume = Number(localStorage.getItem("bloxtip_volume") ?? "0.6");
if (!Number.isFinite(masterVolume) || masterVolume < 0 || masterVolume > 1) masterVolume = 0.6;
let shiftLockEnabled = localStorage.getItem("bloxtip_shiftlock") === "1";
let activeEscTab = "guidance";

let audioCtx = null;
function playUiSound(freq = 520, duration = 0.06, type = "sine") {
  if (masterVolume <= 0.001) return;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (!audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(Math.min(0.25, masterVolume * 0.18), audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (_) {}
}

function updateSkyAndLighting() {

  const topHex = "#" + studioConfig.skyTopColor.toString(16).padStart(6, "0");

  hemi.color.setHex(studioConfig.ambientColor);
  skyDome.position.copy(camera.position);
}

let cachedAvatarTemplate = null;
let avatarTemplatePromise = null;
let cachedAvatarPortraitUrl = "";

function buildFallbackRobloxRig() {
  const rig = new THREE.Group();

  const headMat = new THREE.MeshStandardMaterial({ color: 0xf5cd30, roughness: 0.5 });
  const torsoMat = new THREE.MeshStandardMaterial({ color: 0x0d69ac, roughness: 0.5 });
  const limbMat = new THREE.MeshStandardMaterial({ color: 0x287f47, roughness: 0.5 });
  const armMat = new THREE.MeshStandardMaterial({ color: 0xf5cd30, roughness: 0.5 });

  const root = new THREE.Group();
  root.name = "HumanoidRootPart";
  rig.add(root);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
  torso.name = "Torso";
  torso.position.set(0, 3, 0);
  torso.castShadow = true;
  torso.receiveShadow = true;
  root.add(torso);

  const headPivot = new THREE.Group();
  headPivot.name = "HeadPivot";
  headPivot.position.set(0, 4.6, 0);
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
  head.name = "Head";
  head.castShadow = true;
  headPivot.add(head);
  root.add(headPivot);

  const leftArmPivot = new THREE.Group();
  leftArmPivot.name = "LeftShoulder";
  leftArmPivot.position.set(-1.5, 3.5, 0);
  const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
  leftArm.name = "Left Arm";
  leftArm.position.set(0, -0.5, 0);
  leftArm.castShadow = true;
  leftArmPivot.add(leftArm);
  root.add(leftArmPivot);

  const rightArmPivot = new THREE.Group();
  rightArmPivot.name = "RightShoulder";
  rightArmPivot.position.set(1.5, 3.5, 0);
  const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
  rightArm.name = "Right Arm";
  rightArm.position.set(0, -0.5, 0);
  rightArm.castShadow = true;
  rightArmPivot.add(rightArm);
  root.add(rightArmPivot);

  const leftLegPivot = new THREE.Group();
  leftLegPivot.name = "LeftHip";
  leftLegPivot.position.set(-0.5, 2, 0);
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), limbMat);
  leftLeg.name = "Left Leg";
  leftLeg.position.set(0, -1, 0);
  leftLeg.castShadow = true;
  leftLegPivot.add(leftLeg);
  root.add(leftLegPivot);

  const rightLegPivot = new THREE.Group();
  rightLegPivot.name = "RightHip";
  rightLegPivot.position.set(0.5, 2, 0);
  const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), limbMat);
  rightLeg.name = "Right Leg";
  rightLeg.position.set(0, -1, 0);
  rightLeg.castShadow = true;
  rightLegPivot.add(rightLeg);
  root.add(rightLegPivot);

  return {
    scene: rig,
    clips: [],
    root,
    torso,
    headPivot,
    leftArmPivot,
    rightArmPivot,
    leftLegPivot,
    rightLegPivot,
    footOffset: 0.05,
    height: 5.2,
    isFallback: true
  };
}

function extractRigParts(obj) {
  let root = null;
  let torso = null;
  let headPivot = null;
  let leftArmPivot = null;
  let rightArmPivot = null;
  let leftLegPivot = null;
  let rightLegPivot = null;

  obj.traverse((node) => {
    node.castShadow = true;
    node.receiveShadow = true;
    const n = (node.name || "").toLowerCase();
    if (!torso && (n.includes("torso") || n.includes("uppertorso") || n.includes("chest") || n.includes("body"))) {
      torso = node;
    }
    if (!root && (n.includes("humanoidrootpart") || n.includes("root") || n.includes("torso") || n.includes("hips"))) {
      root = node;
    }
    if (!headPivot && n.includes("head")) headPivot = node;
    if (!leftArmPivot && (n.includes("leftarm") || n.includes("left_arm") || n.includes("left arm") || n.includes("leftshoulder") || n.includes("left upper arm"))) {
      leftArmPivot = node;
    }
    if (!rightArmPivot && (n.includes("rightarm") || n.includes("right_arm") || n.includes("right arm") || n.includes("rightshoulder") || n.includes("right upper arm"))) {
      rightArmPivot = node;
    }
    if (!leftLegPivot && (n.includes("leftleg") || n.includes("left_leg") || n.includes("left leg") || n.includes("lefthip") || n.includes("left upper leg"))) {
      leftLegPivot = node;
    }
    if (!rightLegPivot && (n.includes("rightleg") || n.includes("right_leg") || n.includes("right leg") || n.includes("righthip") || n.includes("right upper leg"))) {
      rightLegPivot = node;
    }
  });

  if (!root) root = obj;
  if (!torso) torso = root;
  return { root, torso, headPivot, leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot };
}

function generateAvatarPortraitDataUrl(template) {
  try {
    const pScene = new THREE.Scene();
    pScene.background = new THREE.Color(0x1b212c);
    pScene.add(new THREE.AmbientLight(0xffffff, 1.4));
    const pLight = new THREE.DirectionalLight(0xffffff, 1.2);
    pLight.position.set(2, 4, 4);
    pScene.add(pLight);

    const pCam = new THREE.PerspectiveCamera(45, 1, 0.1, 50);
    pCam.position.set(0, 3.6, 5.4);
    pCam.lookAt(0, 3.0, 0);

    const pRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    pRenderer.setSize(96, 96);
    const clone = template.scene.clone(true);
    pScene.add(clone);
    pRenderer.render(pScene, pCam);
    const url = pRenderer.domElement.toDataURL("image/png");
    pRenderer.dispose();
    return url;
  } catch (_) {
    return "";
  }
}

function loadAvatarTemplate(glbUrl = AVATAR_GLB_URL) {
  if (glbUrl === AVATAR_GLB_URL && cachedAvatarTemplate) {
    return Promise.resolve(cachedAvatarTemplate);
  }
  if (glbUrl === AVATAR_GLB_URL && avatarTemplatePromise) {
    return avatarTemplatePromise;
  }

  const p = new Promise((resolve) => {
    gltfLoader.load(
      glbUrl,
      (gltf) => {
        const rawBox = new THREE.Box3().setFromObject(gltf.scene);
        const rawSize = new THREE.Vector3();
        rawBox.getSize(rawSize);
        const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z, 0.001);
        const targetHeight = 5.0;
        const scaleFactor = rawSize.y > 0.01 ? (targetHeight / rawSize.y) : (targetHeight / maxDim);
        gltf.scene.scale.multiplyScalar(scaleFactor);

        gltf.scene.updateMatrixWorld(true);
        const scaledBox = new THREE.Box3().setFromObject(gltf.scene);
        const minY = Number.isFinite(scaledBox.min.y) ? scaledBox.min.y : 0;
        const maxY = Number.isFinite(scaledBox.max.y) ? scaledBox.max.y : targetHeight;
        const footOffset = Math.max(0.05, -minY + 0.05);
        const height = Math.max(1.0, maxY - minY);

        const parts = extractRigParts(gltf.scene);
        const result = {
          scene: gltf.scene,
          clips: gltf.animations || [],
          ...parts,
          footOffset,
          height,
          isFallback: false
        };
        if (glbUrl === AVATAR_GLB_URL) {
          cachedAvatarTemplate = result;
          cachedAvatarPortraitUrl = generateAvatarPortraitDataUrl(result);
        }
        resolve(result);
      },
      undefined,
      () => {
        const fallback = buildFallbackRobloxRig();
        if (glbUrl === AVATAR_GLB_URL) {
          cachedAvatarTemplate = fallback;
          cachedAvatarPortraitUrl = generateAvatarPortraitDataUrl(fallback);
        }
        resolve(fallback);
      }
    );
  });

  if (glbUrl === AVATAR_GLB_URL) {
    avatarTemplatePromise = p;
  }
  return p;
}

function createNameplateSprite(name, topY = 5.6) {
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 64;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
  ctx.fillRect(16, 12, 224, 40);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px Segoe UI, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(name, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4.5, 1.15, 1);
  sprite.position.set(0, topY, 0);
  return sprite;
}

function createAnimatedAvatarInstance(template, playerName) {
  const container = new THREE.Group();
  const cloned = template.scene.clone(true);
  cloned.name = "AvatarGlbMesh";
  container.add(cloned);

  const parts = extractRigParts(cloned);
  const mixer = (template.clips && template.clips.length > 0) ? new THREE.AnimationMixer(cloned) : null;
  const actions = {};

  if (mixer && template.clips.length > 0) {
    template.clips.forEach((clip, idx) => {
      const action = mixer.clipAction(clip);
      actions[clip.name.toLowerCase()] = action;
      if (idx === 0) {
        action.play();
      }
    });
  }

  const height = template.height || 5.0;
  const nameplate = createNameplateSprite(playerName, height + 0.8);
  container.add(nameplate);

  const heldMount = new THREE.Group();
  heldMount.position.set(0, -1.0, -0.4);
  if (parts.rightArmPivot) {
    parts.rightArmPivot.add(heldMount);
  } else {
    container.add(heldMount);
  }

  return {
    container,
    cloned,
    parts,
    mixer,
    actions,
    heldMount,
    footOffset: template.footOffset || 0.05,
    height,
    animTime: 0,
    equippedToolName: ""
  };
}

function attachCameraDirectlyToGlbTorso(avatarInst) {
  if (!avatarInst) return;
  const torsoTarget = avatarInst.parts?.torso || avatarInst.parts?.root || avatarInst.cloned || avatarInst.container;
  if (glbTorsoCameraGroup.parent !== torsoTarget) {
    torsoTarget.add(glbTorsoCameraGroup);
  }
  glbTorsoCameraGroup.position.set(0, 0, 0);
  glbTorsoCameraGroup.rotation.set(0, 0, 0);
}

function stepAvatarAnimation(avatarInst, dt, speedRatio, isGrounded, isJumping, isAttacking) {
  if (!avatarInst) return;
  avatarInst.animTime += dt * (1 + speedRatio * 5.5);

  if (avatarInst.mixer) {
    avatarInst.mixer.update(dt);
  }

  const { leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot, headPivot, root } = avatarInst.parts || {};
  const t = avatarInst.animTime;

  if (!isGrounded || isJumping) {
    if (leftArmPivot) leftArmPivot.rotation.x = THREE.MathUtils.lerp(leftArmPivot.rotation.x, -2.55, dt * 14);
    if (rightArmPivot) rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, -2.55, dt * 14);
    if (leftLegPivot) leftLegPivot.rotation.x = THREE.MathUtils.lerp(leftLegPivot.rotation.x, -0.65, dt * 14);
    if (rightLegPivot) rightLegPivot.rotation.x = THREE.MathUtils.lerp(rightLegPivot.rotation.x, 0.55, dt * 14);
    if (root && root !== avatarInst.container) {
      root.position.y = THREE.MathUtils.lerp(root.position.y, 0.25, dt * 10);
    }
  } else if (speedRatio > 0.08) {
    const swing = Math.sin(t * 2.3) * 0.9 * Math.min(1, speedRatio);
    const bob = Math.abs(Math.cos(t * 2.3)) * 0.14 * Math.min(1, speedRatio);
    if (leftLegPivot) leftLegPivot.rotation.x = THREE.MathUtils.lerp(leftLegPivot.rotation.x, swing, dt * 18);
    if (rightLegPivot) rightLegPivot.rotation.x = THREE.MathUtils.lerp(rightLegPivot.rotation.x, -swing, dt * 18);
    if (leftArmPivot) leftArmPivot.rotation.x = THREE.MathUtils.lerp(leftArmPivot.rotation.x, -swing * 0.92, dt * 18);
    if (!avatarInst.equippedToolName && rightArmPivot) {
      rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, swing * 0.92, dt * 18);
    }
    if (root && root !== avatarInst.container) {
      root.position.y = THREE.MathUtils.lerp(root.position.y, bob, dt * 16);
    }
  } else {
    const breathe = Math.sin(t * 0.65) * 0.07;
    if (leftLegPivot) leftLegPivot.rotation.x = THREE.MathUtils.lerp(leftLegPivot.rotation.x, 0, dt * 14);
    if (rightLegPivot) rightLegPivot.rotation.x = THREE.MathUtils.lerp(rightLegPivot.rotation.x, 0, dt * 14);
    if (leftArmPivot) leftArmPivot.rotation.x = THREE.MathUtils.lerp(leftArmPivot.rotation.x, breathe, dt * 14);
    if (!avatarInst.equippedToolName && rightArmPivot) {
      rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, -breathe, dt * 14);
    }
    if (root && root !== avatarInst.container) {
      root.position.y = THREE.MathUtils.lerp(root.position.y, 0, dt * 14);
    }
  }

  if (avatarInst.equippedToolName && rightArmPivot) {
    const targetArmX = isAttacking ? -0.35 : -1.35;
    rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, targetArmX, dt * 18);
  }

  if (headPivot) {
    headPivot.rotation.y = Math.sin(t * 0.35) * 0.08;
  }
}

const imageAssetMap = new Map();

function isSupportedWebUrl(url) {
  if (typeof url !== "string") return false;
  const trimmed = url.trim();
  if (!trimmed) return false;
  if (/^rbxasset:\/\//i.test(trimmed)) return false;
  if (/^rbxassetid:\/\//i.test(trimmed)) return false;
  return /^https?:\/\//i.test(trimmed) || trimmed.startsWith("data:image/") || trimmed.startsWith("./") || trimmed.startsWith("/");
}

function resolveImageUrlFromAssets(rawUrl, fallbackName = "") {
  if (typeof rawUrl === "string" && isSupportedWebUrl(rawUrl)) {
    return rawUrl.trim();
  }
  const clean = String(rawUrl || "").trim();
  const baseFile = clean.split("/").pop().split("\\").pop().toLowerCase();
  if (baseFile && imageAssetMap.has(baseFile)) {
    return imageAssetMap.get(baseFile);
  }
  const cleanLower = clean.toLowerCase();
  if (cleanLower && imageAssetMap.has(cleanLower)) {
    return imageAssetMap.get(cleanLower);
  }
  const nameLower = String(fallbackName || "").trim().toLowerCase();
  if (nameLower && imageAssetMap.has(nameLower)) {
    return imageAssetMap.get(nameLower);
  }
  for (const [k, v] of imageAssetMap.entries()) {
    if (baseFile && (k.includes(baseFile) || baseFile.includes(k))) {
      return v;
    }
  }
  return "";
}

function registerImagesFromXmlOrRow(xmlText, gameRow) {
  if (gameRow && typeof gameRow === "object") {
    for (const [key, val] of Object.entries(gameRow)) {
      if (typeof val === "string" && isSupportedWebUrl(val)) {
        imageAssetMap.set(key.toLowerCase(), val.trim());
        const filePart = val.trim().split("/").pop().split("?")[0].toLowerCase();
        if (filePart) imageAssetMap.set(filePart, val.trim());
      }
    }
  }

  if (typeof xmlText !== "string" || !xmlText.trim()) return;
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, "application/xml");
    const allEls = doc.getElementsByTagName("*");
    for (let i = 0; i < allEls.length; i++) {
      const el = allEls[i];
      const txt = (el.textContent || "").trim();
      if (isSupportedWebUrl(txt)) {
        const attrName = (el.getAttribute("name") || el.tagName || "").toLowerCase();
        if (attrName) imageAssetMap.set(attrName, txt);
        const filePart = txt.split("/").pop().split("?")[0].toLowerCase();
        if (filePart) imageAssetMap.set(filePart, txt);
      }
    }
  } catch (_) {}
}

function readNum(parent, tagName, fallback) {
  if (!parent) return fallback;
  const el = parent.getElementsByTagName(tagName)[0];
  if (!el) return fallback;
  const n = Number(el.textContent);
  return Number.isFinite(n) ? n : fallback;
}

function readBool(parent, propName, fallback) {
  if (!parent) return fallback;
  for (const el of Array.from(parent.children)) {
    if ((el.getAttribute("name") || "").toLowerCase() === propName.toLowerCase()) {
      const txt = (el.textContent || "").trim().toLowerCase();
      if (txt === "true" || txt === "1") return true;
      if (txt === "false" || txt === "0") return false;
    }
  }
  return fallback;
}

function readStr(parent, propName, fallback = "") {
  if (!parent) return fallback;
  for (const el of Array.from(parent.children)) {
    if (el.getAttribute("name") === propName) return el.textContent ?? fallback;
  }
  return fallback;
}

function findPropElement(parent, propName) {
  if (!parent) return null;
  for (const el of Array.from(parent.children)) {
    if (el.getAttribute("name") === propName) return el;
  }
  return null;
}

function parseColor3Value(propEl, fallbackHex = 0x00a2ff) {
  if (!propEl) return fallbackHex;
  const rEl = propEl.getElementsByTagName("R")[0];
  const gEl = propEl.getElementsByTagName("G")[0];
  const bEl = propEl.getElementsByTagName("B")[0];
  if (rEl && gEl && bEl) {
    let r = Number(rEl.textContent);
    let g = Number(gEl.textContent);
    let b = Number(bEl.textContent);
    if (Number.isFinite(r) && Number.isFinite(g) && Number.isFinite(b)) {
      if (r <= 1.001 && g <= 1.001 && b <= 1.001) {
        r = Math.round(Math.max(0, Math.min(1, r)) * 255);
        g = Math.round(Math.max(0, Math.min(1, g)) * 255);
        b = Math.round(Math.max(0, Math.min(1, b)) * 255);
      } else {
        r = Math.round(Math.max(0, Math.min(255, r)));
        g = Math.round(Math.max(0, Math.min(255, g)));
        b = Math.round(Math.max(0, Math.min(255, b)));
      }
      return (r << 16) | (g << 8) | b;
    }
  }
  const uintEl = propEl.getElementsByTagName("uint")[0] || propEl.getElementsByTagName("int")[0];
  if (uintEl) {
    const val = Number(uintEl.textContent);
    if (Number.isFinite(val) && val >= 0) {
      if (val > 0xffffff) return val & 0xffffff;
      return val;
    }
  }
  const txt = (propEl.textContent || "").trim();
  if (/^#?[0-9a-fA-F]{6}$/.test(txt)) {
    return parseInt(txt.replace("#", ""), 16);
  }
  const num = Number(txt);
  if (Number.isFinite(num) && num >= 0) {
    return num > 0xffffff ? (num & 0xffffff) : num;
  }
  return fallbackHex;
}

function parseColorFromProps(props, fallbackHex = 0x00a2ff) {
  const color3Prop = findPropElement(props, "Color3") || findPropElement(props, "color3");
  if (color3Prop) return parseColor3Value(color3Prop, fallbackHex);

  const colorProp = findPropElement(props, "Color") || findPropElement(props, "color");
  if (colorProp) {
    const c3 = parseColor3Value(colorProp, null);
    if (c3 !== null) return c3;
  }

  const brickProp = findPropElement(props, "BrickColor") || findPropElement(props, "brickcolor");
  if (brickProp) {
    const code = Number((brickProp.textContent || "").trim());
    if (Number.isFinite(code) && BRICK_COLORS[code] !== undefined) {
      return BRICK_COLORS[code];
    }
  }

  const colorStr = readStr(props, "Color", "") || readStr(props, "BrickColor", "");
  if (colorStr) {
    const num = Number(colorStr.trim());
    if (Number.isFinite(num)) {
      if (BRICK_COLORS[num] !== undefined) return BRICK_COLORS[num];
      if (num >= 0) return num > 0xffffff ? (num & 0xffffff) : num;
    }
    if (/^#?[0-9a-fA-F]{6}$/.test(colorStr.trim())) {
      return parseInt(colorStr.trim().replace("#", ""), 16);
    }
  }
  return fallbackHex;
}

function parseUDim2Css(propEl, fallback = { sx: 0, ox: 100, sy: 0, oy: 40 }) {
  if (!propEl) {
    return {
      left: fallback.ox + "px",
      top: fallback.oy + "px",
      width: (fallback.sx * 100) + "%",
      height: fallback.sy + "px"
    };
  }
  const xs = readNum(propEl, "XS", fallback.sx);
  const xo = readNum(propEl, "XO", fallback.ox);
  const ys = readNum(propEl, "YS", fallback.sy);
  const yo = readNum(propEl, "YO", fallback.oy);
  return {
    left: `calc(${xs * 100}% + ${xo}px)`,
    top: `calc(${ys * 100}% + ${yo}px)`,
    width: `calc(${xs * 100}% + ${xo}px)`,
    height: `calc(${ys * 100}% + ${yo}px)`
  };
}

function parseCFrameMatrix(cfEl) {
  const fallback = {
    x: 0, y: 2, z: -12,
    matrix4: new THREE.Matrix4().identity()
  };
  if (!cfEl) return fallback;

  const x = readNum(cfEl, "X", 0);
  const y = readNum(cfEl, "Y", 2);
  const z = readNum(cfEl, "Z", -12);

  const r00 = readNum(cfEl, "R00", null);
  const r01 = readNum(cfEl, "R01", null);
  const r02 = readNum(cfEl, "R02", null);
  const r10 = readNum(cfEl, "R10", null);
  const r11 = readNum(cfEl, "R11", null);
  const r12 = readNum(cfEl, "R12", null);
  const r20 = readNum(cfEl, "R20", null);
  const r21 = readNum(cfEl, "R21", null);
  const r22 = readNum(cfEl, "R22", null);

  const m = new THREE.Matrix4();
  if (
    r00 !== null && r01 !== null && r02 !== null &&
    r10 !== null && r11 !== null && r12 !== null &&
    r20 !== null && r21 !== null && r22 !== null
  ) {
    m.set(
      r00, r01, r02, x,
      r10, r11, r12, y,
      r20, r21, r22, z,
      0,   0,   0,   1
    );
  } else {
    m.makeTranslation(x, y, z);
  }

  return { x, y, z, matrix4: m };
}

function getPartShape(item, props, cls) {
  if (cls === "WedgePart") return "Wedge";
  if (cls === "Cylinder" || cls === "CylinderPart") return "Cylinder";
  if (cls === "Ball" || cls === "SpherePart") return "Ball";
  if (cls === "TrussPart") return "Truss";
  if (cls === "CornerWedgePart") return "CornerWedge";

  const shapeProp = findPropElement(props, "shape") || findPropElement(props, "Shape");
  if (shapeProp) {
    const txt = (shapeProp.textContent || "").trim();
    const num = Number(txt);
    if (Number.isFinite(num)) {
      if (num === 0) return "Ball";
      if (num === 1) return "Block";
      if (num === 2) return "Cylinder";
      if (num === 3) return "Wedge";
      if (num === 4) return "CornerWedge";
    }
    const lower = txt.toLowerCase();
    if (lower.includes("cyl")) return "Cylinder";
    if (lower.includes("ball") || lower.includes("sphere")) return "Ball";
    if (lower.includes("wedge") && lower.includes("corner")) return "CornerWedge";
    if (lower.includes("wedge")) return "Wedge";
  }

  const childItems = Array.from(item.children).filter((c) => c.tagName === "Item");
  for (const ch of childItems) {
    const cCls = ch.getAttribute("class");
    if (cCls === "CylinderMesh") return "Cylinder";
    if (cCls === "SpecialMesh") {
      const cProps = findPropElement(ch, "Properties") || ch.firstElementChild;
      const mType = readStr(cProps, "MeshType", "");
      const mNum = Number(mType.trim());
      if (mNum === 0) return "Head";
      if (mNum === 1) return "Torso";
      if (mNum === 2) return "Wedge";
      if (mNum === 3) return "Sphere";
      if (mNum === 4) return "Cylinder";
      if (mNum === 5) return "FileMesh";
      if (mNum === 6) return "Brick";
      const mLower = mType.toLowerCase();
      if (mLower.includes("cyl")) return "Cylinder";
      if (mLower.includes("sphere") || mLower.includes("ball")) return "Ball";
      if (mLower.includes("wedge")) return "Wedge";
      if (mLower.includes("file")) return "FileMesh";
    }
  }

  return "Block";
}

function createWedgeGeometry(sx, sy, sz) {
  const shape = new THREE.Shape();
  shape.moveTo(-sz / 2, -sy / 2);
  shape.lineTo(sz / 2, -sy / 2);
  shape.lineTo(sz / 2, sy / 2);
  shape.closePath();

  const geom = new THREE.ExtrudeGeometry(shape, {
    depth: sx,
    bevelEnabled: false
  });
  geom.translate(0, 0, -sx / 2);
  geom.rotateY(-Math.PI / 2);
  return geom;
}

function createCornerWedgeGeometry(sx, sy, sz) {
  const geom = new THREE.BufferGeometry();
  const hx = sx / 2, hy = sy / 2, hz = sz / 2;
  const vertices = new Float32Array([
    -hx, -hy, -hz,   hx, -hy, -hz,   hx, -hy,  hz,
    -hx, -hy, -hz,   hx, -hy,  hz,  -hx, -hy,  hz,
    -hx, -hy, -hz,  -hx,  hy, -hz,   hx, -hy, -hz,
    -hx, -hy, -hz,  -hx, -hy,  hz,  -hx,  hy, -hz,
    -hx,  hy, -hz,  -hx, -hy,  hz,   hx, -hy, -hz,
     hx, -hy, -hz,  -hx, -hy,  hz,   hx, -hy,  hz
  ]);
  geom.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geom.computeVertexNormals();
  return geom;
}

function buildGeometryForPart(shape, sx, sy, sz) {
  const w = Math.max(0.05, sx);
  const h = Math.max(0.05, sy);
  const d = Math.max(0.05, sz);

  if (shape === "Cylinder") {
    const radius = Math.max(0.025, Math.min(h, d) / 2);
    const cyl = new THREE.CylinderGeometry(radius, radius, w, 28, 1, false);
    cyl.rotateZ(-Math.PI / 2);
    return cyl;
  }
  if (shape === "Ball" || shape === "Sphere") {
    const r = Math.max(0.025, Math.min(w, h, d) / 2);
    return new THREE.SphereGeometry(r, 24, 18);
  }
  if (shape === "Wedge") {
    return createWedgeGeometry(w, h, d);
  }
  if (shape === "CornerWedge") {
    return createCornerWedgeGeometry(w, h, d);
  }
  if (shape === "Truss") {
    const g = new THREE.Group();
    const railGeo = new THREE.BoxGeometry(0.25, h, 0.25);
    const mat = new THREE.MeshStandardMaterial({ color: 0x8a929a });
    const offsets = [
      [-w / 2 + 0.125, -d / 2 + 0.125],
      [w / 2 - 0.125, -d / 2 + 0.125],
      [-w / 2 + 0.125, d / 2 - 0.125],
      [w / 2 - 0.125, d / 2 - 0.125]
    ];
    offsets.forEach(([ox, oz]) => {
      const post = new THREE.Mesh(railGeo, mat);
      post.position.set(ox, 0, oz);
      g.add(post);
    });
    const rungCount = Math.max(1, Math.floor(h / 2));
    for (let i = 0; i <= rungCount; i++) {
      const ry = -h / 2 + (i / rungCount) * h;
      const rung1 = new THREE.Mesh(new THREE.BoxGeometry(w, 0.16, 0.16), mat);
      rung1.position.set(0, ry, 0);
      g.add(rung1);
    }
    return g;
  }
  return new THREE.BoxGeometry(w, h, d);
}

const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin("anonymous");

function materialPropsFromRoblox(props, colorHex, texUrl) {
  const transparency = Math.max(0, Math.min(1, readNum(props, "Transparency", 0)));
  const reflectance = Math.max(0, Math.min(1, readNum(props, "Reflectance", 0)));
  const matName = (readStr(props, "Material", "") || "").toLowerCase();
  const validTexUrl = isSupportedWebUrl(texUrl) ? texUrl.trim() : "";

  let roughness = 0.65;
  let metalness = Math.min(0.9, reflectance * 0.85);
  let emissive = 0x000000;
  let emissiveIntensity = 0;

  if (matName.includes("neon")) {
    roughness = 0.2;
    emissive = colorHex;
    emissiveIntensity = 0.85;
  } else if (matName.includes("metal") || matName.includes("diamondplate") || matName.includes("foil") || matName.includes("corrugated")) {
    roughness = 0.28;
    metalness = Math.max(metalness, 0.72);
  } else if (matName.includes("glass")) {
    roughness = 0.08;
    metalness = 0.1;
  } else if (matName.includes("smoothplastic") || matName.includes("plastic")) {
    roughness = 0.42;
  } else if (matName.includes("wood")) {
    roughness = 0.78;
  } else if (matName.includes("grass") || matName.includes("sand") || matName.includes("brick") || matName.includes("stone") || matName.includes("rock") || matName.includes("concrete")) {
    roughness = 0.88;
  }

  const opts = {
    color: validTexUrl ? 0xffffff : colorHex,
    roughness,
    metalness,
    emissive,
    emissiveIntensity
  };

  if (transparency > 0.001) {
    opts.transparent = true;
    opts.opacity = 1 - transparency;
  }

  const mat = new THREE.MeshStandardMaterial(opts);

  if (validTexUrl) {
    const tex = textureLoader.load(validTexUrl, undefined, undefined, () => {
      if (mat.map) {
        mat.map.dispose();
        mat.map = null;
      }
      mat.color.setHex(colorHex);
      mat.needsUpdate = true;
    });
    tex.colorSpace = THREE.SRGBColorSpace;
    mat.map = tex;
  }

  return mat;
}

function extractTextureOrMeshUrl(item, props) {
  const itemName = readStr(props, "Name", "");
  let rawTex = readStr(props, "TextureUrl", "") || readStr(props, "Texture", "") || readStr(props, "Image", "");
  let rawMesh = "";

  for (const child of Array.from(item.children)) {
    if (child.tagName !== "Item") continue;
    const cCls = child.getAttribute("class");
    const cProps = findPropElement(child, "Properties") || child.firstElementChild;
    if (!cProps) continue;

    if (cCls === "Decal" || cCls === "Texture") {
      const dUrl = readStr(cProps, "Texture", "") || readStr(cProps, "TextureUrl", "") || readStr(cProps, "Image", "");
      if (dUrl && !rawTex) rawTex = dUrl;
    } else if (cCls === "SpecialMesh" || cCls === "FileMesh") {
      const mTex = readStr(cProps, "TextureId", "") || readStr(cProps, "Texture", "");
      const mId = readStr(cProps, "MeshId", "");
      if (mTex && !rawTex) rawTex = mTex;
      if (mId) rawMesh = mId;
    }
  }

  const texUrl = resolveImageUrlFromAssets(rawTex, itemName);
  const meshUrl = isSupportedWebUrl(rawMesh) ? rawMesh.trim() : "";
  return { texUrl, meshUrl };
}

function attachLightsFromItem(item, targetGroup) {
  for (const child of Array.from(item.children)) {
    if (child.tagName !== "Item") continue;
    const cCls = child.getAttribute("class");
    const cProps = findPropElement(child, "Properties") || child.firstElementChild;
    if (!cProps) continue;
    const brightness = readNum(cProps, "Brightness", 1);
    const range = readNum(cProps, "Range", 16);
    const lColor = parseColorFromProps(cProps, 0xfff5cc);

    if (cCls === "PointLight") {
      const pt = new THREE.PointLight(lColor, brightness * 1.4, range);
      targetGroup.add(pt);
    } else if (cCls === "SpotLight") {
      const angleDeg = readNum(cProps, "Angle", 90);
      const sp = new THREE.SpotLight(lColor, brightness * 1.6, range, THREE.MathUtils.degToRad(angleDeg / 2), 0.35);
      targetGroup.add(sp);
    } else if (cCls === "SurfaceLight") {
      const surf = new THREE.PointLight(lColor, brightness * 1.1, range);
      targetGroup.add(surf);
    }
  }
}

let backpackItems = [];
let equippedIndex = -1;
let pickupItems = [];
let interactiveParts = [];
let dynamicParts = [];
let queuedScripts = [];

function renderHotbar() {
  hotbarEl.innerHTML = "";
  if (backpackItems.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hb-slot";
    empty.textContent = "Empty";
    hotbarEl.appendChild(empty);
    return;
  }
  backpackItems.forEach((tool, idx) => {
    const slot = document.createElement("div");
    slot.className = "hb-slot" + (idx === equippedIndex ? " active" : "");
    slot.textContent = (idx + 1) + ": " + tool.name;
    slot.addEventListener("click", () => equipBackpackSlot(idx));
    hotbarEl.appendChild(slot);
  });
}

function createVisualItemMesh(item, props) {
  const name = readStr(props, "Name", "Item");
  const colorHex = parseColorFromProps(props, 0x8d99ae);
  const { texUrl, meshUrl } = extractTextureOrMeshUrl(item, props);

  const itemRoot = new THREE.Group();
  itemRoot.name = name;

  let handlePart = null;
  const childItems = Array.from(item.children).filter((c) => c.tagName === "Item");
  for (const ch of childItems) {
    const cCls = ch.getAttribute("class") || "";
    const cProps = findPropElement(ch, "Properties") || ch.firstElementChild;
    const cName = cProps ? readStr(cProps, "Name", "") : "";
    if (cName === "Handle" || cCls === "Part" || cCls === "MeshPart" || cCls === "WedgePart" || cCls === "Cylinder") {
      handlePart = { ch, cProps, cCls };
      if (cName === "Handle") break;
    }
  }

  if (handlePart && handlePart.cProps) {
    const sEl = findPropElement(handlePart.cProps, "size") || findPropElement(handlePart.cProps, "Size");
    const sx = sEl ? Math.max(0.2, readNum(sEl, "X", 0.5)) : 0.5;
    const sy = sEl ? Math.max(0.2, readNum(sEl, "Y", 2.2)) : 2.2;
    const sz = sEl ? Math.max(0.2, readNum(sEl, "Z", 0.5)) : 0.5;
    const hColor = parseColorFromProps(handlePart.cProps, colorHex);
    const hShape = getPartShape(handlePart.ch, handlePart.cProps, handlePart.cCls);
    const hGeo = buildGeometryForPart(hShape, sx, sy, sz);
    const hMat = materialPropsFromRoblox(handlePart.cProps, hColor, texUrl);
    if (hGeo.isGroup) {
      hGeo.traverse((m) => { if (m.isMesh) m.material = hMat; });
      itemRoot.add(hGeo);
    } else {
      itemRoot.add(new THREE.Mesh(hGeo, hMat));
    }
  } else if (texUrl) {
    const spriteTex = textureLoader.load(texUrl);
    spriteTex.colorSpace = THREE.SRGBColorSpace;
    const cardMat = new THREE.MeshStandardMaterial({
      map: spriteTex,
      transparent: true,
      side: THREE.DoubleSide,
      roughness: 0.5
    });
    const card = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), cardMat);
    card.position.set(0, 1.3, 0);
    itemRoot.add(card);
  } else {
    const gripMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42, roughness: 0.5 });
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1.1, 12), gripMat);
    grip.position.set(0, 0.4, 0);
    itemRoot.add(grip);

    const bladeMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.0, 0.35), bladeMat);
    blade.position.set(0, 1.7, 0);
    itemRoot.add(blade);
  }

  if (meshUrl && /^https?:\/\//i.test(meshUrl) && meshUrl.toLowerCase().endsWith(".glb")) {
    gltfLoader.load(
      meshUrl,
      (gltf) => {
        while (itemRoot.children.length > 0) itemRoot.remove(itemRoot.children[0]);
        const sc = gltf.scene.clone(true);
        sc.scale.set(1.2, 1.2, 1.2);
        itemRoot.add(sc);
      },
      undefined,
      () => {}
    );
  }

  return itemRoot;
}

let localAvatarInst = null;

function applyToolVisualToRig(avatarInst, toolName, colorHex = 0xc0c8d0, texUrl = "") {
  if (!avatarInst || !avatarInst.heldMount) return;
  while (avatarInst.heldMount.children.length > 0) {
    avatarInst.heldMount.remove(avatarInst.heldMount.children[0]);
  }
  avatarInst.equippedToolName = toolName || "";
  if (!toolName) return;

  const resolvedTex = texUrl || resolveImageUrlFromAssets("", toolName);
  if (resolvedTex) {
    const tex = textureLoader.load(resolvedTex);
    tex.colorSpace = THREE.SRGBColorSpace;
    const planeMat = new THREE.MeshStandardMaterial({
      map: tex,
      transparent: true,
      side: THREE.DoubleSide,
      roughness: 0.4
    });
    const badge = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), planeMat);
    badge.position.set(0, 0.6, 0);
    avatarInst.heldMount.add(badge);
    return;
  }

  const gripMat = new THREE.MeshStandardMaterial({ color: 0x333842, roughness: 0.5 });
  const bladeMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.25, metalness: 0.75 });
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.9, 10), gripMat);
  handle.position.set(0, 0.2, 0);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.3), bladeMat);
  blade.position.set(0, 1.4, 0);
  avatarInst.heldMount.add(handle, blade);
}

function equipBackpackSlot(index) {
  if (index === equippedIndex) {
    equippedIndex = -1;
    applyToolVisualToRig(localAvatarInst, "");
    renderHotbar();
    broadcastSelfState();
    return;
  }
  if (index < 0 || index >= backpackItems.length) return;
  equippedIndex = index;
  const tool = backpackItems[index];
  applyToolVisualToRig(localAvatarInst, tool.name, tool.colorHex || 0xc0c8d0, tool.texUrl || "");
  renderHotbar();
  broadcastSelfState();
}

function giveItemToBackpack(itemName, colorHex = 0xc0c8d0, autoEquip = false, texUrl = "") {
  const resolvedTex = texUrl || resolveImageUrlFromAssets("", itemName);
  const existingIdx = backpackItems.findIndex((t) => t.name === itemName);
  if (existingIdx !== -1) {
    if (resolvedTex && !backpackItems[existingIdx].texUrl) {
      backpackItems[existingIdx].texUrl = resolvedTex;
    }
    if (autoEquip) equipBackpackSlot(existingIdx);
    return;
  }
  backpackItems.push({ name: itemName || "Item", colorHex, texUrl: resolvedTex });
  renderHotbar();
  if (autoEquip || backpackItems.length === 1) {
    equipBackpackSlot(backpackItems.length - 1);
  }
}

function applyGuiElementProps(domEl, props, cls) {
  const name = readStr(props, "Name", cls);
  domEl.dataset.rblxName = name;

  const posProp = findPropElement(props, "Position");
  const sizeProp = findPropElement(props, "Size");

  if (posProp) {
    const xs = readNum(posProp, "XS", 0);
    const xo = readNum(posProp, "XO", 0);
    const ys = readNum(posProp, "YS", 0);
    const yo = readNum(posProp, "YO", 0);
    domEl.style.left = `calc(${xs * 100}% + ${xo}px)`;
    domEl.style.top = `calc(${ys * 100}% + ${yo}px)`;
  }

  if (sizeProp) {
    const xs = readNum(sizeProp, "XS", 0);
    const xo = readNum(sizeProp, "XO", 120);
    const ys = readNum(sizeProp, "YS", 0);
    const yo = readNum(sizeProp, "YO", 36);
    domEl.style.width = `calc(${xs * 100}% + ${xo}px)`;
    domEl.style.height = `calc(${ys * 100}% + ${yo}px)`;
  } else if (cls === "TextLabel" || cls === "TextButton") {
    domEl.style.minWidth = "90px";
    domEl.style.minHeight = "28px";
    domEl.style.padding = "4px 8px";
  }

  const visible = readBool(props, "Visible", true);
  domEl.style.display = visible ? (cls === "TextLabel" || cls === "TextButton" ? "flex" : "block") : "none";

  const bgHex = parseColorFromProps(props, null);
  const bgTrans = Math.max(0, Math.min(1, readNum(props, "BackgroundTransparency", cls === "TextLabel" ? 0.25 : 0)));
  if (bgHex !== null) {
    const r = (bgHex >> 16) & 255;
    const g = (bgHex >> 8) & 255;
    const b = bgHex & 255;
    domEl.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${1 - bgTrans})`;
  } else if (bgTrans >= 0.999) {
    domEl.style.backgroundColor = "transparent";
  } else {
    domEl.style.backgroundColor = `rgba(37, 42, 52, ${1 - bgTrans})`;
  }

  const textVal = readStr(props, "Text", "");
  if (cls === "TextLabel" || cls === "TextButton") {
    domEl.textContent = textVal || name;
    const txtHex = parseColor3Value(findPropElement(props, "TextColor3"), 0xffffff);
    domEl.style.color = "#" + txtHex.toString(16).padStart(6, "0");
    const tSize = readNum(props, "TextSize", 14);
    domEl.style.fontSize = Math.max(8, tSize) + "px";
    if (readBool(props, "TextScaled", false)) {
      domEl.style.fontSize = "clamp(10px, 2.2vw, 28px)";
    }
  }

  const rawImg = readStr(props, "Image", "") || readStr(props, "Texture", "");
  const resolvedImg = resolveImageUrlFromAssets(rawImg, name);
  if (resolvedImg && (cls === "ImageLabel" || cls === "ImageButton" || cls === "Frame" || cls === "TextLabel" || cls === "TextButton")) {
    domEl.style.backgroundImage = `url("${resolvedImg.replace(/"/g, "&quot;")}")`;
    domEl.style.backgroundSize = "cover";
    domEl.style.backgroundPosition = "center";
  }
}

function buildGuiHierarchy(item, parentDom) {
  if (!item || item.tagName !== "Item") return;
  const cls = item.getAttribute("class") || "";
  const props = findPropElement(item, "Properties") || item.firstElementChild;

  let currentDom = parentDom;
  if (cls === "ScreenGui") {
    const sg = document.createElement("div");
    sg.className = "rblx-screengui";
    if (props && !readBool(props, "Enabled", true)) {
      sg.style.display = "none";
    }
    robloxGuiLayer.appendChild(sg);
    currentDom = sg;
  } else if (cls === "Frame" || cls === "ScrollingFrame") {
    const fr = document.createElement("div");
    fr.className = "rblx-el rblx-frame";
    if (cls === "ScrollingFrame") fr.style.overflow = "auto";
    if (props) applyGuiElementProps(fr, props, cls);
    currentDom.appendChild(fr);
    currentDom = fr;
  } else if (cls === "TextLabel") {
    const lbl = document.createElement("div");
    lbl.className = "rblx-el rblx-label";
    if (props) applyGuiElementProps(lbl, props, cls);
    currentDom.appendChild(lbl);
    currentDom = lbl;
  } else if (cls === "TextButton") {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "rblx-el rblx-button";
    if (props) applyGuiElementProps(btn, props, cls);
    btn.addEventListener("click", () => {
      playUiSound(660, 0.05);
      btn.dispatchEvent(new CustomEvent("MouseButton1Click"));
    });
    currentDom.appendChild(btn);
    currentDom = btn;
  } else if (cls === "ImageLabel" || cls === "ImageButton") {
    const im = document.createElement(cls === "ImageButton" ? "button" : "div");
    if (cls === "ImageButton") im.type = "button";
    im.className = "rblx-el rblx-button";
    if (props) applyGuiElementProps(im, props, cls);
    im.addEventListener("click", () => {
      playUiSound(660, 0.05);
      im.dispatchEvent(new CustomEvent("MouseButton1Click"));
    });
    currentDom.appendChild(im);
    currentDom = im;
  } else if (cls === "UICorner" && parentDom && parentDom !== robloxGuiLayer) {
    const rScale = props ? readNum(props, "CornerRadiusScale", 0) : 0;
    const rOffset = props ? readNum(props, "CornerRadiusOffset", 8) : 8;
    parentDom.style.borderRadius = rScale > 0 ? `${Math.round(rScale * 100)}%` : `${rOffset}px`;
  } else if (cls === "UIStroke" && parentDom && parentDom !== robloxGuiLayer) {
    const thick = props ? readNum(props, "Thickness", 1) : 1;
    const strokeHex = props ? parseColorFromProps(props, 0xffffff) : 0xffffff;
    parentDom.style.border = `${Math.max(1, thick)}px solid #${strokeHex.toString(16).padStart(6, "0")}`;
  }

  for (const child of Array.from(item.children)) {
    if (child.tagName === "Item") {
      buildGuiHierarchy(child, currentDom);
    }
  }
}

function runLuauScriptSource(code, scriptName = "Script") {
  if (!code || !code.trim()) return;

  let js = String(code);
  js = js.replace(/--\[\[[\s\S]*?\]\]/g, "");
  js = js.replace(/--[^\n]*/g, "");

  js = js.replace(/\belseif\b/g, "} else if (");
  js = js.replace(/\bthen\b/g, ") {");
  js = js.replace(/\bif\s+/g, "if (");
  js = js.replace(/\bwhile\s+/g, "while (");
  js = js.replace(/\bfor\s+([a-zA-Z_]\w*)\s*=\s*([^,\n]+),\s*([^,\n]+)(?:,\s*([^\n]+))?\s+do\b/g, (_, v, start, end, step) => {
    const s = (step || "1").trim();
    const cond = Number(s) < 0 ? `${v} >= (${end.trim()})` : `${v} <= (${end.trim()})`;
    return `for (let ${v} = (${start.trim()}); ${cond}; ${v} += (${s})) {`;
  });
  js = js.replace(/\bdo\b/g, "{");
  js = js.replace(/\bfunction\s+([a-zA-Z0-9_.:]+)\s*\(([^)]*)\)/g, (_, fnName, fnArgs) => {
    if (fnName.includes(".") || fnName.includes(":")) {
      return `${fnName} = async function(${fnArgs})`;
    }
    return `async function ${fnName}(${fnArgs})`;
  });
  js = js.replace(/\bfunction\s*\(([^)]*)\)/g, "async function($1)");
  js = js.replace(/\bend\b/g, "}");
  js = js.replace(/\blocal\s+/g, "let ");
  js = js.replace(/\bnil\b/g, "null");
  js = js.replace(/\bnot\s+/g, "!");
  js = js.replace(/\band\b/g, "&&");
  js = js.replace(/\bor\b/g, "||");
  js = js.replace(/~=/g, "!==");
  js = js.replace(/\.\./g, "+");
  js = js.replace(/\b([a-zA-Z0-9_.\]]+):([a-zA-Z_]\w*)\(/g, "$1.$2(");

  const apiHelper = (obj) => {
    if (!obj) return null;
    if (obj.isPartProxy) return obj;
    return obj;
  };

  const makePartProxy = (partRecord) => {
    const holder = partRecord.holder;
    return {
      isPartProxy: true,
      Name: partRecord.name,
      get Anchored() { return Boolean(partRecord.anchored); },
      set Anchored(v) { partRecord.anchored = Boolean(v); },
      get CanCollide() { return Boolean(partRecord.canCollide); },
      set CanCollide(v) { partRecord.canCollide = Boolean(v); invalidateFloorCache(); },
      get Transparency() {
        let tr = 0;
        holder.traverse((m) => {
          if (m.isMesh && m.material) tr = 1 - (m.material.opacity ?? 1);
        });
        return tr;
      },
      set Transparency(v) {
        const op = Math.max(0, Math.min(1, 1 - Number(v || 0)));
        holder.traverse((m) => {
          if (m.isMesh && m.material) {
            m.material.transparent = op < 0.999;
            m.material.opacity = op;
            m.material.needsUpdate = true;
          }
        });
      },
      get Position() {
        return { X: holder.position.x, Y: holder.position.y, Z: holder.position.z };
      },
      set Position(vec) {
        if (!vec) return;
        holder.position.set(Number(vec.X ?? holder.position.x), Number(vec.Y ?? holder.position.y), Number(vec.Z ?? holder.position.z));
        invalidateFloorCache();
      },
      Destroy() {
        if (holder.parent) holder.parent.remove(holder);
        partRecord.destroyed = true;
        invalidateFloorCache();
      },
      FindFirstChild(childName) {
        if (childName === "TouchInterest") return {};
        return null;
      },
      Touched: {
        Connect(cb) {
          partRecord.touchedCallbacks.push(cb);
          return { Disconnect() { partRecord.touchedCallbacks = partRecord.touchedCallbacks.filter((x) => x !== cb); } };
        }
      }
    };
  };

  const workspaceProxy = {
    Gravity: studioConfig.gravity,
    FindFirstChild(name) {
      const found = dynamicParts.find((p) => !p.destroyed && p.name === name);
      return found ? makePartProxy(found) : null;
    },
    GetChildren() {
      return dynamicParts.filter((p) => !p.destroyed).map((p) => makePartProxy(p));
    }
  };

  const humanoidProxy = {
    get WalkSpeed() { return studioConfig.walkSpeed; },
    set WalkSpeed(v) { const n = Number(v); if (Number.isFinite(n) && n > 0) studioConfig.walkSpeed = n; },
    get JumpPower() { return studioConfig.jumpPower; },
    set JumpPower(v) { const n = Number(v); if (Number.isFinite(n) && n > 0) studioConfig.jumpPower = n; },
    Health: 100,
    MaxHealth: 100,
    TakeDamage(dmg) {
      humanoidProxy.Health = Math.max(0, humanoidProxy.Health - Number(dmg || 0));
      if (humanoidProxy.Health <= 0) {
        humanoidProxy.Health = humanoidProxy.MaxHealth;
        respawnLocalPlayer();
      }
    }
  };

  const characterProxy = {
    Name: username,
    Humanoid: humanoidProxy,
    HumanoidRootPart: {
      get Position() { return { X: playerPos.x, Y: playerPos.y, Z: playerPos.z }; },
      set Position(v) {
        if (!v) return;
        playerPos.set(Number(v.X ?? playerPos.x), Number(v.Y ?? playerPos.y), Number(v.Z ?? playerPos.z));
        syncLocalAvatarTransform();
      }
    },
    FindFirstChild(n) {
      if (n === "Humanoid") return humanoidProxy;
      if (n === "HumanoidRootPart") return characterProxy.HumanoidRootPart;
      return null;
    }
  };

  const localPlayerProxy = {
    Name: username,
    Character: characterProxy,
    Backpack: {
      GetChildren() {
        return backpackItems.map((b) => ({ Name: b.name }));
      }
    }
  };

  const gameProxy = {
    PlaceId: Number(placeId) || 0,
    Workspace: workspaceProxy,
    Players: {
      LocalPlayer: localPlayerProxy,
      GetPlayers() { return [localPlayerProxy]; }
    },
    GetService(svcName) {
      if (svcName === "Workspace") return workspaceProxy;
      if (svcName === "Players") return gameProxy.Players;
      return {};
    }
  };

  const InstanceProxy = {
    new(clsName, parentObj) {
      if (clsName === "Part" || clsName === "WedgePart" || clsName === "Cylinder" || clsName === "Ball") {
        const sx = 4, sy = 2, sz = 4;
        const shape = clsName === "WedgePart" ? "Wedge" : clsName === "Cylinder" ? "Cylinder" : clsName === "Ball" ? "Ball" : "Block";
        const geo = buildGeometryForPart(shape, sx, sy, sz);
        const mat = new THREE.MeshStandardMaterial({ color: 0x00a2ff, roughness: 0.5 });
        const holder = new THREE.Group();
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        holder.add(mesh);
        holder.position.set(0, 4, -8);
        worldGroup.add(holder);

        const rec = {
          name: clsName,
          holder,
          anchored: true,
          canCollide: true,
          velY: 0,
          halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2),
          touchedCallbacks: [],
          destroyed: false
        };
        dynamicParts.push(rec);
        invalidateFloorCache();
        const proxy = makePartProxy(rec);
        if (parentObj && typeof parentObj.FindFirstChild === "function") {
          return proxy;
        }
        return proxy;
      }
      if (clsName === "TextLabel" || clsName === "TextButton" || clsName === "Frame") {
        let sg = robloxGuiLayer.querySelector(".rblx-screengui");
        if (!sg) {
          sg = document.createElement("div");
          sg.className = "rblx-screengui";
          robloxGuiLayer.appendChild(sg);
        }
        const el = document.createElement(clsName === "TextButton" ? "button" : "div");
        el.className = "rblx-el " + (clsName === "TextButton" ? "rblx-button" : clsName === "TextLabel" ? "rblx-label" : "rblx-frame");
        el.style.left = "20px";
        el.style.top = "180px";
        el.style.width = "160px";
        el.style.height = "34px";
        el.style.backgroundColor = "rgba(30, 36, 46, 0.85)";
        el.style.color = "#ffffff";
        el.style.borderRadius = "4px";
        el.textContent = clsName;
        sg.appendChild(el);
        return {
          get Text() { return el.textContent; },
          set Text(v) { el.textContent = String(v ?? ""); },
          get Visible() { return el.style.display !== "none"; },
          set Visible(v) { el.style.display = v ? "flex" : "none"; },
          MouseButton1Click: {
            Connect(cb) { el.addEventListener("click", cb); }
          }
        };
      }
      return { Name: clsName };
    }
  };

  const Vector3Proxy = {
    new(x = 0, y = 0, z = 0) { return { X: Number(x) || 0, Y: Number(y) || 0, Z: Number(z) || 0 }; }
  };
  const CFrameProxy = {
    new(x = 0, y = 0, z = 0) { return { X: Number(x) || 0, Y: Number(y) || 0, Z: Number(z) || 0 }; }
  };
  const Color3Proxy = {
    new(r = 1, g = 1, b = 1) { return { R: Number(r) || 0, G: Number(g) || 0, B: Number(b) || 0 }; },
    fromRGB(r = 255, g = 255, b = 255) { return { R: (Number(r) || 0) / 255, G: (Number(g) || 0) / 255, B: (Number(b) || 0) / 255 }; }
  };
  const BrickColorProxy = {
    new(c) { return c; }
  };

  const waitFn = (sec = 0.05) => new Promise((r) => setTimeout(r, Math.max(10, Number(sec || 0.05) * 1000)));
  const taskProxy = {
    wait: waitFn,
    spawn(fn) { Promise.resolve().then(fn).catch((err) => addChat("ScriptWarn", String(err))); }
  };

  try {
    const fn = new Function(
      "workspace", "game", "script", "Instance", "Vector3", "CFrame", "Color3", "BrickColor", "wait", "task", "print", "warn", "apiHelper",
      `"use strict"; return (async () => { ${js} })();`
    );
    fn(
      workspaceProxy,
      gameProxy,
      { Name: scriptName, Parent: workspaceProxy },
      InstanceProxy,
      Vector3Proxy,
      CFrameProxy,
      Color3Proxy,
      BrickColorProxy,
      waitFn,
      taskProxy,
      (...args) => addChat(scriptName, args.map((a) => (typeof a === "object" ? JSON.stringify(a) : String(a))).join(" ")),
      (...args) => addChat(scriptName + " (warn)", args.join(" ")),
      apiHelper
    ).catch((err) => {
      addChat("ScriptError", scriptName + ": " + (err && err.message ? err.message : String(err)));
    });
  } catch (err) {
    addChat("ScriptError", scriptName + ": " + (err && err.message ? err.message : String(err)));
  }
}

function processStudioItem(item, parentGroup, defaultSpawnPosRef, worldItemsCollector) {
  if (!item || item.tagName !== "Item") return;
  const cls = item.getAttribute("class") || "";
  const props = findPropElement(item, "Properties") || item.firstElementChild;
  const name = props ? readStr(props, "Name", cls) : cls;

  if (cls === "StarterGui") {
    for (const ch of Array.from(item.children)) {
      if (ch.tagName === "Item") buildGuiHierarchy(ch, robloxGuiLayer);
    }
    return;
  }

  if (cls === "Script" || cls === "LocalScript" || cls === "ModuleScript") {
    if (props) {
      const src = readStr(props, "Source", "") || readStr(props, "Code", "") || readStr(props, "ScriptSource", "");
      if (src.trim()) {
        queuedScripts.push({ name, source: src });
      }
    }
    return;
  }

  if (cls === "Workspace" && props) {
    const gVal = readNum(props, "Gravity", null);
    if (gVal !== null && gVal > 0) studioConfig.gravity = gVal;
    const fpHeight = readNum(props, "FallenPartsDestroyHeight", null);
    if (fpHeight !== null) studioConfig.fallenPartsDestroyHeight = fpHeight;
  }

  if ((cls === "StarterPlayer" || cls === "StarterCharacterScripts") && props) {
    const ws = readNum(props, "CharacterWalkSpeed", null);
    const jp = readNum(props, "CharacterJumpPower", null);
    if (ws !== null && ws > 0) studioConfig.walkSpeed = ws;
    if (jp !== null && jp > 0) studioConfig.jumpPower = jp;
  }

  if (cls === "Lighting" && props) {
    const ambientHex = parseColorFromProps(props, null);
    if (ambientHex !== null) {
      studioConfig.ambientColor = ambientHex;
    }
    const skyHex = parseColor3Value(findPropElement(props, "OutdoorAmbient") || findPropElement(props, "FogColor"), null);
    if (skyHex !== null) {
      studioConfig.outdoorAmbientColor = skyHex;
      studioConfig.fogColor = skyHex;
      studioConfig.skyBottomColor = skyHex;
    }
    const fogEnd = readNum(props, "FogEnd", null);
    const fogStart = readNum(props, "FogStart", null);
    if (fogEnd !== null && fogEnd > 0) {
      studioConfig.fogEnd = fogEnd;
      studioConfig.fogStart = fogStart !== null ? fogStart : Math.min(40, fogEnd * 0.25);
    }
    const todStr = readStr(props, "TimeOfDay", "");
    if (todStr && todStr.includes(":")) {
      const parts = todStr.split(":").map(Number);
      if (parts.length >= 2 && Number.isFinite(parts[0]) && Number.isFinite(parts[1])) {
        studioConfig.dayTimeMinutes = parts[0] * 60 + parts[1];
      }
    }
    updateSkyAndLighting();
  }

  const isToolOrItem = (
    cls === "Tool" ||
    cls === "HopperBin" ||
    cls === "Accoutrement" ||
    cls === "Hat" ||
    cls === "Accessory"
  );

  if (isToolOrItem && props) {
    const cfEl = findPropElement(props, "CFrame") || findPropElement(props, "Grip") || findPropElement(props, "CoordinateFrame");
    const hasExplicitWorldPos = Boolean(
      cfEl && (
        cfEl.getElementsByTagName("X")[0] !== undefined ||
        cfEl.getElementsByTagName("Y")[0] !== undefined ||
        cfEl.getElementsByTagName("Z")[0] !== undefined
      )
    );
    const visual = createVisualItemMesh(item, props);
    const colorHex = parseColorFromProps(props, 0xc0c8d0);
    const { texUrl } = extractTextureOrMeshUrl(item, props);

    if (hasExplicitWorldPos) {
      const { matrix4 } = parseCFrameMatrix(cfEl);
      const posVec = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scaleVec = new THREE.Vector3();
      matrix4.decompose(posVec, quat, scaleVec);
      visual.position.copy(posVec);
      visual.quaternion.copy(quat);
      parentGroup.add(visual);
      if (worldItemsCollector) {
        worldItemsCollector.push({ name, colorHex, texUrl, mesh: visual, pickupPos: posVec.clone(), collected: false });
      }
    } else {
      giveItemToBackpack(name, colorHex, backpackItems.length === 0, texUrl);
    }
  }

  const isPartLike = (
    cls === "Part" ||
    cls === "SpawnLocation" ||
    cls === "WedgePart" ||
    cls === "TrussPart" ||
    cls === "CornerWedgePart" ||
    cls === "Cylinder" ||
    cls === "CylinderPart" ||
    cls === "Ball" ||
    cls === "SpherePart" ||
    cls === "MeshPart" ||
    cls === "Seat" ||
    cls === "VehicleSeat" ||
    cls === "FlagStand"
  );

  if (isPartLike && props) {
    const anchored = readBool(props, "Anchored", true);
    const canCollide = readBool(props, "CanCollide", true);

    if (name === "Baseplate") {
      const sizeEl = findPropElement(props, "size") || findPropElement(props, "Size");
      const cfEl = findPropElement(props, "CFrame");
      if (sizeEl) {
        const bx = Math.max(4, readNum(sizeEl, "X", 128));
        const by = Math.max(1, readNum(sizeEl, "Y", 2));
        const bz = Math.max(4, readNum(sizeEl, "Z", 128));
        baseplate.geometry.dispose();
        baseplate.geometry = new THREE.BoxGeometry(bx, by, bz);
      }
      if (cfEl) {
        baseplate.position.set(readNum(cfEl, "X", 0), readNum(cfEl, "Y", -1), readNum(cfEl, "Z", 0));
      }
      const bpColor = parseColorFromProps(props, null);
      if (bpColor !== null && baseplate.material) {
        baseplate.material.color.setHex(bpColor);
      }
      baseplate.userData.canCollide = canCollide;
      baseplate.userData.anchored = anchored;
      return;
    }

    const sizeEl = findPropElement(props, "size") || findPropElement(props, "Size");
    const sx = sizeEl ? readNum(sizeEl, "X", 4) : 4;
    const sy = sizeEl ? readNum(sizeEl, "Y", 2) : 2;
    const sz = sizeEl ? readNum(sizeEl, "Z", 4) : 4;

    const cfEl = findPropElement(props, "CFrame") || findPropElement(props, "CoordinateFrame");
    const { x: px, y: py, z: pz, matrix4 } = parseCFrameMatrix(cfEl);

    if (cls === "SpawnLocation" && !defaultSpawnPosRef.set) {
      defaultSpawnPosRef.set = true;
      defaultSpawnPosRef.x = px;
      defaultSpawnPosRef.y = py + Math.max(0.4, sy / 2 + 0.1);
      defaultSpawnPosRef.z = pz;
      spawnPad.position.set(px, py - sy / 2 + 0.2, pz);
    }

    const colorHex = parseColorFromProps(props, cls === "SpawnLocation" ? 0xd9dde2 : 0x00a2ff);
    const { texUrl, meshUrl } = extractTextureOrMeshUrl(item, props);
    const shape = getPartShape(item, props, cls);
    const geomOrGroup = buildGeometryForPart(shape, sx, sy, sz);
    const mat = materialPropsFromRoblox(props, colorHex, texUrl);

    const partHolder = new THREE.Group();
    if (geomOrGroup.isGroup) {
      geomOrGroup.traverse((child) => {
        if (child.isMesh) {
          child.material = mat;
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      partHolder.add(geomOrGroup);
    } else {
      const mesh = new THREE.Mesh(geomOrGroup, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      partHolder.add(mesh);
    }

    const posVec = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scaleVec = new THREE.Vector3();
    matrix4.decompose(posVec, quat, scaleVec);
    partHolder.position.copy(posVec);
    partHolder.quaternion.copy(quat);
    partHolder.userData.canCollide = canCollide;
    partHolder.userData.anchored = anchored;

    attachLightsFromItem(item, partHolder);
    parentGroup.add(partHolder);

    dynamicParts.push({
      name,
      holder: partHolder,
      anchored,
      canCollide,
      velY: 0,
      halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2),
      touchedCallbacks: [],
      destroyed: false
    });

    const lowerName = name.toLowerCase();
    if (lowerName.includes("kill") || lowerName.includes("lava") || lowerName.includes("acid") || lowerName.includes("spike")) {
      interactiveParts.push({ type: "kill", mesh: partHolder, canCollide, halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2) });
    } else if (lowerName.includes("jump") || lowerName.includes("bounce") || lowerName.includes("pad")) {
      interactiveParts.push({ type: "jump", mesh: partHolder, canCollide, halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2), boost: 85 });
    } else if (lowerName.includes("speed") || lowerName.includes("boost")) {
      interactiveParts.push({ type: "speed", mesh: partHolder, canCollide, halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2), speed: 34 });
    }

    if (meshUrl && /^https?:\/\//i.test(meshUrl) && meshUrl.toLowerCase().endsWith(".glb")) {
      gltfLoader.load(
        meshUrl,
        (gltf) => {
          while (partHolder.children.length > 0) partHolder.remove(partHolder.children[0]);
          const mScene = gltf.scene;
          mScene.scale.set(sx / 2, sy / 2, sz / 2);
          partHolder.add(mScene);
        },
        undefined,
        () => {}
      );
    }
  }

  for (const child of Array.from(item.children)) {
    if (child.tagName === "Item") {
      processStudioItem(child, parentGroup, defaultSpawnPosRef, worldItemsCollector);
    }
  }
}

const playerPos = new THREE.Vector3(0, 0.5, 0);
const playerVel = new THREE.Vector3(0, 0, 0);
let playerYaw = 0;
let isGrounded = false;
let isJumping = false;
let isAttacking = false;
let attackTimer = 0;
let currentSpawn = { x: 0, y: 0.5, z: 0 };
let speedBoostTimer = 0;

let floorCacheTime = 0;
let cachedFloorBoxes = [];

function invalidateFloorCache() {
  floorCacheTime = 0;
  cachedFloorBoxes = [];
}

function syncLocalAvatarTransform() {
  if (!localAvatarInst) return;
  attachCameraDirectlyToGlbTorso(localAvatarInst);
  localAvatarInst.container.position.set(playerPos.x, playerPos.y + localAvatarInst.footOffset, playerPos.z);
  localAvatarInst.container.rotation.y = playerYaw;
}

function respawnLocalPlayer() {
  const footOff = localAvatarInst ? localAvatarInst.footOffset : 0.05;
  playerPos.set(currentSpawn.x, currentSpawn.y + footOff + 0.5, currentSpawn.z);
  playerVel.set(0, 0, 0);
  isGrounded = false;
  isJumping = false;
  speedBoostTimer = 0;
  syncLocalAvatarTransform();
  broadcastSelfState();
}

function loadPlaceXmlString(xmlText, gameRow = null) {
  clearWorldGroup();
  invalidateFloorCache();
  imageAssetMap.clear();
  registerImagesFromXmlOrRow(xmlText, gameRow);
  pickupItems = [];
  interactiveParts = [];
  dynamicParts = [];
  queuedScripts = [];
  backpackItems = [];
  equippedIndex = -1;
  applyToolVisualToRig(localAvatarInst, "");
  renderHotbar();

  studioConfig.gravity = 196.2;
  studioConfig.walkSpeed = 16;
  studioConfig.jumpPower = 50;
  studioConfig.ambientColor = 0xffffff;
  studioConfig.outdoorAmbientColor = 0x87c6ff;
  studioConfig.fogColor = 0x87c6ff;
  studioConfig.fogStart = 80;
  studioConfig.fogEnd = 260;
  updateSkyAndLighting();

  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "application/xml");
  const rootItems = Array.from(doc.documentElement ? doc.documentElement.children : []).filter((c) => c.tagName === "Item");
  const spawnRef = { set: false, x: 0, y: 0.5, z: 0 };

  rootItems.forEach((item) => {
    processStudioItem(item, worldGroup, spawnRef, pickupItems);
  });

  if (spawnRef.set) {
    currentSpawn = { x: spawnRef.x, y: spawnRef.y, z: spawnRef.z };
  } else {
    currentSpawn = { x: 0, y: 0.5, z: 0 };
  }
  respawnLocalPlayer();

  for (const sc of queuedScripts) {
    runLuauScriptSource(sc.source, sc.name);
  }
}

function looksLikeXml(raw) {
  if (typeof raw !== "string") return false;
  const s = raw.trim();
  return s.startsWith("<") && (s.includes("<Item") || s.includes("<roblox") || s.includes("<?xml"));
}

async function resolveXmlFromGameRow(place) {
  let row = place;

  if (place && place.id !== undefined && place.id !== null) {
    const hasXml = typeof place.xml === "string" && place.xml.trim().length > 0;
    if (!hasXml) {
      try {
        const { data, error } = await sb
          .from("games")
          .select("*")
          .eq("id", place.id)
          .limit(1);
        if (!error && Array.isArray(data) && data[0]) {
          row = { ...place, ...data[0] };
        }
      } catch (_) {}
    }
  }

  if (row && typeof row.xml === "string" && row.xml.trim()) {
    const trimmedXml = row.xml.trim();
    if (looksLikeXml(trimmedXml)) {
      return { xml: trimmedXml, row };
    }
    if (/^https?:\/\//i.test(trimmedXml)) {
      try {
        const res = await fetch(trimmedXml);
        if (res.ok) {
          const fetched = await res.text();
          if (looksLikeXml(fetched)) return { xml: fetched.trim(), row };
        }
      } catch (_) {}
    }
  }

  if (row && typeof row.file_url === "string" && /^https?:\/\//i.test(row.file_url.trim())) {
    try {
      const res = await fetch(row.file_url.trim());
      if (res.ok) {
        const fetched = await res.text();
        if (looksLikeXml(fetched)) return { xml: fetched.trim(), row };
      }
    } catch (_) {}
  }

  return {
    xml: `<?xml version="1.0" encoding="utf-8"?>
<roblox version="4">
  <Item class="Workspace">
    <Properties>
      <string name="Name">Workspace</string>
      <float name="Gravity">196.2</float>
    </Properties>
    <Item class="SpawnLocation">
      <Properties>
        <string name="Name">SpawnLocation</string>
        <Vector3 name="Size"><X>8</X><Y>1</Y><Z>8</Z></Vector3>
        <CoordinateFrame name="CFrame"><X>0</X><Y>0.5</Y><Z>0</Z></CoordinateFrame>
        <bool name="Anchored">true</bool>
        <bool name="CanCollide">true</bool>
      </Properties>
    </Item>
    <Item class="Part">
      <Properties>
        <string name="Name">ClassicBrick</string>
        <Vector3 name="Size"><X>6</X><Y>4</Y><Z>6</Z></Vector3>
        <CoordinateFrame name="CFrame"><X>10</X><Y>2</Y><Z>-10</Z></CoordinateFrame>
        <int name="BrickColor">21</int>
        <bool name="Anchored">true</bool>
        <bool name="CanCollide">true</bool>
      </Properties>
    </Item>
  </Item>
</roblox>`,
    row
  };
}

function addOrUpdateRemotePlayer(id, payload) {
  if (!id || id === peerId) return;
  let rp = remotePlayers.get(id);
  if (!rp) {
    const tpl = cachedAvatarTemplate || buildFallbackRobloxRig();
    const avatarInst = createAnimatedAvatarInstance(tpl, payload.name || "Player");
    remotePlayersGroup.add(avatarInst.container);
    const footOff = avatarInst.footOffset || 0.05;
    const px = payload.x ?? 0;
    const py = (payload.y ?? 0.5) + footOff;
    const pz = payload.z ?? 0;
    avatarInst.container.position.set(px, py, pz);
    rp = {
      id,
      name: payload.name || "Player",
      avatarInst,
      footOffset: footOff,
      targetPos: new THREE.Vector3(px, py, pz),
      targetYaw: payload.yaw ?? 0,
      speedRatio: payload.speedRatio ?? 0,
      isGrounded: payload.isGrounded ?? true,
      isJumping: payload.isJumping ?? false,
      isAttacking: payload.isAttacking ?? false,
      toolName: payload.toolName || "",
      lastSeen: Date.now()
    };
    remotePlayers.set(id, rp);
    addChat("System", (payload.name || "Player") + " joined the server.");
    updateLeaderboard();
  } else {
    rp.name = payload.name || rp.name;
    rp.targetPos.set(
      payload.x ?? (rp.targetPos.x),
      (payload.y ?? (rp.targetPos.y - rp.footOffset)) + rp.footOffset,
      payload.z ?? (rp.targetPos.z)
    );
    rp.targetYaw = payload.yaw ?? rp.targetYaw;
    rp.speedRatio = payload.speedRatio ?? 0;
    rp.isGrounded = payload.isGrounded ?? true;
    rp.isJumping = payload.isJumping ?? false;
    rp.isAttacking = payload.isAttacking ?? false;
    rp.lastSeen = Date.now();
    if ((payload.toolName || "") !== rp.avatarInst.equippedToolName) {
      applyToolVisualToRig(rp.avatarInst, payload.toolName || "");
    }
  }
}

function removeRemotePlayer(id) {
  const rp = remotePlayers.get(id);
  if (!rp) return;
  remotePlayersGroup.remove(rp.avatarInst.container);
  remotePlayers.delete(id);
  addChat("System", (rp.name || "Player") + " left the server.");
  updateLeaderboard();
}

async function discoverAndJoinMultiplayerServer(targetPlaceId) {
  if (activeChannel) {
    channelSubscribed = false;
    try { await sb.removeChannel(activeChannel); } catch (_) {}
    activeChannel = null;
  }
  remotePlayers.forEach((_, id) => removeRemotePlayer(id));
  remotePlayers.clear();

  const cleanPlace = targetPlaceId || "default";
  serverRoleLabel.textContent = "finding server...";

  const candidateServers = [0, 1, 2, 3, 4].map((idx) => `bloxtip_${cleanPlace}_srv_${idx}`);
  let chosenServerId = activeServerId || "";
  let chosenIsHost = false;

  if (!chosenServerId) {
    for (const srvName of candidateServers) {
      const checkRes = await new Promise((resolve) => {
        const probe = sb.channel(srvName, { config: { presence: { key: peerId } } });
        let settled = false;
        const finish = (val) => {
          if (!settled) {
            settled = true;
            sb.removeChannel(probe).catch(() => {});
            resolve(val);
          }
        };
        setTimeout(() => finish({ exists: false, count: 0 }), 700);
        probe.on("presence", { event: "sync" }, () => {
          const st = probe.presenceState();
          const count = Object.keys(st).length;
          finish({ exists: count > 0, count });
        });
        probe.subscribe((status) => {
          if (status === "SUBSCRIBED") {
            setTimeout(() => {
              const st = probe.presenceState();
              const count = Object.keys(st).length;
              finish({ exists: count > 0, count });
            }, 350);
          }
        });
      });

      if (checkRes.exists && checkRes.count < MAX_SERVER_PLAYERS) {
        chosenServerId = srvName;
        chosenIsHost = false;
        break;
      }
    }
  }

  if (!chosenServerId) {
    chosenServerId = candidateServers[0];
    chosenIsHost = true;
  }

  activeServerId = chosenServerId;
  isHost = chosenIsHost;
  hostId = isHost ? peerId : "";
  channelSubscribed = false;

  const ch = sb.channel(chosenServerId, {
    config: {
      presence: { key: peerId },
      broadcast: { ack: false }
    }
  });

  ch.on("presence", { event: "sync" }, () => {
    const state = ch.presenceState();
    const keys = Object.keys(state).sort();
    if (keys.length > 0 && keys[0] === peerId) {
      isHost = true;
      hostId = peerId;
    } else if (keys.length > 0) {
      isHost = false;
      hostId = keys[0];
    }
    serverRoleLabel.textContent = isHost ? `Host (${chosenServerId})` : `Multiplayer (${chosenServerId})`;

    keys.forEach((k) => {
      if (k !== peerId && !remotePlayers.has(k)) {
        const meta = (state[k] && state[k][0]) || {};
        addOrUpdateRemotePlayer(k, {
          name: meta.name || ("Player_" + k.slice(-4)),
          x: meta.x ?? 0,
          y: meta.y ?? 0.5,
          z: meta.z ?? 0,
          yaw: meta.yaw ?? 0
        });
      }
    });

    remotePlayers.forEach((_, k) => {
      if (!state[k]) removeRemotePlayer(k);
    });
    updateLeaderboard();
  });

  ch.on("presence", { event: "leave" }, ({ key }) => {
    if (key !== peerId) removeRemotePlayer(key);
  });

  ch.on("broadcast", { event: "state" }, ({ payload }) => {
    if (!payload || payload.peerId === peerId) return;
    addOrUpdateRemotePlayer(payload.peerId, payload);
  });

  ch.on("broadcast", { event: "chat" }, ({ payload }) => {
    if (!payload || payload.peerId === peerId) return;
    addChat(payload.sender || "Player", payload.text || "");
  });

  activeChannel = ch;
  ch.subscribe(async (status) => {
    if (status === "SUBSCRIBED") {
      channelSubscribed = true;
      await ch.track({
        name: username,
        x: playerPos.x,
        y: playerPos.y,
        z: playerPos.z,
        yaw: playerYaw
      });
      serverRoleLabel.textContent = isHost ? `Host (${chosenServerId})` : `Multiplayer (${chosenServerId})`;
      updateLeaderboard();
      broadcastSelfState();
    } else if (status === "CLOSED" || status === "CHANNEL_ERROR") {
      channelSubscribed = false;
    }
  });
}

async function selectAndLaunchGame(gameOrId) {
  const titleText = typeof gameOrId === "object" && gameOrId !== null
    ? String(gameOrId.title || gameOrId.name || "Loading Game...")
    : "Loading Game...";
  showLoading("Loading " + titleText, "Reading xml column from games table...");

  try {
    if (!gamesCache || gamesCache.length === 0) {
      await loadGamesList();
    }
    const targetId = typeof gameOrId === "object" && gameOrId !== null
      ? String(gameOrId.id ?? "")
      : String(gameOrId ?? "");
    const chosen = (typeof gameOrId === "object" && gameOrId !== null)
      ? gameOrId
      : (gamesCache.find((g) => String(g.id) === targetId) || gamesCache[0] || { id: targetId || "default", title: "Baseplate" });

    placeId = String(chosen.id ?? targetId ?? "default");
    activeServerId = "";

    updateLoadingStatus("Fetching xml for " + (chosen.title || chosen.name || placeId) + "...");
    const { xml, row } = await resolveXmlFromGameRow(chosen);

    updateLoadingStatus("Building 3D world from XML...");
    loadPlaceXmlString(xml, row);

    updateLoadingStatus("Connecting to multiplayer server...");
    await discoverAndJoinMultiplayerServer(placeId);
  } finally {
    setTimeout(() => hideLoading(), 220);
  }
}
