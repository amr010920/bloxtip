function buildFallbackRobloxRig() {
  const rig = new THREE.Group();

  const torsoMat = new THREE.MeshStandardMaterial({ color: 0x0d69ac, roughness: 0.5 });

  const armMat = new THREE.MeshStandardMaterial({ color: 0xf5cd30, roughness: 0.5 });

  const root = new THREE.Group();
  root.name = "HumanoidRootPart";
  rig.add(root);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
  torso.name = "Torso";
  torso.position.set(0, 3, 0);
  torso.castShadow = true;
  torso.receiveShadow = true;
  root.add(torso);

  const headPivot = new THREE.Group();

  headPivot.position.set(0, 4.6, 0);

  head.name = "Head";
  head.castShadow = true;
  headPivot.add(head);
  root.add(headPivot);

  const leftArmPivot = new THREE.Group();
  leftArmPivot.name = "LeftShoulder";
  leftArmPivot.position.set(-1.5, 3.5, 0);
  const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
  leftArm.name = "Left Arm";
  leftArm.position.set(0, -0.5, 0);
  leftArm.castShadow = true;
  leftArmPivot.add(leftArm);
  root.add(leftArmPivot);

  const rightArmPivot = new THREE.Group();
  rightArmPivot.name = "RightShoulder";
  rightArmPivot.position.set(1.5, 3.5, 0);
  const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
  rightArm.name = "Right Arm";
  rightArm.position.set(0, -0.5, 0);
  rightArm.castShadow = true;
  rightArmPivot.add(rightArm);
  root.add(rightArmPivot);

  const leftLegPivot = new THREE.Group();
  leftLegPivot.name = "LeftHip";
  leftLegPivot.position.set(-0.5, 2, 0);
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), limbMat);
  leftLeg.name = "Left Leg";
  leftLeg.position.set(0, -1, 0);
  leftLeg.castShadow = true;
  leftLegPivot.add(leftLeg);
  root.add(leftLegPivot);

  const rightLegPivot = new THREE.Group();
  rightLegPivot.name = "RightHip";
  rightLegPivot.position.set(0.5, 2, 0);
  const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), limbMat);
  rightLeg.name = "Right Leg";
  rightLeg.position.set(0, -1, 0);
  rightLeg.castShadow = true;

  root.add(rightLegPivot);

  return {
    scene: rig,
    clips: [],
    root,
    headPivot,
    leftArmPivot,

    leftLegPivot,
    rightLegPivot,
    footOffset: 0.05,

    isFallback: true
  };
}

function extractRigParts(obj) {
  let root = null;
  let headPivot = null;
  let leftArmPivot = null;
  let rightArmPivot = null;
  let leftLegPivot = null;
  let rightLegPivot = null;

  obj.traverse((node) => {
    node.castShadow = true;
    node.receiveShadow = true;
    const n = (node.name || "").toLowerCase();
    if (!root && (n.includes("humanoidrootpart") || n.includes("root") || n.includes("torso") || n.includes("hips"))) {
      root = node;
    }
    if (!headPivot && n.includes("head")) headPivot = node;
    if (!leftArmPivot && (n.includes("leftarm") || n.includes("left_arm") || n.includes("left arm") || n.includes("leftshoulder") || n.includes("left upper arm"))) {
      leftArmPivot = node;
    }
    if (!rightArmPivot && (n.includes("rightarm") || n.includes("right_arm") || n.includes("right arm") || n.includes("rightshoulder") || n.includes("right upper arm"))) {
      rightArmPivot = node;
    }
    if (!leftLegPivot && (n.includes("leftleg") || n.includes("left_leg") || n.includes("left leg") || n.includes("lefthip") || n.includes("left upper leg"))) {
      leftLegPivot = node;
    }
    if (!rightLegPivot && (n.includes("rightleg") || n.includes("right_leg") || n.includes("right leg") || n.includes("righthip") || n.includes("right upper leg"))) {
      rightLegPivot = node;
    }
  });

  if (!root) root = obj;
  return { root, headPivot, leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot };
}

function loadAvatarTemplate(glbUrl = AVATAR_GLB_URL) {
  if (glbUrl === AVATAR_GLB_URL && cachedAvatarTemplate) {
    return Promise.resolve(cachedAvatarTemplate);
  }
  if (glbUrl === AVATAR_GLB_URL && avatarTemplatePromise) {
    return avatarTemplatePromise;
  }

  const p = new Promise((resolve) => {
    gltfLoader.load(
      glbUrl,
      (gltf) => {
        const rawBox = new THREE.Box3().setFromObject(gltf.scene);
        const rawSize = new THREE.Vector3();
        rawBox.getSize(rawSize);
        const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z, 0.001);
        const targetHeight = 5.0;
        const scaleFactor = rawSize.y > 0.01 ? (targetHeight / rawSize.y) : (targetHeight / maxDim);
        gltf.scene.scale.multiplyScalar(scaleFactor);

        gltf.scene.updateMatrixWorld(true);
        const scaledBox = new THREE.Box3().setFromObject(gltf.scene);
        const minY = Number.isFinite(scaledBox.min.y) ? scaledBox.min.y : 0;
        const maxY = Number.isFinite(scaledBox.max.y) ? scaledBox.max.y : targetHeight;
        const footOffset = Math.max(0.05, -minY + 0.05);
        const height = Math.max(1.0, maxY - minY);

        const parts = extractRigParts(gltf.scene);
        const result = {
          scene: gltf.scene,
          clips: gltf.animations || [],
          ...parts,
          footOffset,
          height,
          isFallback: false
        };
        if (glbUrl === AVATAR_GLB_URL) {
          cachedAvatarTemplate = result;
        }
        resolve(result);
      },
      undefined,
      () => {
        const fallback = buildFallbackRobloxRig();
        if (glbUrl === AVATAR_GLB_URL) {
          cachedAvatarTemplate = fallback;
        }
        resolve(fallback);
      }
    );
  });

  if (glbUrl === AVATAR_GLB_URL) {
    avatarTemplatePromise = p;
  }
  return p;
}

function createNameplateSprite(name, topY = 5.6) {
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 64;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
  ctx.fillRect(16, 12, 224, 40);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px Segoe UI, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(name, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4.5, 1.15, 1);
  sprite.position.set(0, topY, 0);
  return sprite;
}

function createAnimatedAvatarInstance(template, playerName) {
  const container = new THREE.Group();
  const cloned = template.scene.clone(true);
  container.add(cloned);

  const parts = extractRigParts(cloned);
  const mixer = (template.clips && template.clips.length > 0) ? new THREE.AnimationMixer(cloned) : null;
  const actions = {};

  if (mixer && template.clips.length > 0) {
    template.clips.forEach((clip, idx) => {
      const action = mixer.clipAction(clip);
      actions[clip.name.toLowerCase()] = action;
      if (idx === 0) {
        action.play();
      }
    });
  }

  const height = template.height || 5.0;
  const nameplate = createNameplateSprite(playerName, height + 0.8);
  container.add(nameplate);

  const heldMount = new THREE.Group();
  heldMount.position.set(0, -1.0, -0.4);
  if (parts.rightArmPivot) {
    parts.rightArmPivot.add(heldMount);
  } else {
    container.add(heldMount);
  }

  return {
    container,
    cloned,
    parts,
    mixer,
    actions,
    heldMount,
    footOffset: template.footOffset || 0.05,
    height,
    animTime: 0,
    equippedToolName: ""
  };
}

function stepAvatarAnimation(avatarInst, dt, speedRatio, isGrounded, isJumping, isAttacking) {
  if (!avatarInst) return;
  avatarInst.animTime += dt * (1 + speedRatio * 5.5);

  if (avatarInst.mixer) {
    avatarInst.mixer.update(dt);
  }

  const { leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot, headPivot } = avatarInst.parts || {};
  const t = avatarInst.animTime;

  if (!isGrounded || isJumping) {
    if (leftArmPivot) leftArmPivot.rotation.x = THREE.MathUtils.lerp(leftArmPivot.rotation.x, -2.5, dt * 12);
    if (rightArmPivot) rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, -2.5, dt * 12);
    if (leftLegPivot) leftLegPivot.rotation.x = THREE.MathUtils.lerp(leftLegPivot.rotation.x, -0.5, dt * 12);
    if (rightLegPivot) rightLegPivot.rotation.x = THREE.MathUtils.lerp(rightLegPivot.rotation.x, 0.5, dt * 12);
  } else if (speedRatio > 0.08) {
    const swing = Math.sin(t * 2.2) * 0.85 * Math.min(1, speedRatio);
    if (leftLegPivot) leftLegPivot.rotation.x = THREE.MathUtils.lerp(leftLegPivot.rotation.x, swing, dt * 16);
    if (rightLegPivot) rightLegPivot.rotation.x = THREE.MathUtils.lerp(rightLegPivot.rotation.x, -swing, dt * 16);
    if (leftArmPivot) leftArmPivot.rotation.x = THREE.MathUtils.lerp(leftArmPivot.rotation.x, -swing * 0.9, dt * 16);
    if (!avatarInst.equippedToolName && rightArmPivot) {
      rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, swing * 0.9, dt * 16);
    }
  } else {
    const breathe = Math.sin(t * 0.6) * 0.06;
    if (leftLegPivot) leftLegPivot.rotation.x = THREE.MathUtils.lerp(leftLegPivot.rotation.x, 0, dt * 12);
    if (rightLegPivot) rightLegPivot.rotation.x = THREE.MathUtils.lerp(rightLegPivot.rotation.x, 0, dt * 12);
    if (leftArmPivot) leftArmPivot.rotation.x = THREE.MathUtils.lerp(leftArmPivot.rotation.x, breathe, dt * 12);
    if (!avatarInst.equippedToolName && rightArmPivot) {
      rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, -breathe, dt * 12);
    }
  }

  if (avatarInst.equippedToolName && rightArmPivot) {
    const targetArmX = isAttacking ? -0.35 : -1.35;
    rightArmPivot.rotation.x = THREE.MathUtils.lerp(rightArmPivot.rotation.x, targetArmX, dt * 18);
  }

  if (headPivot) {
    headPivot.rotation.y = Math.sin(t * 0.35) * 0.08;
  }
}

function clearWorldGroup() {
  while (worldGroup.children.length > 0) {
    worldGroup.remove(worldGroup.children[0]);
  }
}

function readNum(parent, tagName, fallback) {
  if (!parent) return fallback;
  const el = parent.getElementsByTagName(tagName)[0];
  if (!el) return fallback;
  const n = Number(el.textContent);
  return Number.isFinite(n) ? n : fallback;
}

function readStr(parent, propName, fallback = "") {
  if (!parent) return fallback;
  for (const el of Array.from(parent.children)) {
    if (el.getAttribute("name") === propName) return el.textContent ?? fallback;
  }
  return fallback;
}

function readBool(parent, propName, fallback = false) {
  const raw = readStr(parent, propName, "");
  if (!raw) return fallback;
  const s = raw.trim().toLowerCase();
  if (s === "true" || s === "1") return true;
  if (s === "false" || s === "0") return false;
  return fallback;
}

function findPropElement(parent, propName) {
  if (!parent) return null;
  for (const el of Array.from(parent.children)) {
    if (el.getAttribute("name") === propName) return el;
  }
  return null;
}

function parseColor3Value(propEl, fallbackHex = 0x00a2ff) {
  if (!propEl) return fallbackHex;
  const rEl = propEl.getElementsByTagName("R")[0];
  const gEl = propEl.getElementsByTagName("G")[0];
  const bEl = propEl.getElementsByTagName("B")[0];
  if (rEl && gEl && bEl) {
    let r = Number(rEl.textContent);
    let g = Number(gEl.textContent);
    let b = Number(bEl.textContent);
    if (Number.isFinite(r) && Number.isFinite(g) && Number.isFinite(b)) {
      if (r <= 1.001 && g <= 1.001 && b <= 1.001) {
        r = Math.round(Math.max(0, Math.min(1, r)) * 255);
        g = Math.round(Math.max(0, Math.min(1, g)) * 255);
        b = Math.round(Math.max(0, Math.min(1, b)) * 255);
      } else {
        r = Math.round(Math.max(0, Math.min(255, r)));
        g = Math.round(Math.max(0, Math.min(255, g)));
        b = Math.round(Math.max(0, Math.min(255, b)));
      }
      return (r << 16) | (g << 8) | b;
    }
  }
  const uintEl = propEl.getElementsByTagName("uint")[0] || propEl.getElementsByTagName("int")[0];
  if (uintEl) {
    const val = Number(uintEl.textContent);
    if (Number.isFinite(val) && val >= 0) {
      if (val > 0xffffff) return val & 0xffffff;
      return val;
    }
  }
  const txt = (propEl.textContent || "").trim();
  if (/^#?[0-9a-fA-F]{6}$/.test(txt)) {
    return parseInt(txt.replace("#", ""), 16);
  }
  const num = Number(txt);
  if (Number.isFinite(num) && num >= 0) {
    return num > 0xffffff ? (num & 0xffffff) : num;
  }
  return fallbackHex;
}

function parseColorFromProps(props, fallbackHex = 0x00a2ff) {
  const color3Prop = findPropElement(props, "Color3") || findPropElement(props, "color3");
  if (color3Prop) return parseColor3Value(color3Prop, fallbackHex);

  const colorProp = findPropElement(props, "Color") || findPropElement(props, "color");
  if (colorProp) {
    const c3 = parseColor3Value(colorProp, null);
    if (c3 !== null) return c3;
  }

  const brickProp = findPropElement(props, "BrickColor") || findPropElement(props, "brickcolor");
  if (brickProp) {
    const code = Number((brickProp.textContent || "").trim());
    if (Number.isFinite(code) && BRICK_COLORS[code] !== undefined) {
      return BRICK_COLORS[code];
    }
  }

  const colorStr = readStr(props, "Color", "") || readStr(props, "BrickColor", "");
  if (colorStr) {
    const num = Number(colorStr.trim());
    if (Number.isFinite(num)) {
      if (BRICK_COLORS[num] !== undefined) return BRICK_COLORS[num];
      if (num >= 0) return num > 0xffffff ? (num & 0xffffff) : num;
    }
    if (/^#?[0-9a-fA-F]{6}$/.test(colorStr.trim())) {
      return parseInt(colorStr.trim().replace("#", ""), 16);
    }
  }
  return fallbackHex;
}

function parseCFrameMatrix(cfEl) {
  const fallback = {
    x: 0, y: 2, z: -12,
    matrix4: new THREE.Matrix4().identity()
  };
  if (!cfEl) return fallback;

  const x = readNum(cfEl, "X", 0);
  const y = readNum(cfEl, "Y", 2);
  const z = readNum(cfEl, "Z", -12);

  const r00 = readNum(cfEl, "R00", null);
  const r01 = readNum(cfEl, "R01", null);
  const r02 = readNum(cfEl, "R02", null);
  const r10 = readNum(cfEl, "R10", null);
  const r11 = readNum(cfEl, "R11", null);
  const r12 = readNum(cfEl, "R12", null);
  const r20 = readNum(cfEl, "R20", null);
  const r21 = readNum(cfEl, "R21", null);
  const r22 = readNum(cfEl, "R22", null);

  const m = new THREE.Matrix4();
  if (
    r00 !== null && r01 !== null && r02 !== null &&
    r10 !== null && r11 !== null && r12 !== null &&
    r20 !== null && r21 !== null && r22 !== null
  ) {
    m.set(
      r00, r01, r02, x,
      r10, r11, r12, y,
      r20, r21, r22, z,
      0,   0,   0,   1
    );
  } else {
    m.makeTranslation(x, y, z);
  }

  return { x, y, z, matrix4: m };
}

function getPartShape(item, props, cls) {
  if (cls === "WedgePart") return "Wedge";
  if (cls === "Cylinder" || cls === "CylinderPart") return "Cylinder";
  if (cls === "Ball" || cls === "SpherePart") return "Ball";
  if (cls === "TrussPart") return "Truss";
  if (cls === "CornerWedgePart") return "CornerWedge";

  const shapeProp = findPropElement(props, "shape") || findPropElement(props, "Shape");
  if (shapeProp) {
    const txt = (shapeProp.textContent || "").trim();
    const num = Number(txt);
    if (Number.isFinite(num)) {
      if (num === 0) return "Ball";
      if (num === 1) return "Block";
      if (num === 2) return "Cylinder";
      if (num === 3) return "Wedge";
      if (num === 4) return "CornerWedge";
    }
    const lower = txt.toLowerCase();
    if (lower.includes("cyl")) return "Cylinder";
    if (lower.includes("ball") || lower.includes("sphere")) return "Ball";
    if (lower.includes("wedge") && lower.includes("corner")) return "CornerWedge";
    if (lower.includes("wedge")) return "Wedge";
  }

  const childItems = Array.from(item.children).filter((c) => c.tagName === "Item");
  for (const ch of childItems) {
    const cCls = ch.getAttribute("class");
    if (cCls === "CylinderMesh") return "Cylinder";
    if (cCls === "SpecialMesh") {
      const cProps = findPropElement(ch, "Properties") || ch.firstElementChild;
      const mType = readStr(cProps, "MeshType", "");
      const mNum = Number(mType.trim());
      if (mNum === 0) return "Head";
      if (mNum === 1) return "Torso";
      if (mNum === 2) return "Wedge";
      if (mNum === 3) return "Sphere";
      if (mNum === 4) return "Cylinder";
      if (mNum === 5) return "FileMesh";
      if (mNum === 6) return "Brick";
      const mLower = mType.toLowerCase();
      if (mLower.includes("cyl")) return "Cylinder";
      if (mLower.includes("sphere") || mLower.includes("ball")) return "Ball";
      if (mLower.includes("wedge")) return "Wedge";
      if (mLower.includes("file")) return "FileMesh";
    }
  }

  return "Block";
}

function createWedgeGeometry(sx, sy, sz) {
  const shape = new THREE.Shape();
  shape.moveTo(-sz / 2, -sy / 2);
  shape.lineTo(sz / 2, -sy / 2);
  shape.lineTo(sz / 2, sy / 2);
  shape.closePath();

  const geom = new THREE.ExtrudeGeometry(shape, {
    depth: sx,
    bevelEnabled: false
  });
  geom.translate(0, 0, -sx / 2);
  geom.rotateY(-Math.PI / 2);
  return geom;
}

function createCornerWedgeGeometry(sx, sy, sz) {
  const geom = new THREE.BufferGeometry();
  const hx = sx / 2, hy = sy / 2, hz = sz / 2;
  const vertices = new Float32Array([
    -hx, -hy, -hz,   hx, -hy, -hz,   hx, -hy,  hz,
    -hx, -hy, -hz,   hx, -hy,  hz,  -hx, -hy,  hz,
    -hx, -hy, -hz,  -hx,  hy, -hz,   hx, -hy, -hz,
    -hx, -hy, -hz,  -hx, -hy,  hz,  -hx,  hy, -hz,
    -hx,  hy, -hz,  -hx, -hy,  hz,   hx, -hy, -hz,
     hx, -hy, -hz,  -hx, -hy,  hz,   hx, -hy,  hz
  ]);
  geom.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geom.computeVertexNormals();
  return geom;
}

function buildGeometryForPart(shape, sx, sy, sz) {
  const w = Math.max(0.05, sx);
  const h = Math.max(0.05, sy);
  const d = Math.max(0.05, sz);

  if (shape === "Cylinder") {
    const radius = Math.max(0.025, Math.min(h, d) / 2);
    const cyl = new THREE.CylinderGeometry(radius, radius, w, 28, 1, false);
    cyl.rotateZ(-Math.PI / 2);
    return cyl;
  }
  if (shape === "Ball" || shape === "Sphere") {
    const r = Math.max(0.025, Math.min(w, h, d) / 2);
    return new THREE.SphereGeometry(r, 24, 18);
  }
  if (shape === "Wedge") {
    return createWedgeGeometry(w, h, d);
  }
  if (shape === "CornerWedge") {
    return createCornerWedgeGeometry(w, h, d);
  }
  if (shape === "Truss") {
    const g = new THREE.Group();
    const railGeo = new THREE.BoxGeometry(0.25, h, 0.25);
    const mat = new THREE.MeshStandardMaterial({ color: 0x8a929a });
    const offsets = [
      [-w / 2 + 0.125, -d / 2 + 0.125],
      [w / 2 - 0.125, -d / 2 + 0.125],
      [-w / 2 + 0.125, d / 2 - 0.125],
      [w / 2 - 0.125, d / 2 - 0.125]
    ];
    offsets.forEach(([ox, oz]) => {
      const post = new THREE.Mesh(railGeo, mat);
      post.position.set(ox, 0, oz);
      g.add(post);
    });
    const rungCount = Math.max(1, Math.floor(h / 2));
    for (let i = 0; i <= rungCount; i++) {
      const ry = -h / 2 + (i / rungCount) * h;
      const rung1 = new THREE.Mesh(new THREE.BoxGeometry(w, 0.16, 0.16), mat);
      rung1.position.set(0, ry, 0);
      g.add(rung1);
    }
    return g;
  }
  return new THREE.BoxGeometry(w, h, d);
}

const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin("anonymous");

function materialPropsFromRoblox(props, colorHex, texUrl) {
  const transparency = Math.max(0, Math.min(1, readNum(props, "Transparency", 0)));
  const reflectance = Math.max(0, Math.min(1, readNum(props, "Reflectance", 0)));
  const matName = (readStr(props, "Material", "") || "").toLowerCase();

  let roughness = 0.65;
  let metalness = Math.min(0.9, reflectance * 0.85);
  let emissive = 0x000000;
  let emissiveIntensity = 0;

  if (matName.includes("neon")) {
    roughness = 0.2;
    emissive = colorHex;
    emissiveIntensity = 0.85;
  } else if (matName.includes("metal") || matName.includes("diamondplate") || matName.includes("foil") || matName.includes("corrugated")) {
    roughness = 0.28;
    metalness = Math.max(metalness, 0.72);
  } else if (matName.includes("glass")) {
    roughness = 0.08;
    metalness = 0.1;
  } else if (matName.includes("smoothplastic") || matName.includes("plastic")) {
    roughness = 0.42;
  } else if (matName.includes("wood")) {
    roughness = 0.78;
  } else if (matName.includes("grass") || matName.includes("sand") || matName.includes("brick") || matName.includes("stone") || matName.includes("rock") || matName.includes("concrete")) {
    roughness = 0.88;
  }

  const opts = {
    color: texUrl ? 0xffffff : colorHex,
    roughness,
    metalness,
    emissive,
    emissiveIntensity
  };

  if (transparency > 0.001) {
    opts.transparent = true;
    opts.opacity = 1 - transparency;
  }

  if (texUrl) {
    const tex = textureLoader.load(texUrl);
    tex.colorSpace = THREE.SRGBColorSpace;
    opts.map = tex;
  }

  return new THREE.MeshStandardMaterial(opts);
}

function extractTextureOrMeshUrl(item, props) {
  let texUrl = readStr(props, "TextureUrl", "") || readStr(props, "Texture", "") || readStr(props, "Image", "");
  let meshUrl = "";

  for (const child of Array.from(item.children)) {
    if (child.tagName !== "Item") continue;
    const cCls = child.getAttribute("class");
    const cProps = findPropElement(child, "Properties") || child.firstElementChild;
    if (!cProps) continue;

    if (cCls === "Decal" || cCls === "Texture") {
      const dUrl = readStr(cProps, "Texture", "") || readStr(cProps, "TextureUrl", "");
      if (dUrl && !texUrl) texUrl = dUrl;
    } else if (cCls === "SpecialMesh" || cCls === "FileMesh") {
      const mTex = readStr(cProps, "TextureId", "") || readStr(cProps, "Texture", "");
      const mId = readStr(cProps, "MeshId", "");
      if (mTex && !texUrl) texUrl = mTex;
      if (mId) meshUrl = mId;
    }
  }
  return { texUrl, meshUrl };
}

function attachLightsFromItem(item, targetGroup) {
  for (const child of Array.from(item.children)) {
    if (child.tagName !== "Item") continue;
    const cCls = child.getAttribute("class");
    const cProps = findPropElement(child, "Properties") || child.firstElementChild;
    if (!cProps) continue;
    const brightness = readNum(cProps, "Brightness", 1);
    const range = readNum(cProps, "Range", 16);
    const lColor = parseColorFromProps(cProps, 0xfff5cc);

    if (cCls === "PointLight") {
      const pt = new THREE.PointLight(lColor, brightness * 1.4, range);
      targetGroup.add(pt);
    } else if (cCls === "SpotLight") {
      const angleDeg = readNum(cProps, "Angle", 90);
      const sp = new THREE.SpotLight(lColor, brightness * 1.6, range, THREE.MathUtils.degToRad(angleDeg / 2), 0.35);
      targetGroup.add(sp);
    } else if (cCls === "SurfaceLight") {
      const surf = new THREE.PointLight(lColor, brightness * 1.1, range);
      targetGroup.add(surf);
    }
  }
}

let backpackItems = [];
let equippedIndex = -1;
let pickupItems = [];
let interactiveParts = [];
let physicsParts = [];

function renderHotbar() {
  hotbarEl.innerHTML = "";
  if (backpackItems.length === 0) {
    const empty = document.createElement("div");
    empty.className = "hb-slot";
    empty.textContent = "Empty";
    hotbarEl.appendChild(empty);
    return;
  }
  backpackItems.forEach((tool, idx) => {
    const slot = document.createElement("div");
    slot.className = "hb-slot" + (idx === equippedIndex ? " active" : "");
    slot.textContent = (idx + 1) + ": " + tool.name;
    slot.addEventListener("click", () => equipBackpackSlot(idx));
    hotbarEl.appendChild(slot);
  });
}

function createVisualItemMesh(item, props) {
  const name = readStr(props, "Name", "Item");
  const colorHex = parseColorFromProps(props, 0x8d99ae);
  const { texUrl, meshUrl } = extractTextureOrMeshUrl(item, props);

  const itemRoot = new THREE.Group();
  itemRoot.name = name;

  let handlePart = null;
  const childItems = Array.from(item.children).filter((c) => c.tagName === "Item");
  for (const ch of childItems) {
    const cCls = ch.getAttribute("class") || "";
    const cProps = findPropElement(ch, "Properties") || ch.firstElementChild;
    const cName = cProps ? readStr(cProps, "Name", "") : "";
    if (cName === "Handle" || cCls === "Part" || cCls === "MeshPart" || cCls === "WedgePart" || cCls === "Cylinder") {
      handlePart = { ch, cProps, cCls };
      if (cName === "Handle") break;
    }
  }

  if (handlePart && handlePart.cProps) {
    const sEl = findPropElement(handlePart.cProps, "size") || findPropElement(handlePart.cProps, "Size");
    const sx = sEl ? Math.max(0.2, readNum(sEl, "X", 0.5)) : 0.5;
    const sy = sEl ? Math.max(0.2, readNum(sEl, "Y", 2.2)) : 2.2;
    const sz = sEl ? Math.max(0.2, readNum(sEl, "Z", 0.5)) : 0.5;
    const hColor = parseColorFromProps(handlePart.cProps, colorHex);
    const hShape = getPartShape(handlePart.ch, handlePart.cProps, handlePart.cCls);
    const hGeo = buildGeometryForPart(hShape, sx, sy, sz);
    const hMat = materialPropsFromRoblox(handlePart.cProps, hColor, texUrl);
    if (hGeo.isGroup) {
      hGeo.traverse((m) => { if (m.isMesh) m.material = hMat; });
      itemRoot.add(hGeo);
    } else {
      itemRoot.add(new THREE.Mesh(hGeo, hMat));
    }
  } else {
    const gripMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42, roughness: 0.5 });
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1.1, 12), gripMat);
    grip.position.set(0, 0.4, 0);
    itemRoot.add(grip);

    const bladeMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.0, 0.35), bladeMat);
    blade.position.set(0, 1.7, 0);
    itemRoot.add(blade);
  }

  if (meshUrl && /^https?:\/\//i.test(meshUrl) && meshUrl.toLowerCase().endsWith(".glb")) {
    gltfLoader.load(
      meshUrl,
      (gltf) => {
        while (itemRoot.children.length > 0) itemRoot.remove(itemRoot.children[0]);
        const sc = gltf.scene.clone(true);
        sc.scale.set(1.2, 1.2, 1.2);
        itemRoot.add(sc);
      },
      undefined,
      () => {}
    );
  }

  return itemRoot;
}

let localAvatarInst = null;

function applyToolVisualToRig(avatarInst, toolName, colorHex = 0xc0c8d0) {
  if (!avatarInst || !avatarInst.heldMount) return;
  while (avatarInst.heldMount.children.length > 0) {
    avatarInst.heldMount.remove(avatarInst.heldMount.children[0]);
  }
  avatarInst.equippedToolName = toolName || "";
  if (!toolName) return;

  const gripMat = new THREE.MeshStandardMaterial({ color: 0x333842, roughness: 0.5 });
  const bladeMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.25, metalness: 0.75 });
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.9, 10), gripMat);
  handle.position.set(0, 0.2, 0);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.3), bladeMat);
  blade.position.set(0, 1.4, 0);
  avatarInst.heldMount.add(handle, blade);
}

function equipBackpackSlot(index) {
  if (index === equippedIndex) {
    equippedIndex = -1;
    applyToolVisualToRig(localAvatarInst, "");
    renderHotbar();
    broadcastSelfState();
    return;
  }
  if (index < 0 || index >= backpackItems.length) return;
  equippedIndex = index;
  const tool = backpackItems[index];
  applyToolVisualToRig(localAvatarInst, tool.name, tool.colorHex || 0xc0c8d0);
  renderHotbar();
  broadcastSelfState();
}

function giveItemToBackpack(itemName, colorHex = 0xc0c8d0, autoEquip = false) {
  const existingIdx = backpackItems.findIndex((t) => t.name === itemName);
  if (existingIdx !== -1) {
    if (autoEquip) equipBackpackSlot(existingIdx);
    return;
  }
  backpackItems.push({ name: itemName || "Item", colorHex });
  renderHotbar();
  if (autoEquip || backpackItems.length === 1) {
    equipBackpackSlot(backpackItems.length - 1);
  }
}

function processStudioItem(item, parentGroup, defaultSpawnPosRef, worldItemsCollector) {
  if (!item || item.tagName !== "Item") return;
  const cls = item.getAttribute("class") || "";
  const props = findPropElement(item, "Properties") || item.firstElementChild;
  const name = props ? readStr(props, "Name", cls) : cls;

  if (cls === "Workspace" && props) {
    const gVal = readNum(props, "Gravity", null);
    if (gVal !== null && gVal > 0) studioConfig.gravity = gVal;
    const fpHeight = readNum(props, "FallenPartsDestroyHeight", null);
    if (fpHeight !== null) studioConfig.fallenPartsDestroyHeight = fpHeight;
  }

  if ((cls === "StarterPlayer" || cls === "StarterCharacterScripts") && props) {
    const ws = readNum(props, "CharacterWalkSpeed", null);
    const jp = readNum(props, "CharacterJumpPower", null);
    if (ws !== null && ws > 0) studioConfig.walkSpeed = ws;
    if (jp !== null && jp > 0) studioConfig.jumpPower = jp;
  }

  if (cls === "Lighting" && props) {
    const ambientHex = parseColorFromProps(props, null);
    if (ambientHex !== null) {
      studioConfig.ambientColor = ambientHex;
    }
    const skyHex = parseColor3Value(findPropElement(props, "OutdoorAmbient") || findPropElement(props, "FogColor"), null);
    if (skyHex !== null) {
      studioConfig.outdoorAmbientColor = skyHex;
      studioConfig.fogColor = skyHex;
      studioConfig.skyBottomColor = skyHex;
    }
    const fogEnd = readNum(props, "FogEnd", null);
    const fogStart = readNum(props, "FogStart", null);
    if (fogEnd !== null && fogEnd > 0) {
      studioConfig.fogEnd = fogEnd;
      studioConfig.fogStart = fogStart !== null ? fogStart : Math.min(40, fogEnd * 0.25);
    }
    const todStr = readStr(props, "TimeOfDay", "");
    if (todStr && todStr.includes(":")) {
      const parts = todStr.split(":").map(Number);
      if (parts.length >= 2 && Number.isFinite(parts[0]) && Number.isFinite(parts[1])) {
        studioConfig.dayTimeMinutes = parts[0] * 60 + parts[1];
      }
    }
    updateSkyAndLighting();
  }

  const isToolOrItem = (
    cls === "Tool" ||
    cls === "HopperBin" ||
    cls === "Accoutrement" ||
    cls === "Hat" ||
    cls === "Accessory"
  );

  if (isToolOrItem && props) {
    const cfEl = findPropElement(props, "CFrame") || findPropElement(props, "Grip") || findPropElement(props, "CoordinateFrame");
    const hasExplicitWorldPos = Boolean(
      cfEl && (
        cfEl.getElementsByTagName("X")[0] !== undefined ||
        cfEl.getElementsByTagName("Y")[0] !== undefined ||
        cfEl.getElementsByTagName("Z")[0] !== undefined
      )
    );
    const visual = createVisualItemMesh(item, props);
    const colorHex = parseColorFromProps(props, 0xc0c8d0);

    if (hasExplicitWorldPos) {
      const { matrix4 } = parseCFrameMatrix(cfEl);
      const posVec = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scaleVec = new THREE.Vector3();
      matrix4.decompose(posVec, quat, scaleVec);
      visual.position.copy(posVec);
      visual.quaternion.copy(quat);
      parentGroup.add(visual);
      if (worldItemsCollector) {
        worldItemsCollector.push({ name, colorHex, mesh: visual, pickupPos: posVec.clone(), collected: false });
      }
    } else {
      giveItemToBackpack(name, colorHex, backpackItems.length === 0);
    }
  }

  const isPartLike = (
    cls === "Part" ||
    cls === "SpawnLocation" ||
    cls === "WedgePart" ||
    cls === "TrussPart" ||
    cls === "CornerWedgePart" ||
    cls === "Cylinder" ||
    cls === "CylinderPart" ||
    cls === "Ball" ||
    cls === "SpherePart" ||
    cls === "MeshPart" ||
    cls === "Seat" ||
    cls === "VehicleSeat" ||
    cls === "FlagStand"
  );

  if (isPartLike && props) {
    if (name === "Baseplate") {
      const sizeEl = findPropElement(props, "size") || findPropElement(props, "Size");
      const cfEl = findPropElement(props, "CFrame");
      if (sizeEl) {
        const bx = Math.max(4, readNum(sizeEl, "X", 128));
        const by = Math.max(1, readNum(sizeEl, "Y", 2));
        const bz = Math.max(4, readNum(sizeEl, "Z", 128));
        baseplate.geometry.dispose();
        baseplate.geometry = new THREE.BoxGeometry(bx, by, bz);
      }
      if (cfEl) {
        baseplate.position.set(readNum(cfEl, "X", 0), readNum(cfEl, "Y", -1), readNum(cfEl, "Z", 0));
      }
      const bpColor = parseColorFromProps(props, null);
      if (bpColor !== null && baseplate.material) {
        baseplate.material.color.setHex(bpColor);
      }
      return;
    }

    const sizeEl = findPropElement(props, "size") || findPropElement(props, "Size");
    const sx = sizeEl ? readNum(sizeEl, "X", 4) : 4;
    const sy = sizeEl ? readNum(sizeEl, "Y", 2) : 2;
    const sz = sizeEl ? readNum(sizeEl, "Z", 4) : 4;

    const cfEl = findPropElement(props, "CFrame") || findPropElement(props, "CoordinateFrame");
    const { x: px, y: py, z: pz, matrix4 } = parseCFrameMatrix(cfEl);

    if (cls === "SpawnLocation" && !defaultSpawnPosRef.set) {
      defaultSpawnPosRef.set = true;
      defaultSpawnPosRef.x = px;
      defaultSpawnPosRef.y = py + Math.max(0.4, sy / 2 + 0.1);
      defaultSpawnPosRef.z = pz;
      spawnPad.position.set(px, py - sy / 2 + 0.2, pz);
    }

    const colorHex = parseColorFromProps(props, cls === "SpawnLocation" ? 0xd9dde2 : 0x00a2ff);
    const { texUrl, meshUrl } = extractTextureOrMeshUrl(item, props);
    const shape = getPartShape(item, props, cls);
    const geomOrGroup = buildGeometryForPart(shape, sx, sy, sz);
    const mat = materialPropsFromRoblox(props, colorHex, texUrl);
    const anchored = readBool(props, "Anchored", true);

    const partHolder = new THREE.Group();
    if (geomOrGroup.isGroup) {
      geomOrGroup.traverse((child) => {
        if (child.isMesh) {
          child.material = mat;
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      partHolder.add(geomOrGroup);
    } else {
      const mesh = new THREE.Mesh(geomOrGroup, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      partHolder.add(mesh);
    }

    const posVec = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scaleVec = new THREE.Vector3();
    matrix4.decompose(posVec, quat, scaleVec);
    partHolder.position.copy(posVec);
    partHolder.quaternion.copy(quat);

    attachLightsFromItem(item, partHolder);
    parentGroup.add(partHolder);

    const lowerName = name.toLowerCase();
    if (lowerName.includes("kill") || lowerName.includes("lava") || lowerName.includes("acid") || lowerName.includes("spike")) {
      interactiveParts.push({ type: "kill", mesh: partHolder, halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2) });
    } else if (lowerName.includes("jump") || lowerName.includes("bounce") || lowerName.includes("pad")) {
      interactiveParts.push({ type: "jump", mesh: partHolder, halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2), boost: 85 });
    } else if (lowerName.includes("speed") || lowerName.includes("boost")) {
      interactiveParts.push({ type: "speed", mesh: partHolder, halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2), speed: 34 });
    }

    if (!anchored && cls !== "SpawnLocation") {
      physicsParts.push({
        mesh: partHolder,
        vy: 0,
        halfHeight: sy / 2
      });
    }

    if (meshUrl && /^https?:\/\//i.test(meshUrl) && meshUrl.toLowerCase().endsWith(".glb")) {
      gltfLoader.load(
        meshUrl,
        (gltf) => {
          while (partHolder.children.length > 0) partHolder.remove(partHolder.children[0]);
          const mScene = gltf.scene;
          mScene.scale.set(sx / 2, sy / 2, sz / 2);
          partHolder.add(mScene);
        },
        undefined,
        () => {}
      );
    }
  }

  for (const child of Array.from(item.children)) {
    if (child.tagName === "Item") {
      processStudioItem(child, parentGroup, defaultSpawnPosRef, worldItemsCollector);
    }
  }
}

const playerPos = new THREE.Vector3(0, 0.5, 0);
const playerVel = new THREE.Vector3(0, 0, 0);
let playerYaw = 0;
let isGrounded = false;
let isJumping = false;
let isAttacking = false;
let attackTimer = 0;
let currentSpawn = { x: 0, y: 0.5, z: 0 };
let speedBoostTimer = 0;

function syncLocalAvatarTransform() {
  if (!localAvatarInst) return;
  localAvatarInst.container.position.set(playerPos.x, playerPos.y + localAvatarInst.footOffset, playerPos.z);
  localAvatarInst.container.rotation.y = playerYaw;
}

function respawnLocalPlayer() {
  const footOff = localAvatarInst ? localAvatarInst.footOffset : 0.05;
  playerPos.set(currentSpawn.x, currentSpawn.y + footOff + 0.5, currentSpawn.z);
  playerVel.set(0, 0, 0);
  isGrounded = false;
  isJumping = false;
  speedBoostTimer = 0;
  syncLocalAvatarTransform();
  broadcastSelfState();
}

function loadPlaceXmlString(xmlText) {
  clearWorldGroup();
  pickupItems = [];
  interactiveParts = [];
  physicsParts = [];
  backpackItems = [];
  equippedIndex = -1;
  applyToolVisualToRig(localAvatarInst, "");
  renderHotbar();

  studioConfig.gravity = 196.2;
  studioConfig.walkSpeed = 16;
  studioConfig.jumpPower = 50;
  studioConfig.ambientColor = 0xffffff;
  studioConfig.outdoorAmbientColor = 0x87c6ff;
  studioConfig.fogColor = 0x87c6ff;
  studioConfig.fogStart = 80;
  studioConfig.fogEnd = 260;
  updateSkyAndLighting();

  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "application/xml");
  const rootItems = Array.from(doc.documentElement ? doc.documentElement.children : []).filter((c) => c.tagName === "Item");
  const spawnRef = { set: false, x: 0, y: 0.5, z: 0 };

  rootItems.forEach((item) => {
    processStudioItem(item, worldGroup, spawnRef, pickupItems);
  });

  if (spawnRef.set) {
    currentSpawn = { x: spawnRef.x, y: spawnRef.y, z: spawnRef.z };
  } else {
    currentSpawn = { x: 0, y: 0.5, z: 0 };
  }
  respawnLocalPlayer();
}

function extractXmlFromGameRow(place) {
  if (!place || typeof place !== "object") return "";
  const directKeys = ["xml", "xml_content", "place_xml", "rbxlx", "data", "content", "code"];
  for (const key of directKeys) {
    const val = place[key];
    if (typeof val === "string" && val.trim().startsWith("<")) {
      return val.trim();
    }
  }
  for (const [k, val] of Object.entries(place)) {
    if (typeof val === "string" && (val.includes("<roblox") || (val.trim().startsWith("<Item") && k !== "name"))) {
      return val.trim();
    }
  }
  return "";
}

async function fetchPlaceXml(place) {
  const inlineXml = extractXmlFromGameRow(place);
  if (inlineXml) return inlineXml;

  const candidates = [
    place && place.xml_url,
    place && place.place_url,
    place && place.asset_url,
    place && place.id ? `https://btip.cc.cd/places/${encodeURIComponent(place.id)}.rbxlx` : null,
    place && place.id ? `https://btip.cc.cd/places/${encodeURIComponent(place.id)}.xml` : null
  ].filter(Boolean);

  for (const url of candidates) {
    try {
      const res = await fetch(url);
      if (res.ok) {
        const txt = await res.text();
        if (txt && txt.includes("<roblox")) return txt;
      }
    } catch (_) {}
  }

  return `<?xml version="1.0" encoding="utf-8"?>
<roblox version="4">
  <Item class="Workspace">
    <Properties>
      <string name="Name">Workspace</string>
      <float name="Gravity">196.2</float>
    </Properties>
    <Item class="SpawnLocation">
      <Properties>
        <string name="Name">SpawnLocation</string>
        <Vector3 name="Size"><X>8</X><Y>1</Y><Z>8</Z></Vector3>
        <CoordinateFrame name="CFrame"><X>0</X><Y>0.5</Y><Z>0</Z></CoordinateFrame>
      </Properties>
    </Item>
    <Item class="Part">
      <Properties>
        <string name="Name">ClassicBrick</string>
        <Vector3 name="Size"><X>6</X><Y>4</Y><Z>6</Z></Vector3>
        <CoordinateFrame name="CFrame"><X>10</X><Y>2</Y><Z>-10</Z></CoordinateFrame>
        <int name="BrickColor">21</int>
      </Properties>
    </Item>
    <Item class="Tool">
      <Properties>
        <string name="Name">Sword</string>
        <Color3 name="Color3"><R>0.75</R><G>0.8</G><B>0.85</B></Color3>
      </Properties>
    </Item>
  </Item>
</roblox>`;
}

function updateLeaderboard() {
  const entries = [{ id: peerId, name: username, isSelf: true }];
  remotePlayers.forEach((rp, id) => {
    entries.push({ id, name: rp.name || "Player", isSelf: false });
  });
  playerCountEl.textContent = String(entries.length);
  leaderboardBody.innerHTML = "";
  entries.forEach((e) => {
    const row = document.createElement("div");
    row.className = "lb-row";
    const left = document.createElement("span");
    left.textContent = escapeHtml(e.name);
    const right = document.createElement("span");
    right.textContent = e.isSelf ? "You" : "Online";
    row.appendChild(left);
    row.appendChild(right);
    leaderboardBody.appendChild(row);
  });
}

function addOrUpdateRemotePlayer(id, payload) {
  if (!id || id === peerId) return;
  let rp = remotePlayers.get(id);
  if (!rp) {
    const tpl = cachedAvatarTemplate || buildFallbackRobloxRig();
    const avatarInst = createAnimatedAvatarInstance(tpl, payload.name || "Player");
    remotePlayersGroup.add(avatarInst.container);
    const footOff = avatarInst.footOffset || 0.05;
    const px = payload.x ?? 0;
    const py = (payload.y ?? 0.5) + footOff;
    const pz = payload.z ?? 0;
    avatarInst.container.position.set(px, py, pz);
    rp = {
      id,
      name: payload.name || "Player",
      avatarInst,
      footOffset: footOff,
      targetPos: new THREE.Vector3(px, py, pz),
      targetYaw: payload.yaw ?? 0,
      speedRatio: payload.speedRatio ?? 0,
      isGrounded: payload.isGrounded ?? true,
      isJumping: payload.isJumping ?? false,
      isAttacking: payload.isAttacking ?? false,
      toolName: payload.toolName || "",
      lastSeen: Date.now()
    };
    remotePlayers.set(id, rp);
    addChat("System", (payload.name || "Player") + " joined the server.");
    updateLeaderboard();
  } else {
    rp.name = payload.name || rp.name;
    rp.targetPos.set(
      payload.x ?? (rp.targetPos.x),
      (payload.y ?? (rp.targetPos.y - rp.footOffset)) + rp.footOffset,
      payload.z ?? (rp.targetPos.z)
    );
    rp.targetYaw = payload.yaw ?? rp.targetYaw;
    rp.speedRatio = payload.speedRatio ?? 0;
    rp.isGrounded = payload.isGrounded ?? true;
    rp.isJumping = payload.isJumping ?? false;
    rp.isAttacking = payload.isAttacking ?? false;
    rp.lastSeen = Date.now();
    if ((payload.toolName || "") !== rp.avatarInst.equippedToolName) {
      applyToolVisualToRig(rp.avatarInst, payload.toolName || "");
    }
  }
}

function removeRemotePlayer(id) {
  const rp = remotePlayers.get(id);
  if (!rp) return;
  remotePlayersGroup.remove(rp.avatarInst.container);
  remotePlayers.delete(id);
  addChat("System", (rp.name || "Player") + " left the server.");
  updateLeaderboard();
}

function broadcastSelfState() {
  if (!activeChannel) return;
  const equippedTool = equippedIndex >= 0 && backpackItems[equippedIndex] ? backpackItems[equippedIndex].name : "";
  const horizSpeed = Math.hypot(playerVel.x, playerVel.z);
  const speedRatio = Math.min(1, horizSpeed / Math.max(1, studioConfig.walkSpeed));
  activeChannel.send({
    type: "broadcast",
    event: "state",
    payload: {
      peerId,
      name: username,
      x: playerPos.x,
      y: playerPos.y,
      z: playerPos.z,
      yaw: playerYaw,
      speedRatio,
      isGrounded,
      isJumping,
      isAttacking,
      toolName: equippedTool
    }
  });
}

async function discoverAndJoinMultiplayerServer(targetPlaceId) {
  if (activeChannel) {
    try { await sb.removeChannel(activeChannel); } catch (_) {}
    activeChannel = null;
  }
  remotePlayers.forEach((_, id) => removeRemotePlayer(id));
  remotePlayers.clear();

  const cleanPlace = targetPlaceId || "default";
  serverRoleLabel.textContent = "finding server...";

  const candidateServers = [0, 1, 2, 3, 4].map((idx) => `bloxtip_${cleanPlace}_srv_${idx}`);
  let chosenServerId = activeServerId || "";
  let chosenIsHost = false;

  if (!chosenServerId) {
    for (const srvName of candidateServers) {
      const checkRes = await new Promise((resolve) => {
        const probe = sb.channel(srvName, { config: { presence: { key: peerId } } });
        let settled = false;
        const finish = (val) => {
          if (!settled) {
            settled = true;
            sb.removeChannel(probe).catch(() => {});
            resolve(val);
          }
        };
        setTimeout(() => finish({ exists: false, count: 0 }), 700);
        probe.on("presence", { event: "sync" }, () => {
          const st = probe.presenceState();
          const count = Object.keys(st).length;
          finish({ exists: count > 0, count });
        });
        probe.subscribe((status) => {
          if (status === "SUBSCRIBED") {
            setTimeout(() => {
              const st = probe.presenceState();
              const count = Object.keys(st).length;
              finish({ exists: count > 0, count });
            }, 350);
          }
        });
      });

      if (checkRes.exists && checkRes.count < MAX_SERVER_PLAYERS) {
        chosenServerId = srvName;
        chosenIsHost = false;
        break;
      }
    }
  }

  if (!chosenServerId) {
    chosenServerId = candidateServers[0];
    chosenIsHost = true;
  }

  activeServerId = chosenServerId;
  isHost = chosenIsHost;
  hostId = isHost ? peerId : "";

  const ch = sb.channel(chosenServerId, {
    config: {
      presence: { key: peerId },
      broadcast: { ack: false }
    }
  });

  ch.on("presence", { event: "sync" }, () => {
    const state = ch.presenceState();
    const keys = Object.keys(state).sort();
    if (keys.length > 0 && keys[0] === peerId) {
      isHost = true;
      hostId = peerId;
    } else if (keys.length > 0) {
      isHost = false;
      hostId = keys[0];
    }
    serverRoleLabel.textContent = isHost ? `Host (${chosenServerId})` : `Multiplayer (${chosenServerId})`;

    keys.forEach((k) => {
      if (k !== peerId && !remotePlayers.has(k)) {
        const meta = (state[k] && state[k][0]) || {};
        addOrUpdateRemotePlayer(k, {
          name: meta.name || ("Player_" + k.slice(-4)),
          x: meta.x ?? 0,
          y: meta.y ?? 0.5,
          z: meta.z ?? 0,
          yaw: meta.yaw ?? 0
        });
      }
    });

    remotePlayers.forEach((_, k) => {
      if (!state[k]) removeRemotePlayer(k);
    });
    updateLeaderboard();
  });

  ch.on("presence", { event: "leave" }, ({ key }) => {
    if (key !== peerId) removeRemotePlayer(key);
  });

  ch.on("broadcast", { event: "state" }, ({ payload }) => {
    if (!payload || payload.peerId === peerId) return;
    addOrUpdateRemotePlayer(payload.peerId, payload);
  });

  ch.on("broadcast", { event: "chat" }, ({ payload }) => {
    if (!payload || payload.peerId === peerId) return;
    addChat(payload.sender || "Player", payload.text || "");
  });

  activeChannel = ch;
  ch.subscribe(async (status) => {
    if (status === "SUBSCRIBED") {
      await ch.track({
        name: username,
        x: playerPos.x,
        y: playerPos.y,
        z: playerPos.z,
        yaw: playerYaw
      });
      serverRoleLabel.textContent = isHost ? `Host (${chosenServerId})` : `Multiplayer (${chosenServerId})`;
      updateLeaderboard();
      broadcastSelfState();
    }
  });
}

async function loadGamesList() {
  let rows = [];
  try {
    const { data, error } = await sb.from("games").select("*");
    if (!error && Array.isArray(data) && data.length > 0) {
      rows = data;
    }
  } catch (_) {}

  if (rows.length === 0) {
    try {
      const res = await fetch("https://btip.cc.cd/games.json");
      if (res.ok) {
        const j = await res.json();
        if (Array.isArray(j)) rows = j;
        else if (Array.isArray(j.games)) rows = j.games;
      }
    } catch (_) {}
  }

  if (rows.length === 0) {
    rows = [
      { id: "classic_baseplate", name: "Classic Baseplate" },
      { id: "obby_arena", name: "Obby & Physics Arena" }
    ];
  }

  gamesCache = rows;
  return rows;
}

async function renderGamesModalList() {
  const rows = await loadGamesList();
  gamesGrid.innerHTML = "";
  rows.forEach((g, idx) => {
    const gId = String(g.id ?? idx);
    const title = String(g.name || g.title || ("Game " + (idx + 1)));
    const card = document.createElement("div");
    card.className = "game-card";

    const titleEl = document.createElement("div");
    titleEl.className = "game-card-title";
    titleEl.textContent = title;

    const metaEl = document.createElement("div");
    metaEl.className = "game-card-meta";
    metaEl.textContent = gId === String(placeId) ? "Playing" : "Ready";

    const joinBtn = document.createElement("button");
    joinBtn.className = "tb-btn";
    joinBtn.type = "button";
    joinBtn.textContent = "Join";
    joinBtn.addEventListener("click", async () => {
      gamesModal.classList.remove("open");
      await selectAndLaunchGame(gId);
    });

    card.appendChild(titleEl);
    card.appendChild(metaEl);
    card.appendChild(joinBtn);
    gamesGrid.appendChild(card);
  });
}

async function selectAndLaunchGame(targetId) {
  if (!gamesCache || gamesCache.length === 0) {
    await loadGamesList();
  }
  const chosen = gamesCache.find((g) => String(g.id) === String(targetId)) || gamesCache[0] || { id: targetId || "default", name: "Baseplate" };
  placeId = String(chosen.id);
  activeServerId = "";
  const xml = await fetchPlaceXml(chosen);
  loadPlaceXmlString(xml);
  await discoverAndJoinMultiplayerServer(placeId);
}

document.getElementById("reset-btn").addEventListener("click", () => {
  respawnLocalPlayer();
});

document.getElementById("leave-btn").addEventListener("click", async () => {
  if (activeChannel) {
    try { await sb.removeChannel(activeChannel); } catch (_) {}
    activeChannel = null;
  }
  remotePlayers.forEach((_, id) => removeRemotePlayer(id));
  serverRoleLabel.textContent = "disconnected";
  updateLeaderboard();
});

chatForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const txt = chatInput.value.trim();
  if (!txt) return;
  addChat(username, txt);
  chatInput.value = "";
  if (activeChannel) {
    activeChannel.send({
      type: "broadcast",
      event: "chat",
      payload: { peerId, sender: username, text: txt }
    });
  }
});

const keysDown = new Set();
window.addEventListener("keydown", (e) => {
  if (document.activeElement === chatInput) return;
  keysDown.add(e.code);

  if (e.code.startsWith("Digit")) {
    const num = parseInt(e.code.replace("Digit", ""), 10);
    if (num >= 1 && num <= 9) {
      equipBackpackSlot(num - 1);
    }
  }
  if (e.code === "Space" && isGrounded) {
    playerVel.y = studioConfig.jumpPower;
    isGrounded = false;
    isJumping = true;
  }
});

window.addEventListener("keyup", (e) => {
  keysDown.delete(e.code);
});

canvas.addEventListener("mousedown", (e) => {
  if (e.button === 0 && equippedIndex >= 0) {
    isAttacking = true;
    attackTimer = 0.25;
    broadcastSelfState();
  }
});

let isDraggingLook = false;
let lastMouseX = 0;
let lastMouseY = 0;
let camPitch = 0.22;
let camDist = 8.5;

canvas.addEventListener("mousedown", (e) => {
  if (e.button === 2 || e.button === 1) {
    isDraggingLook = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  }
});
window.addEventListener("mouseup", () => {
  isDraggingLook = false;
});
window.addEventListener("mousemove", (e) => {
  if (!isDraggingLook) return;
  const dx = e.clientX - lastMouseX;
  const dy = e.clientY - lastMouseY;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  playerYaw -= dx * 0.006;
  camPitch = Math.max(-0.4, Math.min(1.15, camPitch + dy * 0.005));
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("wheel", (e) => {
  camDist = Math.max(3, Math.min(35, camDist + e.deltaY * 0.01));
});

window.addEventListener("resize", () => {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (w > 0 && h > 0) {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
});

function getFloorHeightAt(x, z, currentY) {
  let highestFloor = -Infinity;

  const bpBox = new THREE.Box3().setFromObject(baseplate);
  if (x >= bpBox.min.x && x <= bpBox.max.x && z >= bpBox.min.z && z <= bpBox.max.z) {
    if (bpBox.max.y <= currentY + 1.5 && bpBox.max.y > highestFloor) {
      highestFloor = bpBox.max.y;
    }
  }

  for (const child of worldGroup.children) {
    const box = new THREE.Box3().setFromObject(child);
    if (x >= box.min.x - 0.5 && x <= box.max.x + 0.5 && z >= box.min.z - 0.5 && z <= box.max.z + 0.5) {
      if (box.max.y <= currentY + 1.5 && box.max.y > highestFloor) {
        highestFloor = box.max.y;
      }
    }
  }

  return highestFloor;
}

function updatePhysicsAndPlayer(dt) {
  if (speedBoostTimer > 0) speedBoostTimer -= dt;
  if (attackTimer > 0) {
    attackTimer -= dt;
    if (attackTimer <= 0) isAttacking = false;
  }

  let moveForward = 0;
  let moveRight = 0;
  if (keysDown.has("KeyW") || keysDown.has("ArrowUp")) moveForward += 1;
  if (keysDown.has("KeyS") || keysDown.has("ArrowDown")) moveForward -= 1;
  if (keysDown.has("KeyD") || keysDown.has("ArrowRight")) moveRight += 1;
  if (keysDown.has("KeyA") || keysDown.has("ArrowLeft")) moveRight -= 1;

  const activeSpeed = speedBoostTimer > 0 ? 34 : studioConfig.walkSpeed;
  const forwardVec = new THREE.Vector3(-Math.sin(playerYaw), 0, -Math.cos(playerYaw));
  const rightVec = new THREE.Vector3(Math.cos(playerYaw), 0, -Math.sin(playerYaw));

  const wishDir = new THREE.Vector3()
    .addScaledVector(forwardVec, moveForward)
    .addScaledVector(rightVec, moveRight);
  if (wishDir.lengthSq() > 0) wishDir.normalize();

  playerVel.x = wishDir.x * activeSpeed;
  playerVel.z = wishDir.z * activeSpeed;

  playerVel.y -= studioConfig.gravity * 0.12 * dt;

  playerPos.x += playerVel.x * dt;
  playerPos.y += playerVel.y * dt;
  playerPos.z += playerVel.z * dt;

  const floorY = getFloorHeightAt(playerPos.x, playerPos.z, playerPos.y);
  if (floorY > -Infinity && playerPos.y <= floorY && playerVel.y <= 0) {
    playerPos.y = floorY;
    playerVel.y = 0;
    isGrounded = true;
    isJumping = false;
  } else {
    isGrounded = false;
  }

  if (playerPos.y < studioConfig.fallenPartsDestroyHeight) {
    respawnLocalPlayer();
  }

  for (const pItem of pickupItems) {
    if (pItem.collected) continue;
    pItem.mesh.rotation.y += dt * 2.0;
    if (playerPos.distanceTo(pItem.pickupPos) < 4.0) {
      pItem.collected = true;
      pItem.mesh.visible = false;
      giveItemToBackpack(pItem.name, pItem.colorHex || 0xc0c8d0, true);
      addChat("System", "Picked up " + pItem.name + "!");
    }
  }

  for (const inter of interactiveParts) {
    const pos = inter.mesh.position;
    const dx = Math.abs(playerPos.x - pos.x);
    const dy = Math.abs(playerPos.y + 2.5 - pos.y);
    const dz = Math.abs(playerPos.z - pos.z);
    if (dx <= inter.halfExtents.x + 1.2 && dy <= inter.halfExtents.y + 2.6 && dz <= inter.halfExtents.z + 1.2) {
      if (inter.type === "kill") {
        respawnLocalPlayer();
        break;
      } else if (inter.type === "jump") {
        playerVel.y = inter.boost || 85;
        isGrounded = false;
        isJumping = true;
      } else if (inter.type === "speed") {
        speedBoostTimer = 4.0;
      }
    }
  }

  for (let i = physicsParts.length - 1; i >= 0; i--) {
    const pp = physicsParts[i];
    pp.vy -= studioConfig.gravity * 0.12 * dt;
    pp.mesh.position.y += pp.vy * dt;
    const pFloor = getFloorHeightAt(pp.mesh.position.x, pp.mesh.position.z, pp.mesh.position.y);
    if (pFloor > -Infinity && pp.mesh.position.y - pp.halfHeight <= pFloor && pp.vy <= 0) {
      pp.mesh.position.y = pFloor + pp.halfHeight;
      pp.vy = 0;
    }
    if (pp.mesh.position.y < studioConfig.fallenPartsDestroyHeight) {
      worldGroup.remove(pp.mesh);
      physicsParts.splice(i, 1);
    }
  }

  const avatarHeight = localAvatarInst ? localAvatarInst.height : 5.0;
  if (localAvatarInst) {
    syncLocalAvatarTransform();
    const horizSpeed = Math.hypot(playerVel.x, playerVel.z);
    const speedRatio = Math.min(1, horizSpeed / Math.max(1, studioConfig.walkSpeed));
    stepAvatarAnimation(localAvatarInst, dt, speedRatio, isGrounded, isJumping, isAttacking);
  }

  const anchorY = playerPos.y + avatarHeight * 0.65;
  const camOffset = new THREE.Vector3(
    Math.sin(playerYaw) * Math.cos(camPitch) * camDist,
    Math.sin(camPitch) * camDist + 1.2,
    Math.cos(playerYaw) * Math.cos(camPitch) * camDist
  );
  camera.position.set(playerPos.x + camOffset.x, anchorY + camOffset.y, playerPos.z + camOffset.z);
  camera.lookAt(playerPos.x, anchorY, playerPos.z);
  skyDome.position.copy(camera.position);
}

let lastFrameTime = performance.now();
let lastBroadcastTime = 0;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  updatePhysicsAndPlayer(dt);

  remotePlayers.forEach((rp) => {
    rp.avatarInst.container.position.lerp(rp.targetPos, Math.min(1, dt * 14));
    rp.avatarInst.container.rotation.y = rp.targetYaw;
    stepAvatarAnimation(rp.avatarInst, dt, rp.speedRatio, rp.isGrounded, rp.isJumping, rp.isAttacking);
  });

  if (now - lastBroadcastTime > 65) {
    lastBroadcastTime = now;
    broadcastSelfState();
  }

  renderer.render(scene, camera);
}

(async function init() {
  const tpl = await loadAvatarTemplate(AVATAR_GLB_URL);
  localAvatarInst = createAnimatedAvatarInstance(tpl, username);
  scene.add(localAvatarInst.container);
  syncLocalAvatarTransform();
  renderHotbar();
  updateLeaderboard();

  const rows = await loadGamesList();
  const initialId = placeId || (rows[0] ? String(rows[0].id) : "default");
  await selectAndLaunchGame(initialId);
  requestAnimationFrame(animate);
})();
</script>
</body>
