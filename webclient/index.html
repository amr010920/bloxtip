function readNum(parent, tagName, fallback) {
  if (!parent) return fallback;
  const el = parent.getElementsByTagName(tagName)[0];
  if (!el) return fallback;
  const n = Number(el.textContent);
  return Number.isFinite(n) ? n : fallback;
}

function readStr(parent, propName, fallback = "") {
  if (!parent) return fallback;
  for (const el of Array.from(parent.children)) {
    if (el.getAttribute("name") === propName) return el.textContent ?? fallback;
  }
  return fallback;
}

function readBool(parent, propName, fallback = false) {
  const raw = readStr(parent, propName, "");
  if (!raw) return fallback;
  const s = raw.trim().toLowerCase();
  if (s === "true" || s === "1") return true;
  if (s === "false" || s === "0") return false;
  return fallback;
}

function findPropElement(parent, propName) {
  if (!parent) return null;
  for (const el of Array.from(parent.children)) {
    if (el.getAttribute("name") === propName) return el;
  }
  return null;
}

function parseColor3Value(propEl, fallbackHex = 0x00a2ff) {
  if (!propEl) return fallbackHex;
  const rEl = propEl.getElementsByTagName("R")[0];
  const gEl = propEl.getElementsByTagName("G")[0];
  const bEl = propEl.getElementsByTagName("B")[0];
  if (rEl && gEl && bEl) {
    let r = Number(rEl.textContent);
    let g = Number(gEl.textContent);
    let b = Number(bEl.textContent);
    if (Number.isFinite(r) && Number.isFinite(g) && Number.isFinite(b)) {
      if (r <= 1.001 && g <= 1.001 && b <= 1.001) {
        r = Math.round(Math.max(0, Math.min(1, r)) * 255);
        g = Math.round(Math.max(0, Math.min(1, g)) * 255);
        b = Math.round(Math.max(0, Math.min(1, b)) * 255);
      } else {
        r = Math.round(Math.max(0, Math.min(255, r)));
        g = Math.round(Math.max(0, Math.min(255, g)));
        b = Math.round(Math.max(0, Math.min(255, b)));
      }
      return (r << 16) | (g << 8) | b;
    }
  }
  const uintEl = propEl.getElementsByTagName("uint")[0] || propEl.getElementsByTagName("int")[0];
  if (uintEl) {
    const val = Number(uintEl.textContent);
    if (Number.isFinite(val) && val >= 0) {
      if (val > 0xffffff) return val & 0xffffff;
      return val;
    }
  }
  const txt = (propEl.textContent || "").trim();
  if (/^#?[0-9a-fA-F]{6}$/.test(txt)) {
    return parseInt(txt.replace("#", ""), 16);
  }
  const num = Number(txt);
  if (Number.isFinite(num) && num >= 0) {
    return num > 0xffffff ? (num & 0xffffff) : num;
  }
  return fallbackHex;
}

function parseColorFromProps(props, fallbackHex = 0x00a2ff) {
  const color3Prop = findPropElement(props, "Color3") || findPropElement(props, "color3");
  if (color3Prop) return parseColor3Value(color3Prop, fallbackHex);

  const colorProp = findPropElement(props, "Color") || findPropElement(props, "color");
  if (colorProp) {
    const c3 = parseColor3Value(colorProp, null);
    if (c3 !== null) return c3;
  }

  const brickProp = findPropElement(props, "BrickColor") || findPropElement(props, "brickcolor");
  if (brickProp) {
    const code = Number((brickProp.textContent || "").trim());
    if (Number.isFinite(code) && BRICK_COLORS[code] !== undefined) {
      return BRICK_COLORS[code];
    }
  }

  const colorStr = readStr(props, "Color", "") || readStr(props, "BrickColor", "");
  if (colorStr) {
    const num = Number(colorStr.trim());
    if (Number.isFinite(num)) {
      if (BRICK_COLORS[num] !== undefined) return BRICK_COLORS[num];
      if (num >= 0) return num > 0xffffff ? (num & 0xffffff) : num;
    }
    if (/^#?[0-9a-fA-F]{6}$/.test(colorStr.trim())) {
      return parseInt(colorStr.trim().replace("#", ""), 16);
    }
  }
  return fallbackHex;
}

function parseCFrameMatrix(cfEl) {
  const fallback = {
    x: 0, y: 2, z: -12,
    matrix4: new THREE.Matrix4().identity()
  };
  if (!cfEl) return fallback;

  const x = readNum(cfEl, "X", 0);
  const y = readNum(cfEl, "Y", 2);
  const z = readNum(cfEl, "Z", -12);

  const r00 = readNum(cfEl, "R00", null);
  const r01 = readNum(cfEl, "R01", null);
  const r02 = readNum(cfEl, "R02", null);
  const r10 = readNum(cfEl, "R10", null);
  const r11 = readNum(cfEl, "R11", null);
  const r12 = readNum(cfEl, "R12", null);
  const r20 = readNum(cfEl, "R20", null);
  const r21 = readNum(cfEl, "R21", null);
  const r22 = readNum(cfEl, "R22", null);

  const m = new THREE.Matrix4();
  if (
    r00 !== null && r01 !== null && r02 !== null &&
    r10 !== null && r11 !== null && r12 !== null &&
    r20 !== null && r21 !== null && r22 !== null
  ) {
    m.set(
      r00, r01, r02, x,
      r10, r11, r12, y,
      r20, r21, r22, z,
      0,   0,   0,   1
    );
  } else {
    m.makeTranslation(x, y, z);
  }

  return { x, y, z, matrix4: m };
}

function getPartShape(item, props, cls) {
  if (cls === "WedgePart") return "Wedge";
  if (cls === "Cylinder" || cls === "CylinderPart") return "Cylinder";
  if (cls === "Ball" || cls === "SpherePart") return "Ball";
  if (cls === "TrussPart") return "Truss";
  if (cls === "CornerWedgePart") return "CornerWedge";

  const shapeProp = findPropElement(props, "shape") || findPropElement(props, "Shape");
  if (shapeProp) {
    const txt = (shapeProp.textContent || "").trim();
    const num = Number(txt);
    if (Number.isFinite(num)) {
      if (num === 0) return "Ball";
      if (num === 1) return "Block";
      if (num === 2) return "Cylinder";
      if (num === 3) return "Wedge";
      if (num === 4) return "CornerWedge";
    }
    const lower = txt.toLowerCase();
    if (lower.includes("cyl")) return "Cylinder";
    if (lower.includes("ball") || lower.includes("sphere")) return "Ball";
    if (lower.includes("wedge") && lower.includes("corner")) return "CornerWedge";
    if (lower.includes("wedge")) return "Wedge";
  }

  const childItems = Array.from(item.children).filter((c) => c.tagName === "Item");
  for (const ch of childItems) {
    const cCls = ch.getAttribute("class");
    if (cCls === "CylinderMesh") return "Cylinder";
    if (cCls === "SpecialMesh") {
      const cProps = findPropElement(ch, "Properties") || ch.firstElementChild;
      const mType = readStr(cProps, "MeshType", "");
      const mNum = Number(mType.trim());
      if (mNum === 0) return "Head";
      if (mNum === 1) return "Torso";
      if (mNum === 2) return "Wedge";
      if (mNum === 3) return "Sphere";
      if (mNum === 4) return "Cylinder";
      if (mNum === 5) return "FileMesh";
      if (mNum === 6) return "Brick";
      const mLower = mType.toLowerCase();
      if (mLower.includes("cyl")) return "Cylinder";
      if (mLower.includes("sphere") || mLower.includes("ball")) return "Ball";
      if (mLower.includes("wedge")) return "Wedge";
      if (mLower.includes("file")) return "FileMesh";
    }
  }

  return "Block";
}

function createWedgeGeometry(sx, sy, sz) {
  const shape = new THREE.Shape();
  shape.moveTo(-sz / 2, -sy / 2);
  shape.lineTo(sz / 2, -sy / 2);
  shape.lineTo(sz / 2, sy / 2);
  shape.closePath();

  const geom = new THREE.ExtrudeGeometry(shape, {
    depth: sx,
    bevelEnabled: false
  });
  geom.translate(0, 0, -sx / 2);
  geom.rotateY(-Math.PI / 2);
  return geom;
}

function createCornerWedgeGeometry(sx, sy, sz) {
  const geom = new THREE.BufferGeometry();
  const hx = sx / 2, hy = sy / 2, hz = sz / 2;
  const vertices = new Float32Array([
    -hx, -hy, -hz,   hx, -hy, -hz,   hx, -hy,  hz,
    -hx, -hy, -hz,   hx, -hy,  hz,  -hx, -hy,  hz,
    -hx, -hy, -hz,  -hx,  hy, -hz,   hx, -hy, -hz,
    -hx, -hy, -hz,  -hx, -hy,  hz,  -hx,  hy, -hz,
    -hx,  hy, -hz,  -hx, -hy,  hz,   hx, -hy, -hz,
     hx, -hy, -hz,  -hx, -hy,  hz,   hx, -hy,  hz
  ]);
  geom.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geom.computeVertexNormals();
  return geom;
}

function buildGeometryForPart(shape, sx, sy, sz) {
  const w = Math.max(0.05, sx);
  const h = Math.max(0.05, sy);
  const d = Math.max(0.05, sz);

  if (shape === "Cylinder") {
    const radius = Math.max(0.025, Math.min(h, d) / 2);
    const cyl = new THREE.CylinderGeometry(radius, radius, w, 28, 1, false);
    cyl.rotateZ(-Math.PI / 2);
    return cyl;
  }
  if (shape === "Ball" || shape === "Sphere") {
    const r = Math.max(0.025, Math.min(w, h, d) / 2);
    return new THREE.SphereGeometry(r, 24, 18);
  }
  if (shape === "Wedge") {
    return createWedgeGeometry(w, h, d);
  }
  if (shape === "CornerWedge") {
    return createCornerWedgeGeometry(w, h, d);
  }
  if (shape === "Truss") {
    const g = new THREE.Group();
    const railGeo = new THREE.BoxGeometry(0.25, h, 0.25);
    const mat = new THREE.MeshStandardMaterial({ color: 0x8a929a });
    const offsets = [
      [-w / 2 + 0.125, -d / 2 + 0.125],
      [w / 2 - 0.125, -d / 2 + 0.125],
      [-w / 2 + 0.125, d / 2 - 0.125],
      [w / 2 - 0.125, d / 2 - 0.125]
    ];
    offsets.forEach(([ox, oz]) => {
      const post = new THREE.Mesh(railGeo, mat);
      post.position.set(ox, 0, oz);
      g.add(post);
    });
    const rungCount = Math.max(1, Math.floor(h / 2));
    for (let i = 0; i <= rungCount; i++) {
      const ry = -h / 2 + (i / rungCount) * h;
      const rung1 = new THREE.Mesh(new THREE.BoxGeometry(w, 0.16, 0.16), mat);
      rung1.position.set(0, ry, 0);
      g.add(rung1);
    }
    return g;
  }
  return new THREE.BoxGeometry(w, h, d);
}

function materialPropsFromRoblox(props, colorHex, texUrl) {
  const transparency = Math.max(0, Math.min(1, readNum(props, "Transparency", 0)));
  const reflectance = Math.max(0, Math.min(1, readNum(props, "Reflectance", 0)));
  const matName = (readStr(props, "Material", "") || "").toLowerCase();

  let roughness = 0.65;
  let metalness = Math.min(0.9, reflectance * 0.85);
  let emissive = 0x000000;
  let emissiveIntensity = 0;

  if (matName.includes("neon")) {
    roughness = 0.2;
    emissive = colorHex;
    emissiveIntensity = 0.85;
  } else if (matName.includes("metal") || matName.includes("diamondplate") || matName.includes("foil") || matName.includes("corrugated")) {
    roughness = 0.28;
    metalness = Math.max(metalness, 0.72);
  } else if (matName.includes("glass")) {
    roughness = 0.08;
    metalness = 0.1;
  } else if (matName.includes("smoothplastic") || matName.includes("plastic")) {
    roughness = 0.42;
  } else if (matName.includes("wood")) {
    roughness = 0.78;
  } else if (matName.includes("grass") || matName.includes("sand") || matName.includes("brick") || matName.includes("stone") || matName.includes("rock") || matName.includes("concrete")) {
    roughness = 0.88;
  }

  const opts = {
    color: texUrl ? 0xffffff : colorHex,
    roughness,
    metalness,
    emissive,
    emissiveIntensity
  };

  if (transparency > 0.001) {
    opts.transparent = true;
    opts.opacity = 1 - transparency;
  }

  if (texUrl) {
    const tex = textureLoader.load(texUrl);
    tex.colorSpace = THREE.SRGBColorSpace;
    opts.map = tex;
  }

  return new THREE.MeshStandardMaterial(opts);
}

function extractTextureOrMeshUrl(item, props) {
  let texUrl = readStr(props, "TextureUrl", "") || readStr(props, "Texture", "") || readStr(props, "Image", "");
  let meshUrl = "";

  for (const child of Array.from(item.children)) {
    if (child.tagName !== "Item") continue;
    const cCls = child.getAttribute("class");
    const cProps = findPropElement(child, "Properties") || child.firstElementChild;
    if (!cProps) continue;

    if (cCls === "Decal" || cCls === "Texture") {
      const dUrl = readStr(cProps, "Texture", "") || readStr(cProps, "TextureUrl", "");
      if (dUrl && !texUrl) texUrl = dUrl;
    } else if (cCls === "SpecialMesh" || cCls === "FileMesh") {
      const mTex = readStr(cProps, "TextureId", "") || readStr(cProps, "Texture", "");
      const mId = readStr(cProps, "MeshId", "");
      if (mTex && !texUrl) texUrl = mTex;
      if (mId) meshUrl = mId;
    }
  }
  return { texUrl, meshUrl };
}

function attachLightsFromItem(item, targetGroup) {
  for (const child of Array.from(item.children)) {
    if (child.tagName !== "Item") continue;
    const cCls = child.getAttribute("class");
    const cProps = findPropElement(child, "Properties") || child.firstElementChild;
    if (!cProps) continue;
    const brightness = readNum(cProps, "Brightness", 1);
    const range = readNum(cProps, "Range", 16);
    const lColor = parseColorFromProps(cProps, 0xfff5cc);

    if (cCls === "PointLight") {
      const pt = new THREE.PointLight(lColor, brightness * 1.4, range);
      targetGroup.add(pt);
    } else if (cCls === "SpotLight") {
      const angleDeg = readNum(cProps, "Angle", 90);
      const sp = new THREE.SpotLight(lColor, brightness * 1.6, range, THREE.MathUtils.degToRad(angleDeg / 2), 0.35);
      targetGroup.add(sp);
    } else if (cCls === "SurfaceLight") {
      const surf = new THREE.PointLight(lColor, brightness * 1.1, range);
      targetGroup.add(surf);
    }
  }
}

const heldItemsGroup = new THREE.Group();
const remoteHeldItems = new Map();

function createVisualItemMesh(item, props) {
  const name = readStr(props, "Name", "Item");
  const colorHex = parseColorFromProps(props, 0x8d99ae);
  const { texUrl, meshUrl } = extractTextureOrMeshUrl(item, props);

  const itemRoot = new THREE.Group();
  itemRoot.name = name;

  let handlePart = null;
  const childItems = Array.from(item.children).filter((c) => c.tagName === "Item");
  for (const ch of childItems) {
    const cCls = ch.getAttribute("class") || "";
    const cProps = findPropElement(ch, "Properties") || ch.firstElementChild;
    const cName = cProps ? readStr(cProps, "Name", "") : "";
    if (cName === "Handle" || cCls === "Part" || cCls === "MeshPart" || cCls === "WedgePart" || cCls === "Cylinder") {
      handlePart = { ch, cProps, cCls };
      if (cName === "Handle") break;
    }
  }

  if (handlePart && handlePart.cProps) {
    const sEl = findPropElement(handlePart.cProps, "size") || findPropElement(handlePart.cProps, "Size");
    const sx = sEl ? Math.max(0.2, readNum(sEl, "X", 0.5)) : 0.5;
    const sy = sEl ? Math.max(0.2, readNum(sEl, "Y", 2.2)) : 2.2;
    const sz = sEl ? Math.max(0.2, readNum(sEl, "Z", 0.5)) : 0.5;
    const hColor = parseColorFromProps(handlePart.cProps, colorHex);
    const hShape = getPartShape(handlePart.ch, handlePart.cProps, handlePart.cCls);
    const hGeo = buildGeometryForPart(hShape, sx, sy, sz);
    const hMat = materialPropsFromRoblox(handlePart.cProps, hColor, texUrl);
    if (hGeo.isGroup) {
      hGeo.traverse((m) => { if (m.isMesh) m.material = hMat; });
      itemRoot.add(hGeo);
    } else {
      itemRoot.add(new THREE.Mesh(hGeo, hMat));
    }
  } else {
    const gripMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42, roughness: 0.5 });
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1.1, 12), gripMat);
    grip.position.set(0, 0.4, 0);
    itemRoot.add(grip);

    const bladeMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.0, 0.35), bladeMat);
    blade.position.set(0, 1.7, 0);
    itemRoot.add(blade);
  }

  if (meshUrl && /^https?:\/\//i.test(meshUrl) && meshUrl.toLowerCase().endsWith(".glb")) {
    gltfLoader.load(
      meshUrl,
      (gltf) => {
        while (itemRoot.children.length > 0) itemRoot.remove(itemRoot.children[0]);
        const sc = gltf.scene.clone(true);
        sc.scale.set(1.2, 1.2, 1.2);
        itemRoot.add(sc);
      },
      undefined,
      () => {}
    );
  }

  return itemRoot;
}

function processStudioItem(item, parentGroup, defaultSpawnPosRef, worldItemsCollector) {
  if (!item || item.tagName !== "Item") return;
  const cls = item.getAttribute("class") || "";
  const props = findPropElement(item, "Properties") || item.firstElementChild;
  const name = props ? readStr(props, "Name", cls) : cls;

  if (cls === "Lighting" && props) {
    const ambientHex = parseColorFromProps(props, null);
    if (ambientHex !== null) {
      hemi.color.setHex(ambientHex);
    }
    const skyHex = parseColor3Value(findPropElement(props, "OutdoorAmbient") || findPropElement(props, "FogColor"), null);
    if (skyHex !== null) {
      scene.background = new THREE.Color(skyHex);
      if (scene.fog) scene.fog.color.setHex(skyHex);
    }
    const fogEnd = readNum(props, "FogEnd", null);
    const fogStart = readNum(props, "FogStart", null);
    if (fogEnd !== null && fogEnd > 0) {
      scene.fog = new THREE.Fog(scene.background.getHex(), fogStart !== null ? fogStart : 40, fogEnd);
    }
  }

  const isToolOrItem = (
    cls === "Tool" ||
    cls === "HopperBin" ||
    cls === "Accoutrement" ||
    cls === "Hat" ||
    cls === "Accessory"
  );

  if (isToolOrItem && props) {
    const cfEl = findPropElement(props, "CFrame") || findPropElement(props, "Grip") || findPropElement(props, "CoordinateFrame");
    const hasExplicitWorldPos = Boolean(
      cfEl && (
        cfEl.getElementsByTagName("X")[0] !== undefined ||
        cfEl.getElementsByTagName("Y")[0] !== undefined ||
        cfEl.getElementsByTagName("Z")[0] !== undefined
      )
    );
    const visual = createVisualItemMesh(item, props);

    if (hasExplicitWorldPos) {
      const { x: ix, y: iy, z: iz, matrix4 } = parseCFrameMatrix(cfEl);
      const posVec = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scaleVec = new THREE.Vector3();
      matrix4.decompose(posVec, quat, scaleVec);
      visual.position.copy(posVec);
      visual.quaternion.copy(quat);
      parentGroup.add(visual);
      if (worldItemsCollector) {
        worldItemsCollector.push({ name, mesh: visual, pickupPos: posVec.clone(), collected: false });
      }
    } else if (worldItemsCollector && worldItemsCollector.length === 0) {
      equipItemOnAvatar(name);
    }
  }

  const isPartLike = (
    cls === "Part" ||
    cls === "SpawnLocation" ||
    cls === "WedgePart" ||
    cls === "TrussPart" ||
    cls === "CornerWedgePart" ||
    cls === "Cylinder" ||
    cls === "CylinderPart" ||
    cls === "Ball" ||
    cls === "SpherePart" ||
    cls === "MeshPart" ||
    cls === "Seat" ||
    cls === "VehicleSeat" ||
    cls === "FlagStand"
  );

  if (isPartLike && props) {
    if (name === "Baseplate") {
      const sizeEl = findPropElement(props, "size") || findPropElement(props, "Size");
      const cfEl = findPropElement(props, "CFrame");
      if (sizeEl) {
        const bx = Math.max(4, readNum(sizeEl, "X", 128));
        const by = Math.max(1, readNum(sizeEl, "Y", 2));
        const bz = Math.max(4, readNum(sizeEl, "Z", 128));
        baseplate.geometry.dispose();
        baseplate.geometry = new THREE.BoxGeometry(bx, by, bz);
      }
      if (cfEl) {
        baseplate.position.set(readNum(cfEl, "X", 0), readNum(cfEl, "Y", -1), readNum(cfEl, "Z", 0));
      }
      const bpColor = parseColorFromProps(props, null);
      if (bpColor !== null && baseplate.material) {
        baseplate.material.color.setHex(bpColor);
      }
      return;
    }

    const sizeEl = findPropElement(props, "size") || findPropElement(props, "Size");
    const sx = sizeEl ? readNum(sizeEl, "X", 4) : 4;
    const sy = sizeEl ? readNum(sizeEl, "Y", 2) : 2;
    const sz = sizeEl ? readNum(sizeEl, "Z", 4) : 4;

    const cfEl = findPropElement(props, "CFrame") || findPropElement(props, "CoordinateFrame");
    const { x: px, y: py, z: pz, matrix4 } = parseCFrameMatrix(cfEl);

    if (cls === "SpawnLocation" && !defaultSpawnPosRef.set) {
      defaultSpawnPosRef.set = true;
      defaultSpawnPosRef.x = px;
      defaultSpawnPosRef.y = py + Math.max(0.4, sy / 2 + 0.1);
      defaultSpawnPosRef.z = pz;
      spawnPad.position.set(px, py - sy / 2 + 0.2, pz);
    }

    const colorHex = parseColorFromProps(props, cls === "SpawnLocation" ? 0xd9dde2 : 0x00a2ff);
    const { texUrl, meshUrl } = extractTextureOrMeshUrl(item, props);
    const shape = getPartShape(item, props, cls);
    const geomOrGroup = buildGeometryForPart(shape, sx, sy, sz);
    const mat = materialPropsFromRoblox(props, colorHex, texUrl);

    const partHolder = new THREE.Group();
    if (geomOrGroup.isGroup) {
      geomOrGroup.traverse((child) => {
        if (child.isMesh) {
          child.material = mat;
        }
      });
      partHolder.add(geomOrGroup);
    } else {
      const mesh = new THREE.Mesh(geomOrGroup, mat);
      partHolder.add(mesh);
    }

    const posVec = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scaleVec = new THREE.Vector3();
    matrix4.decompose(posVec, quat, scaleVec);
    partHolder.position.copy(posVec);
    partHolder.quaternion.copy(quat);

    attachLightsFromItem(item, partHolder);
    parentGroup.add(partHolder);

    if (meshUrl && /^https?:\/\//i.test(meshUrl) && meshUrl.toLowerCase().endsWith(".glb")) {
      gltfLoader.load(
        meshUrl,
        (gltf) => {
          while (partHolder.children.length > 0) partHolder.remove(partHolder.children[0]);
          const mScene = gltf.scene;
          mScene.scale.set(sx / 2, sy / 2, sz / 2);
          partHolder.add(mScene);
        },
        undefined,
        () => {}
      );
    }
  }

  for (const child of Array.from(item.children)) {
    if (child.tagName === "Item") {
      processStudioItem(child, parentGroup, defaultSpawnPosRef, worldItemsCollector);
    }
  }
}

let pickupItems = [];
let currentEquippedItemName = "";

function equipItemOnAvatar(itemName) {
  currentEquippedItemName = itemName || "Item";
  while (heldItemsGroup.children.length > 0) {
    heldItemsGroup.remove(heldItemsGroup.children[0]);
  }
  const gripMat = new THREE.MeshStandardMaterial({ color: 0x333842, roughness: 0.5 });
  const bladeMat = new THREE.MeshStandardMaterial({ color: 0xc0c8d0, roughness: 0.25, metalness: 0.75 });
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.9, 10), gripMat);
  handle.position.set(0, 0.2, 0);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.3), bladeMat);
  blade.position.set(0, 1.4, 0);
  heldItemsGroup.add(handle, blade);
}

function readXmlFromBrowser(xmlText) {
  clearWorldGroup();
  pickupItems = [];
  if (!xmlText || !String(xmlText).trim()) return;

  const doc = new DOMParser().parseFromString(String(xmlText), "text/xml");
  const rootItems = Array.from(doc.documentElement ? doc.documentElement.children : []).filter(
    (el) => el.tagName === "Item"
  );
  if (rootItems.length === 0) {
    Array.from(doc.getElementsByTagName("Item")).forEach((item) => {
      if (item.parentElement && item.parentElement.tagName !== "Item") {
        rootItems.push(item);
      }
    });
  }

  const spawnRef = { set: false, x: 0, y: 0.2, z: 0 };
  rootItems.forEach((item) => processStudioItem(item, worldGroup, spawnRef, pickupItems));

  if (spawnRef.set) {
    character.position.set(spawnRef.x, spawnRef.y, spawnRef.z);
    velY = 0;
    grounded = true;
  }
}

const character = new THREE.Group();
scene.add(character);

const gltfLoader = new GLTFLoader();
gltfLoader.setCrossOrigin("anonymous");
let cachedNoobGlb = null;

// Classic Roblox default walking animation keyframes (16-frame cycle normalized to [0..1])
const ROBLOX_WALK_FRAMES = [
  { t: 0.000, legL:  0.00, legR:  0.00, armL:  0.00, armR:  0.00, bobY: 0.00, torsoRoll:  0.00 },
  { t: 0.125, legL:  0.42, legR: -0.38, armL: -0.35, armR:  0.35, bobY: 0.08, torsoRoll:  0.02 },
  { t: 0.250, legL:  0.72, legR: -0.58, armL: -0.58, armR:  0.58, bobY: 0.02, torsoRoll:  0.03 },
  { t: 0.375, legL:  0.34, legR: -0.22, armL: -0.26, armR:  0.26, bobY: -0.04, torsoRoll: 0.01 },
  { t: 0.500, legL:  0.00, legR:  0.00, armL:  0.00, armR:  0.00, bobY: 0.00, torsoRoll:  0.00 },
  { t: 0.625, legL: -0.38, legR:  0.42, armL:  0.35, armR: -0.35, bobY: 0.08, torsoRoll: -0.02 },
  { t: 0.750, legL: -0.58, legR:  0.72, armL:  0.58, armR: -0.58, bobY: 0.02, torsoRoll: -0.03 },
  { t: 0.875, legL: -0.22, legR:  0.34, armL:  0.26, armR: -0.26, bobY: -0.04, torsoRoll: -0.01 },
  { t: 1.000, legL:  0.00, legR:  0.00, armL:  0.00, armR:  0.00, bobY: 0.00, torsoRoll:  0.00 }
];

function sampleRobloxWalkPose(phase) {
  const p = ((phase % 1) + 1) % 1;
  let a = ROBLOX_WALK_FRAMES[0];
  let b = ROBLOX_WALK_FRAMES[ROBLOX_WALK_FRAMES.length - 1];
  for (let i = 0; i < ROBLOX_WALK_FRAMES.length - 1; i++) {
    if (p >= ROBLOX_WALK_FRAMES[i].t && p <= ROBLOX_WALK_FRAMES[i + 1].t) {
      a = ROBLOX_WALK_FRAMES[i];
      b = ROBLOX_WALK_FRAMES[i + 1];
      break;
    }
  }
  const span = Math.max(1e-6, b.t - a.t);
  const alpha = (p - a.t) / span;
  return {
    legL: THREE.MathUtils.lerp(a.legL, b.legL, alpha),
    legR: THREE.MathUtils.lerp(a.legR, b.legR, alpha),
    armL: THREE.MathUtils.lerp(a.armL, b.armL, alpha),
    armR: THREE.MathUtils.lerp(a.armR, b.armR, alpha),
    bobY: THREE.MathUtils.lerp(a.bobY, b.bobY, alpha),
    torsoRoll: THREE.MathUtils.lerp(a.torsoRoll, b.torsoRoll, alpha)
  };
}

function buildRiggedAvatarFromGlb(glbScene, tintColor = null) {
  const rigRoot = new THREE.Group();
  const model = glbScene.clone(true);

  model.updateMatrixWorld(true);
  const rawBox = new THREE.Box3().setFromObject(model);
  const rawSize = new THREE.Vector3();
  rawBox.getSize(rawSize);
  const targetHeight = 4.6;
  const maxDim = Math.max(0.001, rawSize.y || Math.max(rawSize.x, rawSize.z));
  const scaleFactor = targetHeight / maxDim;
  model.scale.setScalar(scaleFactor);

  model.traverse((child) => {
    if (child.isMesh && child.material) {
      const mat = child.material.clone();
      mat.side = THREE.FrontSide;
      mat.depthWrite = true;
      mat.transparent = false;
      mat.opacity = 1;
      if (tintColor !== null) {
        mat.color.setHex(tintColor);
      }
      child.material = mat;
    }
  });

  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const center = new THREE.Vector3();
  box.getCenter(center);
  model.position.set(-center.x, -box.min.y, -center.z);

  const height = Math.max(2.0, box.max.y - box.min.y);
  const hipY = height * 0.42;
  const shoulderY = height * 0.78;

  const torsoPivot = new THREE.Group();
  torsoPivot.position.set(0, hipY, 0);

  const legLPivot = new THREE.Group();
  legLPivot.position.set(-0.45, hipY, 0);

  const legRPivot = new THREE.Group();
  legRPivot.position.set(0.45, hipY, 0);

  const armLPivot = new THREE.Group();
  armLPivot.position.set(-1.15, shoulderY, 0);

  const armRPivot = new THREE.Group();
  armRPivot.position.set(1.15, shoulderY, 0);

  model.traverse((child) => {
    if (!child.isMesh || !child.geometry) return;
    const baseGeo = child.geometry.clone();
    baseGeo.computeBoundingBox();
    const gBox = baseGeo.boundingBox;
    const gCenter = new THREE.Vector3();
    gBox.getCenter(gCenter);

    const relX = gCenter.x - center.x;
    const relY = gCenter.y - box.min.y;

    const partMesh = new THREE.Mesh(baseGeo, child.material);
    partMesh.position.copy(model.position);
    partMesh.scale.copy(model.scale);
    partMesh.rotation.copy(model.rotation);

    if (relY < hipY * 0.95) {
      if (relX < 0) {
        partMesh.position.x -= legLPivot.position.x;
        partMesh.position.y -= legLPivot.position.y;
        legLPivot.add(partMesh);
      } else {
        partMesh.position.x -= legRPivot.position.x;
        partMesh.position.y -= legRPivot.position.y;
        legRPivot.add(partMesh);
      }
    } else if (relY > shoulderY * 0.75 && Math.abs(relX) > 0.75) {
      if (relX < 0) {
        partMesh.position.x -= armLPivot.position.x;
        partMesh.position.y -= armLPivot.position.y;
        armLPivot.add(partMesh);
      } else {
        partMesh.position.x -= armRPivot.position.x;
        partMesh.position.y -= armRPivot.position.y;
        armRPivot.add(partMesh);
      }
    } else {
      partMesh.position.x -= torsoPivot.position.x;
      partMesh.position.y -= torsoPivot.position.y;
      torsoPivot.add(partMesh);
    }
  });

  rigRoot.add(torsoPivot, legLPivot, legRPivot, armLPivot, armRPivot);
  rigRoot.userData.limbs = {
    torsoPivot,
    legLPivot,
    legRPivot,
    armLPivot,
    armRPivot,
    baseHipY: hipY,
    baseShoulderY: shoulderY
  };
  return rigRoot;
}

function applyAvatarWalkAnimation(rigRoot, walkPhase, isMoving, isGrounded) {
  if (!rigRoot || !rigRoot.userData || !rigRoot.userData.limbs) return;
  const { torsoPivot, legLPivot, legRPivot, armLPivot, armRPivot, baseHipY, baseShoulderY } = rigRoot.userData.limbs;

  if (!isGrounded) {
    legLPivot.rotation.x = THREE.MathUtils.lerp(legLPivot.rotation.x, -0.35, 0.25);
    legRPivot.rotation.x = THREE.MathUtils.lerp(legRPivot.rotation.x, 0.28, 0.25);
    armLPivot.rotation.x = THREE.MathUtils.lerp(armLPivot.rotation.x, -0.55, 0.25);
    armRPivot.rotation.x = THREE.MathUtils.lerp(armRPivot.rotation.x, -0.55, 0.25);
    torsoPivot.rotation.z = THREE.MathUtils.lerp(torsoPivot.rotation.z, 0, 0.25);
    torsoPivot.position.y = baseHipY;
    return;
  }

  if (!isMoving) {
    legLPivot.rotation.x = THREE.MathUtils.lerp(legLPivot.rotation.x, 0, 0.22);
    legRPivot.rotation.x = THREE.MathUtils.lerp(legRPivot.rotation.x, 0, 0.22);
    armLPivot.rotation.x = THREE.MathUtils.lerp(armLPivot.rotation.x, 0, 0.22);
    armRPivot.rotation.x = THREE.MathUtils.lerp(armRPivot.rotation.x, currentEquippedItemName ? -0.45 : 0, 0.22);
    torsoPivot.rotation.z = THREE.MathUtils.lerp(torsoPivot.rotation.z, 0, 0.22);
    torsoPivot.position.y = THREE.MathUtils.lerp(torsoPivot.position.y, baseHipY, 0.22);
    return;
  }

  const pose = sampleRobloxWalkPose(walkPhase);
  legLPivot.rotation.x = pose.legL;
  legRPivot.rotation.x = pose.legR;
  armLPivot.rotation.x = pose.armL;
  armRPivot.rotation.x = currentEquippedItemName ? -0.45 : pose.armR;
  torsoPivot.rotation.z = pose.torsoRoll;
  torsoPivot.position.y = baseHipY + pose.bobY;
  armLPivot.position.y = baseShoulderY + pose.bobY;
  armRPivot.position.y = baseShoulderY + pose.bobY;
}

function createNoobAvatar(tintColor = null, attachToolGroup = null) {
  const holder = new THREE.Group();
  if (!cachedNoobGlb) return holder;
  const rig = buildRiggedAvatarFromGlb(cachedNoobGlb, tintColor);
  holder.userData.rig = rig;
  holder.add(rig);

  if (attachToolGroup && rig.userData.limbs) {
    attachToolGroup.position.set(0, -0.2, -0.5);
    attachToolGroup.rotation.set(Math.PI / 3, 0, 0);
    rig.userData.limbs.armRPivot.add(attachToolGroup);
  }
  return holder;
}

function colorForPeer(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  const palette = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff9f1c, 0xc77dff];
  return palette[h % palette.length];
}

function refreshAvatarMeshes() {
  if (!cachedNoobGlb) return;
  while (character.children.length > 0) character.remove(character.children[0]);
  character.add(createNoobAvatar(null, heldItemsGroup));
  remotePlayers.forEach((entry, id) => {
    while (entry.group.children.length > 0) entry.group.remove(entry.group.children[0]);
    const rTool = new THREE.Group();
    remoteHeldItems.set(id, rTool);
    entry.group.add(createNoobAvatar(colorForPeer(id), rTool));
  });
}

gltfLoader.load(
  AVATAR_GLB_URL,
  (gltf) => {
    cachedNoobGlb = gltf.scene;
    refreshAvatarMeshes();
  },
  undefined,
  (err) => {
    console.error("Failed to load avatar GLB:", AVATAR_GLB_URL, err);
  }
);

function updateLeaderboard(presenceState) {
  const rows = [];
  const seen = new Set();

  rows.push({ id: peerId, name: username + (isHost ? " [Host]" : ""), score: 100 });
  seen.add(peerId);

  if (presenceState) {
    Object.values(presenceState).forEach((list) => {
      (list || []).forEach((meta) => {
        if (!meta || !meta.peerId || seen.has(meta.peerId)) return;
        seen.add(meta.peerId);
        rows.push({
          id: meta.peerId,
          name: (meta.username || "Player") + (meta.peerId === hostId ? " [Host]" : ""),
          score: 100
        });
      });
    });
  }

  playerCountEl.textContent = String(rows.length);
  leaderboardBody.innerHTML = rows
    .map((r) => `<div class="lb-row"><span>${escapeHtml(r.name)}</span><span>${r.score}</span></div>`)
    .join("");
}

function recomputeHostFromPresence(state) {
  const allPeers = new Set([peerId]);
  if (state) {
    Object.values(state).forEach((list) => {
      (list || []).forEach((m) => {
        if (m && m.peerId) allPeers.add(m.peerId);
      });
    });
  }
  const sorted = Array.from(allPeers).sort();
  hostId = sorted[0] || peerId;
  const wasHost = isHost;
  isHost = hostId === peerId;
  serverRoleLabel.textContent = isHost ? "Server: Hosting in Browser" : "Server: Connected to Host";
  if (isHost && !wasHost && allPeers.size > 1) {
    addChat("System", "You are now hosting this game server in your browser.");
  }
  updateLeaderboard(state);
}

function removeRemotePlayer(id) {
  const entry = remotePlayers.get(id);
  if (entry) {
    remotePlayersGroup.remove(entry.group);
    remotePlayers.delete(id);
  }
}

function clearAllRemotePlayers() {
  Array.from(remotePlayers.keys()).forEach(removeRemotePlayer);
}

function upsertRemotePlayer(id, name, x, y, z, rotY, moving = false, phase = 0, equippedItem = "") {
  if (!id || id === peerId) return;
  let entry = remotePlayers.get(id);
  if (!entry) {
    const rTool = new THREE.Group();
    remoteHeldItems.set(id, rTool);
    const group = createNoobAvatar(colorForPeer(id), rTool);
    remotePlayersGroup.add(group);
    entry = { group, name: name || "Player", walkPhase: 0, equippedItem: "" };
    remotePlayers.set(id, entry);
    addChat("System", `${name || "Player"} joined the server.`);
  }
  entry.group.position.set(Number(x) || 0, Number(y) || 0, Number(z) || 0);
  entry.group.rotation.y = Number(rotY) || 0;
  entry.walkPhase = Number(phase) || entry.walkPhase || 0;

  if (equippedItem && equippedItem !== entry.equippedItem) {
    entry.equippedItem = equippedItem;
    const rTool = remoteHeldItems.get(id);
    if (rTool) {
      while (rTool.children.length > 0) rTool.remove(rTool.children[0]);
      const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.9, 10), new THREE.MeshStandardMaterial({ color: 0x333842 }));
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.3), new THREE.MeshStandardMaterial({ color: 0x00a2ff }));
      blade.position.set(0, 1.2, 0);
      rTool.add(grip, blade);
    }
  }

  const rig = entry.group.userData?.rig || entry.group.children[0];
  applyAvatarWalkAnimation(rig, entry.walkPhase, Boolean(moving), true);
}

async function resolveGameXml(gameRow) {
  const rawXml = gameRow?.xml;
  if (typeof rawXml === "string" && rawXml.trim()) {
    const trimmed = rawXml.trim();
    if (trimmed.startsWith("<")) {
      return trimmed;
    }
    if (/^https?:\/\//i.test(trimmed)) {
      const res = await fetch(trimmed);
      if (res.ok) return await res.text();
    }
  }
  return "";
}

async function joinSelectedGame(selectedId) {
  placeId = String(selectedId || "");
  if (!placeId) return;

  let gameRow = gamesCache.find((g) => String(g.id) === placeId);
  const { data: rows, error } = await sb
    .from("games")
    .select("*")
    .eq("id", placeId)
    .limit(1);

  if (!error && Array.isArray(rows) && rows[0]) {
    gameRow = rows[0];
  }

  const xmlText = await resolveGameXml(gameRow);
  readXmlFromBrowser(xmlText);

  clearAllRemotePlayers();
  isHost = false;
  hostId = peerId;
  serverRoleLabel.textContent = "Server: Joining...";

  if (activeChannel) {
    await sb.removeChannel(activeChannel);
    activeChannel = null;
  }

  const roomChannel = sb.channel("bloxtip_server_place_" + placeId, {
    config: { presence: { key: peerId } }
  });

  roomChannel
    .on("presence", { event: "sync" }, () => {
      const state = roomChannel.presenceState();
      recomputeHostFromPresence(state);
      const activeIds = new Set();
      Object.values(state).forEach((list) => {
        (list || []).forEach((m) => {
          if (m && m.peerId && m.peerId !== peerId) activeIds.add(m.peerId);
        });
      });
      Array.from(remotePlayers.keys()).forEach((id) => {
        if (!activeIds.has(id)) {
          const leftName = remotePlayers.get(id)?.name || "Player";
          removeRemotePlayer(id);
          addChat("System", `${leftName} left the server.`);
        }
      });
    })
    .on("broadcast", { event: "pos" }, ({ payload }) => {
      if (!payload || payload.peerId === peerId) return;
      upsertRemotePlayer(
        payload.peerId,
        payload.username,
        payload.x,
        payload.y,
        payload.z,
        payload.rotY,
        payload.moving,
        payload.walkPhase,
        payload.equippedItem
      );
    })
    .on("broadcast", { event: "chat" }, ({ payload }) => {
      if (!payload || payload.peerId === peerId) return;
      addChat(payload.username || "Player", payload.text || "");
    })
    .subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        await roomChannel.track({
          peerId,
          username,
          placeId,
          joinedAt: Date.now()
        });
        recomputeHostFromPresence(roomChannel.presenceState());
        addChat("System", `Connected to "${gameRow?.title || gameRow?.name || placeId}".`);
      }
    });

  activeChannel = roomChannel;
}

chatForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const val = chatInput.value.trim();
  if (!val) return;
  addChat(username, val);
  if (activeChannel) {
    activeChannel.send({
      type: "broadcast",
      event: "chat",
      payload: { peerId, username, text: val }
    });
  }
  chatInput.value = "";
  chatInput.blur();
});

async function fetchAllGamesFromTable() {
  const allRows = [];
  const pageSize = 1000;
  let from = 0;

  while (true) {
    const { data: batch, error } = await sb
      .from("games")
      .select("*")
      .range(from, from + pageSize - 1);

    if (error) {
      throw error;
    }

    if (!Array.isArray(batch) || batch.length === 0) {
      break;
    }

    allRows.push(...batch);
    if (batch.length < pageSize) {
      break;
    }
    from += pageSize;
  }

  // Deduplicate by id if present while preserving order
  const seen = new Set();
  const deduped = [];
  for (const row of allRows) {
    const key = row && row.id !== undefined && row.id !== null ? String(row.id) : JSON.stringify(row);
    if (!seen.has(key)) {
      seen.add(key);
      deduped.push(row);
    }
  }

  deduped.sort((a, b) => {
    const idA = a?.id ?? "";
    const idB = b?.id ?? "";
    const numA = Number(idA);
    const numB = Number(idB);
    if (Number.isFinite(numA) && Number.isFinite(numB)) return numA - numB;
    return String(idA).localeCompare(String(idB));
  });

  return deduped;
}

async function loadGamesTable() {
  try {
    const rows = await fetchAllGamesFromTable();
    if (!Array.isArray(rows) || rows.length === 0) {
      gameSelect.innerHTML = `<option value="">No games in games table</option>`;
      return;
    }

    gamesCache = rows;
    gameSelect.innerHTML = rows
      .map((g, idx) => {
        const val = g.id !== undefined && g.id !== null ? String(g.id) : String(idx);
        const label = g.title || g.name || g.placeName || g.id || `Game ${idx + 1}`;
        return `<option value="${escapeHtml(val)}">${escapeHtml(label)}</option>`;
      })
      .join("");

    if (!placeId || !rows.some((g, idx) => String(g.id ?? idx) === String(placeId))) {
      placeId = String(rows[0].id ?? 0);
    }
    gameSelect.value = placeId;
    await joinSelectedGame(placeId);
  } catch (error) {
    console.error("Failed to load all games from Supabase games table:", error);
    gameSelect.innerHTML = `<option value="">Error loading games</option>`;
  }
}

loadGameBtn.addEventListener("click", () => {
  if (!gameSelect.value) return;
  const nextUrl = new URL(window.location.href);
  nextUrl.searchParams.set("placeId", gameSelect.value);
  window.history.replaceState({}, "", nextUrl.toString());
  joinSelectedGame(gameSelect.value);
});

const keys = {};
window.addEventListener("keydown", (e) => {
  if (document.activeElement === chatInput) return;
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => {
  keys[e.code] = false;
});

let camYaw = 0;
let camPitch = 0.35;
let camDist = 14;
let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("mousedown", (e) => {
  if (e.button === 2 || e.button === 0) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  }
});
window.addEventListener("mouseup", () => { dragging = false; });
window.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.007;
  camPitch = Math.max(0.08, Math.min(1.3, camPitch + (e.clientY - lastY) * 0.007));
  lastX = e.clientX;
  lastY = e.clientY;
});
canvas.addEventListener("wheel", (e) => {
  camDist = Math.max(5, Math.min(35, camDist + e.deltaY * 0.01));
});

let velY = 0;
let grounded = true;

function resetCharacter() {
  character.position.set(0, 0.2, 0);
  velY = 0;
  grounded = true;
}
resetCharacter();

document.getElementById("reset-btn").addEventListener("click", resetCharacter);
document.getElementById("leave-btn").addEventListener("click", async () => {
  if (activeChannel) {
    await sb.removeChannel(activeChannel);
  }
  window.location.href = "/home.html";
});

window.addEventListener("resize", () => {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
});

loadGamesTable();

let prev = performance.now();
let lastSyncTime = 0;
let walkPhase = 0;

function animate(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;

  let moveX = 0;
  let moveZ = 0;
  if (keys["KeyW"] || keys["ArrowUp"]) moveZ -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) moveZ += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) moveX -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) moveX += 1;

  const isMoving = moveX !== 0 || moveZ !== 0;
  if (isMoving) {
    const len = Math.hypot(moveX, moveZ);
    moveX /= len;
    moveZ /= len;
    const sin = Math.sin(camYaw);
    const cos = Math.cos(camYaw);
    const wx = moveX * cos + moveZ * sin;
    const wz = moveZ * cos - moveX * sin;
    character.position.x = Math.max(-62, Math.min(62, character.position.x + wx * 16 * dt));
    character.position.z = Math.max(-62, Math.min(62, character.position.z + wz * 16 * dt));
    character.rotation.y = Math.atan2(wx, wz);
    walkPhase = (walkPhase + dt * 1.15) % 1;
  }

  if (keys["Space"] && grounded) {
    velY = 18;
    grounded = false;
  }

  velY -= 48 * dt;
  character.position.y += velY * dt;
  if (character.position.y <= 0.2) {
    character.position.y = 0.2;
    velY = 0;
    grounded = true;
  }

  for (const pItem of pickupItems) {
    if (!pItem.collected && pItem.mesh) {
      pItem.mesh.rotation.y += dt * 1.6;
      const dist = character.position.distanceTo(pItem.pickupPos);
      if (dist < 4.2) {
        pItem.collected = true;
        pItem.mesh.visible = false;
        equipItemOnAvatar(pItem.name);
        addChat("System", `Picked up ${pItem.name}.`);
      }
    }
  }

  const localRig = character.userData?.rig || character.children[0];
  applyAvatarWalkAnimation(localRig, walkPhase, isMoving, grounded);

  if (activeChannel && now - lastSyncTime > 65) {
    lastSyncTime = now;
    activeChannel.send({
      type: "broadcast",
      event: "pos",
      payload: {
        peerId,
        username,
        x: Number(character.position.x.toFixed(2)),
        y: Number(character.position.y.toFixed(2)),
        z: Number(character.position.z.toFixed(2)),
        rotY: Number(character.rotation.y.toFixed(2)),
        moving: isMoving,
        walkPhase: Number(walkPhase.toFixed(3)),
        equippedItem: currentEquippedItemName
      }
    });
  }

  const target = new THREE.Vector3(character.position.x, character.position.y + 3, character.position.z);
  const horiz = Math.cos(camPitch) * camDist;
  camera.position.set(
    target.x + Math.sin(camYaw) * horiz,
    target.y + Math.sin(camPitch) * camDist,
    target.z + Math.cos(camYaw) * horiz
  );
  camera.lookAt(target);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
