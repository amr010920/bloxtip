        return createLuaTable([false, err && err.message ? err.message : String(err)]);
      }
    },
    xpcall: (fn, errHandler, ...args) => {
      try {
        const res = fn(...args);
        return createLuaTable([true, res]);
      } catch (err) {
        const msg = err && err.message ? err.message : String(err);
        try { if (typeof errHandler === "function") errHandler(msg); } catch (_) {}
        return createLuaTable([false, msg]);
      }
    },
    select: (index, ...args) => {
      if (index === "#") return args.length;
      const i = Math.max(0, Number(index) - 1);
      return args[i];
    },
    unpack: (t) => {
      if (t && t.__isLuaTable) return t.__arr[0];
      return Array.isArray(t) ? t[0] : undefined;
    },
    ipairs: (t) => {
      if (t && t.__isLuaTable) {
        const rows = [];
        for (let i = 0; i < t.__arr.length; i++) {
          if (t.__arr[i] !== undefined) rows.push([i + 1, t.__arr[i]]);
        }
        return rows;
      }
      const arr = Array.isArray(t) ? t : Object.values(t || {});
      return arr.map((v, idx) => [idx + 1, v]);
    },
    pairs: (t) => {
      if (t && t.__isLuaTable) {
        const rows = [];
        for (let i = 0; i < t.__arr.length; i++) {
          if (t.__arr[i] !== undefined) rows.push([i + 1, t.__arr[i]]);
        }
        for (const [k, v] of Object.entries(t.__map)) {
          rows.push([k, v]);
        }
        return rows;
      }
      if (Array.isArray(t)) return t.map((v, idx) => [idx + 1, v]);
      return Object.entries(t || {});
    },
    tick: () => performance.now() / 1000,
    time: () => performance.now() / 1000,
    elapsedTime: () => performance.now() / 1000,
    wait: (sec = 0.05) => new Promise((r) => setTimeout(r, Math.max(10, Number(sec || 0.05) * 1000))),
    task: {
      wait: (sec = 0.05) => new Promise((r) => setTimeout(r, Math.max(10, Number(sec || 0.05) * 1000))),
      spawn: (fn, ...args) => {
        if (typeof fn === "function") {
          Promise.resolve().then(() => fn(...args)).catch((e) => addChat("ScriptWarn", String(e)));
        }
      },
      defer: (fn, ...args) => {
        if (typeof fn === "function") {
          queueMicrotask(() => {
            try { fn(...args); } catch (e) { addChat("ScriptWarn", String(e)); }
          });
        }
      },
      delay: (sec, fn, ...args) => {
        const ms = Math.max(10, Number(sec || 0.05) * 1000);
        setTimeout(() => {
          if (typeof fn === "function") {
            try { fn(...args); } catch (e) { addChat("ScriptWarn", String(e)); }
          }
        }, ms);
      }
    },
    delay: (sec, fn) => setTimeout(() => { if (typeof fn === "function") { try { fn(); } catch (_) {} } }, Math.max(10, Number(sec || 0.05) * 1000)),
    spawn: (fn) => { if (typeof fn === "function") Promise.resolve().then(() => { try { fn(); } catch (_) {} }); },
    print: (...args) => addChat(scriptName, args.map(luauTostring).join(" ")),
    warn: (...args) => addChat(scriptName + " [WARN]", args.map(luauTostring).join(" "))
  };

  try {
    parseAndRunLuau(code, envGlobals, scriptName);
  } catch (err) {
    addChat("ScriptError", scriptName + ": " + (err && err.message ? err.message : String(err)));
  }
}

function processStudioItem(item, parentGroup, defaultSpawnPosRef, worldItemsCollector) {
  if (!item || item.tagName !== "Item") return;
  const cls = item.getAttribute("class") || "";
  const props = findPropElement(item, "Properties") || item.firstElementChild;
  const name = props ? readStr(props, "Name", cls) : cls;

  if (cls === "StarterGui") {
    for (const ch of Array.from(item.children)) {
      if (ch.tagName === "Item") buildGuiHierarchy(ch, robloxGuiLayer);
    }
    return;
  }

  if (cls === "Script" || cls === "LocalScript" || cls === "ModuleScript") {
    if (props) {
      const src = readStr(props, "Source", "") || readStr(props, "Code", "") || readStr(props, "ScriptSource", "");
      if (src.trim()) {
        queuedScripts.push({ name, source: src });
      }
    }
    return;
  }

  if (cls === "Workspace" && props) {
    const gVal = readNum(props, "Gravity", null);
    if (gVal !== null && gVal > 0) studioConfig.gravity = gVal;
    const fpHeight = readNum(props, "FallenPartsDestroyHeight", null);
    if (fpHeight !== null) studioConfig.fallenPartsDestroyHeight = fpHeight;
  }

  if ((cls === "StarterPlayer" || cls === "StarterCharacterScripts") && props) {
    const ws = readNum(props, "CharacterWalkSpeed", null);
    const jp = readNum(props, "CharacterJumpPower", null);
    if (ws !== null && ws > 0) studioConfig.walkSpeed = ws;
    if (jp !== null && jp > 0) studioConfig.jumpPower = jp;
  }

  if (cls === "Lighting" && props) {
    const ambientHex = parseColorFromProps(props, null);
    if (ambientHex !== null) {
      studioConfig.ambientColor = ambientHex;
    }
    const skyHex = parseColor3Value(findPropElement(props, "OutdoorAmbient") || findPropElement(props, "FogColor"), null);
    if (skyHex !== null) {
      studioConfig.outdoorAmbientColor = skyHex;
      studioConfig.fogColor = skyHex;
      studioConfig.skyBottomColor = skyHex;
    }
    const fogEnd = readNum(props, "FogEnd", null);
    const fogStart = readNum(props, "FogStart", null);
    if (fogEnd !== null && fogEnd > 0) {
      studioConfig.fogEnd = fogEnd;
      studioConfig.fogStart = fogStart !== null ? fogStart : Math.min(40, fogEnd * 0.25);
    }
    const todStr = readStr(props, "TimeOfDay", "");
    if (todStr && todStr.includes(":")) {
      const parts = todStr.split(":").map(Number);
      if (parts.length >= 2 && Number.isFinite(parts[0]) && Number.isFinite(parts[1])) {
        studioConfig.dayTimeMinutes = parts[0] * 60 + parts[1];
      }
    }
    updateSkyAndLighting();
  }

  const isToolOrItem = (
    cls === "Tool" ||
    cls === "HopperBin" ||
    cls === "Accoutrement" ||
    cls === "Hat" ||
    cls === "Accessory"
  );

  if (isToolOrItem && props) {
    const cfEl = findPropElement(props, "CFrame") || findPropElement(props, "Grip") || findPropElement(props, "CoordinateFrame");
    const hasExplicitWorldPos = Boolean(
      cfEl && (
        cfEl.getElementsByTagName("X")[0] !== undefined ||
        cfEl.getElementsByTagName("Y")[0] !== undefined ||
        cfEl.getElementsByTagName("Z")[0] !== undefined
      )
    );
    const visual = createVisualItemMesh(item, props);
    const colorHex = parseColorFromProps(props, 0xc0c8d0);
    const { texUrl } = extractTextureOrMeshUrl(item, props);

    if (hasExplicitWorldPos) {
      const { matrix4 } = parseCFrameMatrix(cfEl);
      const posVec = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scaleVec = new THREE.Vector3();
      matrix4.decompose(posVec, quat, scaleVec);
      visual.position.copy(posVec);
      visual.quaternion.copy(quat);
      parentGroup.add(visual);
      if (worldItemsCollector) {
        worldItemsCollector.push({ name, colorHex, texUrl, mesh: visual, pickupPos: posVec.clone(), collected: false });
      }
    } else {
      giveItemToBackpack(name, colorHex, backpackItems.length === 0, texUrl);
    }
  }

  const isPartLike = (
    cls === "Part" ||
    cls === "SpawnLocation" ||
    cls === "WedgePart" ||
    cls === "TrussPart" ||
    cls === "CornerWedgePart" ||
    cls === "Cylinder" ||
    cls === "CylinderPart" ||
    cls === "Ball" ||
    cls === "SpherePart" ||
    cls === "MeshPart" ||
    cls === "Seat" ||
    cls === "VehicleSeat" ||
    cls === "FlagStand"
  );

  if (isPartLike && props) {
    const anchored = readBool(props, "Anchored", true);
    const canCollide = readBool(props, "CanCollide", true);

    if (name === "Baseplate") {
      const sizeEl = findPropElement(props, "size") || findPropElement(props, "Size");
      const cfEl = findPropElement(props, "CFrame");
      if (sizeEl) {
        const bx = Math.max(4, readNum(sizeEl, "X", 128));
        const by = Math.max(1, readNum(sizeEl, "Y", 2));
        const bz = Math.max(4, readNum(sizeEl, "Z", 128));
        baseplate.geometry.dispose();
        baseplate.geometry = new THREE.BoxGeometry(bx, by, bz);
      }
      if (cfEl) {
        baseplate.position.set(readNum(cfEl, "X", 0), readNum(cfEl, "Y", -1), readNum(cfEl, "Z", 0));
      }
      const bpColor = parseColorFromProps(props, null);
      if (bpColor !== null && baseplate.material) {
        baseplate.material.color.setHex(bpColor);
      }
      baseplate.userData.canCollide = canCollide;
      baseplate.userData.anchored = anchored;
      return;
    }

    const sizeEl = findPropElement(props, "size") || findPropElement(props, "Size");
    const sx = sizeEl ? readNum(sizeEl, "X", 4) : 4;
    const sy = sizeEl ? readNum(sizeEl, "Y", 2) : 2;
    const sz = sizeEl ? readNum(sizeEl, "Z", 4) : 4;

    const cfEl = findPropElement(props, "CFrame") || findPropElement(props, "CoordinateFrame");
    const { x: px, y: py, z: pz, matrix4 } = parseCFrameMatrix(cfEl);

    if (cls === "SpawnLocation" && !defaultSpawnPosRef.set) {
      defaultSpawnPosRef.set = true;
      defaultSpawnPosRef.x = px;
      defaultSpawnPosRef.y = py + Math.max(0.4, sy / 2 + 0.1);
      defaultSpawnPosRef.z = pz;
      spawnPad.position.set(px, py - sy / 2 + 0.2, pz);
    }

    const colorHex = parseColorFromProps(props, cls === "SpawnLocation" ? 0xd9dde2 : 0x00a2ff);
    const { texUrl, meshUrl } = extractTextureOrMeshUrl(item, props);
    const shape = getPartShape(item, props, cls);
    const geomOrGroup = buildGeometryForPart(shape, sx, sy, sz);
    const mat = materialPropsFromRoblox(props, colorHex, texUrl);

    const partHolder = new THREE.Group();
    if (geomOrGroup.isGroup) {
      geomOrGroup.traverse((child) => {
        if (child.isMesh) {
          child.material = mat;
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      partHolder.add(geomOrGroup);
    } else {
      const mesh = new THREE.Mesh(geomOrGroup, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      partHolder.add(mesh);
    }

    const posVec = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scaleVec = new THREE.Vector3();
    matrix4.decompose(posVec, quat, scaleVec);
    partHolder.position.copy(posVec);
    partHolder.quaternion.copy(quat);
    partHolder.userData.canCollide = canCollide;
    partHolder.userData.anchored = anchored;

    attachLightsFromItem(item, partHolder);
    parentGroup.add(partHolder);

    dynamicParts.push({
      name,
      holder: partHolder,
      anchored,
      canCollide,
      velY: 0,
      halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2),
      touchedCallbacks: [],
      destroyed: false
    });

    const lowerName = name.toLowerCase();
    if (lowerName.includes("kill") || lowerName.includes("lava") || lowerName.includes("acid") || lowerName.includes("spike")) {
      interactiveParts.push({ type: "kill", mesh: partHolder, canCollide, halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2) });
    } else if (lowerName.includes("jump") || lowerName.includes("bounce") || lowerName.includes("pad")) {
      interactiveParts.push({ type: "jump", mesh: partHolder, canCollide, halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2), boost: 85 });
    } else if (lowerName.includes("speed") || lowerName.includes("boost")) {
      interactiveParts.push({ type: "speed", mesh: partHolder, canCollide, halfExtents: new THREE.Vector3(sx / 2, sy / 2, sz / 2), speed: 34 });
    }

    if (meshUrl && /^https?:\/\//i.test(meshUrl) && meshUrl.toLowerCase().endsWith(".glb")) {
      gltfLoader.load(
        meshUrl,
        (gltf) => {
          while (partHolder.children.length > 0) partHolder.remove(partHolder.children[0]);
          const mScene = gltf.scene;
          mScene.scale.set(sx / 2, sy / 2, sz / 2);
          partHolder.add(mScene);
        },
        undefined,
        () => {}
      );
    }
  }

  for (const child of Array.from(item.children)) {
    if (child.tagName === "Item") {
      processStudioItem(child, parentGroup, defaultSpawnPosRef, worldItemsCollector);
    }
  }
}

const playerPos = new THREE.Vector3(0, 0.5, 0);
const playerVel = new THREE.Vector3(0, 0, 0);
let playerYaw = 0;
let isGrounded = false;
let isJumping = false;
let isAttacking = false;
let attackTimer = 0;
let currentSpawn = { x: 0, y: 0.5, z: 0 };
let speedBoostTimer = 0;

let floorCacheTime = 0;
let cachedFloorBoxes = [];

function invalidateFloorCache() {
  floorCacheTime = 0;
  cachedFloorBoxes = [];
}

function syncLocalAvatarTransform() {
  try {
    const avatar = ensureLocalAvatarExists();
    if (!Number.isFinite(playerPos.x) || !Number.isFinite(playerPos.y) || !Number.isFinite(playerPos.z)) {
      playerPos.set(currentSpawn.x || 0, (currentSpawn.y || 0.5) + 0.5, currentSpawn.z || 0);
    }
    const footOff = Number.isFinite(avatar.footOffset) ? avatar.footOffset : 0.05;
    avatar.container.position.set(playerPos.x, playerPos.y + footOff, playerPos.z);
    avatar.container.rotation.y = Number.isFinite(playerYaw) ? playerYaw : 0;
    avatar.container.updateMatrixWorld(true);

    const anchorTarget = avatar.parts?.torso || avatar.parts?.root || avatar.container;
    const anchorWorldPos = new THREE.Vector3();
    anchorTarget.getWorldPosition(anchorWorldPos);
    if (Number.isFinite(anchorWorldPos.x) && Number.isFinite(anchorWorldPos.y) && Number.isFinite(anchorWorldPos.z)) {
      playerCameraRig.position.copy(anchorWorldPos);
    } else {
      playerCameraRig.position.set(playerPos.x, playerPos.y + 2.5, playerPos.z);
    }
  } catch (_) {
    playerCameraRig.position.set(playerPos.x || 0, (playerPos.y || 0.5) + 2.5, playerPos.z || 0);
  }
}

function respawnLocalPlayer() {
  const avatar = ensureLocalAvatarExists();
  const footOff = avatar ? (avatar.footOffset || 0.05) : 0.05;
  playerPos.set(currentSpawn.x || 0, (currentSpawn.y || 0.5) + footOff + 0.5, currentSpawn.z || 0);
  playerVel.set(0, 0, 0);
  isGrounded = false;
  isJumping = false;
  speedBoostTimer = 0;
  syncLocalAvatarTransform();
  broadcastSelfState();
}

function loadPlaceXmlString(xmlText, gameRow = null) {
  try {
    clearWorldGroup();
    invalidateFloorCache();
    imageAssetMap.clear();
    registerImagesFromXmlOrRow(xmlText, gameRow);
    pickupItems = [];
    interactiveParts = [];
    dynamicParts = [];
    queuedScripts = [];
    heartbeatCallbacks.length = 0;
    steppedCallbacks.length = 0;
    renderSteppedCallbacks.length = 0;
    userInputBeganCallbacks.length = 0;
    userInputEndedCallbacks.length = 0;
    tweenServiceActive.length = 0;
    backpackItems = [];
    equippedIndex = -1;
    applyToolVisualToRig(ensureLocalAvatarExists(), "");
    renderHotbar();

    studioConfig.gravity = 196.2;
    studioConfig.walkSpeed = 16;
    studioConfig.jumpPower = 50;
    studioConfig.ambientColor = 0xffffff;
    studioConfig.outdoorAmbientColor = 0x87c6ff;
    studioConfig.fogColor = 0x87c6ff;
    studioConfig.fogStart = 80;
    studioConfig.fogEnd = 260;
    updateSkyAndLighting();

    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, "application/xml");
    const rootItems = Array.from(doc.documentElement ? doc.documentElement.children : []).filter((c) => c.tagName === "Item");
    const spawnRef = { set: false, x: 0, y: 0.5, z: 0 };

    rootItems.forEach((item) => {
      try {
        processStudioItem(item, worldGroup, spawnRef, pickupItems);
      } catch (itemErr) {
        addChat("WorldWarn", String(itemErr?.message || itemErr));
      }
    });

    if (spawnRef.set) {
      currentSpawn = { x: spawnRef.x, y: spawnRef.y, z: spawnRef.z };
    } else {
      currentSpawn = { x: 0, y: 0.5, z: 0 };
    }
    respawnLocalPlayer();

    for (const sc of queuedScripts) {
      runLuauScriptSource(sc.source, sc.name);
    }
  } catch (err) {
    addChat("WorldError", String(err?.message || err));
    currentSpawn = { x: 0, y: 0.5, z: 0 };
    respawnLocalPlayer();
  }
}

function looksLikeXml(raw) {
  if (typeof raw !== "string") return false;
  const s = raw.trim();
  return s.startsWith("<") && (s.includes("<Item") || s.includes("<roblox") || s.includes("<?xml"));
}

async function resolveXmlFromGameRow(place) {
  let row = place;

  if (sb && place && place.id !== undefined && place.id !== null) {
    const hasXml = typeof place.xml === "string" && place.xml.trim().length > 0;
    if (!hasXml) {
      try {
        const { data, error } = await sb
          .from("games")
          .select("*")
          .eq("id", place.id)
          .limit(1);
        if (!error && Array.isArray(data) && data[0]) {
          row = { ...place, ...data[0] };
        }
      } catch (_) {}
    }
  }

  if (row && typeof row.xml === "string" && row.xml.trim()) {
    const trimmedXml = row.xml.trim();
    if (looksLikeXml(trimmedXml)) {
      return { xml: trimmedXml, row };
    }
    if (/^https?:\/\//i.test(trimmedXml)) {
      try {
        const res = await fetch(trimmedXml);
        if (res.ok) {
          const fetched = await res.text();
          if (looksLikeXml(fetched)) return { xml: fetched.trim(), row };
        }
      } catch (_) {}
    }
  }

  if (row && typeof row.file_url === "string" && /^https?:\/\//i.test(row.file_url.trim())) {
    try {
      const res = await fetch(row.file_url.trim());
      if (res.ok) {
        const fetched = await res.text();
        if (looksLikeXml(fetched)) return { xml: fetched.trim(), row };
      }
    } catch (_) {}
  }

  return {
    xml: `<?xml version="1.0" encoding="utf-8"?>
<roblox version="4">
  <Item class="Workspace">
    <Properties>
      <string name="Name">Workspace</string>
      <float name="Gravity">196.2</float>
    </Properties>
    <Item class="SpawnLocation">
      <Properties>
        <string name="Name">SpawnLocation</string>
        <Vector3 name="Size"><X>8</X><Y>1</Y><Z>8</Z></Vector3>
        <CoordinateFrame name="CFrame"><X>0</X><Y>0.5</Y><Z>0</Z></CoordinateFrame>
        <bool name="Anchored">true</bool>
        <bool name="CanCollide">true</bool>
      </Properties>
    </Item>
    <Item class="Part">
      <Properties>
        <string name="Name">ClassicBrick</string>
        <Vector3 name="Size"><X>6</X><Y>4</Y><Z>6</Z></Vector3>
        <CoordinateFrame name="CFrame"><X>10</X><Y>2</Y><Z>-10</Z></CoordinateFrame>
        <int name="BrickColor">21</int>
        <bool name="Anchored">true</bool>
        <bool name="CanCollide">true</bool>
      </Properties>
    </Item>
  </Item>
</roblox>`,
    row
  };
}

function updateLeaderboard() {
  const entries = [{ id: peerId, name: username, isSelf: true }];
  remotePlayers.forEach((rp, id) => {
    entries.push({ id, name: rp.name || "Player", isSelf: false });
  });
  if (playerCountEl) playerCountEl.textContent = String(entries.length);
  leaderboardBody.innerHTML = "";
  entries.forEach((e) => {
    const row = document.createElement("div");
    row.className = "lb-row";
    const left = document.createElement("span");
    left.textContent = escapeHtml(e.name);
    const right = document.createElement("span");
    right.textContent = e.isSelf ? "You" : "Online";
    row.appendChild(left);
    row.appendChild(right);
    leaderboardBody.appendChild(row);
  });
}

function addOrUpdateRemotePlayer(id, payload) {
  if (!id || id === peerId) return;
  let rp = remotePlayers.get(id);
  if (!rp) {
    const tpl = cachedAvatarTemplate || buildFallbackRobloxRig();
    const avatarInst = createAnimatedAvatarInstance(tpl, payload.name || "Player");
    remotePlayersGroup.add(avatarInst.container);
    const footOff = avatarInst.footOffset || 0.05;
    const px = payload.x ?? 0;
    const py = (payload.y ?? 0.5) + footOff;
    const pz = payload.z ?? 0;
    avatarInst.container.position.set(px, py, pz);
    rp = {
      id,
      name: payload.name || "Player",
      avatarInst,
      footOffset: footOff,
      targetPos: new THREE.Vector3(px, py, pz),
      targetYaw: payload.yaw ?? 0,
      speedRatio: payload.speedRatio ?? 0,
      isGrounded: payload.isGrounded ?? true,
      isJumping: payload.isJumping ?? false,
      isAttacking: payload.isAttacking ?? false,
      toolName: payload.toolName || "",
      lastSeen: Date.now()
    };
    remotePlayers.set(id, rp);
    addChat("System", (payload.name || "Player") + " joined the server.");
    updateLeaderboard();
  } else {
    rp.name = payload.name || rp.name;
    rp.targetPos.set(
      payload.x ?? (rp.targetPos.x),
      (payload.y ?? (rp.targetPos.y - rp.footOffset)) + rp.footOffset,
      payload.z ?? (rp.targetPos.z)
    );
    rp.targetYaw = payload.yaw ?? rp.targetYaw;
    rp.speedRatio = payload.speedRatio ?? 0;
    rp.isGrounded = payload.isGrounded ?? true;
    rp.isJumping = payload.isJumping ?? false;
    rp.isAttacking = payload.isAttacking ?? false;
    rp.lastSeen = Date.now();
    if ((payload.toolName || "") !== rp.avatarInst.equippedToolName) {
      applyToolVisualToRig(rp.avatarInst, payload.toolName || "");
    }
  }
}

function removeRemotePlayer(id) {
  const rp = remotePlayers.get(id);
  if (!rp) return;
  remotePlayersGroup.remove(rp.avatarInst.container);
  remotePlayers.delete(id);
  addChat("System", (rp.name || "Player") + " left the server.");
  updateLeaderboard();
}

function broadcastSelfState() {
  if (!activeChannel || !channelSubscribed) return;
  try {
    const equippedTool = equippedIndex >= 0 && backpackItems[equippedIndex] ? backpackItems[equippedIndex].name : "";
    const horizSpeed = Math.hypot(playerVel.x, playerVel.z);
    const speedRatio = Math.min(1, horizSpeed / Math.max(1, studioConfig.walkSpeed));
    activeChannel.send({
      type: "broadcast",
      event: "state",
      payload: {
        peerId,
        name: username,
        x: playerPos.x,
        y: playerPos.y,
        z: playerPos.z,
        yaw: playerYaw,
        speedRatio,
        isGrounded,
        isJumping,
        isAttacking,
        toolName: equippedTool
      }
    });
  } catch (_) {}
}

async function discoverAndJoinMultiplayerServer(targetPlaceId) {
  if (!sb) {
    serverRoleLabel.textContent = "local mode";
    updateLeaderboard();
    return;
  }

  if (activeChannel) {
    channelSubscribed = false;
    try { await sb.removeChannel(activeChannel); } catch (_) {}
    activeChannel = null;
  }
  remotePlayers.forEach((_, id) => removeRemotePlayer(id));
  remotePlayers.clear();

  const cleanPlace = targetPlaceId || "default";
  serverRoleLabel.textContent = "finding server...";

  const candidateServers = [0, 1, 2, 3, 4].map((idx) => `bloxtip_${cleanPlace}_srv_${idx}`);
  let chosenServerId = activeServerId || "";
  let chosenIsHost = false;

  if (!chosenServerId) {
    for (const srvName of candidateServers) {
      const checkRes = await new Promise((resolve) => {
        let probe = null;
        try {
          probe = sb.channel(srvName, { config: { presence: { key: peerId } } });
        } catch (_) {
          resolve({ exists: false, count: 0 });
          return;
        }
        let settled = false;
        const finish = (val) => {
          if (!settled) {
            settled = true;
            if (probe) sb.removeChannel(probe).catch(() => {});
            resolve(val);
          }
        };
        setTimeout(() => finish({ exists: false, count: 0 }), 700);
        probe.on("presence", { event: "sync" }, () => {
          try {
            const st = probe.presenceState();
            const count = Object.keys(st).length;
            finish({ exists: count > 0, count });
          } catch (_) { finish({ exists: false, count: 0 }); }
        });
        probe.subscribe((status) => {
          if (status === "SUBSCRIBED") {
            setTimeout(() => {
              try {
                const st = probe.presenceState();
                const count = Object.keys(st).length;
                finish({ exists: count > 0, count });
              } catch (_) { finish({ exists: false, count: 0 }); }
            }, 350);
          }
        });
      });

      if (checkRes.exists && checkRes.count < MAX_SERVER_PLAYERS) {
        chosenServerId = srvName;
        chosenIsHost = false;
        break;
      }
    }
  }

  if (!chosenServerId) {
    chosenServerId = candidateServers[0];
    chosenIsHost = true;
  }

  activeServerId = chosenServerId;
  isHost = chosenIsHost;
  hostId = isHost ? peerId : "";
  channelSubscribed = false;

  const ch = sb.channel(chosenServerId, {
    config: {
      presence: { key: peerId },
      broadcast: { ack: false }
    }
  });

  ch.on("presence", { event: "sync" }, () => {
    try {
      const state = ch.presenceState();
      const keys = Object.keys(state).sort();
      if (keys.length > 0 && keys[0] === peerId) {
        isHost = true;
        hostId = peerId;
      } else if (keys.length > 0) {
        isHost = false;
        hostId = keys[0];
      }
      serverRoleLabel.textContent = isHost ? `Host (${chosenServerId})` : `Multiplayer (${chosenServerId})`;

      keys.forEach((k) => {
        if (k !== peerId && !remotePlayers.has(k)) {
          const meta = (state[k] && state[k][0]) || {};
          addOrUpdateRemotePlayer(k, {
            name: meta.name || ("Player_" + k.slice(-4)),
            x: meta.x ?? 0,
            y: meta.y ?? 0.5,
            z: meta.z ?? 0,
            yaw: meta.yaw ?? 0
          });
        }
      });

      remotePlayers.forEach((_, k) => {
        if (!state[k]) removeRemotePlayer(k);
      });
      updateLeaderboard();
    } catch (_) {}
  });

  ch.on("presence", { event: "leave" }, ({ key }) => {
    if (key !== peerId) removeRemotePlayer(key);
  });

  ch.on("broadcast", { event: "state" }, ({ payload }) => {
    if (!payload || payload.peerId === peerId) return;
    addOrUpdateRemotePlayer(payload.peerId, payload);
  });

  ch.on("broadcast", { event: "chat" }, ({ payload }) => {
    if (!payload || payload.peerId === peerId) return;
    addChat(payload.sender || "Player", payload.text || "");
  });

  activeChannel = ch;
  ch.subscribe(async (status) => {
    if (status === "SUBSCRIBED") {
      channelSubscribed = true;
      try {
        await ch.track({
          name: username,
          x: playerPos.x,
          y: playerPos.y,
          z: playerPos.z,
          yaw: playerYaw
        });
      } catch (_) {}
      serverRoleLabel.textContent = isHost ? `Host (${chosenServerId})` : `Multiplayer (${chosenServerId})`;
      updateLeaderboard();
      broadcastSelfState();
    } else if (status === "CLOSED" || status === "CHANNEL_ERROR") {
      channelSubscribed = false;
    }
  });
}

async function loadGamesList() {
  let rows = [];
  if (sb) {
    try {
      const { data, error } = await sb.from("games").select("*");
      if (!error && Array.isArray(data) && data.length > 0) {
        rows = data;
      }
    } catch (_) {}
  }

  if (rows.length === 0) {
    rows = [
      { id: "classic_baseplate", title: "Classic Baseplate", creator: "amr010920" },
      { id: "obby_arena", title: "Obby & Physics Arena", creator: "amr010920" }
    ];
  }

  gamesCache = rows;
  return rows;
}

async function renderGamesModalList() {
  const rows = await loadGamesList();
  gamesGrid.innerHTML = "";
  rows.forEach((g, idx) => {
    const gId = String(g.id ?? idx);
    const title = String(g.title || g.name || ("Game " + (idx + 1)));
    const creator = String(g.creator || "amr010920");
    const yearStr = g.year ? ` (${g.year})` : "";
    const card = document.createElement("div");
    card.className = "game-card";

    if (g.thumbnail_url && isSupportedWebUrl(String(g.thumbnail_url).trim())) {
      const thumb = document.createElement("img");
      thumb.className = "game-card-thumb";
      thumb.src = String(g.thumbnail_url).trim();
      thumb.alt = title;
      thumb.onerror = () => { thumb.remove(); };
      card.appendChild(thumb);
    }

    const titleEl = document.createElement("div");
    titleEl.className = "game-card-title";
    titleEl.textContent = title;

    const metaEl = document.createElement("div");
    metaEl.className = "game-card-meta";
    metaEl.textContent = `By ${creator}${yearStr}`;

    const joinBtn = document.createElement("button");
    joinBtn.className = "tb-btn";
    joinBtn.type = "button";
    joinBtn.textContent = gId === String(placeId) ? "Rejoin" : "Join";
    joinBtn.addEventListener("click", async () => {
      gamesModal.classList.remove("open");
      await selectAndLaunchGame(g);
    });

    card.appendChild(titleEl);
    card.appendChild(metaEl);
    card.appendChild(joinBtn);
    gamesGrid.appendChild(card);
  });
}

async function selectAndLaunchGame(gameOrId) {
  const titleText = typeof gameOrId === "object" && gameOrId !== null
    ? String(gameOrId.title || gameOrId.name || "Loading Game...")
    : "Loading Game...";
  showLoading("Loading " + titleText, "Reading xml column from games table...");

  try {
    ensureLocalAvatarExists();
    syncLocalAvatarTransform();

    if (!gamesCache || gamesCache.length === 0) {
      try { await loadGamesList(); } catch (_) {}
    }
    const targetId = typeof gameOrId === "object" && gameOrId !== null
      ? String(gameOrId.id ?? "")
      : String(gameOrId ?? "");
    const chosen = (typeof gameOrId === "object" && gameOrId !== null)
      ? gameOrId
      : (gamesCache.find((g) => String(g.id) === targetId) || gamesCache[0] || { id: targetId || "default", title: "Baseplate" });

    placeId = String(chosen.id ?? targetId ?? "default");
    activeServerId = "";

    updateLoadingStatus("Fetching xml for " + (chosen.title || chosen.name || placeId) + "...");
    const { xml, row } = await resolveXmlFromGameRow(chosen);

    updateLoadingStatus("Building 3D world from XML...");
    loadPlaceXmlString(xml, row);

    updateLoadingStatus("Connecting to multiplayer server...");
    try {
      await discoverAndJoinMultiplayerServer(placeId);
    } catch (_) {}
  } catch (err) {
    addChat("LoadWarn", String(err?.message || err));
  } finally {
    ensureLocalAvatarExists();
    syncLocalAvatarTransform();
    setTimeout(() => hideLoading(), 220);
  }
}

document.getElementById("reset-btn").addEventListener("click", () => {
  respawnLocalPlayer();
});

document.getElementById("leave-btn").addEventListener("click", async () => {
  if (sb && activeChannel) {
    channelSubscribed = false;
    try { await sb.removeChannel(activeChannel); } catch (_) {}
    activeChannel = null;
  }
  remotePlayers.forEach((_, id) => removeRemotePlayer(id));
  serverRoleLabel.textContent = "disconnected";
  updateLeaderboard();
});

chatForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const txt = chatInput.value.trim();
  if (!txt) return;
  addChat(username, txt);
  chatInput.value = "";
  if (activeChannel && channelSubscribed) {
    try {
      activeChannel.send({
        type: "broadcast",
        event: "chat",
        payload: { peerId, sender: username, text: txt }
      });
    } catch (_) {}
  }
});

const keysDown = new Set();
window.addEventListener("keydown", (e) => {
  if (document.activeElement === chatInput) return;
  keysDown.add(e.code);
  userInputBeganCallbacks.forEach((f) => { try { f({ KeyCode: e.code }); } catch (_) {} });

  if (e.code.startsWith("Digit")) {
    const num = parseInt(e.code.replace("Digit", ""), 10);
    if (num >= 1 && num <= 9) {
      equipBackpackSlot(num - 1);
    }
  }
  if (e.code === "Space" && isGrounded) {
    playerVel.y = studioConfig.jumpPower;
    isGrounded = false;
    isJumping = true;
  }
});

window.addEventListener("keyup", (e) => {
  keysDown.delete(e.code);
  userInputEndedCallbacks.forEach((f) => { try { f({ KeyCode: e.code }); } catch (_) {} });
});

canvas.addEventListener("mousedown", (e) => {
  if (e.button === 0 && equippedIndex >= 0) {
    isAttacking = true;
    attackTimer = 0.25;
    broadcastSelfState();
  }
});

let isRightDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;
let camPitch = 0.16;
let camDist = 4.2;

canvas.addEventListener("mousedown", (e) => {
  if (e.button === 2) {
    isRightDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    canvas.style.cursor = "grabbing";
  }
});
window.addEventListener("mouseup", (e) => {
  if (!e || e.button === 2 || e.button === undefined) {
    isRightDragging = false;
    canvas.style.cursor = "default";
  }
});
window.addEventListener("mousemove", (e) => {
  if (!isRightDragging) return;
  const dx = e.clientX - lastMouseX;
  const dy = e.clientY - lastMouseY;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  playerYaw -= dx * 0.0045;
  camPitch = Math.max(-0.55, Math.min(1.15, camPitch + dy * 0.004));
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("wheel", (e) => {
  camDist = Math.max(1.8, Math.min(14, camDist + e.deltaY * 0.006));
});

window.addEventListener("resize", () => {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (w > 0 && h > 0) {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
});

function refreshFloorBoxes(now) {
  if (now - floorCacheTime < 120 && cachedFloorBoxes.length > 0) return;
  floorCacheTime = now;
  const list = [];
  if (baseplate.userData.canCollide !== false) {
    list.push(new THREE.Box3().setFromObject(baseplate));
  }
  for (const child of worldGroup.children) {
    if (child.userData && child.userData.canCollide === false) continue;
    list.push(new THREE.Box3().setFromObject(child));
  }
  cachedFloorBoxes = list;
}

function getFloorHeightAt(x, z, currentY) {
  let highestFloor = -Infinity;
  for (let i = 0; i < cachedFloorBoxes.length; i++) {
    const box = cachedFloorBoxes[i];
    if (x >= box.min.x - 0.5 && x <= box.max.x + 0.5 && z >= box.min.z - 0.5 && z <= box.max.z + 0.5) {
      if (box.max.y <= currentY + 1.5 && box.max.y > highestFloor) {
        highestFloor = box.max.y;
      }
    }
  }
  return highestFloor;
}

function updatePhysicsAndPlayer(dt, now) {
  try {
    refreshFloorBoxes(now);

    for (let i = tweenServiceActive.length - 1; i >= 0; i--) {
      const tw = tweenServiceActive[i];
      tw.elapsed += dt;
      const alpha = Math.min(1, tw.elapsed / tw.dur);
      tw.onStep(alpha);
      if (alpha >= 1) tweenServiceActive.splice(i, 1);
    }

    for (const partRec of dynamicParts) {
      if (partRec.destroyed) continue;
      if (!partRec.anchored) {
        partRec.velY -= studioConfig.gravity * 0.12 * dt;
        partRec.holder.position.y += partRec.velY * dt;
        if (partRec.canCollide && partRec.holder.position.y - partRec.halfExtents.y <= 0) {
          partRec.holder.position.y = partRec.halfExtents.y;
          partRec.velY = 0;
        }
        if (partRec.holder.position.y < studioConfig.fallenPartsDestroyHeight) {
          partRec.destroyed = true;
          if (partRec.holder.parent) partRec.holder.parent.remove(partRec.holder);
        }
      }
      if (partRec.touchedCallbacks && partRec.touchedCallbacks.length > 0) {
        const p = partRec.holder.position;
        const dist = Math.hypot(playerPos.x - p.x, (playerPos.y + 2.0) - p.y, playerPos.z - p.z);
        if (dist < Math.max(partRec.halfExtents.x, partRec.halfExtents.y, partRec.halfExtents.z) + 2.5) {
          for (const cb of partRec.touchedCallbacks) {
            try { cb({ Name: username, Humanoid: { TakeDamage() {} } }); } catch (_) {}
          }
        }
      }
    }

    if (speedBoostTimer > 0) speedBoostTimer -= dt;
    if (attackTimer > 0) {
      attackTimer -= dt;
      if (attackTimer <= 0) isAttacking = false;
    }

    let moveForward = 0;
    let moveRight = 0;
    if (keysDown.has("KeyW") || keysDown.has("ArrowUp")) moveForward += 1;
    if (keysDown.has("KeyS") || keysDown.has("ArrowDown")) moveForward -= 1;
    if (keysDown.has("KeyD") || keysDown.has("ArrowRight")) moveRight += 1;
    if (keysDown.has("KeyA") || keysDown.has("ArrowLeft")) moveRight -= 1;

    const activeSpeed = speedBoostTimer > 0 ? 34 : studioConfig.walkSpeed;
    const forwardVec = new THREE.Vector3(-Math.sin(playerYaw), 0, -Math.cos(playerYaw));
    const rightVec = new THREE.Vector3(Math.cos(playerYaw), 0, -Math.sin(playerYaw));

    const wishDir = new THREE.Vector3()
      .addScaledVector(forwardVec, moveForward)
      .addScaledVector(rightVec, moveRight);
    if (wishDir.lengthSq() > 0) wishDir.normalize();

    playerVel.x = wishDir.x * activeSpeed;
    playerVel.z = wishDir.z * activeSpeed;

    playerVel.y -= studioConfig.gravity * 0.12 * dt;

    playerPos.x += playerVel.x * dt;
    playerPos.y += playerVel.y * dt;
    playerPos.z += playerVel.z * dt;

    const floorY = getFloorHeightAt(playerPos.x, playerPos.z, playerPos.y);
    if (floorY > -Infinity && playerPos.y <= floorY && playerVel.y <= 0) {
      playerPos.y = floorY;
      playerVel.y = 0;
      isGrounded = true;
      isJumping = false;
    } else {
      isGrounded = false;
    }

    if (playerPos.y < studioConfig.fallenPartsDestroyHeight) {
      respawnLocalPlayer();
    }

    for (const pItem of pickupItems) {
      if (pItem.collected) continue;
      pItem.mesh.rotation.y += dt * 2.0;
      if (playerPos.distanceTo(pItem.pickupPos) < 4.0) {
        pItem.collected = true;
        pItem.mesh.visible = false;
        giveItemToBackpack(pItem.name, pItem.colorHex || 0xc0c8d0, true, pItem.texUrl || "");
        addChat("System", "Picked up " + pItem.name + "!");
      }
    }

    for (const inter of interactiveParts) {
      if (inter.canCollide === false) continue;
      const pos = inter.mesh.position;
      const dx = Math.abs(playerPos.x - pos.x);
      const dy = Math.abs(playerPos.y + 2.5 - pos.y);
      const dz = Math.abs(playerPos.z - pos.z);
      if (dx <= inter.halfExtents.x + 1.2 && dy <= inter.halfExtents.y + 2.6 && dz <= inter.halfExtents.z + 1.2) {
        if (inter.type === "kill") {
          respawnLocalPlayer();
          break;
        } else if (inter.type === "jump") {
          playerVel.y = inter.boost || 85;
          isGrounded = false;
          isJumping = true;
        } else if (inter.type === "speed") {
          speedBoostTimer = 4.0;
        }
      }
    }

    steppedCallbacks.forEach((f) => { try { f(dt); } catch (_) {} });
    heartbeatCallbacks.forEach((f) => { try { f(dt); } catch (_) {} });
  } catch (_) {}

  const avatar = ensureLocalAvatarExists();
  syncLocalAvatarTransform();
  const horizSpeed = Math.hypot(playerVel.x || 0, playerVel.z || 0);
  const speedRatio = Math.min(1, horizSpeed / Math.max(1, studioConfig.walkSpeed));
  stepAvatarAnimation(avatar, dt, speedRatio, isGrounded, isJumping, isAttacking);

  const horizDist = Math.cos(camPitch) * camDist;
  const vertDist = Math.sin(camPitch) * camDist;

  camera.position.set(
    playerCameraRig.position.x + Math.sin(playerYaw) * horizDist,
    playerCameraRig.position.y + vertDist + 0.35,
    playerCameraRig.position.z + Math.cos(playerYaw) * horizDist
  );
  camera.lookAt(playerCameraRig.position.x, playerCameraRig.position.y + 0.35, playerCameraRig.position.z);
  skyDome.position.copy(camera.position);

  renderSteppedCallbacks.forEach((f) => { try { f(dt); } catch (_) {} });
}

let lastFrameTime = performance.now();
let lastBroadcastTime = 0;

function animate(now) {
  requestAnimationFrame(animate);
  try {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
    lastFrameTime = now;

    updatePhysicsAndPlayer(dt, now);

    remotePlayers.forEach((rp) => {
      try {
        rp.avatarInst.container.position.lerp(rp.targetPos, Math.min(1, dt * 14));
        rp.avatarInst.container.rotation.y = rp.targetYaw;
        stepAvatarAnimation(rp.avatarInst, dt, rp.speedRatio, rp.isGrounded, rp.isJumping, rp.isAttacking);
      } catch (_) {}
    });

    if (now - lastBroadcastTime > 65) {
      lastBroadcastTime = now;
      broadcastSelfState();
    }

    renderer.render(scene, camera);
  } catch (_) {
    try {
      ensureLocalAvatarExists();
      syncLocalAvatarTransform();
      renderer.render(scene, camera);
    } catch (_) {}
  }
}

(async function init() {
  showLoading("Starting Webclient...", "Loading");
  try {
    const tpl = await loadAvatarTemplate(AVATAR_GLB_URL);
    cachedAvatarTemplate = tpl;
    localAvatarInst = createAnimatedAvatarInstance(tpl, username);
    scene.add(localAvatarInst.container);
    syncLocalAvatarTransform();
    renderHotbar();
    updateLeaderboard();

    const rows = await loadGamesList();
    const initialGame = placeId
      ? (rows.find((g) => String(g.id) === String(placeId)) || { id: placeId, title: "Game" })
      : (rows[0] || { id: "default", title: "Baseplate" });
    await selectAndLaunchGame(initialGame);
  } catch (initErr) {
    addChat("InitWarn", String(initErr?.message || initErr));
    ensureLocalAvatarExists();
    syncLocalAvatarTransform();
    hideLoading();
  } finally {
    ensureLocalAvatarExists();
    syncLocalAvatarTransform();
    hideLoading();
    requestAnimationFrame(animate);
  }
})();
</script>
