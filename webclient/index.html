function escapeXml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

function gameRowToRobloxXml(game) {
  const title = escapeXml(game.title || ("Place " + (game.id || placeId)));
  const creator = escapeXml(game.creator_name || "Novrex");
  const thumb = escapeXml(game.thumbnail_url || ("https://btip.cc.cd/asset/?id=" + (game.id || placeId)));
  const parts = Array.isArray(game.parts) ? game.parts : [];

  const partXml = parts.length > 0
    ? parts.map((p, idx) => {
        const px = Number(p.x ?? 0);
        const py = Number(p.y ?? 2);
        const pz = Number(p.z ?? -10 - idx * 4);
        const sx = Number(p.sx ?? 4);
        const sy = Number(p.sy ?? 2);
        const sz = Number(p.sz ?? 4);
        const col = Number(p.color ?? 0x00a2ff);
        return `
      <Item class="Part">
        <Properties>
          <string name="Name">${escapeXml(p.name || ("Part" + (idx + 1)))}</string>
          <bool name="Anchored">${p.anchored !== false}</bool>
          <CoordinateFrame name="CFrame">
            <X>${px}</X><Y>${py}</Y><Z>${pz}</Z>
            <R00>1</R00><R01>0</R01><R02>0</R02>
            <R10>0</R10><R11>1</R11><R12>0</R12>
            <R20>0</R20><R21>0</R21><R22>1</R22>
          </CoordinateFrame>
          <Vector3 name="size">
            <X>${sx}</X><Y>${sy}</Y><Z>${sz}</Z>
          </Vector3>
          <int name="BrickColor">${col}</int>
        </Properties>
      </Item>`;
      }).join("")
    : `
      <Item class="Part">
        <Properties>
          <string name="Name">GameSign</string>
          <bool name="Anchored">true</bool>
          <CoordinateFrame name="CFrame">
            <X>0</X><Y>4</Y><Z>-12</Z>
            <R00>1</R00><R01>0</R01><R02>0</R02>
            <R10>0</R10><R11>1</R11><R12>0</R12>
            <R20>0</R20><R21>0</R21><R22>1</R22>
          </CoordinateFrame>
          <Vector3 name="size">
            <X>6</X><Y>6</Y><Z>0.4</Z>
          </Vector3>
          <string name="TextureUrl">${thumb}</string>
        </Properties>
      </Item>`;

  return `<roblox xmlns:xmime="http://www.w3.org/2005/05/xmlmime" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.roblox.com/roblox.xsd" version="4">
  <External>null</External>
  <External>nil</External>
  <Item class="Workspace">
    <Properties>
      <string name="Name">Workspace</string>
      <string name="GameTitle">${title}</string>
      <string name="CreatorName">${creator}</string>
    </Properties>
    <Item class="Part">
      <Properties>
        <string name="Name">Baseplate</string>
        <bool name="Anchored">true</bool>
        <CoordinateFrame name="CFrame">
          <X>0</X><Y>-1</Y><Z>0</Z>
          <R00>1</R00><R01>0</R01><R02>0</R02>
          <R10>0</R10><R11>1</R11><R12>0</R12>
          <R20>0</R20><R21>0</R21><R22>1</R22>
        </CoordinateFrame>
        <Vector3 name="size">
          <X>128</X><Y>2</Y><Z>128</Z>
        </Vector3>
      </Properties>
    </Item>${partXml}
  </Item>
</roblox>`;
}

function xmlToRbxlBlob(xmlString) {
  const bytes = new TextEncoder().encode(xmlString);
  return new Blob([bytes], { type: "application/x-roblox-place" });
}

const textureLoader = new THREE.TextureLoader();
textureLoader.setCrossOrigin("anonymous");

function clearWorldGroup() {
  while (worldGroup.children.length > 0) {
    worldGroup.remove(worldGroup.children[0]);
  }
}

function renderRbxlInBrowser(rbxlBlob, fallbackThumbUrl) {
  clearWorldGroup();
  const reader = new FileReader();
  reader.onload = () => {
    const rawText = String(reader.result || "");
    const parser = new DOMParser();
    const doc = parser.parseFromString(rawText, "text/xml");
    const items = Array.from(doc.getElementsByTagName("Item"));

    let builtAny = false;
    items.forEach((item) => {
      if (item.getAttribute("class") !== "Part") return;
      const props = item.firstElementChild;
      if (!props) return;

      let name = "";
      let sx = 4, sy = 2, sz = 4;
      let px = 0, py = 2, pz = -12;
      let texUrl = "";

      Array.from(props.children).forEach((propEl) => {
        const propName = propEl.getAttribute("name");
        if (propName === "Name") name = propEl.textContent || "";
        if (propName === "size") {
          sx = Number(propEl.getElementsByTagName("X")[0]?.textContent || sx);
          sy = Number(propEl.getElementsByTagName("Y")[0]?.textContent || sy);
          sz = Number(propEl.getElementsByTagName("Z")[0]?.textContent || sz);
        }
        if (propName === "CFrame") {
          px = Number(propEl.getElementsByTagName("X")[0]?.textContent || px);
          py = Number(propEl.getElementsByTagName("Y")[0]?.textContent || py);
          pz = Number(propEl.getElementsByTagName("Z")[0]?.textContent || pz);
        }
        if (propName === "TextureUrl") {
          texUrl = propEl.textContent || "";
        }
      });

      if (name === "Baseplate") return;
      builtAny = true;

      const matOpts = { color: 0xffffff };
      const resolvedTex = texUrl || fallbackThumbUrl;
      if (resolvedTex) {
        const tex = textureLoader.load(resolvedTex);
        tex.colorSpace = THREE.SRGBColorSpace;
        matOpts.map = tex;
      }

      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        new THREE.MeshStandardMaterial(matOpts)
      );
      mesh.position.set(px, py, pz);
      worldGroup.add(mesh);
    });

    if (!builtAny) {
      const signTex = fallbackThumbUrl ? textureLoader.load(fallbackThumbUrl) : null;
      if (signTex) signTex.colorSpace = THREE.SRGBColorSpace;
      const sign = new THREE.Mesh(
        new THREE.BoxGeometry(6, 6, 0.4),
        new THREE.MeshStandardMaterial({ map: signTex || null, color: 0xffffff })
      );
      sign.position.set(0, 4, -12);
      worldGroup.add(sign);
    }
  };
  reader.readAsText(rbxlBlob);
}

const character = new THREE.Group();
scene.add(character);

const gltfLoader = new GLTFLoader();
let cachedAvatarTemplate = null;

function createAvatarInstance(tintColor = null) {
  const holder = new THREE.Group();
  if (cachedAvatarTemplate) {
    const clone = cachedAvatarTemplate.clone(true);
    clone.scale.set(1.8, 1.8, 1.8);
    if (tintColor !== null) {
      clone.traverse((child) => {
        if (child.isMesh && child.material) {
          child.material = child.material.clone();
          child.material.color.setHex(tintColor);
        }
      });
    }
    holder.add(clone);
    return holder;
  }
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(1.2, 1.2, 1.2),
    new THREE.MeshStandardMaterial({ color: tintColor ?? 0xf5cd30 })
  );
  head.position.y = 3.2;
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 2.4, 1.2),
    new THREE.MeshStandardMaterial({ color: tintColor ?? 0x0d69ac })
  );
  body.position.y = 1.4;
  holder.add(head, body);
  return holder;
}

gltfLoader.load(

    while (character.children.length > 0) character.remove(character.children[0]);

function colorForPeer(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  const palette = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff9f1c, 0xc77dff];
  return palette[h % palette.length];
}

function updateLeaderboard(presenceState) {
  const rows = [];
  const seen = new Set();

  rows.push({ id: peerId, name: username + (isHost ? " [Host]" : ""), score: 100 });
  seen.add(peerId);

  if (presenceState) {
    Object.values(presenceState).forEach((list) => {
      (list || []).forEach((meta) => {
        if (!meta || !meta.peerId || seen.has(meta.peerId)) return;
        seen.add(meta.peerId);
        rows.push({
          id: meta.peerId,
          name: (meta.username || "Player") + (meta.peerId === hostId ? " [Host]" : ""),
          score: 100
        });
      });
    });
  }

  playerCountEl.textContent = String(rows.length);
  leaderboardBody.innerHTML = rows
    .map((r) => `<div class="lb-row"><span>${escapeXml(r.name)}</span><span>${r.score}</span></div>`)
    .join("");
}

function recomputeHostFromPresence(state) {
  const allPeers = new Set([peerId]);
  if (state) {
    Object.values(state).forEach((list) => {
      (list || []).forEach((m) => {
        if (m && m.peerId) allPeers.add(m.peerId);
      });
    });
  }
  const sorted = Array.from(allPeers).sort();
  hostId = sorted[0] || peerId;
  const wasHost = isHost;
  isHost = hostId === peerId;
  serverRoleLabel.textContent = isHost ? "Server: Hosting in Browser" : "Server: Connected to Host";
  if (isHost && !wasHost && allPeers.size > 1) {
    addChat("System", "You are now hosting this game server in your browser.");
  }
  updateLeaderboard(state);
}

function removeRemotePlayer(id) {
  const entry = remotePlayers.get(id);
  if (entry) {
    remotePlayersGroup.remove(entry.group);
    remotePlayers.delete(id);
  }
}

function clearAllRemotePlayers() {
  Array.from(remotePlayers.keys()).forEach(removeRemotePlayer);
}

function upsertRemotePlayer(id, name, x, y, z, rotY) {
  if (!id || id === peerId) return;
  let entry = remotePlayers.get(id);
  if (!entry) {
    const group = createAvatarInstance(colorForPeer(id));
    remotePlayersGroup.add(group);
    entry = { group, name: name || "Player" };
    remotePlayers.set(id, entry);
    addChat("System", `${name || "Player"} joined the server.`);
  }
  entry.group.position.set(Number(x) || 0, Number(y) || 0, Number(z) || 0);
  entry.group.rotation.y = Number(rotY) || 0;
}

async function joinMultiplayerServerForGame(idToLoad) {
  placeId = String(idToLoad || "1");
  if (placeLabel) placeLabel.textContent = "Place ID: " + placeId;

  let gameObj = gamesCache.find((g) => String(g.id) === placeId);
  if (!gameObj && sb) {
    try {
      const { data } = await sb
        .from("novrex_games")
        .select("*")
        .eq("id", placeId)
        .limit(1);
      if (Array.isArray(data) && data[0]) gameObj = data[0];
    } catch (_e) {}
  }
  if (!gameObj) {
    gameObj = {
      id: placeId,
      title: "Place " + placeId,
      creator_name: "Novrex",
      thumbnail_url: "/asset/?id=" + encodeURIComponent(placeId)
    };
  }

  const xml = gameRowToRobloxXml(gameObj);
  const rbxlBlob = xmlToRbxlBlob(xml);
  lastRbxlBlob = rbxlBlob;
  lastRbxlFilename = `place_${placeId}.rbxl`;
  const thumb = gameObj.thumbnail_url || ("/asset/?id=" + encodeURIComponent(placeId));
  renderRbxlInBrowser(rbxlBlob, thumb);

  clearAllRemotePlayers();
  isHost = false;
  hostId = peerId;
  serverRoleLabel.textContent = "Server: Joining...";

  if (activeChannel && sb) {
    await sb.removeChannel(activeChannel);
    activeChannel = null;
  }

  if (!sb) {
    serverRoleLabel.textContent = "Server: Hosting Locally";
    addChat("System", `Loaded "${gameObj.title}".`);
    return;
  }

  const roomChannel = sb.channel("bloxtip_server_place_" + placeId, {
    config: { presence: { key: peerId } }
  });

  roomChannel
    .on("presence", { event: "sync" }, () => {
      const state = roomChannel.presenceState();
      recomputeHostFromPresence(state);
      const activeIds = new Set();
      Object.values(state).forEach((list) => {
        (list || []).forEach((m) => {
          if (m && m.peerId && m.peerId !== peerId) activeIds.add(m.peerId);
        });
      });
      Array.from(remotePlayers.keys()).forEach((id) => {
        if (!activeIds.has(id)) {
          const leftName = remotePlayers.get(id)?.name || "Player";
          removeRemotePlayer(id);
          addChat("System", `${leftName} left the server.`);
        }
      });
    })
    .on("broadcast", { event: "pos" }, ({ payload }) => {
      if (!payload || payload.peerId === peerId) return;
      upsertRemotePlayer(payload.peerId, payload.username, payload.x, payload.y, payload.z, payload.rotY);
    })
    .on("broadcast", { event: "chat" }, ({ payload }) => {
      if (!payload || payload.peerId === peerId) return;
      addChat(payload.username || "Player", payload.text || "");
    })
    .subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        await roomChannel.track({
          peerId,
          username,
          placeId,
          joinedAt: Date.now()
        });
        recomputeHostFromPresence(roomChannel.presenceState());
        addChat("System", `Connected to server for "${gameObj.title}" (Place #${placeId}).`);
      }
    });

  activeChannel = roomChannel;
}

chatForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const val = chatInput.value.trim();
  if (!val) return;
  addChat(username, val);
  if (activeChannel) {
    activeChannel.send({
      type: "broadcast",
      event: "chat",
      payload: { peerId, username, text: val }
    });
  }
  chatInput.value = "";
  chatInput.blur();
});

async function populateGamesFromSupabase() {
  if (sb) {
    try {
      const { data: rows, error } = await sb
        .from("novrex_games")
        .select("*")
        .order("id", { ascending: true });
      if (!error && Array.isArray(rows) && rows.length > 0) {
        gamesCache = rows;
        gameSelect.innerHTML = rows
          .map((g) => `<option value="${escapeXml(g.id)}">${escapeXml(g.title || ("Place " + g.id))} (#${escapeXml(g.id)})</option>`)
          .join("");
        if (!rows.some((g) => String(g.id) === placeId)) {
          placeId = String(rows[0].id);
        }
        gameSelect.value = placeId;
        await joinMultiplayerServerForGame(placeId);
        return;
      }
    } catch (_e) {}
  }

  gameSelect.innerHTML = `<option value="${escapeXml(placeId)}">Place #${escapeXml(placeId)}</option>`;
  await joinMultiplayerServerForGame(placeId);
}

loadGameBtn.addEventListener("click", () => {
  if (gameSelect.value) {
    const nextUrl = new URL(window.location.href);
    nextUrl.searchParams.set("placeId", gameSelect.value);
    window.history.replaceState({}, "", nextUrl.toString());
    joinMultiplayerServerForGame(gameSelect.value);
  }
});

if (downloadRbxlBtn) {
  downloadRbxlBtn.addEventListener("click", () => {
    if (!lastRbxlBlob) return;
    const url = URL.createObjectURL(lastRbxlBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = lastRbxlFilename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
}

const keys = {};
window.addEventListener("keydown", (e) => {
  if (document.activeElement === chatInput) return;
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => {
  keys[e.code] = false;
});

let camYaw = 0;
let camPitch = 0.35;
let camDist = 14;
let dragging = false;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("mousedown", (e) => {
  if (e.button === 2 || e.button === 0) {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
  }
});
window.addEventListener("mouseup", () => { dragging = false; });
window.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.007;
  camPitch = Math.max(0.08, Math.min(1.3, camPitch + (e.clientY - lastY) * 0.007));
  lastX = e.clientX;
  lastY = e.clientY;
});
canvas.addEventListener("wheel", (e) => {
  camDist = Math.max(5, Math.min(35, camDist + e.deltaY * 0.01));
});

let velY = 0;
let grounded = true;

function resetCharacter() {
  character.position.set(0, 0.4, 0);
  velY = 0;
  grounded = true;
}
resetCharacter();

document.getElementById("reset-btn").addEventListener("click", resetCharacter);
document.getElementById("leave-btn").addEventListener("click", async () => {
  if (activeChannel && sb) {
    await sb.removeChannel(activeChannel);
  }
  window.location.href = "/home.html";
});

window.addEventListener("resize", () => {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
});

populateGamesFromSupabase();

let prev = performance.now();
let lastSyncTime = 0;

function animate(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;

  let moveX = 0;
  let moveZ = 0;
  if (keys["KeyW"] || keys["ArrowUp"]) moveZ -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) moveZ += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) moveX -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) moveX += 1;

  if (moveX !== 0 || moveZ !== 0) {
    const len = Math.hypot(moveX, moveZ);
    moveX /= len;
    moveZ /= len;
    const sin = Math.sin(camYaw);
    const cos = Math.cos(camYaw);
    const wx = moveX * cos + moveZ * sin;
    const wz = moveZ * cos - moveX * sin;
    character.position.x = Math.max(-62, Math.min(62, character.position.x + wx * 16 * dt));
    character.position.z = Math.max(-62, Math.min(62, character.position.z + wz * 16 * dt));
    character.rotation.y = Math.atan2(wx, wz);
  }

  if (keys["Space"] && grounded) {
    velY = 18;
    grounded = false;
  }

  velY -= 48 * dt;
  character.position.y += velY * dt;
  if (character.position.y <= 0) {
    character.position.y = 0;
    velY = 0;
    grounded = true;
  }

  if (activeChannel && now - lastSyncTime > 65) {
    lastSyncTime = now;
    activeChannel.send({
      type: "broadcast",
      event: "pos",
      payload: {
        peerId,
        username,
        x: Number(character.position.x.toFixed(2)),
        y: Number(character.position.y.toFixed(2)),
        z: Number(character.position.z.toFixed(2)),
        rotY: Number(character.rotation.y.toFixed(2))
      }
    });
  }

  const target = new THREE.Vector3(character.position.x, character.position.y + 3, character.position.z);
  const horiz = Math.cos(camPitch) * camDist;
  camera.position.set(
    target.x + Math.sin(camYaw) * horiz,
    target.y + Math.sin(camPitch) * camDist,
    target.z + Math.cos(camYaw) * horiz
  );
  camera.lookAt(target);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
