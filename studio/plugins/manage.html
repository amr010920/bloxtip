<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Plugins - Bloxtip</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #ececec;
      color: #191919;
      font-size: 12px;
      overflow-x: hidden;
    }

    .header {
      background: #0074bd;
      color: #ffffff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00568c;
    }
    .header-title {
      font-size: 14px;
      font-weight: bold;
    }
    .header-sub {
      font-size: 11px;
      opacity: 0.9;
    }

    .container {
      max-width: 760px;
      margin: 12px auto;
      padding: 0 12px 20px;
    }

    .add-bar {
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 3px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .input {
      flex: 1;
      min-width: 120px;
      padding: 6px 8px;
      border: 1px solid #bbbbbb;
      border-radius: 2px;
      font-size: 12px;
      background: #ffffff;
      color: #191919;
    }
    .input:focus { outline: none; border-color: #0074bd; }

    .btn {
      padding: 6px 10px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: #02b757;
      border-color: #018a41;
      color: #ffffff;
    }
    .btn-primary:hover { background: #00cc61; }

    .btn-secondary {
      background: #f5f5f5;
      border-color: #bbbbbb;
      color: #222222;
    }
    .btn-secondary:hover { background: #e8e8e8; }

    .btn-toggle-on {
      background: #0074bd;
      border-color: #00568c;
      color: #ffffff;
    }
    .btn-toggle-off {
      background: #e0e0e0;
      border-color: #b5b5b5;
      color: #444444;
    }

    .btn-danger {
      background: #ffffff;
      border-color: #d9534f;
      color: #c9302c;
    }
    .btn-danger:hover {
      background: #d9534f;
      color: #ffffff;
    }

    .plugin-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .plugin-card {
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 3px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .plugin-card.disabled {
      opacity: 0.72;
      background: #f9f9f9;
    }

    .plugin-info {
      flex: 1;
      min-width: 0;
    }
    .plugin-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .plugin-name {
      font-size: 13px;
      font-weight: bold;
      color: #191919;
    }
    .badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 2px;
      font-weight: bold;
    }
    .badge-on {
      background: #dff0d8;
      color: #3c763d;
      border: 1px solid #c3e6cb;
    }
    .badge-off {
      background: #eeeeee;
      color: #666666;
      border: 1px solid #cccccc;
    }
    .plugin-meta {
      font-size: 11px;
      color: #666666;
      margin-top: 3px;
      word-break: break-word;
    }

    .plugin-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .empty-state {
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 3px;
      padding: 16px;
      text-align: center;
      color: #666666;
    }

    .notice {
      margin-top: 10px;
      font-size: 11px;
      color: #555555;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="header-title">Manage Plugins</div>
      <div class="header-sub">Enable or disable plugins for Roblox Studio</div>
    </div>
    <button type="button" class="btn btn-secondary" onclick="resetDefaults()">Reset Defaults</button>
  </div>

  <div class="container">
    <div class="add-bar">
      <input type="text" id="plugin-name-input" class="input" placeholder="Plugin name (e.g. Part Resize)">
      <input type="text" id="plugin-id-input" class="input" placeholder="Asset ID (e.g. 142314093)" style="max-width: 170px;">
      <button type="button" class="btn btn-primary" onclick="addPlugin()">Add Plugin</button>
    </div>

    <div id="plugin-list" class="plugin-list"></div>

    <div class="notice" id="status-notice"></div>
  </div>

  <script>
    var STORAGE_KEY = 'bloxtip_studio_plugins_v1';
    var ASSET_ENDPOINT = 'https://hdpxjesfeawnntjzttwj.supabase.co/functions/v1/asset';
    var memoryStore = null;

    var DEFAULT_PLUGINS = [
      { id: '142314093', name: 'Studio Build Suite', creator: 'Bloxtip', enabled: true },
      { id: '165687726', name: 'Align Tool', creator: 'Bloxtip', enabled: true },
      { id: '217792837', name: 'Terrain & Part Helper', creator: 'Bloxtip', enabled: false }
    ];

    var plugins = [];

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function readStorage() {
      try {
        if (window.localStorage) {
          return window.localStorage.getItem(STORAGE_KEY);
        }
      } catch (e) {}
      return memoryStore;
    }

    function writeStorage(value) {
      try {
        if (window.localStorage) {
          window.localStorage.setItem(STORAGE_KEY, value);
          return;
        }
      } catch (e) {}
      memoryStore = value;
    }

    function savePlugins() {
      writeStorage(JSON.stringify(plugins));
    }

    function loadPlugins() {
      var raw = readStorage();
      if (!raw) {
        plugins = cloneDefaults();
        savePlugins();
        return;
      }
      try {
        var parsed = JSON.parse(raw);
        if (Object.prototype.toString.call(parsed) === '[object Array]') {
          plugins = parsed;
          return;
        }
      } catch (e) {}
      plugins = cloneDefaults();
    }

    function cloneDefaults() {
      var copy = [];
      for (var i = 0; i < DEFAULT_PLUGINS.length; i++) {
        var d = DEFAULT_PLUGINS[i];
        copy.push({
          id: d.id,
          name: d.name,
          creator: d.creator,
          enabled: Boolean(d.enabled)
        });
      }
      return copy;
    }

    function notifyStudio(plugin, enabled) {
      var url = ASSET_ENDPOINT + '?id=' + encodeURIComponent(plugin.id);
      try {
        if (window.external && typeof window.external.SetPluginEnabled === 'function') {
          window.external.SetPluginEnabled(String(plugin.id), Boolean(enabled));
        }
      } catch (e) {}

      var notice = document.getElementById('status-notice');
      if (notice) {
        notice.innerHTML = escapeHtml(plugin.name) + ' is now ' + (enabled ? '<strong>Enabled</strong>' : '<strong>Disabled</strong>') + ' (' + escapeHtml(url) + ').';
      }
    }

    function togglePlugin(index) {
      if (index < 0 || index >= plugins.length) return;
      var item = plugins[index];
      item.enabled = !item.enabled;
      savePlugins();
      renderPlugins();
      notifyStudio(item, item.enabled);
    }

    function removePlugin(index) {
      if (index < 0 || index >= plugins.length) return;
      plugins.splice(index, 1);
      savePlugins();
      renderPlugins();
    }

    function addPlugin() {
      var nameInput = document.getElementById('plugin-name-input');
      var idInput = document.getElementById('plugin-id-input');
      var rawName = nameInput ? nameInput.value.replace(/^\s+|\s+$/g, '') : '';
      var rawId = idInput ? idInput.value.replace(/^\s+|\s+$/g, '') : '';

      if (!rawId) {
        alert('Please enter a Plugin Asset ID.');
        return;
      }

      plugins.unshift({
        id: rawId,
        name: rawName || ('Plugin #' + rawId),
        creator: 'Custom',
        enabled: true
      });

      savePlugins();
      if (nameInput) nameInput.value = '';
      if (idInput) idInput.value = '';
      renderPlugins();
    }

    function resetDefaults() {
      plugins = cloneDefaults();
      savePlugins();
      renderPlugins();
    }

    function renderPlugins() {
      var listEl = document.getElementById('plugin-list');
      if (!listEl) return;

      if (!plugins || plugins.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No plugins in your list. Add a plugin ID above to get started.</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < plugins.length; i++) {
        var p = plugins[i];
        var isOn = Boolean(p.enabled);
        html += '' +
          '<div class="plugin-card' + (isOn ? '' : ' disabled') + '">' +
            '<div class="plugin-info">' +
              '<div class="plugin-name-row">' +
                '<span class="plugin-name">' + escapeHtml(p.name) + '</span>' +
                '<span class="badge ' + (isOn ? 'badge-on' : 'badge-off') + '">' + (isOn ? 'Enabled' : 'Disabled') + '</span>' +
              '</div>' +
              '<div class="plugin-meta">By ' + escapeHtml(p.creator || 'Unknown') + ' &middot; Asset ID: ' + escapeHtml(p.id) + '</div>' +
            '</div>' +
            '<div class="plugin-actions">' +
              '<button type="button" class="btn ' + (isOn ? 'btn-toggle-on' : 'btn-toggle-off') + '" onclick="togglePlugin(' + i + ')">' + (isOn ? 'Disable' : 'Enable') + '</button>' +
              '<button type="button" class="btn btn-danger" onclick="removePlugin(' + i + ')">Remove</button>' +
            '</div>' +
          '</div>';
      }

      listEl.innerHTML = html;
    }

    loadPlugins();
    renderPlugins();
  </script>
</body>
</html>
